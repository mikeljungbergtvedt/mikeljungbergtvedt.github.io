<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Peasy Daily Stats - Mike</title>
  
  <!-- PapaParse CDN - for reading CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  
  <!-- Optional: Chart.js if you want graphs later -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> -->
  
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 40px;
      background-color: #f8f9fa;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    table {
      width: 100%;
      max-width: 1100px;
      margin: 20px auto;
      border-collapse: collapse;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      background: white;
    }
    th, td {
      padding: 12px 15px;
      text-align: right;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #34495e;
      color: white;
      text-align: center;
    }
    td:first-child {
      text-align: left;
      font-weight: bold;
    }
    tr:hover {
      background-color: #f1f1f1;
    }
    .totals {
      font-weight: bold;
      background-color: #ecf0f1;
    }
    .error {
      color: red;
      text-align: center;
      font-weight: bold;
      margin: 20px;
    }
    #loading {
      text-align: center;
      font-style: italic;
      color: #777;
      margin: 30px;
    }
  </style>
</head>
<body>

  <h1>Peasy Daily Stats → Mottatt & Solgt</h1>
  
  <div id="loading">Loading data from CSV...</div>
  <div id="error" class="error" style="display:none;"></div>

  <table id="stats-table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Priced</th>
        <th>Received</th>
        <th>Sold</th>
        <th>Marketing (NOK)</th>
        <th>Sold Price (NOK)</th>
        <th>Peasy Fee (NOK)</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody id="table-body">
      <!-- Data rows inserted here by JavaScript -->
    </tbody>
    <tfoot>
      <tr id="totals-row" class="totals" style="display:none;">
        <td>Total</td>
        <td></td>
        <td></td>
        <td id="total-sold">0</td>
        <td></td>
        <td id="total-revenue">0 NOK</td>
        <td id="total-fee">0 NOK</td>
        <td></td>
      </tr>
    </tfoot>
  </table>

  <!-- Optional canvas for charts - uncomment and add logic below if needed -->
  <!-- <canvas id="salesChart" width="900" height="400" style="margin: 40px auto; display:block;"></canvas> -->

  <script>
    const csvFile = "Peasy Daily Stats - Ark 1.csv";  // Must match exact filename in repo root

    Papa.parse(csvFile, {
      download: true,
      header: true,
      skipEmptyLines: true,
      dynamicTyping: true,           // Converts numbers automatically
      transformHeader: function(h) {
        // Clean up header names if needed (your file has some odd spacing)
        return h.trim().toLowerCase().replace(/\s+/g, '_');
      },
      complete: function(results) {
        document.getElementById('loading').style.display = 'none';

        const data = results.data
          .filter(row => row.date)                    // Remove invalid rows
          .sort((a, b) => new Date(b.date) - new Date(a.date));  // Newest first

        if (data.length === 0) {
          showError("No valid data rows found in CSV.");
          return;
        }

        console.log("Loaded", data.length, "rows");

        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';  // Clear any old content

        let totalSold = 0;
        let totalRevenue = 0;
        let totalFee = 0;

        data.forEach(row => {
          const tr = document.createElement('tr');

          const sold = Number(row.sold) || 0;
          const price = Number(row.sold_price) || 0;
          const fee = Number(row.peasy_fee) || 0;

          totalSold += sold;
          totalRevenue += price;
          totalFee += fee;

          tr.innerHTML = `
            <td>${row.date || '-'}</td>
            <td>${row.priced || 0}</td>
            <td>${row.received || 0}</td>
            <td>${sold}</td>
            <td>${Number(row.marketing_nok || 0).toLocaleString()}</td>
            <td>${price.toLocaleString()} NOK</td>
            <td>${fee.toLocaleString()} NOK</td>
            <td style="text-align:left; max-width:300px;">${row.notes || row['notes_(opt.)'] || '-'}</td>
          `;
          tbody.appendChild(tr);
        });

        // Show totals
        document.getElementById('total-sold').textContent = totalSold;
        document.getElementById('total-revenue').textContent = totalRevenue.toLocaleString() + ' NOK';
        document.getElementById('total-fee').textContent = totalFee.toLocaleString() + ' NOK';
        document.getElementById('totals-row').style.display = 'table-row';

        // Optional: Add Chart.js example (uncomment CDN above too)
        /*
        const ctx = document.getElementById('salesChart').getContext('2d');
        new Chart(ctx, {
          type: 'line',
          data: {
            labels: data.map(r => r.date),
            datasets: [{
              label: 'Sold Price (NOK)',
              data: data.map(r => Number(r.sold_price) || 0),
              borderColor: '#3498db',
              tension: 0.1
            }, {
              label: 'Peasy Fee (NOK)',
              data: data.map(r => Number(r.peasy_fee) || 0),
              borderColor: '#e74c3c',
              tension: 0.1
            }]
          },
          options: { responsive: true, scales: { y: { beginAtZero: true } } }
        });
        */
      },
      error: function(err) {
        document.getElementById('loading').style.display = 'none';
        showError("Failed to load CSV: " + (err.message || "Check file name and repo access."));
        console.error("PapaParse error:", err);
      }
    });

    function showError(msg) {
      const errDiv = document.getElementById('error');
      errDiv.textContent = msg;
      errDiv.style.display = 'block';
    }
  </script>

</body>
</html>
