<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Peasy Dashboard – Updated</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; background: #F2F7F9; color: #004225; }
        .container { max-width: 1280px; margin: 0 auto; padding: 32px 24px; }
        h1 { font-weight: 700; font-size: 1.8rem; margin-bottom: 16px; color: #004225; }
        .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
        select, button { padding: 10px 16px; font-size: 1rem; border-radius: 6px; border: 1px solid #82BFD2; background: white; cursor: pointer; }
        button { background: #004225; color: white; border: none; }
        .funnel { background: white; padding: 28px; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,66,37,0.1); margin-bottom: 32px; }
        .funnel-row { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; font-size: 1.2rem; }
        .funnel-title { font-weight: 600; width: 120px; text-align: left; color: #004225; }
        .funnel-number { font-weight: 800; font-size: 2.4rem; color: #004225; width: 120px; text-align: center; }
        .arrow { font-size: 2.4rem; color: #82BFD2; margin: 0 12px; }
        .arrow-ratio { font-weight: 800; color: #FFCC33; }
        .arrow-ratio.alert { color: #d32f2f; }
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 32px; }
        .kpi-card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 12px rgba(0,66,37,0.1); text-align: center; }
        .kpi-card.highlight { background: #F2F7F9; border: 2px solid #004225; }
        .kpi-card.alert { background: #ffebee; border: 2px solid #d32f2f; color: #b71c1c; }
        .kpi-value { font-size: 2.2rem; font-weight: 800; margin: 8px 0; }
        .kpi-sub { font-size: 1rem; color: #555; margin-top: -4px; }
        .kpi-label { font-size: 0.95rem; color: #004225; opacity: 0.8; }
        .kpi-target { font-size: 0.85rem; color: #777; margin-top: 6px; font-style: italic; }
        .sold-split { font-size: 0.9rem; color: #555; margin-top: 4px; }
        .chart-container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 12px rgba(0,66,37,0.1); margin-bottom: 32px; }
        .version { font-size: 0.9rem; color: #555; text-align: right; margin-bottom: 8px; opacity: 0.8; }
    </style>
</head>
<body>
<div class="container">
    <h1>Peasy – Key Metrics Overview</h1>
    <div class="controls">
        <label for="periodSelect">Period:</label>
        <select id="periodSelect">
            <option value="7">Last 7 days</option>
            <option value="14">Last 14 days</option>
            <option value="30" selected>Last 30 days</option>
            <option value="90">Last 90 days</option>
            <option value="all">All time</option>
        </select>
        <button onclick="loadDashboard()">Refresh</button>
    </div>
    <p style="margin-top:8px; font-size:0.9rem; opacity:0.8;">
        Last updated: <span id="lastUpdate">—</span> • Valuation ≈ 2 min/car • Working day 7.5 h
    </p>
    <div id="loading" style="margin:20px 0; font-style:italic; opacity:0.6;"></div>

    <div class="version">Version 1.4 – All time avg N/A + funnel % red on low</div>
    <div class="funnel" id="funnelArea"></div>

    <div class="kpi-grid" id="kpiArea"></div>

    <div class="chart-container">
        <h2>Valuations per day (Customer Service Load)</h2>
        <canvas id="workloadChart" height="320"></canvas>
    </div>
    <div class="chart-container">
        <h2>Received vs Sold</h2>
        <canvas id="receivedSoldChart" height="320"></canvas>
    </div>
</div>

<script>
    let workloadChart = null;
    let receivedSoldChart = null;

    async function loadDashboard() {
        const url = 'https://api.biladministrasjon.no/public/reports/peasy/dhqui7Hkl54?output=xlsx';
        document.getElementById('loading').textContent = 'Loading...';
        document.getElementById('funnelArea').innerHTML = '';
        document.getElementById('kpiArea').innerHTML = '';

        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const ab = await res.arrayBuffer();
            const wb = XLSX.read(ab, {type:'array'});
            const ws = wb.Sheets[wb.SheetNames[0]];
            const range = XLSX.utils.decode_range(ws['!ref']);

            const COL_O = 14; // Valued
            const COL_Q = 16; // Received
            const COL_R = 17; // Sold
            const COL_S = 18; // Bud
            const COL_T = 19; // Avgift
            const COL_U = 20; // Returned

            const today = new Date();
            const periodDays = document.getElementById('periodSelect').value;
            const startDate = periodDays === 'all' ? new Date(2000,0,1) : new Date(today);
            if (periodDays !== 'all') startDate.setDate(today.getDate() - periodDays);

            const mapO = new Map();
            const mapQ = new Map();
            const mapR = new Map();

            let totalO = 0, totalQ = 0, totalR = 0, totalU = 0;
            let sumS = 0, countS = 0;
            let sumT = 0, countT = 0;
            let soldUnder25k = 0, soldOver25k = 0;
            let returnedUnder25k = 0, returnedOver25k = 0;
            let transportSum = 0;
            let prodSoldSum = 0;
            let prodReturnedSum = 0;

            for (let row = range.s.r + 1; row <= range.e.r; row++) {
                const dO = getDate(ws, row, COL_O);
                const dQ = getDate(ws, row, COL_Q);
                const dR = getDate(ws, row, COL_R);
                const dU = getDate(ws, row, COL_U);

                if (dO && dO >= startDate) {
                    mapO.set(dateToYMD(dO), (mapO.get(dateToYMD(dO)) || 0) + 1);
                    totalO++;
                }

                if (dQ && dQ >= startDate) {
                    mapQ.set(dateToYMD(dQ), (mapQ.get(dateToYMD(dQ)) || 0) + 1);
                    totalQ++;
                    transportSum += 750;
                }

                if (dR && dR >= startDate) {
                    mapR.set(dateToYMD(dR), (mapR.get(dateToYMD(dR)) || 0) + 1);
                    totalR++;

                    const bud = parseFloat(ws[XLSX.utils.encode_cell({r:row, c:COL_S})]?.v || 0);
                    sumS += bud;
                    countS++;

                    const avgiftCell = ws[XLSX.utils.encode_cell({r:row, c:COL_T})];
                    const avgift = avgiftCell && avgiftCell.v != null ? parseFloat(avgiftCell.v) : 0;
                    sumT += avgift;
                    if (avgift !== 0) countT++;

                    if (bud < 25000) {
                        soldUnder25k++;
                        prodSoldSum += 2000;
                    } else {
                        soldOver25k++;
                        prodSoldSum += 2500;
                    }
                }

                if (dU && dU >= startDate) {
                    totalU++;
                    const bud = parseFloat(ws[XLSX.utils.encode_cell({r:row, c:COL_S})]?.v || 0);
                    if (bud < 25000) {
                        returnedUnder25k++;
                        prodReturnedSum += 1300;
                    } else {
                        returnedOver25k++;
                        prodReturnedSum += 1700;
                    }
                }
            }

            const avgS = countS > 0 ? (sumS / countS).toFixed(0) : 0;
            const avgT = countT > 0 ? (sumT / countT).toFixed(0) : 0;

            const isAllTime = periodDays === 'all';
            const daysInPeriod = isAllTime ? 30 : periodDays;
            const avgDailyO = isAllTime ? 'N/A' : (totalO / daysInPeriod).toFixed(0);

            const minPerDay = isAllTime ? 'N/A' : (parseFloat(avgDailyO) * 2).toFixed(2);
            const hoursPerDay = isAllTime ? 'N/A' : (parseFloat(minPerDay) / 60).toFixed(2);
            const fteNeeded = isAllTime ? 'N/A' : (parseFloat(minPerDay) / (7.5 * 60)).toFixed(2);

            const convOR = totalO > 0 ? ((totalR / totalO) * 100).toFixed(1) : 0;
            const convQR = totalQ > 0 ? ((totalR / totalQ) * 100).toFixed(1) : 0;
            const convQU = totalQ > 0 ? ((totalU / totalQ) * 100).toFixed(1) : 0;
            const convVR = totalO > 0 ? ((totalQ / totalO) * 100).toFixed(1) : 0;

            const arIncomeTotal = sumS * 0.027;
            const arIncomeAvg = countS > 0 ? (arIncomeTotal / countS).toFixed(0) : 0;

            // Funnel with conditional red on low ratios
            document.getElementById('funnelArea').innerHTML = `
                <div class="funnel-row">
                    <div class="funnel-title">Valued</div>
                    <div class="funnel-number">${totalO}</div>
                </div>
                <div class="funnel-row">
                    <div class="funnel-title"></div>
                    <div class="arrow">↓ <span class="arrow-ratio ${convVR < 10 ? 'alert' : ''}">${((totalQ/totalO)*100||0).toFixed(0)}%</span></div>
                </div>
                <div class="funnel-row">
                    <div class="funnel-title">Received</div>
                    <div class="funnel-number big">${totalQ}</div>
                </div>
                <div class="funnel-row">
                    <div class="funnel-title"></div>
                    <div class="arrow">↓ <span class="arrow-ratio ${convQR < 70 ? 'alert' : ''}">${convQR}%</span></div>
                </div>
                <div class="funnel-row">
                    <div class="funnel-title">Sold</div>
                    <div class="funnel-number">${totalR}</div>
                </div>
                <div class="funnel-row">
                    <div class="funnel-title">Returned</div>
                    <div class="funnel-number">${totalU}</div>
                    <div style="margin-left:16px;">(${convQU}%)</div>
                </div>
            `;

            // KPI tiles (unchanged except FTE handling for all time)
            document.getElementById('kpiArea').innerHTML = `
                <div class="kpi-card ${convVR < 10 ? 'alert' : ''}">
                    <div class="kpi-value">${convVR}%</div>
                    <div class="kpi-label">Valued → Received</div>
                    <div class="kpi-target">Target: ≥10%</div>
                </div>
                <div class="kpi-card ${convQR < 70 ? 'alert' : 'highlight'}">
                    <div class="kpi-value">${convQR}%</div>
                    <div class="kpi-label">Received → Sold</div>
                    <div class="kpi-target">Target: ≥70%</div>
                </div>
                <div class="kpi-card ${convOR < 10 ? 'alert' : ''}">
                    <div class="kpi-value">${convOR}%</div>
                    <div class="kpi-label">Valued → Sold</div>
                    <div class="kpi-target">Target: ≥10%</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-value">${totalO}</div>
                    <div class="kpi-sub">Avg/day: ${avgDailyO}</div>
                    <div class="kpi-label">Valuations ${isAllTime ? '(all time total)' : ''}</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-value">${totalQ}</div>
                    <div class="kpi-label">Received</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-value">${totalR}</div>
                    <div class="sold-split"><25k: ${soldUnder25k} | ≥25k: ${soldOver25k}</div>
                    <div class="kpi-label">Sold</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-value">${totalU}</div>
                    <div class="sold-split"><25k: ${returnedUnder25k} | ≥25k: ${returnedOver25k}</div>
                    <div class="kpi-label">Returned</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-value">${avgS.toLocaleString('nb-NO')} NOK</div>
                    <div class="kpi-sub">Total: ${sumS.toLocaleString('nb-NO')} NOK</div>
                    <div class="kpi-label">Avg Bud (per sold)</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-value">${arIncomeAvg.toLocaleString('nb-NO')} NOK</div>
                    <div class="kpi-sub">Total est.: ${arIncomeTotal.toLocaleString('nb-NO')} NOK</div>
                    <div class="kpi-label">AR Income (2.7% of Bud)</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-value">${avgT.toLocaleString('nb-NO')} NOK</div>
                    <div class="kpi-sub">Total: ${sumT.toLocaleString('nb-NO')} NOK</div>
                    <div class="kpi-label">Avg Avgift (per sold)</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-value">${(transportSum / (totalR || 1)).toFixed(0).toLocaleString('nb-NO')} NOK</div>
                    <div class="kpi-sub">Total: ${transportSum.toLocaleString('nb-NO')} NOK</div>
                    <div class="kpi-label">Transport Cost per sold</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-value">${(prodSoldSum / (totalR || 1)).toFixed(0).toLocaleString('nb-NO')} NOK</div>
                    <div class="kpi-sub">Total: ${prodSoldSum.toLocaleString('nb-NO')} NOK</div>
                    <div class="kpi-label">Prod Cost – Sold per car</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-value">${(prodReturnedSum / (totalR || 1)).toFixed(0).toLocaleString('nb-NO')} NOK</div>
                    <div class="kpi-sub">Total: ${prodReturnedSum.toLocaleString('nb-NO')} NOK</div>
                    <div class="kpi-label">Prod Cost – Returned per sold</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-value">${hoursPerDay} h / ${fteNeeded} FTE</div>
                    <div class="kpi-sub">Based on 2 min/car</div>
                    <div class="kpi-label">Pricing Time / Load per day</div>
                </div>
            `;

            document.getElementById('lastUpdate').textContent = new Date().toLocaleString('nb-NO');

            // Chart 1 (weekends already subtle)
            const datesO = [...mapO.keys()].sort();
            const dataO = datesO.map(k => mapO.get(k));
            const weekendAnnotations = datesO.map((dateStr, idx) => {
                const d = new Date(dateStr);
                const day = d.getDay();
                if (day === 0 || day === 6) {
                    return {
                        type: 'box',
                        xMin: idx - 0.5,
                        xMax: idx + 0.5,
                        yMin: 0,
                        yMax: Math.max(...dataO, 10) * 1.2,
                        backgroundColor: 'rgba(130, 191, 210, 0.08)',
                        borderWidth: 0
                    };
                }
            }).filter(Boolean);

            if (workloadChart) workloadChart.destroy();
            workloadChart = new Chart(document.getElementById('workloadChart'), {
                type: 'line',
                data: {
                    labels: datesO,
                    datasets: [{
                        label: 'Valuations per day',
                        data: dataO,
                        borderColor: '#004225',
                        backgroundColor: 'rgba(0, 66, 37, 0.08)',
                        tension: 0.2,
                        fill: true
                    }]
                },
                options: {
                    scales: { y: { beginAtZero: true } },
                    plugins: { annotation: { annotations: weekendAnnotations } }
                }
            });

            const allDates = [...new Set([...mapQ.keys(), ...mapR.keys()])].sort();
            const dataQ_chart = allDates.map(d => mapQ.get(d) || 0);
            const dataR_chart = allDates.map(d => mapR.get(d) || 0);

            if (receivedSoldChart) receivedSoldChart.destroy();
            receivedSoldChart = new Chart(document.getElementById('receivedSoldChart'), {
                type: 'line',
                data: {
                    labels: allDates,
                    datasets: [
                        { label: 'Received', data: dataQ_chart, borderColor: '#82BFD2', tension: 0.2 },
                        { label: 'Sold', data: dataR_chart, borderColor: '#FFCC33', tension: 0.2 }
                    ]
                },
                options: { scales: { y: { beginAtZero: true } } }
            });

        } catch (err) {
            document.getElementById('loading').innerHTML = `Error: ${err.message}<br><a href="${url}" target="_blank">Open XLSX manually</a>`;
        } finally {
            document.getElementById('loading').textContent = '';
        }
    }

    function getDate(ws, row, col) {
        const cell = ws[XLSX.utils.encode_cell({r:row, c:col})];
        if (!cell || !cell.v) return null;
        if (typeof cell.v === 'number') {
            const d = XLSX.SSF.parse_date_code(cell.v);
            return new Date(d.y, d.m-1, d.d);
        }
        if (typeof cell.v === 'string') {
            const m = cell.v.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
            if (m) return new Date(+m[3], m[2]-1, +m[1]);
        }
        return null;
    }

    function dateToYMD(d) {
        return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    window.onload = loadDashboard;
</script>
</body>
</html>
