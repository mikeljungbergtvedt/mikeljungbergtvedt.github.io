<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peasy Priset → Mottatt</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/date-fns@3.6.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px 10px; background: #e0e9e5; color: #004225; }
    .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
    h1 { text-align: center; color: #004225; font-size: 2rem; margin-bottom: 10px; }
    .subtitle { text-align: center; font-size: 1.3rem; margin-bottom: 20px; color: #004225; }
    .controls { text-align: center; margin: 15px 0; }
    .last-update { text-align: center; font-size: 1.1rem; color: #004225; margin: 15px 0; font-weight: bold; }
    .input-area { text-align: center; margin: 20px 0; padding: 15px; background: #f5f9f6; border-radius: 10px; display: none; }
    .input-area label { font-size: 1.1rem; font-weight: bold; display: block; margin-bottom: 6px; }
    .input-area input, .input-area button { padding: 10px; font-size: 1.1rem; border: 1px solid #ddd; border-radius: 6px; margin: 5px 0; width: calc(100% - 20px); box-sizing: border-box; }
    .input-area button { background: #ffcc33; color: #004225; border: none; font-weight: bold; cursor: pointer; }
    .input-area button:hover { background: #e6b800; }
    .toggle-button { margin: 10px auto; display: block; padding: 8px 15px; background: #ffcc33; color: #004225; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; }
    .toggle-button:hover { background: #e6b800; }
    canvas { margin-top: 20px; background: white; border-radius: 8px; width: 100% !important; height: 500px !important; }
    #notification { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: #27ae60; color: white; padding: 10px 20px; border-radius: 6px; z-index: 1000; opacity: 0; transition: opacity 0.3s; font-weight: bold; font-size: 0.9rem; }
    .stats-table { margin: 30px auto; max-width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    .stats-table th, .stats-table td { padding: 10px; text-align: center; border: 1px solid #ddd; font-weight: bold; }
    .stats-table th { background: #f5f9f6; }
    .stats-table td { background: white; }
    .total-row td { background: #e8f5e9; font-weight: bold; }
    @media (max-width: 768px) {
      body { padding: 15px 10px; }
      .container { padding: 15px; }
      h1 { font-size: 1.6rem; }
      .subtitle { font-size: 1.1rem; }
      canvas { height: 400px !important; }
      .stats-table { font-size: 0.9rem; overflow-x: auto; display: block; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Peasy Priset → Mottatt</h1>
    <div class="subtitle">Antall biler registrert per dag (SD mottatt på) – fra 01.07.2025</div>

    <div class="controls">
      <label for="monthFilter" style="font-weight:bold; margin-right:10px;">Vis kun måned:</label>
      <select id="monthFilter">
        <option value="all">Alle måneder</option>
      </select>
      <button class="toggle-button" onclick="toggleInputArea()">Skjul / Vis input</button>
    </div>

    <div class="input-area" id="inputArea">
      <label for="selectedDate">Dato</label>
      <input type="date" id="selectedDate">
      <label for="dailyCount">Priset (SD mottatt på)</label>
      <input type="number" id="dailyCount" min="0" placeholder="f.eks. 11">
      <label for="receivedCount">Mottatt på lager</label>
      <input type="number" id="receivedCount" min="0" placeholder="f.eks. 13">
      <label for="soldCount">Solgte biler</label>
      <input type="number" id="soldCount" min="0" placeholder="f.eks. 5">
      <label for="marketingCost">Markedsføringskostnad (per dag)</label>
      <input type="number" id="marketingCost" min="0" placeholder="f.eks. 5000">
      <button onclick="addCountForDate()">Legg til / oppdater</button>
    </div>

    <canvas id="dailyChart"></canvas>

    <div class="last-update" id="lastUpdate">Sist oppdatert: —</div>

    <table class="stats-table">
      <thead>
        <tr>
          <th>Periode</th>
          <th>Priset</th>
          <th>Mottatt</th>
          <th>Priset → Mottatt</th>
          <th>Solgt</th>
          <th>Markedsføringskostnad per solgt bil</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Siste dag med data</td>
          <td id="lastRegistered">—</td>
          <td id="lastReceived">—</td>
          <td id="lastRatio">—</td>
          <td id="lastSold">—</td>
          <td id="lastMarketingCost">—</td>
        </tr>
        <tr id="row7days">
          <td>Siste 7 dager</td>
          <td id="avgRegistered7">—</td>
          <td id="avgReceived7">—</td>
          <td id="ratio7">—</td>
          <td id="sold7">—</td>
          <td id="marketing7">—</td>
        </tr>
        <tr id="row30days">
          <td>Siste 30 dager</td>
          <td id="avgRegistered30">—</td>
          <td id="avgReceived30">—</td>
          <td id="ratio30">—</td>
          <td id="sold30">—</td>
          <td id="marketing30">—</td>
        </tr>
        <tr class="total-row">
          <td>Totalt (hele perioden)</td>
          <td id="totalPriset">—</td>
          <td id="totalMottatt">—</td>
          <td id="totalRatio">—</td>
          <td id="totalSold">—</td>
          <td id="totalMarketingCost">—</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div id="notification"></div>

  <script>
    const historicalData = {
      "2025-07-02": 1, "2025-07-03": 2, "2025-07-05": 1, "2025-07-08": 1, "2025-07-10": 1,
      "2025-07-12": 2, "2025-07-15": 2, "2025-07-17": 1, "2025-07-19": 1, "2025-07-21": 1,
      "2025-07-22": 2, "2025-07-24": 1, "2025-07-25": 2, "2025-07-28": 1, "2025-07-30": 2,
      "2025-07-31": 1, "2025-08-01": 1, "2025-08-02": 4, "2025-08-03": 1, "2025-08-04": 1,
      "2025-08-05": 1, "2025-08-06": 1, "2025-08-07": 1, "2025-08-12": 2, "2025-08-13": 3,
      "2025-08-15": 2, "2025-08-17": 1, "2025-08-18": 1, "2025-08-19": 1, "2025-08-22": 2,
      "2025-08-23": 1, "2025-08-26": 2, "2025-08-27": 4, "2025-08-28": 2, "2025-08-30": 2,
      "2025-09-02": 2, "2025-09-03": 1, "2025-09-04": 1, "2025-09-05": 2, "2025-09-06": 1,
      "2025-09-07": 2, "2025-09-09": 2, "2025-09-10": 1, "2025-09-11": 2, "2025-09-14": 1,
      "2025-09-15": 1, "2025-09-16": 5, "2025-09-17": 4, "2025-09-19": 1, "2025-09-20": 2,
      "2025-09-21": 1, "2025-09-22": 4, "2025-09-23": 5, "2025-09-24": 1, "2025-09-25": 1,
      "2025-09-26": 1, "2025-09-28": 2, "2025-09-30": 1, "2025-10-01": 1, "2025-10-02": 3,
      "2025-10-04": 1, "2025-10-06": 3, "2025-10-07": 4, "2025-10-08": 1, "2025-10-10": 2,
      "2025-10-11": 1, "2025-10-12": 3, "2025-10-13": 4, "2025-10-14": 1, "2025-10-15": 2,
      "2025-10-16": 3, "2025-10-17": 1, "2025-10-18": 1, "2025-10-19": 2, "2025-10-20": 4,
      "2025-10-21": 1, "2025-10-22": 1, "2025-10-23": 2, "2025-10-24": 1, "2025-10-28": 1,
      "2025-10-29": 1, "2025-10-30": 1, "2025-10-31": 1,
      "2025-11-01": 1, "2025-11-02": 1, "2025-11-03": 5, "2025-11-04": 10, "2025-11-05": 6,
      "2025-11-06": 16, "2025-11-07": 12, "2025-11-08": 13, "2025-11-09": 12, "2025-11-10": 14,
      "2025-11-11": 5, "2025-11-12": 5, "2025-11-13": 9, "2025-11-14": 6, "2025-11-15": 6,
      "2025-11-16": 4, "2025-11-17": 6, "2025-11-18": 8, "2025-11-19": 11, "2025-11-20": 8,
      "2025-11-21": 9, "2025-11-22": 5, "2025-11-23": 5, "2025-11-24": 7, "2025-11-25": 8,
      "2025-11-26": 6, "2025-11-27": 10, "2025-11-28": 11, "2025-11-29": 11, "2025-11-30": 4,
      "2025-12-01": 11, "2025-12-02": 9, "2025-12-03": 3, "2025-12-04": 10, "2025-12-05": 11,
      "2025-12-06": 7, "2025-12-07": 8, "2025-12-08": 14, "2025-12-09": 8, "2025-12-10": 12,
      "2025-12-11": 8, "2025-12-12": 3, "2025-12-13": 4, "2025-12-14": 7, "2025-12-15": 10,
      "2025-12-16": 14, "2025-12-17": 14, "2025-12-18": 4, "2025-12-19": 4, "2025-12-20": 8,
      "2025-12-21": 8, "2025-12-22": 4, "2025-12-23": 4, "2025-12-24": 3, "2025-12-25": 4,
      "2025-12-26": 5, "2025-12-27": 3, "2025-12-28": 5, "2025-12-29": 8, "2025-12-30": 5,
      "2025-12-31": 2, "2026-01-01": 5, "2026-01-02": 13, "2026-01-03": 8, "2026-01-04": 9,
      "2026-01-05": 13, "2026-01-06": 14, "2026-01-07": 6, "2026-01-08": 11
    };
    const historicalSoldData = {
      "2025-05-05": 1,
      "2025-05-23": 1,
      "2025-06-10": 1,
      "2025-06-12": 1,
      "2025-06-30": 1,
      "2025-07-03": 1,
      "2025-07-28": 1,
      "2025-08-07": 1,
      "2025-08-14": 1,
      "2025-09-02": 1,
      "2025-09-15": 1,
      "2025-09-18": 1,
      "2025-09-24": 1,
      "2025-09-25": 1,
      "2025-09-29": 1,
      "2025-10-02": 1,
      "2025-10-06": 1,
      "2025-10-20": 1,
      "2025-10-24": 1,
      "2025-10-27": 1,
      "2025-10-28": 1,
      "2025-10-31": 1,
      "2025-11-07": 1,
      "2025-11-11": 1,
      "2025-11-13": 1,
      "2025-11-14": 1,
      "2025-11-17": 1,
      "2025-11-20": 1,
      "2025-11-24": 1,
      "2025-11-26": 2,
      "2025-11-27": 1,
      "2025-12-01": 4,
      "2025-12-03": 1,
      "2025-12-05": 1,
      "2025-12-08": 2,
      "2025-12-10": 1,
      "2025-12-11": 1,
      "2025-12-12": 1,
      "2025-12-17": 2,
      "2025-12-19": 3,
      "2025-12-22": 1,
      "2026-01-05": 1,
      "2026-01-07": 2
    };
    const START_DATE = '2025-07-01';

    let registeredData = JSON.parse(localStorage.getItem('peasyRegisteredData') || '{}');
    let receivedData = {}; // forced empty - no mottatt data
    let soldData = JSON.parse(localStorage.getItem('peasySoldData') || '{}');
    let marketingData = JSON.parse(localStorage.getItem('peasyMarketingData') || '{}');

    let allRegistered = { ...historicalData, ...registeredData };
    let allReceived = {}; // forced to 0 everywhere
    let allSold = { ...historicalSoldData, ...soldData };
    let allMarketing = { ...marketingData };

    // Auto-apply 1000 kr/day marketing from 2025-11-01 and every day forward
    const MARKETING_START = '2025-11-01';
    const MARKETING_DAILY = 1000;
    const today = new Date();
    let current = new Date(MARKETING_START);
    while (current <= today) {
      const dateStr = current.toISOString().split('T')[0];
      if (!(dateStr in allMarketing)) {
        allMarketing[dateStr] = MARKETING_DAILY;
      }
      current.setDate(current.getDate() + 1);
    }

    let chart;
    let selectedMonth = 'all';

    document.getElementById('selectedDate').valueAsDate = new Date();

    // Populate month dropdown
    function populateMonthFilter() {
      const select = document.getElementById('monthFilter');
      const months = new Set();
      Object.keys(allRegistered).forEach(date => {
        if (date >= START_DATE) {
          months.add(date.slice(0, 7)); // YYYY-MM
        }
      });
      [...months].sort().forEach(m => {
        const option = document.createElement('option');
        option.value = m;
        const [y, mo] = m.split('-');
        option.textContent = new Date(y, mo - 1).toLocaleString('nb-NO', { month: 'long', year: 'numeric' });
        select.appendChild(option);
      });
    }
    populateMonthFilter();

    // Month filter change handler
    document.getElementById('monthFilter').addEventListener('change', e => {
      selectedMonth = e.target.value;
      renderChart();
      updateStatsTable();
    });

    function toggleInputArea() {
      const inputArea = document.getElementById('inputArea');
      inputArea.style.display = inputArea.style.display === 'none' ? 'block' : 'none';
    }

    function addCountForDate() {
      const dateInput = document.getElementById('selectedDate').value;
      const registered = parseInt(document.getElementById('dailyCount').value) || 0;
      const received = 0;
      const sold = parseInt(document.getElementById('soldCount').value) || 0;
      const marketing = parseFloat(document.getElementById('marketingCost').value) || 0;
      if (!dateInput) return alert('Velg en dato først!');
      allRegistered[dateInput] = registered;
      registeredData[dateInput] = registered;
      allReceived[dateInput] = received;
      receivedData[dateInput] = received;
      allSold[dateInput] = (allSold[dateInput] || 0) + sold;
      soldData[dateInput] = allSold[dateInput];
      allMarketing[dateInput] = marketing;
      marketingData[dateInput] = marketing;
      localStorage.setItem('peasyRegisteredData', JSON.stringify(registeredData));
      localStorage.setItem('peasyReceivedData', JSON.stringify(receivedData));
      localStorage.setItem('peasySoldData', JSON.stringify(soldData));
      localStorage.setItem('peasyMarketingData', JSON.stringify(marketingData));
      showNotification(`Lagret for ${dateInput.split('-').reverse().join('.')}: Priset ${registered}, Mottatt 0, Solgte ${sold}, Markedsføring ${marketing} NOK`);
      renderChart();
      updateStatsTable();
      document.getElementById('dailyCount').value = '';
      document.getElementById('receivedCount').value = '';
      document.getElementById('soldCount').value = '';
      document.getElementById('marketingCost').value = '';
    }

    function showNotification(text) {
      const notif = document.getElementById('notification');
      notif.textContent = text;
      notif.style.opacity = 1;
      setTimeout(() => notif.style.opacity = 0, 3000);
    }

    function calculateTrendLine(dates, data, startDateStr) {
      const startIndex = dates.findIndex(d => d >= startDateStr);
      if (startIndex === -1) return new Array(dates.length).fill(null);
      const x = [], y = [];
      for (let i = startIndex; i < dates.length; i++) {
        const val = data[i];
        if (val != null && !isNaN(val)) { x.push(i); y.push(val); }
      }
      if (x.length < 2) return new Array(dates.length).fill(null);
      const n = x.length;
      let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;
      for (let i = 0; i < n; i++) {
        sumX += x[i]; sumY += y[i]; sumXY += x[i] * y[i]; sumX2 += x[i] * x[i];
      }
      const m = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
      const b = (sumY - m * sumX) / n;
      const trend = new Array(dates.length).fill(null);
      for (let i = startIndex; i < dates.length; i++) trend[i] = m * i + b;
      return trend;
    }

    function updateStatsTable() {
      const sortedDates = Object.keys(allRegistered).sort().filter(date => {
        if (selectedMonth === 'all') return true;
        return date.startsWith(selectedMonth);
      });

      // Last update date (most recent date with any data in filtered range)
      let lastUpdateDate = '—';
      if (sortedDates.length > 0) {
        const latestDate = sortedDates[sortedDates.length - 1];
        lastUpdateDate = new Date(latestDate).toLocaleDateString('nb-NO', {
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        });
      }
      document.getElementById('lastUpdate').textContent = `Sist oppdatert: ${lastUpdateDate}`;

      // Last day with data
      let lastReg = '—', lastRec = 0, lastRat = '—', lastSoldVal = '—', lastMarketing = '—';
      for (const date of sortedDates.slice().reverse()) {
        if (allRegistered[date] !== undefined || allSold[date] !== undefined || allMarketing[date] !== undefined) {
          lastReg = allRegistered[date] || 0;
          lastRec = 0;
          lastRat = '—';
          lastSoldVal = allSold[date] || 0;
          lastMarketing = lastSoldVal > 0 ? (allMarketing[date] / lastSoldVal).toFixed(0) + ' NOK' : '—';
          break;
        }
      }
      document.getElementById('lastRegistered').textContent = lastReg;
      document.getElementById('lastReceived').textContent = lastRec;
      document.getElementById('lastRatio').textContent = lastRat;
      document.getElementById('lastSold').textContent = lastSoldVal;
      document.getElementById('lastMarketingCost').textContent = lastMarketing;

      function getAverages(days) {
        let sumReg = 0, sumSold = 0, sumMarketing = 0, count = 0;
        const cutoff = new Date();
        cutoff.setDate(cutoff.getDate() - days + 1);
        const cutoffStr = cutoff.toISOString().split('T')[0];
        for (const date of sortedDates) {
          if (date >= cutoffStr) {
            sumReg += allRegistered[date] || 0;
            sumSold += allSold[date] || 0;
            sumMarketing += allMarketing[date] || 0;
            count++;
          }
        }
        if (count === 0) return { reg: '—', rec: '0', ratio: '—', sold: '0', marketing: '—' };
        const avgReg = (sumReg / count).toFixed(1);
        const ratio = '—';
        const marketing = sumSold > 0 ? (sumMarketing / sumSold).toFixed(0) + ' NOK' : '—';
        return { reg: avgReg, rec: '0', ratio, sold: sumSold, marketing };
      }

      const avg7 = getAverages(7);
      document.getElementById('avgRegistered7').textContent = avg7.reg;
      document.getElementById('avgReceived7').textContent = '0';
      document.getElementById('ratio7').textContent = avg7.ratio;
      document.getElementById('sold7').textContent = avg7.sold;
      document.getElementById('marketing7').textContent = avg7.marketing;

      const avg30 = getAverages(30);
      document.getElementById('avgRegistered30').textContent = avg30.reg;
      document.getElementById('avgReceived30').textContent = '0';
      document.getElementById('ratio30').textContent = avg30.ratio;
      document.getElementById('sold30').textContent = avg30.sold;
      document.getElementById('marketing30').textContent = avg30.marketing;

      let totalReg = 0, totalSold = 0, totalMarketing = 0;
      for (const date of sortedDates) {
        totalReg += allRegistered[date] || 0;
        totalSold += allSold[date] || 0;
        totalMarketing += allMarketing[date] || 0;
      }
      const totalRatio = '—';
      const totalMarketingAvg = totalSold > 0 ? (totalMarketing / totalSold).toFixed(0) + ' NOK' : '—';
      document.getElementById('totalPriset').textContent = totalReg;
      document.getElementById('totalMottatt').textContent = '0';
      document.getElementById('totalRatio').textContent = totalRatio;
      document.getElementById('totalSold').textContent = totalSold;
      document.getElementById('totalMarketingCost').textContent = totalMarketingAvg;
    }

    function renderChart() {
      const start = new Date(START_DATE);
      const end = new Date();
      let dates = [];
      let current = new Date(start);
      while (current <= end) {
        const d = current.toISOString().split('T')[0];
        if (selectedMonth === 'all' || d.startsWith(selectedMonth)) {
          dates.push(d);
        }
        current.setDate(current.getDate() + 1);
      }

      const prisetData = dates.map(d => allRegistered[d] || 0);
      const soldDataChart = dates.map(d => allSold[d] || 0);
      const trendData = calculateTrendLine(dates, prisetData, '2025-11-01');

      const ctx = document.getElementById('dailyChart').getContext('2d');
      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: dates,
          datasets: [
            { label: 'Priset', data: prisetData, backgroundColor: '#004225', borderColor: '#004225', borderWidth: 1 },
            { label: 'Solgt', data: soldDataChart, backgroundColor: '#ff4444', borderColor: '#ff4444', borderWidth: 1 },
            { label: 'Trend (Priset)', type: 'line', data: trendData, borderColor: '#e6b800', borderWidth: 4, pointRadius: 0, fill: false, tension: 0 }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: true, position: 'top' },
            tooltip: {
              callbacks: {
                title: tooltipItems => tooltipItems[0].label,
                label: context => {
                  const date = context.label;
                  const datasetLabel = context.dataset.label;
                  const value = context.raw;
                  let text = `${datasetLabel}: ${value}`;
                  if (datasetLabel === 'Priset' || datasetLabel === 'Solgt') {
                    const sold = allSold[date] || 0;
                    const marketing = allMarketing[date] || 0;
                    if (sold > 0 || marketing > 0) {
                      text += ` | Solgte: ${sold} | Markedsføring: ${marketing} NOK`;
                    }
                  }
                  return text;
                }
              }
            }
          },
          scales: {
            x: {
              type: 'time',
              time: { unit: 'day', displayFormats: { day: 'dd.MM' } },
              ticks: { color: '#004225', font: { size: 14 }, maxRotation: 45, minRotation: 45, autoSkip: true },
              grid: { color: '#ddd' }
            },
            y: { beginAtZero: true, suggestedMax: 20, ticks: { stepSize: 2, color: '#004225', font: { size: 14 } }, grid: { color: '#ddd' } }
          }
        }
      });
      updateStatsTable();
    }

    const dateInput = document.getElementById('selectedDate');
    dateInput.addEventListener('change', loadDataForDate);
    dateInput.addEventListener('click', loadDataForDate);
    dateInput.addEventListener('focus', loadDataForDate);

    function loadDataForDate() {
      const date = dateInput.value;
      if (!date) return;
      document.getElementById('dailyCount').value = allRegistered[date] || '';
      document.getElementById('receivedCount').value = '0';
      document.getElementById('soldCount').value = allSold[date] || '';
      document.getElementById('marketingCost').value = allMarketing[date] || '';
      if (allRegistered[date] || allSold[date] || allMarketing[date]) {
        showNotification(`Lastet data for ${date.split('-').reverse().join('.')}`);
      } else {
        showNotification(`Ingen data for ${date.split('-').reverse().join('.')}`);
      }
    }

    renderChart();
  </script>
</body>
</html>
