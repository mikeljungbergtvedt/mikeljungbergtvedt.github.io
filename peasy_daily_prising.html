      margin: 0;
      padding: 40px 20px;
      background: #e0e9e5;
      color: #004225;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);

      color: #004225;
      font-size: 2rem;
      margin-bottom: 10px;
    }
    .subtitle {
      text-align: center;
      font-size: 1.3rem;
      margin-bottom: 40px;
      color: #004225;
    }
    .input-area {
      text-align: center;
      margin: 30px 0;
      padding: 20px;
      background: #f5f9f6;
      border-radius: 10px;
    }
    .input-area label {
      font-size: 1.2rem;
      font-weight: bold;
      display: block;
      margin-bottom: 10px;
    }
    .input-area input[type="date"] {
      padding: 12px;
      font-size: 1.2rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-right: 15px;
    }
    .input-area input[type="number"] {
      padding: 12px;
      font-size: 1.2rem;
      width: 150px;
      border: 1px solid #ddd;
      border-radius: 6px;
      text-align: center;
      margin-right: 15px;
    }
    .input-area button {
      padding: 12px 24px;
      background: #ffcc33;
      color: #004225;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .input-area button:hover {
      background: #e6b800;
    }
    canvas {
      margin-top: 40px;
      background: white;
      border-radius: 8px;
    }
    #notification {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #27ae60;
      color: white;
      padding: 12px 24px;
      border-radius: 6px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
      font-weight: bold;
    }

    const START_DATE = '2025-07-01';

    let userData = JSON.parse(localStorage.getItem('peasyDailyUserData') || '{}');
    let allData = { ...historicalData, ...userData };

    let chart;

    // Default to today's date in the calendar
    document.getElementById('selectedDate').valueAsDate = new Date();

    function addCountForDate() {
      const dateInput = document.getElementById('selectedDate').value;
      const count = parseInt(document.getElementById('dailyCount').value) || 0;

      if (!dateInput) {
        alert('Velg en dato først!');
        return;
      }

      allData[dateInput] = count;
      userData[dateInput] = count;
      localStorage.setItem('peasyDailyUserData', JSON.stringify(userData));

      showNotification(`Antall ${count} lagret for ${dateInput.split('-').reverse().join('.')}`);
      renderChart();
    }

    function showNotification(text) {
      const notif = document.getElementById('notification');
      notif.textContent = text;
      notif.style.opacity = 1;
      setTimeout(() => notif.style.opacity = 0, 3000);
    }

    function renderChart() {
      const start = new Date(START_DATE);
      const end = new Date();
      const dates = [];
      const current = new Date(start);
      while (current <= end) {
        const key = current.toISOString().split('T')[0];
        dates.push(key);
        current.setDate(current.getDate() + 1);
      }

      const labels = dates.map(d => {
        const parts = d.split('-');
        return `${parts[2]}.${parts[1]}.${parts[0]}`;
      });
      const data = dates.map(d => allData[d] || 0);

      const ctx = document.getElementById('dailyChart').getContext('2d');
      if (chart) chart.destroy();

      chart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Antall biler',
            data: data,
            backgroundColor: '#004225',
            borderColor: '#004225',
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            title: {
              display: true,
              text: 'Daglig antall registrerte biler (SD mottatt på)',
              font: { size: 18 },
              color: '#004225'
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: { stepSize: 1, color: '#004225' },
              grid: { color: '#ddd' }
            },
            x: {
              ticks: { color: '#004225', maxRotation: 90, minRotation: 90 },
              grid: { color: '#ddd' }
            }
          }
        }
      });
    }

    renderChart();
