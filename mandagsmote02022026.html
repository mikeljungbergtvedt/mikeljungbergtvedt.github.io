<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mandagsrapport – Peasy v15 (sky-lagring + egen kommentar)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      margin: 0; padding: 0;
      background: linear-gradient(135deg, #F2F7F9 0%, #E8F0F5 100%);
      color: #004225;
      min-height: 100vh;
    }
    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    h1 {
      font-weight: 900;
      font-size: 2.4rem;
      letter-spacing: -0.7px;
      margin-bottom: 8px;
      background: linear-gradient(to right, #004225, #006644);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }
    .version {
      font-size: 1.4rem;
      font-weight: 700;
      color: #006644;
      margin-left: 16px;
      vertical-align: super;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    button {
      padding: 10px 20px;
      font-size: 0.98rem;
      font-weight: 600;
      border-radius: 10px;
      border: none;
      background: #004225;
      color: white;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,66,37,0.06);
      transition: all 0.2s ease;
    }
    button:hover {
      box-shadow: 0 3px 10px rgba(0,66,37,0.14);
      transform: translateY(-1px);
    }
    button:disabled {
      background: #aaa;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
      opacity: 0.75;
    }
    button#edit-btn { background: #006644; }
    button.danger { background: #c62828; }
    .commentary {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(130,191,210, 0.10);
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0,66,37,0.05);
      padding: 24px;
      margin-bottom: 40px;
    }
    .user-comment {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid rgba(130,191,210,0.2);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(130,191,210, 0.10);
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0,66,37,0.05);
      margin-bottom: 40px;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid rgba(130,191,210, 0.10);
    }
    th {
      background: rgba(130,191,210,0.05);
      font-weight: 700;
    }
    tfoot td {
      font-weight: 700;
      background: rgba(130,191,210,0.08);
    }
    .highlight-negative { color: #d32f2f; font-weight: 600; }
    .highlight-positive { color: #2e7d32; font-weight: 600; }
    .highlight-zero { color: #555; font-weight: 600; }
    #loading {
      font-style: italic;
      opacity: 0.75;
      text-align: center;
      font-size: 1rem;
      margin: 24px 0;
    }
    .section-title {
      font-size: 1.3rem;
      margin: 32px 0 16px;
      font-weight: 700;
    }
    #report-content { display: none; }
    .timestamp {
      font-size: 0.92rem;
      opacity: 0.8;
      margin-bottom: 16px;
    }
    .no-data {
      text-align: center;
      color: #777;
      font-style: italic;
      margin: 20px 0;
    }
    textarea {
      width: 100%;
      min-height: 180px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(130,191,210,0.3);
      background: white;
      font-family: inherit;
      font-size: 1.05rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Mandagsrapport – Peasy<span class="version">v15</span></h1>
  <p style="opacity: 0.8; margin-bottom: 32px;">Rapporter lagres i skyen – synlig for alle som åpner denne filen.</p>

  <div class="controls">
    <select id="weekSelect" onchange="loadSavedReport()">
      <option value="">Velg uke...</option>
    </select>
    <button id="generate-btn" onclick="generateNewReport()">Generer rapport for forrige fullførte uke</button>
    <button id="edit-btn" onclick="editUserComment()" style="display:none;">Rediger egen kommentar</button>
    <button id="lock-btn" onclick="showLockCommentModal()" style="display:none;">Lås inn rapport</button>
    <button id="delete-btn" onclick="showDeleteConfirm()" style="display:none; background:#c62828;">Slett rapport</button>
  </div>

  <div id="loading" style="display:none;">Laster...</div>

  <div id="report-content" style="display:none;">
    <div id="timestamp" class="timestamp"></div>
    <div id="commentary" class="commentary"></div>

    <div id="sold-section">
      <div class="section-title">Solgte biler</div>
      <table id="sold-table"></table>
    </div>

    <div id="returned-section">
      <div class="section-title">Returnerte biler</div>
      <table id="returned-table"></table>
    </div>
  </div>

  <!-- Lås-modal -->
  <div id="lock-comment-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center;">
    <div style="background:white; padding:32px; border-radius:16px; width:90%; max-width:600px; box-shadow:0 10px 30px rgba(0,0,0,0.3);">
      <h3>Kommentar før låsing (valgfritt)</h3>
      <textarea id="lock-comment-text" placeholder="Skriv en kommentar eller begrunnelse..."></textarea>
      <div style="margin-top:16px; text-align:right;">
        <button onclick="closeLockModal()" style="background:#757575; margin-right:12px;">Avbryt</button>
        <button onclick="confirmLockWithComment()" style="background:#2e7d32;">Lås inn</button>
      </div>
    </div>
  </div>

  <!-- Slett-bekreftelse -->
  <div id="delete-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center;">
    <div style="background:white; padding:32px; border-radius:16px; text-align:center; max-width:400px; box-shadow:0 10px 30px rgba(0,0,0,0.3);">
      <h3>Sikker på sletting?</h3>
      <p>Rapporten blir borte for alle brukere.</p>
      <div style="margin-top:20px;">
        <button onclick="promptPasswordForDelete()" style="background:#c62828; color:white;">Ja, slett</button>
        <button onclick="closeDeleteModal()" style="margin-left:16px; background:#757575; color:white;">Nei</button>
      </div>
    </div>
  </div>

  <!-- Passord for sletting -->
  <div id="password-prompt" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:32px; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.3); z-index:1100; text-align:center;">
    <h3>Passord kreves</h3>
    <input type="password" id="password-input" placeholder="Passord" style="padding:12px; font-size:1.1rem; width:220px; margin:16px auto; display:block;">
    <button onclick="checkDeletePassword()" style="background:#c62828; color:white;">Bekreft</button>
    <button onclick="closePasswordPrompt()" style="margin-left:16px; background:#757575; color:white;">Avbryt</button>
  </div>
</div>

<script>
// ────────────────────────────────────────────────
// KONFIGURASJON
const BIN_ID = '6981aa3dae596e708f0d773b';
const MASTER_KEY = '$2a$10$rBlUQ2a25wMoTJmNRu9hkuX5aB/DVZh9EhrM75Ek1nUAdvvILtuy.';
const DELETE_PASSWORD = "slett123"; // ← BYTT UT MED DITT EGET HEMMELIGE PASSORD!
const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
const HEADERS = { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY };
// ────────────────────────────────────────────────

let currentReport = null;

// Hjelpefunksjoner
function cleanNum(str) {
  if (!str) return 0;
  let s = String(str).replace(/[\s\u00A0]/g, '').replace(/\u2212/g, '-').replace(/[^\d.-]/g, '');
  return parseFloat(s) || 0;
}

function getISOWeek(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
  const yearStart = new Date(d.getFullYear(), 0, 1);
  const days = Math.floor((d - yearStart) / 86400000);
  return Math.ceil((days + 1) / 7);
}

function getMostRecentCompletedWeekStart() {
  const today = new Date();
  const dayOfWeek = today.getDay() || 7;
  let daysBack = dayOfWeek === 1 ? 8 : dayOfWeek;
  const endPrev = new Date(today);
  endPrev.setDate(today.getDate() - daysBack);
  endPrev.setHours(0,0,0,0);
  const startPrev = new Date(endPrev);
  startPrev.setDate(endPrev.getDate() - 6);
  startPrev.setHours(0,0,0,0);
  return startPrev;
}

// JSONBin
async function fetchReports() {
  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error(`Henting feilet: ${res.status}`);
    const json = await res.json();
    return json.record?.reports ?? [];
  } catch (err) {
    console.error("Feil ved henting:", err);
    return [];
  }
}

async function saveReports(reports) {
  try {
    const res = await fetch(API_URL, {
      method: 'PUT',
      headers: HEADERS,
      body: JSON.stringify({ reports })
    });
    if (!res.ok) throw new Error(`Lagring feilet: ${res.status}`);
    console.log("Lagret til JSONBin");
  } catch (err) {
    console.error("Lagring feilet:", err);
    alert("Kunne ikke lagre til skyen. Sjekk konsollen.");
  }
}

// Initial lasting – nyeste rapport som default
window.onload = async () => {
  const reports = await fetchReports();
  populateWeekSelect(reports);
  if (reports.length > 0) {
    const newest = reports[reports.length - 1];
    document.getElementById('weekSelect').value = newest.id;
    await loadSavedReport();
  }
  await updateGenerateButtonState();
};

function populateWeekSelect(reports) {
  const sel = document.getElementById('weekSelect');
  sel.innerHTML = '<option value="">Velg uke...</option>';
  reports.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r.id;
    opt.textContent = r.title;
    sel.appendChild(opt);
  });
}

async function loadSavedReport() {
  const id = document.getElementById('weekSelect').value;
  if (!id) {
    document.getElementById('report-content').style.display = 'none';
    document.querySelectorAll('#edit-btn, #lock-btn, #delete-btn').forEach(el => el.style.display = 'none');
    await updateGenerateButtonState();
    return;
  }

  const reports = await fetchReports();
  const report = reports.find(r => r.id === id);
  if (!report) return;

  currentReport = report;

  let ts = `Opprettet: ${report.created}`;
  if (report.edited) ts += ` • Sist endret: ${report.edited}`;
  if (report.locked && report.lockComment) ts += ` • Låst med: "${report.lockComment}"`;
  document.getElementById('timestamp').textContent = ts;

  let html = report.commentary || '<p style="color:#777;">Ingen fakta generert.</p>';
  if (report.userComment) {
    html += `
      <div class="user-comment">
        <h3>Kommentar til rapporten</h3>
        <div style="white-space: pre-wrap; line-height:1.6;">${report.userComment.replace(/\n/g, '<br>')}</div>
      </div>`;
  }
  document.getElementById('commentary').innerHTML = html;

  renderTable('sold-table', report.soldCars || []);
  renderTable('returned-table', report.returnedCars || []);

  document.getElementById('sold-section').style.display = report.soldCars?.length ? 'block' : 'none';
  document.getElementById('returned-section').style.display = report.returnedCars?.length ? 'block' : 'none';

  document.getElementById('report-content').style.display = 'block';

  const locked = !!report.locked;
  document.getElementById('edit-btn').style.display = 'block';
  document.getElementById('lock-btn').style.display = locked ? 'none' : 'block';
  document.getElementById('delete-btn').style.display = locked ? 'block' : 'none';

  await updateGenerateButtonState();
}

function renderTable(id, cars) {
  const table = document.getElementById(id);
  table.innerHTML = '';
  if (!cars.length) {
    table.innerHTML = '<tr><td colspan="7" class="no-data">Ingen biler</td></tr>';
    return;
  }

  table.innerHTML = `
    <thead>
      <tr>
        <th>Merke</th><th>Modell</th><th>År</th><th>AR laveste estimat</th><th>Bud</th><th>Diff NOK</th><th>Diff %</th>
      </tr>
    </thead>
    <tbody>
      ${cars.map(car => `
        <tr>
          <td>${car.Merke}</td>
          <td>${car.Modell}</td>
          <td>${car.År}</td>
          <td>${car['AR laveste estimat_raw']?.toLocaleString('nb-NO') || '-'}</td>
          <td>${car['Bud_raw']?.toLocaleString('nb-NO') || '-'}</td>
          <td class="${car['Diff NOK_raw'] < 0 ? 'highlight-negative' : car['Diff NOK_raw'] > 0 ? 'highlight-positive' : 'highlight-zero'}">
            ${car['Diff NOK_raw']?.toLocaleString('nb-NO') || '-'}
          </td>
          <td>${(car['Diff %_raw'] ?? 0).toFixed(1)}%</td>
        </tr>
      `).join('')}
    </tbody>
    <tfoot>
      <tr>
        <td colspan="3"><strong>Gjennomsnitt (${cars.length} biler)</strong></td>
        <td>${Math.round(cars.reduce((s,c)=>s+(c['AR laveste estimat_raw']||0),0)/cars.length||0).toLocaleString('nb-NO')}</td>
        <td>${Math.round(cars.reduce((s,c)=>s+(c['Bud_raw']||0),0)/cars.length||0).toLocaleString('nb-NO')}</td>
        <td class="${(()=>{let a=cars.reduce((s,c)=>s+(c['Diff NOK_raw']||0),0)/cars.length||0;return a<0?'highlight-negative':a>0?'highlight-positive':'highlight-zero'})()}">
          ${Math.round(cars.reduce((s,c)=>s+(c['Diff NOK_raw']||0),0)/cars.length||0).toLocaleString('nb-NO')}
        </td>
        <td>${(cars.reduce((s,c)=>s+(c['Diff %_raw']||0),0)/cars.length||0).toFixed(1)}%</td>
      </tr>
    </tfoot>`;
}

// Generer ny rapport
async function generateNewReport() {
  const btn = document.getElementById('generate-btn');
  if (btn.disabled) return;
  btn.disabled = true;
  document.getElementById('loading').textContent = 'Genererer...';
  document.getElementById('loading').style.display = 'block';

  try {
    const url = 'https://api.biladministrasjon.no/public/reports/peasy/dhqui7Hkl54?output=xlsx';
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const ab = await res.arrayBuffer();
    const wb = XLSX.read(ab, {type: 'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const data = XLSX.utils.sheet_to_json(ws, {header: 1, defval: ''});

    const headers = data[0].map(h => (h || '').trim());
    const col = {
      Merke: headers.indexOf('Merke'),
      Modell: headers.indexOf('Modell'),
      År: headers.indexOf('År'),
      'Endelig AR verdi': headers.findIndex(h => h?.includes('Endelig AR verdi')),
      Bud: headers.indexOf('Bud'),
      'Solgt på': headers.indexOf('Solgt på'),
      Returnert: headers.findIndex(h => h?.includes('Returnert'))
    };

    const startDate = getMostRecentCompletedWeekStart();
    const endDate = new Date(startDate);
    endDate.setDate(startDate.getDate() + 7);
    const weekNum = getISOWeek(startDate);
    const title = `Mandag ${startDate.toLocaleDateString('nb-NO')} – uke ${weekNum}`;
    const nowStr = new Date().toLocaleString('nb-NO', {dateStyle: 'short', timeStyle: 'short'});

    const reports = await fetchReports();
    if (reports.some(r => r.title === title)) {
      alert('Rapport for denne uken finnes allerede.');
      return;
    }

    const soldCars = [], returnedCars = [];

    for (let i = 1; i < data.length; i++) {
      const row = data[i];
      const parseDate = str => {
        if (!str) return null;
        const m = str.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
        return m ? new Date(m[3], m[2]-1, m[1]) : null;
      };

      const soldDate = parseDate(row[col['Solgt på']]);
      const retDate  = parseDate(row[col.Returnert]);

      let arLowest = 0;
      const arRange = row[col['Endelig AR verdi']] || '';
      if (arRange.includes('-')) {
        arLowest = parseFloat(arRange.split('-')[0].trim()) || 0;
      } else {
        arLowest = parseFloat(arRange) || 0;
      }

      const bud = parseFloat(row[col.Bud] || 0);
      const diffNok = bud - arLowest;
      const diffPct = arLowest ? (diffNok / arLowest * 100) : 0;

      const car = {
        Merke: row[col.Merke] || '-',
        Modell: row[col.Modell] || '-',
        År: row[col.År] || '-',
        'AR laveste estimat_raw': arLowest,
        'Bud_raw': bud,
        'Diff NOK_raw': diffNok,
        'Diff %_raw': diffPct
      };

      if (soldDate && soldDate >= startDate && soldDate < endDate) soldCars.push(car);
      if (retDate  && retDate  >= startDate && retDate  < endDate) returnedCars.push(car);
    }

    const commentaryHtml = generateCommentary(soldCars, returnedCars);

    currentReport = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2),
      title,
      created: nowStr,
      edited: null,
      commentary: commentaryHtml,
      userComment: '',
      soldCars,
      returnedCars,
      locked: false,
      lockComment: ''
    };

    await saveCurrentReport();

    const updatedReports = await fetchReports();
    populateWeekSelect(updatedReports);
    document.getElementById('weekSelect').value = currentReport.id;
    await loadSavedReport();

    alert('Rapport generert og lagret i skyen!');
  } catch (err) {
    console.error(err);
    alert('Feil: ' + err.message);
  } finally {
    document.getElementById('loading').style.display = 'none';
    btn.disabled = false;
  }
}

function generateCommentary(sold, returned) {
  const stats = arr => {
    if (!arr.length) return {n:0,u:0,o:0,z:0,avgN:0,avgP:0};
    let u=0,o=0,z=0,sn=0,sp=0;
    arr.forEach(c => {
      const n = c['Diff NOK_raw'];
      if (n<0) u++;
      else if (n>0) o++;
      else z++;
      sn += n;
      sp += c['Diff %_raw'];
    });
    return {
      n: arr.length,
      u, o, z,
      avgN: Math.round(sn / arr.length),
      avgP: (sp / arr.length).toFixed(1)
    };
  };

  const s = stats(sold);
  const r = stats(returned);

  return `
    <h3>Fakta – forrige fullførte uke (man–søn)</h3>

    <div style="margin: 24px 0 12px 0;">
      <strong>Solgte biler</strong><br>
      Totalt: ${s.n} biler
    </div>

    <ul style="margin: 8px 0 32px 24px; line-height: 1.6; list-style-type: disc; color: #004225;">
      <li>Under estimat: ${s.u} biler</li>
      <li>Over estimat: ${s.o} biler</li>
      <li>På estimat: ${s.z} biler</li>
      <li style="margin-top: 12px; font-weight: 500; color: #2e7d32;">
        Gjennomsnittlig diff: ${s.avgN.toLocaleString('nb-NO')} kr (${s.avgP}%)
      </li>
    </ul>

    <div style="margin: 32px 0 12px 0;">
      <strong>Returnerte biler</strong><br>
      Totalt: ${r.n} biler
    </div>

    <div style="margin-bottom: 24px; color: #004225; font-weight: 500;">
      Gjennomsnittlig diff: ${r.avgN.toLocaleString('nb-NO')} kr (${r.avgP}%)
    </div>
  `;
}

async function saveCurrentReport() {
  if (!currentReport) return;
  let reports = await fetchReports();
  const idx = reports.findIndex(r => r.id === currentReport.id);
  if (idx >= 0) reports[idx] = currentReport;
  else reports.push(currentReport);
  await saveReports(reports);
}

async function updateGenerateButtonState() {
  const btn = document.getElementById('generate-btn');
  const start = getMostRecentCompletedWeekStart();
  const week = getISOWeek(start);
  const title = `Mandag ${start.toLocaleDateString('nb-NO')} – uke ${week}`;
  const reports = await fetchReports();
  const exists = reports.some(r => r.title === title);
  btn.disabled = exists;
  btn.title = exists ? "Rapport for denne uken finnes allerede" : "";
}

// Rediger KUN brukerens egen kommentar
function editUserComment() {
  if (!currentReport) return;
  const div = document.getElementById('commentary');
  const currentUserText = currentReport.userComment || '';

  let html = currentReport.commentary || '<p style="color:#777;">Ingen fakta generert.</p>';
  html += `
    <div class="user-comment" style="margin-top:32px; padding-top:20px; border-top:1px solid rgba(130,191,210,0.2);">
      <h3>Rediger kommentar til rapporten</h3>
      <textarea id="user-comment-textarea">${currentUserText}</textarea>
      <div style="margin-top:12px; text-align:right;">
        <button onclick="cancelUserEdit()" style="background:#757575; margin-right:8px;">Avbryt</button>
        <button onclick="saveUserComment()" style="background:#2e7d32;">Lagre kommentar</button>
      </div>
    </div>`;
  div.innerHTML = html;
  document.getElementById('edit-btn').style.display = 'none';
}

function cancelUserEdit() {
  loadSavedReport();
}

async function saveUserComment() {
  const ta = document.getElementById('user-comment-textarea');
  if (!ta) return;
  const newText = ta.value.trim();
  currentReport.userComment = newText;
  currentReport.edited = new Date().toLocaleString('nb-NO', {dateStyle:'short', timeStyle:'short'});
  await saveCurrentReport();
  await loadSavedReport();
}

// Låsing
function showLockCommentModal() {
  document.getElementById('lock-comment-modal').style.display = 'flex';
}

function closeLockModal() {
  document.getElementById('lock-comment-modal').style.display = 'none';
}

async function confirmLockWithComment() {
  const comment = document.getElementById('lock-comment-text').value.trim();
  if (currentReport) {
    currentReport.locked = true;
    currentReport.lockComment = comment || '(ingen kommentar)';
    await saveCurrentReport();
    alert('Rapporten er nå låst.');
    closeLockModal();
    await loadSavedReport();
  }
}

// Sletting
function showDeleteConfirm() {
  document.getElementById('delete-modal').style.display = 'flex';
}

function closeDeleteModal() {
  document.getElementById('delete-modal').style.display = 'none';
}

function promptPasswordForDelete() {
  closeDeleteModal();
  document.getElementById('password-prompt').style.display = 'block';
}

function closePasswordPrompt() {
  document.getElementById('password-prompt').style.display = 'none';
}

async function checkDeletePassword() {
  if (document.getElementById('password-input').value === DELETE_PASSWORD) {
    let reports = await fetchReports();
    reports = reports.filter(r => r.id !== currentReport.id);
    await saveReports(reports);
    alert('Rapport slettet.');
    currentReport = null;
    const updated = await fetchReports();
    populateWeekSelect(updated);
    document.getElementById('report-content').style.display = 'none';
    closePasswordPrompt();
    await updateGenerateButtonState();
  } else {
    alert('Feil passord.');
  }
}
</script>
