<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peasy Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --peasy-green: #004225;
      --peasy-yellow: #FFCC33;
      --light-bg-start: #F2F7F9;
      --light-bg-end: #E8F0F5;
      --card-bg: rgba(255,255,255,0.96);
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, var(--light-bg-start) 0%, var(--light-bg-end) 100%);
      color: var(--peasy-green);
      min-height: 100vh;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(0,66,37,0.08);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,66,37,0.06);
    }
    .gauge-container {
      position: relative;
      width: 148px;
      height: 148px;
      margin: 0 auto;
    }
    #version-info {
      position: fixed;
      bottom: 12px;
      right: 16px;
      font-size: 0.8rem;
      color: #555;
      padding: 4px 10px;
      pointer-events: none;
    }
    .date-filter {
      background: rgba(255,255,255,0.7);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1.5rem;
    }
    .chart-container {
      max-height: 420px;
      margin-top: 2rem;
    }
    .preset-btn {
      @apply px-4 py-2 text-sm font-medium rounded-lg transition;
    }
    .preset-btn.active {
      @apply bg-[#FFCC33] text-[#004225] shadow-md;
    }
    .preset-btn:hover:not(.active) {
      @apply bg-gray-100;
    }
  </style>
</head>
<body class="text-[#004225]">

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

    <header class="text-center mb-8">
      <img src="Peasy_Logo_ORG.png" alt="Peasy Logo" class="mx-auto h-16 md:h-20 mb-4">
    </header>

    <div class="date-filter card">
      <div class="flex flex-wrap justify-center gap-3 mb-4">
        <button class="preset-btn" onclick="setPreset(30)">30 dager</button>
        <button class="preset-btn" onclick="setPreset(60)">60 dager</button>
        <button class="preset-btn active" onclick="setPreset(90)">90 dager</button>
        <button class="preset-btn" onclick="setPreset('custom')">Custom</button>
      </div>

      <div class="flex flex-wrap justify-center gap-4 items-end">
        <div>
          <label class="block text-sm font-medium mb-1">Fra dato</label>
          <input type="date" id="fromDate" class="px-4 py-2 border border-gray-300 rounded-lg">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Til dato</label>
          <input type="date" id="toDate" class="px-4 py-2 border border-gray-300 rounded-lg">
        </div>
        <button onclick="loadData()" class="px-6 py-2 bg-[#FFCC33] text-[#004225] font-semibold rounded-xl hover:bg-[#FFD966] transition">
          Oppdater
        </button>
      </div>
    </div>

    <div class="flex justify-center mb-6">
      <div id="status" class="text-center text-gray-600 min-h-[1.5rem]"></div>
    </div>

    <div class="card p-8 md:p-10">
      <h2 class="text-2xl md:text-3xl font-semibold text-center mb-10">Nøkkeltall & selgerprisvillighet</h2>
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-8 mb-12">
        <div class="text-center">
          <div class="gauge-container"><canvas id="g1"></canvas></div>
          <p class="mt-4 text-sm text-gray-600">Mottatt av SD mottatt</p>
          <p class="text-4xl font-bold text-[#FFCC33]" id="v1">-</p>
        </div>
        <div class="text-center">
          <div class="gauge-container"><canvas id="g2"></canvas></div>
          <p class="mt-4 text-sm text-gray-600">Solgt av mottatt</p>
          <p class="text-4xl font-bold text-[#FFCC33]" id="v2">-</p>
        </div>
        <div class="text-center">
          <div class="gauge-container"><canvas id="g3"></canvas></div>
          <p class="mt-4 text-sm text-gray-600">% av AR – Solgt</p>
          <p class="text-4xl font-bold text-[#FFCC33]" id="v3">-</p>
        </div>
        <div class="text-center">
          <div class="gauge-container"><canvas id="g4"></canvas></div>
          <p class="mt-4 text-sm text-gray-600">% av AR – Returnert</p>
          <p class="text-4xl font-bold text-red-600" id="v4">-</p>
        </div>
      </div>

      <h3 class="text-xl font-semibold text-center mb-4">Trend: Gj.sn. % av AR – Solgt vs Returnert per måned</h3>
      <div class="chart-container">
        <canvas id="combinedTrendChart"></canvas>
      </div>
    </div>
  </div>

  <div id="version-info">v1.1.5 – Dashboard – 10.02.2026</div>

  <script>
    const DATA_URL = "https://api.biladministrasjon.no/public/reports/peasy/dhqui7Hkl54?output=xlsx";

    let currentPreset = 90;

    function setPreset(days) {
      currentPreset = days;
      document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
      if (days !== 'custom') {
        document.querySelector(`button[onclick="setPreset(${days})"]`).classList.add('active');
      } else {
        document.querySelector('button[onclick="setPreset(\'custom\')"]').classList.add('active');
      }

      const today = new Date();
      const from = new Date(today);
      if (days !== 'custom') {
        from.setDate(today.getDate() - days);
        document.getElementById('fromDate').value = from.toISOString().split('T')[0];
        document.getElementById('toDate').value = today.toISOString().split('T')[0];
      }

      loadData();
    }

    // Initial load with 90 days
    window.addEventListener('load', () => {
      setPreset(90);
    });

    let combinedChartInstance = null;

    async function loadData() {
      const status = document.getElementById('status');
      status.textContent = "Laster data...";

      const fromStr = document.getElementById('fromDate').value;
      const toStr   = document.getElementById('toDate').value;
      const fromDate = fromStr ? new Date(fromStr) : null;
      const toDate   = toStr   ? new Date(toStr)   : null;

      try {
        const res = await fetch(DATA_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const ab = await res.arrayBuffer();
        const wb = XLSX.read(ab, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

        const headers = json[0].map(h => String(h || '').trim());
        const dataRows = json.slice(1);

        function findCol(patterns) {
          const lower = headers.map(h => h.toLowerCase());
          for (let p of patterns) {
            let idx = lower.findIndex(h => h === p.toLowerCase());
            if (idx !== -1) return idx;
            idx = lower.findIndex(h => h.includes(p.toLowerCase()));
            if (idx !== -1) return idx;
          }
          return -1;
        }

        const idx = {
          sd: findCol(['SD mottatt på']),
          ar: findCol(['Endelig AR verdi']),
          mottatt: findCol(['Mottatt']),
          bud: findCol(['Høyeste bud']),
          solgt: findCol(['Solgt på']),
          ret: findCol(['Returnert på'])
        };

        const cleanNum = str => {
          if (!str || str === '-' || str === '') return 0;
          let s = String(str).replace(/\s/g, '').replace(/,/g, '.').replace(/[^0-9.-]/g, '');
          if (s.includes('-')) s = s.split('-')[0];
          return parseFloat(s) || 0;
        };

        const parseDate = str => {
          if (!str) return null;
          const parts = String(str).trim().split(/\s+/)[0].split('.');
          if (parts.length !== 3) return null;
          const [d, m, y] = parts.map(Number);
          return new Date(y, m-1, d);
        };

        const cars = dataRows.map(row => {
          const sdDate = parseDate(row[idx.sd]);
          return {
            sdStr: row[idx.sd] || '',
            sdDate,
            ar: cleanNum(row[idx.ar]),
            mottatt: row[idx.mottatt] || '',
            bud: cleanNum(row[idx.bud]),
            solgt: row[idx.solgt] || '',
            ret: row[idx.ret] || ''
          };
        }).filter(r => r.sdStr && r.ar > 10000 && (!fromDate || (r.sdDate && r.sdDate >= fromDate)) && (!toDate || (r.sdDate && r.sdDate <= toDate)));

        const mottattCars = cars.filter(c => c.mottatt);
        const soldCars    = cars.filter(c => c.solgt);
        const returnedCars = cars.filter(c => c.ret);

        status.textContent = `${cars.length} biler i perioden • ${mottattCars.length} mottatt • ${soldCars.length} solgt • ${returnedCars.length} returnert`;

        renderGauges(cars, mottattCars, soldCars, returnedCars);
        renderCombinedTrendChart(soldCars, returnedCars);

      } catch (e) {
        console.error(e);
        status.textContent = "Feil ved lasting – sjekk konsoll";
      }
    }

    function renderGauges(cars, mottattCars, soldCars, returnedCars) {
      const pctMottatt = cars.length ? Math.round(mottattCars.length / cars.length * 100) : 0;
      const pctSell = mottattCars.length ? Math.round(soldCars.length / mottattCars.length * 100) : 0;

      let avgSoldPct = 0, avgRetPct = 0;

      if (soldCars.length) {
        const ratios = soldCars.map(c => c.ar > 0 ? (c.bud / c.ar) * 100 : 0).filter(r => r > 0);
        avgSoldPct = Math.round(ratios.reduce((a,b)=>a+b,0) / ratios.length);
      }

      if (returnedCars.length) {
        const ratios = returnedCars.map(c => c.ar > 0 ? (c.bud / c.ar) * 100 : 0).filter(r => r > 0);
        avgRetPct = Math.round(ratios.reduce((a,b)=>a+b,0) / ratios.length);
      }

      document.getElementById('v1').textContent = pctMottatt + '%';
      document.getElementById('v2').textContent = pctSell + '%';
      document.getElementById('v3').textContent = avgSoldPct + '%';
      document.getElementById('v4').textContent = avgRetPct + '%';

      const cfg = (val, color = '#FFCC33') => ({
        type: 'doughnut',
        data: { datasets: [{ data: [val, 100-val], backgroundColor: [color, '#e5e7eb'], borderWidth: 0, circumference: 270, rotation: 225 }] },
        options: { cutout: '78%', plugins: { legend: {display:false}, tooltip:{enabled:false} } }
      });

      new Chart(document.getElementById('g1'), cfg(pctMottatt));
      new Chart(document.getElementById('g2'), cfg(pctSell));
      new Chart(document.getElementById('g3'), cfg(avgSoldPct));
      new Chart(document.getElementById('g4'), cfg(avgRetPct, '#ef4444'));
    }

    function renderCombinedTrendChart(soldCars, returnedCars) {
      const canvas = document.getElementById('combinedTrendChart');

      const monthlySold = {};
      const monthlyRet  = {};

      soldCars.forEach(c => {
        if (!c.sdDate || c.ar <= 0 || c.bud <= 0) return;
        const key = c.sdDate.toISOString().slice(0,7);
        if (!monthlySold[key]) monthlySold[key] = { sum: 0, count: 0 };
        monthlySold[key].sum += (c.bud / c.ar) * 100;
        monthlySold[key].count++;
      });

      returnedCars.forEach(c => {
        if (!c.sdDate || c.ar <= 0 || c.bud <= 0) return;
        const key = c.sdDate.toISOString().slice(0,7);
        if (!monthlyRet[key]) monthlyRet[key] = { sum: 0, count: 0 };
        monthlyRet[key].sum += (c.bud / c.ar) * 100;
        monthlyRet[key].count++;
      });

      const allMonths = [...new Set([...Object.keys(monthlySold), ...Object.keys(monthlyRet)])].sort();

      if (allMonths.length === 0) {
        canvas.parentElement.innerHTML = '<p class="text-center text-gray-600 py-8">Ingen data til trendvisning</p>';
        return;
      }

      const labels = allMonths.map(m => {
        const [y, mth] = m.split('-');
        return `${mth}.${y.slice(2)}`;
      });

      const soldData = allMonths.map(m => {
        const entry = monthlySold[m];
        return entry && entry.count >= 3 ? Math.round(entry.sum / entry.count) : null;
      });

      const retData = allMonths.map(m => {
        const entry = monthlyRet[m];
        return entry && entry.count >= 3 ? Math.round(entry.sum / entry.count) : null;
      });

      if (combinedChartInstance) combinedChartInstance.destroy();

      combinedChartInstance = new Chart(canvas, {
        type: 'line',
        data: {
          labels,
          datasets: [
            {
              label: 'Solgt – % av AR',
              data: soldData,
              borderColor: '#004225',
              backgroundColor: '#004225',
              pointBackgroundColor: '#FFCC33',
              pointBorderColor: '#004225',
              pointRadius: 5,
              tension: 0.3,
              fill: false
            },
            {
              label: 'Returnert – % av AR',
              data: retData,
              borderColor: '#ef4444',
              backgroundColor: '#ef4444',
              pointBackgroundColor: '#FFCC33',
              pointBorderColor: '#ef4444',
              pointRadius: 5,
              tension: 0.3,
              fill: false
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              min: 40,
              max: 110,
              title: { display: true, text: '% av AR' }
            },
            x: { title: { display: true, text: 'Måned (SD mottatt)' } }
          },
          plugins: {
            legend: { display: true, position: 'top' }
          }
        }
      });
    }
  </script>
</body>
</html>
