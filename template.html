<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Peasy Exec Rapport</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 40px 20px; background: #e0e9e5; color: #004225; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 50px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { text-align: center; font-size: 3rem; font-weight: 800; color: #004225; margin-bottom: 10px; }
        .subtitle { text-align: center; font-size: 1.5rem; font-weight: 500; color: #004225; margin-bottom: 30px; }
        .timestamp { text-align: center; font-size: 1rem; color: #555; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 40px; margin: 40px 0; }
        .card { background: #f8faf9; padding: 32px; border-radius: 16px; border: 1px solid #ddd; box-shadow: 0 6px 20px rgba(0,0,0,0.06); text-align: center; }
        .card strong { font-size: 1.5rem; font-weight: 700; display: block; margin-bottom: 16px; color: #004225; }
        .card .number { font-size: 3.8rem; font-weight: 800; color: #004225; margin-bottom: 24px; }
        .funnel-arrow { font-size: 3rem; color: #004225; align-self: center; }
        .chart-container { margin: 60px 0; padding: 32px; background: #f8faf9; border-radius: 16px; border: 1px solid #ddd; height: 400px; }
        .periode-controls { text-align: center; margin-bottom: 40px; }
        .periode-controls label { margin: 0 20px; font-size: 1.2rem; cursor: pointer; }
        #month-selector select { padding: 10px 20px; font-size: 1.2rem; margin: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Peasy Exec Rapport</h1>
    <div class="subtitle">Funnel: Priced → Received → Sold / Returned</div>
    <div class="timestamp">Generert: <span id="timestamp">{{ now_year }}-{{ now_month }}</span> | Versjon: v1.1 - Fixed JSON parsing & data cleaning</div>

    <div class="periode-controls">
        <label><input type="radio" name="period-type" value="month" checked> En måned</label>
        <label><input type="radio" name="period-type" value="range"> Egendefinert</label>
        <div id="month-selector">
            <select id="period-select">
                {% for m in months %}
                    <option value="{{ m }}" {% if m == default_month %}selected{% endif %}>{{ m }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div class="grid" id="funnel-grid">
        <div class="card">
            <strong>Priced<br>(SD mottatt)</strong>
            <div class="number" id="priset-count">0</div>
        </div>
        <div class="funnel-arrow">→</div>
        <div class="card">
            <strong>Received<br>(Mottatt)</strong>
            <div class="number" id="mottatt-count">0</div>
        </div>
        <div class="funnel-arrow">→</div>
        <div class="card">
            <strong>Sold<br>(Solgt på)</strong>
            <div class="number" id="solgt-count">0</div>
        </div>
        <div class="funnel-arrow">↳</div>
        <div class="card">
            <strong>Returned<br>(Returnert)</strong>
            <div class="number" id="returnert-count">0</div>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="funnelChart"></canvas>
    </div>
</div>

<script>
    // Parse safely and ensure we have arrays
    let dataAllRaw = {{ data_all_json | tojson | safe }};
    let dataCompletedRaw = {{ data_completed_json | tojson | safe }};

    const dataAll = Array.isArray(dataAllRaw) ? dataAllRaw : Object.values(dataAllRaw || {});
    const dataCompleted = Array.isArray(dataCompletedRaw) ? dataCompletedRaw : Object.values(dataCompletedRaw || {});

    console.log('dataAll type:', typeof dataAll, 'length:', dataAll.length);
    console.log('dataCompleted type:', typeof dataCompleted, 'length:', dataCompleted.length);
    console.log('First all item:', dataAll[0]);
    console.log('First completed item:', dataCompleted[0]);

    let currentPeriod = { type: 'month', value: '{{ default_month }}' };

    function isInPeriod(dateStr, period) {
        if (!dateStr) return false;
        const [year, month] = dateStr.split('-');
        const dateYM = `${year}-${month}`;
        if (period.type === 'month') {
            return dateYM === period.value;
        } else if (period.type === 'range') {
            return dateYM >= period.start && dateYM <= period.end;
        }
        return false;
    }

    function getPrisetCount(period) {
        return dataAll.filter(d => d['SD mottatt på'] && isInPeriod(d['SD mottatt på_month'], period)).length;
    }

    function getMottattCount(period) {
        return dataCompleted.filter(d => d['Mottatt'] && isInPeriod(d['Mottatt_month'], period)).length;
    }

    function getSolgtCount(period) {
        return dataCompleted.filter(d => d['Solgt på'] && isInPeriod(d['Solgt på_month'], period)).length;
    }

    function getReturnertCount(period) {
        return dataCompleted.filter(d => d['Returnert på'] && isInPeriod(d['Returnert på_month'], period)).length;
    }

    function updateCards() {
        document.getElementById('priset-count').textContent   = getPrisetCount(currentPeriod);
        document.getElementById('mottatt-count').textContent  = getMottattCount(currentPeriod);
        document.getElementById('solgt-count').textContent    = getSolgtCount(currentPeriod);
        document.getElementById('returnert-count').textContent = getReturnertCount(currentPeriod);

        updateFunnelChart();
    }

    function updateFunnelChart() {
        const ctx = document.getElementById('funnelChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Priced', 'Received', 'Sold', 'Returned'],
                datasets: [{
                    label: 'Antall biler',
                    data: [
                        getPrisetCount(currentPeriod),
                        getMottattCount(currentPeriod),
                        getSolgtCount(currentPeriod),
                        getReturnertCount(currentPeriod)
                    ],
                    backgroundColor: ['#ffcc33', '#27ae60', '#004225', '#c0392b'],
                    borderWidth: 1
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                scales: { x: { beginAtZero: true } }
            }
        });
    }

    // Event listeners
    document.querySelectorAll('input[name="period-type"]').forEach(r => {
        r.addEventListener('change', e => {
            if (e.target.value === 'month') {
                currentPeriod = { type: 'month', value: document.getElementById('period-select').value };
            }
            updateCards();
        });
    });

    document.getElementById('period-select').addEventListener('change', e => {
        if (document.querySelector('[name="period-type"]:checked').value === 'month') {
            currentPeriod = { type: 'month', value: e.target.value };
            updateCards();
        }
    });

    // Initial render
    updateCards();
</script>

</body>
</html>
