<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Peasy – selg bilen fra sofaen</title>
<style>
  :root{
    --coral:#ff5e7e; --orange:#ff9f43; --yellow:#ffd93d; --mint:#06d6a0; --sky:#3fc1ff; --purple:#7b2cbf; --violet:#b983ff;
    --ink:#2a1a3d; --white:#fff;
    --font:"Inter","SF Pro Display",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Helvetica,Arial,sans-serif;
    --bounce:cubic-bezier(.34,1.56,.64,1);
    --ease:cubic-bezier(.22,.8,.26,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#3a1466;color:var(--white);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
  body{display:flex;align-items:center;justify-content:center}
  #stage{position:relative;flex:none;width:1080px;height:1920px;overflow:hidden;transform-origin:center center;background:#3a1466}

  /* backgrounds, one per scene, cross-faded */
  .bg{position:absolute;inset:0;opacity:0;transition:opacity .7s var(--ease)}
  .bg.on{opacity:1}
  .bg.hook{background:linear-gradient(160deg,#ff5e7e 0%,#ff9f43 55%,#ffd93d 100%)}
  .bg.s1{background:linear-gradient(160deg,#ffd93d 0%,#06d6a0 100%)}
  .bg.s2{background:linear-gradient(160deg,#06d6a0 0%,#3fc1ff 100%)}
  .bg.s3{background:linear-gradient(160deg,#7b2cbf 0%,#ff5e7e 100%)}
  .bg.s4{background:linear-gradient(160deg,#ff9f43 0%,#ff5e7e 100%)}
  .bg.s5{background:linear-gradient(160deg,#3fc1ff 0%,#7b2cbf 100%)}
  .bg.s6{background:linear-gradient(160deg,#06d6a0 0%,#ffd93d 100%)}
  .bg.end{background:linear-gradient(160deg,#7b2cbf 0%,#ff5e7e 60%,#ff9f43 100%)}
  .bg::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.22),transparent 55%)}
  .bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .bubbles i{position:absolute;border-radius:50%;background:rgba(255,255,255,.14);animation:bub linear infinite}
  @keyframes bub{from{transform:translateY(0) scale(1)}to{transform:translateY(-2200px) scale(1.4)}}

  .brand{position:absolute;top:96px;left:0;right:0;text-align:center;font-size:34px;font-weight:900;letter-spacing:-.03em;z-index:5;text-shadow:0 4px 16px rgba(0,0,0,.15)}
  .progress{position:absolute;left:90px;right:90px;bottom:96px;height:8px;border-radius:4px;background:rgba(255,255,255,.3);z-index:5}
  .progress i{display:block;height:100%;width:0;border-radius:4px;background:#fff}

  /* overlay */
  .overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#7b2cbf,#ff5e7e 60%,#ff9f43);opacity:0;pointer-events:none;transition:opacity .6s var(--ease)}
  .overlay.show{opacity:1;pointer-events:auto}
  .ov-logo{position:relative;font-size:170px;font-weight:900;letter-spacing:-.06em;line-height:1;margin-bottom:130px;text-shadow:0 10px 30px rgba(0,0,0,.2)}
  .sp{position:absolute;width:86px;height:56px}.sp svg{width:100%;height:100%;overflow:visible}
  .ov-logo .sp{right:-32px;top:-8px}
  .play{position:relative;width:320px;height:320px;border-radius:50%;border:0;background:var(--yellow);cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 30px 70px rgba(0,0,0,.25);transition:transform .3s var(--bounce);-webkit-tap-highlight-color:transparent;outline:none;animation:wobble 2.4s ease-in-out infinite}
  @keyframes wobble{0%,100%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(4deg) scale(1.05)}}
  .play:hover,.play:focus-visible{transform:scale(1.08)}
  .play::before{content:"";position:absolute;inset:-30px;border-radius:50%;border:5px solid rgba(255,255,255,.6);animation:playRing 2s ease-out infinite}
  @keyframes playRing{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.5);opacity:0}}
  .play svg{width:120px;height:120px;margin-left:18px}.play path{fill:var(--ink)}
  .play-label{margin-top:56px;font-size:44px;font-weight:800}

  /* scenes */
  .scene{position:absolute;inset:0;display:none;opacity:0}
  .scene.on{display:block;animation:sceneIn .5s var(--ease) forwards}
  .scene.out{animation:sceneOut .4s ease-in forwards}
  @keyframes sceneIn{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}
  @keyframes sceneOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.94)}}

  .h{position:absolute;left:70px;right:70px;top:300px;text-align:center;font-size:118px;font-weight:900;letter-spacing:-.04em;line-height:1.05;text-shadow:0 10px 30px rgba(0,0,0,.18)}
  .h .w{display:inline-block;opacity:0;transform:translateY(80px) rotate(-6deg) scale(.6);animation:wordPop .6s var(--bounce) forwards}
  @keyframes wordPop{to{opacity:1;transform:translateY(0) rotate(0) scale(1)}}
  .h .w.hl{color:var(--yellow)}
  .h.tilt{transform:rotate(-3deg)}
  .sub{position:absolute;left:70px;right:70px;top:620px;text-align:center;font-size:52px;font-weight:800;opacity:0;animation:wordPop .6s var(--bounce) forwards}

  @keyframes popIn{0%{opacity:0;transform:scale(.3) rotate(-14deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
  @keyframes dropIn{0%{opacity:0;transform:translateY(-500px) rotate(-10deg)}100%{opacity:1;transform:translateY(0) rotate(0)}}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-26px) rotate(2deg)}}
  @keyframes wig{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes fadeIn{to{opacity:1}}
  @keyframes blink{50%{opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}

  .big{position:absolute;left:50%;transform-origin:center}
  .shadow{filter:drop-shadow(0 30px 40px rgba(0,0,0,.22))}

  /* ===== hook: sofa ===== */
  .sofa{top:860px;width:760px;height:460px;margin-left:-380px;opacity:0;animation:dropIn .7s .25s var(--bounce) forwards,floaty 3s 1s ease-in-out infinite}
  .sofa svg{width:100%;height:100%;overflow:visible}
  .spark{position:absolute;width:60px;height:60px;opacity:0;animation:sparkle 1.2s ease-out infinite}
  .spark::before,.spark::after{content:"";position:absolute;left:50%;top:50%;width:60px;height:14px;margin:-7px 0 0 -30px;border-radius:7px;background:#fff}
  .spark::after{transform:rotate(90deg)}
  @keyframes sparkle{0%{opacity:0;transform:scale(.2) rotate(0)}40%{opacity:1}100%{opacity:0;transform:scale(1.2) rotate(90deg)}}

  /* ===== 1: plate ===== */
  .plate{top:880px;width:820px;height:230px;margin-left:-410px;border-radius:40px;background:#fff;border:10px solid var(--ink);display:flex;align-items:center;gap:30px;padding:0 40px;
    box-shadow:0 40px 60px rgba(0,0,0,.25);opacity:0;animation:plateIn .8s .4s var(--bounce) forwards,wig 2.4s 1.3s ease-in-out infinite}
  @keyframes plateIn{0%{opacity:0;transform:translateY(900px) rotate(25deg) scale(.5)}100%{opacity:1;transform:translateY(0) rotate(0) scale(1)}}
  .plate .flag{width:86px;height:140px;border-radius:16px;background:#2a52be;color:#ffd93d;font-size:34px;font-weight:900;display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px}
  .plate .txt{font-size:112px;font-weight:900;color:var(--ink);letter-spacing:.06em;font-variant-numeric:tabular-nums}
  .plate .txt span{opacity:0;animation:popIn .25s var(--bounce) forwards}
  .cursor{position:absolute;left:50%;top:1140px;width:120px;height:120px;margin-left:200px;opacity:0;animation:cursorIn .5s 1s var(--bounce) forwards,tapTap .5s 1.6s ease-in-out 3}
  @keyframes cursorIn{to{opacity:1}}
  @keyframes tapTap{50%{transform:translateY(-30px) scale(.9)}}
  .cursor svg{width:100%;height:100%}.cursor path{fill:#ffcf9c;stroke:var(--ink);stroke-width:8;stroke-linejoin:round}

  /* ===== 2: cars ===== */
  .cars{position:absolute;left:0;right:0;top:880px;height:500px}
  .car{position:absolute;width:420px;height:230px;opacity:0}
  .car svg{width:100%;height:100%;overflow:visible}
  .car.c1{left:60px;top:40px;animation:carL .8s .3s var(--bounce) forwards,floaty 2.6s 1.2s ease-in-out infinite}
  .car.c2{left:330px;top:250px;animation:popIn .7s .9s var(--bounce) forwards,wig 2s 1.7s ease-in-out infinite}
  .car.c3{right:60px;top:40px;animation:carR .8s .6s var(--bounce) forwards,floaty 2.6s 1.5s ease-in-out infinite}
  @keyframes carL{0%{opacity:0;transform:translateX(-900px) rotate(-20deg)}100%{opacity:1;transform:translateX(0) rotate(0)}}
  @keyframes carR{0%{opacity:0;transform:translateX(900px) rotate(20deg)}100%{opacity:1;transform:translateX(0) rotate(0)}}
  .eq{position:absolute;left:50%;top:1070px;width:180px;height:180px;margin-left:-90px;border-radius:50%;background:#fff;color:var(--ink);font-size:120px;font-weight:900;display:flex;align-items:center;justify-content:center;
    box-shadow:0 20px 50px rgba(0,0,0,.2);opacity:0;animation:popIn .5s 1.5s var(--bounce) forwards,wobble 1.6s 2s ease-in-out infinite}

  /* ===== 3: bids ===== */
  .bids{position:absolute;left:50%;top:820px;width:820px;margin-left:-410px}
  .bid{position:absolute;left:0;right:0;height:190px;border-radius:50px;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 54px;
    font-size:76px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums;box-shadow:0 30px 50px rgba(0,0,0,.22);opacity:0}
  .bid small{font-size:28px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--purple);background:#f1e6ff;padding:12px 22px;border-radius:999px}
  .bid.b1{animation:bidL .7s .4s var(--bounce) forwards,bidOld .4s 2.2s forwards}
  .bid.b2{animation:bidR .7s 1.2s var(--bounce) forwards,bidOld .4s 2.2s forwards}
  .bid.b3{background:var(--yellow);animation:bidUp .8s 2.0s var(--bounce) forwards,wobble 1.4s 2.8s ease-in-out infinite}
  @keyframes bidL{0%{opacity:0;transform:translateX(-1000px) rotate(-15deg)}100%{opacity:1;transform:translateX(0) rotate(0)}}
  @keyframes bidR{0%{opacity:0;transform:translateX(1000px) rotate(15deg)}100%{opacity:1;transform:translateX(0) rotate(0)}}
  @keyframes bidUp{0%{opacity:0;transform:translateY(700px) scale(.6)}100%{opacity:1;transform:translateY(0) scale(1.08)}}
  @keyframes bidOld{to{opacity:.55;transform:scale(.94)}}
  .arrowup{position:absolute;left:50%;top:1480px;width:140px;height:140px;margin-left:-70px;opacity:0;animation:popIn .5s 2.6s var(--bounce) forwards,upup .8s 3s ease-in-out infinite}
  @keyframes upup{50%{transform:translateY(-30px)}}
  .arrowup svg{width:100%;height:100%}.arrowup path{fill:none;stroke:#fff;stroke-width:22;stroke-linecap:round;stroke-linejoin:round}

  /* ===== phone ===== */
  .phone{position:absolute;left:50%;top:760px;width:580px;height:1000px;margin-left:-290px;border-radius:90px;background:var(--ink);padding:22px;
    box-shadow:0 50px 80px rgba(0,0,0,.3);opacity:0;animation:dropIn .8s .3s var(--bounce) forwards}
  .phone .screen{position:relative;width:100%;height:100%;border-radius:70px;background:#fff;overflow:hidden}
  .phone .notch{position:absolute;left:50%;top:22px;transform:translateX(-50%);width:170px;height:40px;border-radius:20px;background:var(--ink)}
  .ph{position:absolute;left:50px;right:50px;height:26px;border-radius:13px;background:#efe9f7}
  .abtn{position:absolute;left:50px;right:50px;top:620px;height:150px;border-radius:50px;background:var(--mint);color:var(--ink);display:flex;align-items:center;justify-content:center;
    font-size:54px;font-weight:900;opacity:0;animation:popIn .5s 1s var(--bounce) forwards,press .3s 2.0s ease-in-out,btnDone .3s 2.2s forwards}
  @keyframes press{50%{transform:scale(.9)}}
  @keyframes btnDone{to{background:var(--yellow)}}
  .abtn .t{animation:tOut .2s 2.2s forwards}
  @keyframes tOut{to{opacity:0}}
  .abtn svg{position:absolute;width:80px;height:80px;opacity:0;animation:fadeIn .2s 2.3s forwards}
  .abtn path{fill:none;stroke:var(--ink);stroke-width:10;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80;animation:draw .4s 2.35s var(--ease) forwards}
  .amount{position:absolute;left:50px;right:50px;top:440px;text-align:center;color:var(--ink);font-size:80px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums;opacity:0;animation:popIn .5s .8s var(--bounce) forwards}
  .thumb{position:absolute;left:50%;top:1330px;width:340px;height:420px;margin-left:-40px;z-index:4;opacity:0;
    animation:thumbIn .6s 1.4s var(--bounce) forwards,thumbPress .3s 2.0s ease-in-out,thumbOut .5s 2.5s var(--ease) forwards}
  @keyframes thumbIn{0%{opacity:0;transform:translate(300px,500px) rotate(-20deg)}100%{opacity:1;transform:translate(0,0) rotate(-8deg)}}
  @keyframes thumbPress{50%{transform:translate(0,22px) rotate(-8deg) scale(.95)}}
  @keyframes thumbOut{to{opacity:0;transform:translate(300px,500px) rotate(-20deg)}}
  .thumb svg{width:100%;height:100%;overflow:visible}.thumb path{fill:#ffcf9c;stroke:var(--ink);stroke-width:9;stroke-linejoin:round}
  .burst{position:absolute;left:50%;top:1455px;width:10px;height:10px;margin-left:-5px;z-index:3}
  .burst i{position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;opacity:0;animation:burst .8s 2.2s var(--ease) forwards}
  @keyframes burst{0%{opacity:1;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--bx),var(--by)) scale(1.2)}}

  /* ===== 5: sign ===== */
  .contract{position:absolute;left:50px;right:50px;top:150px;bottom:60px;border-radius:50px;background:#f7f2ff;padding:50px 40px}
  .contract .ttl{color:var(--ink);font-size:40px;font-weight:900;margin-bottom:30px}
  .contract .ln{height:22px;border-radius:11px;background:#e2d6f5;margin-bottom:20px}
  .sigbox{position:absolute;left:40px;right:40px;bottom:50px;height:240px;border-radius:40px;background:#fff;border:6px dashed #d9c9f3}
  .sigbox svg{position:absolute;left:30px;top:40px;width:360px;height:160px}
  .sigbox path{fill:none;stroke:var(--purple);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.1s 1.2s ease-in-out forwards}
  .pen{position:absolute;left:0;top:0;width:110px;height:110px;opacity:0;offset-path:path("M30 90 C70 20 110 150 160 80 S250 20 290 90 S350 110 370 60");offset-rotate:0deg;animation:penMove 1.1s 1.2s ease-in-out forwards}
  @keyframes penMove{0%{opacity:1;offset-distance:0%}92%{opacity:1}100%{opacity:0;offset-distance:100%}}
  .pen svg{width:100%;height:100%;transform:translate(10px,-80px) rotate(-30deg)}.pen path{fill:var(--coral);stroke:var(--ink);stroke-width:6;stroke-linejoin:round}
  .stamp{position:absolute;right:60px;top:60px;width:170px;height:170px;border-radius:50%;background:var(--mint);display:flex;align-items:center;justify-content:center;
    box-shadow:0 20px 40px rgba(0,0,0,.2);opacity:0;animation:popIn .5s 2.4s var(--bounce) forwards}
  .stamp svg{width:90px;height:90px}.stamp path{fill:none;stroke:var(--ink);stroke-width:12;stroke-linecap:round;stroke-linejoin:round}

  /* ===== 6: money ===== */
  .money{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .money i{position:absolute;top:-200px;opacity:0;animation:rain 1.8s var(--ease) forwards}
  .money i.bill{width:150px;height:80px;border-radius:16px;background:#2ecc71;border:8px solid #fff}
  .money i.bill::after{content:"";position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:#fff}
  .money i.coin{width:90px;height:90px;border-radius:50%;background:var(--yellow);border:8px solid #fff;display:flex;align-items:center;justify-content:center;color:var(--ink);font-weight:900;font-size:36px}
  @keyframes rain{0%{opacity:0;transform:translateY(0) rotate(0)}10%{opacity:1}100%{opacity:1;transform:translateY(var(--fall)) rotate(var(--rot))}}
  .pill{position:absolute;left:50%;width:820px;margin-left:-410px;height:170px;border-radius:999px;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:26px;
    font-size:56px;font-weight:900;letter-spacing:-.02em;box-shadow:0 30px 50px rgba(0,0,0,.2);opacity:0;animation:popIn .6s var(--bounce) forwards}
  .pill .ok{width:76px;height:76px;border-radius:50%;background:var(--mint);display:flex;align-items:center;justify-content:center;flex:none}
  .pill .ok svg{width:40px;height:40px}.pill .ok path{fill:none;stroke:var(--ink);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
  .pill.you{background:var(--yellow)}

  /* ===== end ===== */
  .end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .logo{position:relative;font-size:240px;font-weight:900;letter-spacing:-.06em;line-height:1;text-shadow:0 14px 40px rgba(0,0,0,.25);opacity:0;animation:popIn .8s .2s var(--bounce) forwards,wobble 3s 1.2s ease-in-out infinite}
  .logo .sp{right:-50px;top:-16px;width:130px;height:86px}
  .endwords{margin-top:60px;display:flex;gap:34px;font-size:68px;font-weight:900}
  .endwords span{opacity:0;transform:scale(.3);animation:popIn .5s var(--bounce) forwards;padding:14px 34px;border-radius:999px;color:var(--ink)}
  .endwords span:nth-child(1){background:var(--yellow)}.endwords span:nth-child(2){background:var(--mint)}.endwords span:nth-child(3){background:#fff}
  .confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .confetti i{position:absolute;top:-40px;width:22px;height:34px;border-radius:5px;opacity:0;animation:conf linear forwards}
  @keyframes conf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:1;transform:translate(var(--cx),2100px) rotate(var(--cr))}}
</style>
</head>
<body>
<div id="stage">
  <div class="bg hook" data-bg="s0"></div><div class="bg s1" data-bg="s1"></div><div class="bg s2" data-bg="s2"></div><div class="bg s3" data-bg="s3"></div>
  <div class="bg s4" data-bg="s4"></div><div class="bg s5" data-bg="s5"></div><div class="bg s6" data-bg="s6"></div><div class="bg end" data-bg="s7"></div>
  <div class="bubbles" id="bubbles"></div>
  <div class="brand">peasy</div>

  <!-- hook -->
  <section class="scene" id="s0">
    <div class="h tilt" data-words="Selg bilen|fra sofaen" data-hl="4"></div>
    <div class="big sofa shadow"><svg viewBox="0 0 760 460">
      <rect x="110" y="40" width="540" height="240" rx="70" fill="#7b2cbf"/>
      <rect x="40" y="200" width="680" height="190" rx="60" fill="#9d4edd"/>
      <rect x="150" y="215" width="210" height="150" rx="40" fill="#ffd93d"/>
      <rect x="400" y="215" width="210" height="150" rx="40" fill="#ffd93d"/>
      <rect x="0" y="180" width="130" height="220" rx="55" fill="#7b2cbf"/>
      <rect x="630" y="180" width="130" height="220" rx="55" fill="#7b2cbf"/>
      <rect x="90" y="390" width="60" height="60" rx="20" fill="#2a1a3d"/><rect x="610" y="390" width="60" height="60" rx="20" fill="#2a1a3d"/>
      <circle cx="300" cy="140" r="22" fill="#ff5e7e"/><circle cx="470" cy="140" r="22" fill="#ff5e7e"/>
      <path d="M330 190 Q385 230 440 190" fill="none" stroke="#ff5e7e" stroke-width="16" stroke-linecap="round"/>
    </svg></div>
    <div class="spark" style="left:200px;top:800px;animation-delay:.9s"></div>
    <div class="spark" style="left:820px;top:760px;animation-delay:1.1s"></div>
    <div class="spark" style="left:880px;top:1280px;animation-delay:.7s"></div>
  </section>

  <!-- 1 -->
  <section class="scene" id="s1">
    <div class="h" data-words="Skriv inn|regnr." data-hl="3"></div>
    <div class="big plate"><div class="flag">N</div><div class="txt" id="plate"></div></div>
    <div class="cursor"><svg viewBox="0 0 120 120"><path d="M40 112 L40 50 Q40 36 54 36 Q68 36 68 50 L68 18 Q68 4 82 4 Q96 4 96 18 L96 70 Q96 112 64 112 Z"/></svg></div>
  </section>

  <!-- 2 -->
  <section class="scene" id="s2">
    <div class="h" data-words="Vi sammenligner|med like biler." data-hl="2"></div>
    <div class="cars">
      <div class="car c1 shadow"><svg viewBox="0 0 420 230"><path d="M20 150 L40 90 Q50 70 80 70 L130 30 Q145 18 180 18 L260 18 Q300 20 350 76 L390 86 Q412 92 412 118 L412 150 Q412 170 392 170 L40 170 Q20 170 20 150 Z" fill="#ff5e7e"/><path d="M140 70 L160 38 L250 38 L300 70 Z" fill="#fff" opacity=".9"/><circle cx="110" cy="172" r="40" fill="#2a1a3d"/><circle cx="110" cy="172" r="16" fill="#fff"/><circle cx="320" cy="172" r="40" fill="#2a1a3d"/><circle cx="320" cy="172" r="16" fill="#fff"/></svg></div>
      <div class="car c2 shadow"><svg viewBox="0 0 420 230"><path d="M20 150 L40 90 Q50 70 80 70 L130 30 Q145 18 180 18 L260 18 Q300 20 350 76 L390 86 Q412 92 412 118 L412 150 Q412 170 392 170 L40 170 Q20 170 20 150 Z" fill="#ffd93d"/><path d="M140 70 L160 38 L250 38 L300 70 Z" fill="#fff" opacity=".9"/><circle cx="110" cy="172" r="40" fill="#2a1a3d"/><circle cx="110" cy="172" r="16" fill="#fff"/><circle cx="320" cy="172" r="40" fill="#2a1a3d"/><circle cx="320" cy="172" r="16" fill="#fff"/></svg></div>
      <div class="car c3 shadow"><svg viewBox="0 0 420 230"><path d="M20 150 L40 90 Q50 70 80 70 L130 30 Q145 18 180 18 L260 18 Q300 20 350 76 L390 86 Q412 92 412 118 L412 150 Q412 170 392 170 L40 170 Q20 170 20 150 Z" fill="#7b2cbf"/><path d="M140 70 L160 38 L250 38 L300 70 Z" fill="#fff" opacity=".9"/><circle cx="110" cy="172" r="40" fill="#2a1a3d"/><circle cx="110" cy="172" r="16" fill="#fff"/><circle cx="320" cy="172" r="40" fill="#2a1a3d"/><circle cx="320" cy="172" r="16" fill="#fff"/></svg></div>

          <div class="pen"><svg viewBox="0 0 110 110"><path d="M18 94 L24 68 L74 18 Q82 10 90 18 L94 22 Q102 30 94 38 L44 88 Z M18 94 L44 88"/></svg></div></div>

    <div class="pill you" style="top:1230px;animation-delay:1.5s"><span class="ok"><svg viewBox="0 0 40 40"><path d="M9 21 L17 29 L31 12"/></svg></span>Til deg: 291 000 kr</div>

  <div class="overlay show" id="overlay">
    <div class="ov-logo">peasy<span class="sp"><svg viewBox="0 0 70 46"><path fill="#ffd93d" d="M2 46 Q14 6 70 0 L70 14 Q28 14 8 46 Z"/></svg></span></div>
    <button class="play" id="play" aria-label="Spill av"><svg viewBox="0 0 110 110"><path d="M30 18 L92 55 L30 92 Z"/></svg></button>
    <div class="play-label" id="playLabel">Spill av</div>

</div>

<script>
(function(){
  const DUR=[1600,2600,2800,3200,3000,2800,3000,4000]; // 23.0 s: hook, 1-6, end
  const SCENES=[]; let acc=0; DUR.forEach((d,i)=>{SCENES.push({id:'s'+i,start:acc,end:acc+d});acc+=d;});
  const TOTAL=acc;
  const $=s=>document.querySelector(s);
  const stage=$('#stage');
  const COLORS=['#ff5e7e','#ffd93d','#06d6a0','#3fc1ff','#7b2cbf','#ff9f43','#fff'];
  const rnd=(a,b)=>a+Math.random()*(b-a);

  function fit(){ const a=innerWidth/1080,b=innerHeight/1920; const s=(innerWidth<innerHeight)?Math.max(a,b):Math.min(a,b); stage.style.transform='scale('+s+')'; }
  addEventListener('resize',fit); fit();

  // floating bubbles
  (function(){ const box=$('#bubbles'); for(let i=0;i<18;i++){ const d=document.createElement('i'); const sz=rnd(40,220);
    d.style.cssText='left:'+rnd(-5,100)+'%;top:'+rnd(1900,2400)+'px;width:'+sz+'px;height:'+sz+'px;animation-duration:'+rnd(9,18)+'s;animation-delay:'+(-rnd(0,18))+'s'; box.appendChild(d);} })();

  function headline(el){
    const lines=el.dataset.words.split('|'); const hl=(el.dataset.hl||'').split(',').filter(Boolean).map(Number);
    el.innerHTML=''; let n=0;
    lines.forEach((line,li)=>{ line.split(' ').forEach(w=>{ n++; const o=document.createElement('span'); o.className='w'+(hl.includes(n)?' hl':''); o.textContent=w;
      o.style.animationDelay=(0.1+n*0.1)+'s'; el.appendChild(o); el.appendChild(document.createTextNode(' ')); }); if(li<lines.length-1) el.appendChild(document.createElement('br')); });
  }
  function fitHeadline(el){ el.style.fontSize=''; const max=el.clientWidth; const lines=el.dataset.words.split('|');
    const m=document.createElement('span'); m.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;font:inherit;letter-spacing:inherit'; el.appendChild(m);
    let fs=parseFloat(getComputedStyle(el).fontSize);
    for(let k=0;k<20;k++){ let widest=0; lines.forEach(l=>{m.textContent=l; widest=Math.max(widest,m.offsetWidth);}); if(widest<=max||fs<=70) break; fs=Math.floor(fs*Math.min(.96,max/widest)); el.style.fontSize=fs+'px'; }
    m.remove(); }

  const build={
    s1(){ const el=$('#plate'); el.innerHTML=''; 'AB 12345'.split('').forEach((c,i)=>{const s=document.createElement('span');s.textContent=c===' '?' ':c;s.style.animationDelay=(1.1+i*.1)+'s';el.appendChild(s);}); },
    s4(){ const b=$('#burst'); b.innerHTML=''; for(let i=0;i<14;i++){ const d=document.createElement('i'); const a=i/14*Math.PI*2, r=rnd(160,300);
      d.style.setProperty('--bx',Math.cos(a)*r+'px'); d.style.setProperty('--by',Math.sin(a)*r+'px'); d.style.background=COLORS[i%COLORS.length]; b.appendChild(d);} },
    s6(){ const m=$('#money'); m.innerHTML=''; for(let i=0;i<22;i++){ const d=document.createElement('i'); const coin=i%3===0; d.className=coin?'coin':'bill'; if(coin) d.textContent='kr';
      d.style.left=rnd(0,95)+'%'; d.style.setProperty('--fall',rnd(900,2100)+'px'); d.style.setProperty('--rot',rnd(-240,240)+'deg'); d.style.animationDelay=rnd(0.1,1.4)+'s'; m.appendChild(d);} },
    s7(){ const c=$('#confetti'); c.innerHTML=''; for(let i=0;i<160;i++){ const d=document.createElement('i');
      d.style.left=rnd(0,100)+'%'; d.style.background=COLORS[i%COLORS.length]; d.style.setProperty('--cx',rnd(-300,300)+'px'); d.style.setProperty('--cr',rnd(-900,900)+'deg');
      d.style.animationDuration=rnd(2.2,4)+'s'; d.style.animationDelay=rnd(0,1.6)+'s'; if(i%4===0) d.style.borderRadius='50%'; c.appendChild(d);} },
  };

  let t0=0,cur=null,outTimer=null,playing=false;
  const overlay=$('#overlay'),playBtn=$('#play'),playLabel=$('#playLabel');
  function enterFullscreen(){ const el=document.documentElement; try{ const r=el.requestFullscreen?el.requestFullscreen():el.webkitRequestFullscreen?el.webkitRequestFullscreen():null; if(r&&r.catch) r.catch(()=>{}); }catch(e){} }
  function exitFullscreen(){ try{ if(document.fullscreenElement&&document.exitFullscreen) document.exitFullscreen().catch(()=>{}); else if(document.webkitFullscreenElement&&document.webkitExitFullscreen) document.webkitExitFullscreen(); }catch(e){} }

  function activate(sc){
    if(cur){ const old=$('#'+cur); old.classList.add('out'); clearTimeout(outTimer); outTimer=setTimeout(()=>old.classList.remove('on','out'),400); }
    document.querySelectorAll('.bg').forEach(b=>b.classList.toggle('on',b.dataset.bg===sc.id));
    const el=$('#'+sc.id); const h=el.querySelector('.h'); if(h) headline(h); if(build[sc.id]) build[sc.id]();
    el.classList.remove('on','out'); void el.offsetWidth; el.classList.add('on'); cur=sc.id; if(h) fitHeadline(h);
  }
  function start(){ enterFullscreen(); overlay.classList.remove('show'); document.querySelectorAll('.scene').forEach(s=>s.classList.remove('on','out'));
    cur=null; $('#bar').style.width='0%'; t0=performance.now(); playing=true; requestAnimationFrame(tick); }
  function finish(){ playing=false; playLabel.textContent='Spill av på nytt'; playBtn.setAttribute('aria-label','Spill av på nytt'); overlay.classList.add('show'); }
  playBtn.addEventListener('click',start);
  addEventListener('keydown',e=>{ if(e.key==='Escape') exitFullscreen(); });

  function tick(now){
    if(!playing) return;
    let t=now-t0; if(t>=TOTAL){ $('#bar').style.width='100%'; finish(); return; }
    $('#bar').style.width=(t/TOTAL*100)+'%';
    for(let i=0;i<SCENES.length;i++){ const sc=SCENES[i]; if(t>=sc.start&&t<sc.end){ if(cur!==sc.id) activate(sc); break; } }
    requestAnimationFrame(tick);
  }
})();
</script>
