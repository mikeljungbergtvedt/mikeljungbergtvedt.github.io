name: Update Peasy Exec Report

on:
  schedule:
    - cron: '0 8 * * *'  # Every day at 8:00 UTC (~9:00 CET)
  workflow_dispatch:    # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl requests jinja2 pyyaml

    - name: Run report generator
      run: python main.py

    - name: Commit updated report
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add Peasy_Exec_Report.html
        git commit -m "Auto-update Peasy Exec Report" || echo "No changes to commit"
        git push
