name: Update Peasy Report

on:
  schedule:
    # 06:00 UTC = 07:00 CET
    - cron: '0 6 * * *'
    # 12:00 UTC = 13:00 CET
    - cron: '0 12 * * *'
  workflow_dispatch:  # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl matplotlib jinja2 requests

      - name: Generate report
        run: |
          echo "Starting report generation at $(date '+%Y-%m-%d %H:%M:%S CET')"
          python report_generator.py || { echo "Report generation failed!"; exit 1; }
          echo "Report generation finished."

      - name: Commit and push updated peasyreport.html (only if changed)
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'actions@github.com'
          
          git add peasyreport.html
          
          git diff --staged --quiet && echo "No changes to commit - skipping" && exit 0
          
          git commit -m "Auto-update Peasy report - $(date '+%Y-%m-%d %H:%M CET')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
