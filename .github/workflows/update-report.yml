name: Update Peasy Report

on:
  schedule:
    - cron: '0 6 * * *'           # daily at ~07:00 CET
  workflow_dispatch:              # allows manual run from Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl matplotlib jinja2

      - name: Generate report
        run: python generate_report.py          # ← change this if your script has a different name!

      - name: Commit updated report
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add test.html                     # ← change to index.html if that's your file
          git commit -m "Auto-update report - $(date +'%Y-%m-%d')" || echo "No changes"
          git push
