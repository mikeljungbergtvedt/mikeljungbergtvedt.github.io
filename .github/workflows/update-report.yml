name: Update Peasy Report

on:
schedule:
- cron: '0 8 * * *'           # 08:00 UTC = 09:00 CET (Norwegian time)
workflow_dispatch:              # Allows manual trigger from Actions tab

jobs:
build:
runs-on: ubuntu-latest

steps:
- name: Checkout repository
uses: actions/checkout@v4

- name: Set up Python 3.11
uses: actions/setup-python@v5
with:
python-version: '3.11'

- name: Install dependencies
run: |
         python -m pip install --upgrade pip
          pip install pandas openpyxl matplotlib jinja2
          pip install pandas openpyxl matplotlib jinja2 requests

     - name: Generate report
run: |
         echo "Starting report generation..."
         python report_generator.py
         echo "Report generation finished."

     - name: Commit and push updated test.html
run: |
         git config --global user.name 'GitHub Action Bot'
         git config --global user.email 'actions@github.com'
         git add test.html
         git commit -m "Auto-update test.html - $(date +'%Y-%m-%d %H:%M CET')" || echo "No changes to commit"
         git push || echo "Push completed or no changes"
