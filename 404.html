<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Siden finnes ikke – Peasy</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/Peasy_Logo_ORG.png">
<meta name="theme-color" content="#004225">
<style>
  :root {
    --green: #004225;
    --green-light: #2E7D32;
    --bg: #F8FAF9;
    --text: #1a2a22;
    --muted: #667;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(180deg, #FFF 0%, var(--bg) 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .logo {
    width: 120px;
    margin-bottom: 32px;
  }
  .code {
    font-size: 88px;
    font-weight: 900;
    color: var(--green);
    letter-spacing: -2px;
    line-height: 1;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 28px;
    font-weight: 800;
    color: var(--green);
    margin-bottom: 12px;
  }
  p {
    font-size: 16px;
    color: var(--muted);
    max-width: 480px;
    margin-bottom: 28px;
    line-height: 1.5;
  }
  .btn {
    display: inline-block;
    background: var(--green);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    padding: 14px 28px;
    border-radius: 999px;
    font-size: 15px;
    transition: background .15s;
  }
  .btn:hover {
    background: var(--green-light);
  }
  .footer {
    position: absolute;
    bottom: 24px;
    font-size: 12px;
    color: var(--muted);
  }
  @media (max-width: 480px) {
    .code { font-size: 64px; }
    h1 { font-size: 22px; }
    p { font-size: 14px; }
  }
</style>
</head>
<body>
  <img src="/Peasy_Logo_ORG.png" alt="Peasy" class="logo">
  <div class="code">404</div>
  <h1>Siden finnes ikke</h1>
  <p>Lenken er kanskje feil, eller siden er flyttet. Gå tilbake til forsiden så hjelper vi deg videre.</p>
  <a href="/peasydemo.html" class="btn">Tilbake til Peasy →</a>
  <div class="footer">© 2026 Peasy / Autoringen AS</div>
</body>
</html>
