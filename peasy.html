<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peasy Priset → Mottatt & Solgt</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/date-fns@3.6.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px 10px; background: #e0e9e5; color: #004225; }
    .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
    h1 { text-align: center; color: #004225; font-size: 2rem; margin-bottom: 10px; }
    .subtitle { text-align: center; font-size: 1.3rem; margin-bottom: 20px; color: #004225; }
    .lang-toggle { text-align: center; margin-bottom: 15px; font-size: 1.1rem; }
    .lang-toggle a { margin: 0 8px; text-decoration: none; color: #004225; }
    .lang-toggle a.active { color: #ffcc33; border-bottom: 2px solid #ffcc33; }
    .controls { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 15px; margin: 15px 0; }
    .last-update { text-align: center; font-size: 1.1rem; color: #004225; margin: 15px 0; font-weight: bold; }
    canvas { margin: 40px auto; background: white; border-radius: 8px; width: 100% !important; height: 500px !important; max-width: 900px; }
    #notification { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: #27ae60; color: white; padding: 10px 20px; border-radius: 6px; z-index: 1000; opacity: 0; transition: opacity 0.3s; font-weight: bold; font-size: 0.9rem; }
    .stats-table { margin: 30px auto; max-width: 100%; border-collapse: collapse; font-size: 0.95rem; overflow-x: auto; display: block; }
    .stats-table th, .stats-table td { padding: 10px; text-align: center; border: 1px solid #ddd; font-weight: bold; }
    .stats-table th { background: #f5f9f6; }
    .stats-table td { background: white; }
    .total-row td { background: #e8f5e9; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Peasy Priset → Mottatt & Solgt</h1>
    <div class="last-update" id="lastUpdate">Sist oppdatert: —</div>
    <canvas id="dailyChart"></canvas>
    <table class="stats-table">
      <thead>
        <tr>
          <th>Periode</th>
          <th>Priset</th>
          <th>Mottatt</th>
          <th>Priset → Mottatt</th>
          <th>Solgt</th>
          <th>Priset → Solgt</th>
          <th>Markedsføring per solgt</th>
          <th>Gjennomsnittspris per solgt</th>
          <th>Peasy fee per solgt</th>
        </tr>
      </thead>
      <tbody id="statsBody"></tbody>
    </table>
    <h2>Total konvertering</h2>
    <canvas id="funnelChart"></canvas>
  </div>

  <script>
    const GOOGLE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSWB8ejCX0vpPlUSmgnFlzhMskHA7UGmxIxj0uA_JiukkH1U1B6diVa3N1o5MFL1kiLhPzHSwSsy8DD/pub?output=csv";

    let allPriced = {};
    let allReceived = {};
    let allSold = {};
    let allMarketing = {};
    let allSoldPrice = {};
    let allPeasyFee = {};

    async function loadData() {
      try {
        const response = await fetch(GOOGLE_CSV_URL + '?' + Date.now());
        const csvText = await response.text();
        const parsed = Papa.parse(csvText, {
          header: true,
          skipEmptyLines: true,
          dynamicTyping: true,
          transformHeader: h => h.trim().toLowerCase()
        });
        const rows = parsed.data.filter(r => r.date && r.date.match(/^\d{4}-\d{2}-\d{2}$/));

        console.log('Loaded rows:', rows.length, rows.slice(0,3));  // debug

        rows.forEach(r => {
          const d = r.date;
          allPriced[d] = Number(r.priced) || 0;
          allReceived[d] = Number(r.received) || 0;
          allSold[d] = Number(r.sold) || 0;
          allMarketing[d] = Number(r.marketing_nok) || 1000;
          allSoldPrice[d] = Number(r.sold_price) || 0;
          allPeasyFee[d] = Number(r.peasy_fee) || 0;
        });

        renderDailyChart();
        renderFunnelChart();
        updateStatsTable();

        document.getElementById('lastUpdate').textContent = "Sist oppdatert: " + new Date().toLocaleString('nb-NO');
      } catch (err) {
        console.error('Load error:', err);
        document.getElementById('lastUpdate').textContent = "Feil ved lasting av data";
      }
    }

    function renderDailyChart() {
      const dates = Object.keys(allPriced).sort();
      const priced = dates.map(d => allPriced[d]);
      const sold = dates.map(d => allSold[d]);

      const ctx = document.getElementById('dailyChart').getContext('2d');
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: dates,
          datasets: [
            { label: 'Priset', data: priced, backgroundColor: '#004225' },
            { label: 'Solgt', data: sold, backgroundColor: '#ff4444' }
          ]
        },
        options: { scales: { y: { beginAtZero: true } } }
      });
    }

    function renderFunnelChart() {
      let totalP = 0, totalR = 0, totalS = 0;
      Object.keys(allPriced).forEach(d => {
        totalP += allPriced[d];
        totalR += allReceived[d];
        totalS += allSold[d];
      });

      const ctx = document.getElementById('funnelChart').getContext('2d');
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Priset', 'Mottatt', 'Solgt'],
          datasets: [{ data: [totalP, totalR, totalS], backgroundColor: ['#004225', '#8fcbbc', '#ffcc33'] }]
        },
        options: { scales: { y: { beginAtZero: true } } }
      });
    }

    function updateStatsTable() {
      const body = document.getElementById('statsBody');
      body.innerHTML = '';

      let totalP = 0, totalR = 0, totalS = 0, totalMkt = 0, totalValue = 0, totalFee = 0;
      Object.keys(allPriced).forEach(d => {
        totalP += allPriced[d];
        totalR += allReceived[d];
        totalS += allSold[d];
        totalMkt += allMarketing[d];
        totalValue += allSoldPrice[d];
        totalFee += allPeasyFee[d];
      });

      const row = document.createElement('tr');
      row.className = 'total-row';
      row.innerHTML = `
        <td>Totalt</td>
        <td>${totalP}</td>
        <td>${totalR}</td>
        <td>${totalP ? ((totalR / totalP)*100).toFixed(0) + '%' : '—'}</td>
        <td>${totalS}</td>
        <td>${totalP ? ((totalS / totalP)*100).toFixed(1) + '%' : '—'}</td>
        <td>${totalS ? (totalMkt / totalS).toFixed(0) + ' NOK' : '—'}</td>
        <td>${totalS ? (totalValue / totalS).toLocaleString('nb-NO') + ' NOK' : '—'}</td>
        <td>${totalS ? (totalFee / totalS).toLocaleString('nb-NO') + ' NOK' : '—'}</td>
      `;
      body.appendChild(row);
    }

    loadData();
    setInterval(loadData, 5 * 60 * 1000);
  </script>
</body>
</html>
