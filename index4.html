<!DOCTYPE html>
<html>
<head>
    <title>Drive.no Bilsalgsfunnel</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        canvas { max-width: 800px; margin: 20px auto; }
        .notes { max-width: 800px; margin: 0 auto; text-align: left; font-size: 14px; }
    </style>
</head>
<body>
    <h2>Drive.no Leadsflyt</h2>
    <canvas id="funnelChart" width="800" height="600"></canvas>
    <div class="notes">
        <p><strong>Merknader:</strong></p>
        <ul>
            <li>146 leads mottatt (100%)</li>
            <li>61 biler mottatt SD skjema (41.8%)</li>
            <li>29 biler timet ut (40 dager etter mottak fra Drive)</li>
        </ul>
    </div>
    <script>
        // Register the datalabels plugin
        Chart.register(ChartDataLabels);

        const ctx = document.getElementById('funnelChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Drive Leads (D1)', 'Innenfor Gire (N3)', 'SD Innsendt (N10)', 'Avvist eller Tidsavbrutt (N18)', 'Nådd Lager (N35)', 'Solgt (N56)', 'Returnert (N45)'],
                datasets: [{
                    label: 'Prosentandel',
                    data: [100, 41.8, 37.0, 24.0, 4.1, 2.7, 1.4],
                    backgroundColor: ['#FFEFDB', '#E2EBFF', '#E2EBFF', '#E2EBFF', '#E2EBFF', '#E0FFE0', '#FFE0E0'],
                    borderColor: ['#FBB35A', '#374D7C', '#374D7C', '#374D7C', '#374D7C', '#00FF00', '#FF0000'],
                    borderWidth: 1
                }]
            },
            options: {
                indexAxis: 'y',
                scales: {
                    x: {
                        beginAtZero: true,
                        title: { display: true, text: 'Prosentandel (%)' },
                        max: 100
                    },
                    y: {
                        title: { display: true, text: 'Prosessstadie' }
                    }
                },
                plugins: {
                    legend: { display: false },
                    title: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const label = context.dataset.label;
                                const value = context.raw.toFixed(1);
                                if (context.dataIndex === 2) {
                                    const percentOfGire = ((37.0 / 41.8) * 100).toFixed(1);
                                    return `${label}: ${value}% (ca. ${percentOfGire}% av Innenfor Gire)`;
                                }
                                return `${label}: ${value}%`;
                            }
                        }
                    },
                    datalabels: {
                        anchor: 'center',
                        align: 'center',
                        color: '#000000', // Black for print readability
                        font: {
                            size: 12,
                            weight: 'bold'
                        },
                        formatter: function(value, context) {
                            const formattedValue = value.toFixed(1) + '%';
                            if (context.dataIndex === 2) {
                                const percentOfGire = ((37.0 / 41.8) * 100).toFixed(1);
                                return `${formattedValue}\n(${percentOfGire}% av N3)`;
                            }
                            return formattedValue;
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
