<!DOCTYPE html>
<html>
<head>
    <title>Driv.no Car Sales Funnel</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <canvas id="funnelChart" width="800" height="600"></canvas>
    <script>
        const ctx = document.getElementById('funnelChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Entered (D1)', 'Within Gire (N3)', 'SD Submitted (N10)', 'Valuation Responded (N18)', 'Reached Compound (N35)', 'Sold (N56)'],
                datasets: [{
                    label: 'Number of Cars',
                    data: [146, 61, 54, 25, 6, 4],
                    backgroundColor: ['#FFEFDB', '#E2EBFF', '#E2EBFF', '#E2EBFF', '#E2EBFF', '#E0FFE0'],
                    borderColor: ['#FBB35A', '#374D7C', '#374D7C', '#374D7C', '#374D7C', '#00FF00'],
                    borderWidth: 1
                }]
            },
            options: {
                indexAxis: 'y',
                scales: {
                    x: { beginAtZero: true, title: { display: true, text: 'Number of Cars' } },
                    y: { title: { display: true, text: 'Process Stage' } }
                },
                plugins: {
                    legend: { display: false },
                    title: { display: true, text: 'Driv.no Car Sales Funnel (Since May 1, 2025)' }
                }
            }
        });
    </script>
</body>
</html>
