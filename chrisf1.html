<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ChrisF1 Tracker 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#e10600;--gold:#c6a84b;--bg:#0a0a0a;--bg2:#111;--border:#222;--muted:#666;--muted2:#444;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:#fff;overflow-x:hidden;}
header{background:linear-gradient(135deg,#0a0a0a,#1a0000,#0a0a0a);border-bottom:1px solid #2a0000;position:sticky;top:0;z-index:100;box-shadow:0 4px 40px rgba(225,6,0,.2);}
.htop{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid #1a1a1a;}
.logo{display:flex;align-items:center;gap:12px;}
.logo-text{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;background:linear-gradient(135deg,#fff 30%,var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.logo-sub{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:2px;}
.f1b{background:var(--red);font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;padding:4px 10px;border-radius:4px;box-shadow:0 0 20px rgba(225,6,0,.5);}
.cwrap{display:flex;align-items:center;gap:14px;}
.ctxt{text-align:right;}
.cdig{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--gold);letter-spacing:1px;}
.cdate{font-size:10px;color:var(--muted);margin-top:2px;}
.rolex{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#2a2a2a,#0d0d0d);border:3px solid var(--gold);box-shadow:0 0 0 1px #111,0 0 18px rgba(198,168,75,.3);position:relative;flex-shrink:0;}
.rc{position:absolute;right:-7px;top:50%;transform:translateY(-50%);width:7px;height:13px;background:linear-gradient(90deg,#b8962e,#e4c45a,#b8962e);border-radius:0 3px 3px 0;}
.tk{position:absolute;left:50%;transform-origin:bottom center;background:var(--gold);}
.tk.mj{width:2px;height:6px;top:3px;opacity:.9;}
.tk.mn{width:1px;height:3px;top:4px;opacity:.4;}
.rl{position:absolute;left:50%;top:63%;transform:translate(-50%,-50%);font-size:5px;color:var(--gold);opacity:.6;font-family:serif;white-space:nowrap;}
.hand{position:absolute;bottom:50%;left:50%;transform-origin:bottom center;border-radius:2px 2px 0 0;}
.hh{width:2.5px;height:16px;background:#fff;margin-left:-1.25px;}
.mh{width:2px;height:22px;background:#ccc;margin-left:-1px;}
.sh{width:1px;height:25px;background:var(--red);margin-left:-.5px;}
.sh::after{content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--red);}
.dot{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--gold);top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;}
.ticker{background:#0d0d0d;border-top:1px solid #1a1a1a;padding:7px 24px;display:flex;align-items:center;gap:12px;overflow:hidden;}
.tlbl{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:2px;color:var(--red);flex-shrink:0;border:1px solid var(--red);padding:1px 6px;border-radius:3px;}
.ttrk{flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);}
.tinn{display:inline-flex;gap:60px;white-space:nowrap;animation:tck 45s linear infinite;}
.ti{font-size:12px;color:#aaa;}.ti b{color:#fff;}
@keyframes tck{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
main{max-width:900px;margin:0 auto;padding:24px 16px 80px;}
.nc{background:linear-gradient(135deg,#141414,#1a0500);border:1px solid #2a1a1a;border-left:4px solid var(--red);border-radius:16px;padding:22px 24px;margin-bottom:20px;position:relative;overflow:hidden;}
.nc::before{content:'';position:absolute;top:-40px;right:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(225,6,0,.07),transparent 70%);pointer-events:none;}
.nlbl{font-size:10px;font-weight:700;color:var(--red);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}
.nname{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:2px;line-height:1;margin-bottom:4px;}
.nmeta{font-size:12px;color:var(--muted);margin-bottom:18px;}
.cd{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.cdb{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:12px 16px;text-align:center;min-width:72px;}
.cdn{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--red);line-height:1;}
.cdl{font-size:9px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;}
.wr{display:flex;gap:8px;flex-wrap:wrap;}
.wp{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;color:#aaa;}
.tabs{display:flex;gap:6px;margin-bottom:16px;}
.tab{padding:9px 20px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--muted);font-size:13px;cursor:pointer;font-weight:500;transition:all .2s;}
.tab:hover{border-color:var(--red);color:#fff;}
.tab.on{background:var(--red);color:#fff;border-color:var(--red);}
.sec{display:none;flex-direction:column;gap:8px;}.sec.on{display:flex;}
.rr{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px;}
.rr.p{opacity:.5;}.rr.nx{border-color:var(--red);background:#1a0500;}
.rn{font-size:11px;color:var(--muted2);min-width:22px;}.rf{font-size:20px;width:28px;flex-shrink:0;}
.ri{flex:1;}.rna{font-size:14px;font-weight:600;}.rd{font-size:11px;color:var(--muted);margin-top:2px;}
.rb{font-size:9px;padding:2px 7px;border-radius:5px;font-weight:700;margin-left:8px;}
.bnx{background:var(--red);color:#fff;}.bco{background:#1e1e1e;color:var(--muted);}
.rres{text-align:right;}.rw{font-size:13px;font-weight:600;}.rtm{font-size:11px;color:var(--muted);margin-top:2px;}
.dr{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px;}
.dp{font-size:14px;font-weight:700;min-width:24px;color:var(--muted2);}
.dp.g{color:#ffd700;}.dp.s{color:#c0c0c0;}.dp.b{color:#cd7f32;}
.db{width:4px;height:36px;border-radius:2px;flex-shrink:0;}
.di{flex:1;}.dn{font-size:14px;font-weight:600;}.dt{font-size:11px;color:var(--muted);margin-top:2px;}
.pb{height:3px;background:#1e1e1e;border-radius:2px;margin-top:6px;}
.pf{height:3px;border-radius:2px;}
.dpt{font-size:18px;font-weight:700;min-width:65px;text-align:right;}
.dpt span{font-size:11px;color:var(--muted2);font-weight:400;}
.note{font-size:10px;color:var(--muted2);text-align:center;padding:8px;}
</style>
</head>
<body>
<header>
  <div class="htop">
    <div class="logo">
      <div class="f1b">F1</div>
      <div><div class="logo-text">ChrisF1 Tracker</div><div class="logo-sub">2026 Formula 1 Season</div></div>
    </div>
    <div class="cwrap">
      <div class="ctxt"><div class="cdig" id="dT">--:--:--</div><div class="cdate" id="dD">Norsk tid</div></div>
      <div class="rolex"><div class="rc"></div><div id="cf"></div><div class="rl">ROLEX</div><div class="hand hh" id="HH"></div><div class="hand mh" id="MH"></div><div class="hand sh" id="SH"></div><div class="dot"></div></div>
    </div>
  </div>
  <div class="ticker"><div class="tlbl">&#9642; LIVE</div><div class="ttrk"><div class="tinn" id="TI"><span class="ti">Laster nyheter...</span></div></div></div>
</header>
<main>
  <div class="nc">
    <div class="nlbl">&#127937; Neste l&#248;p</div>
    <div class="nname" id="NN">Laster...</div>
    <div class="nmeta" id="NM"></div>
    <div class="cd" id="CD"></div>
    <div class="wr" id="WR"></div>
  </div>
  <div class="tabs">
    <button class="tab on" onclick="sT('races',this)">&#128197; Kalender</button>
    <button class="tab" onclick="sT('standings',this)">&#127942; Stilling</button>
  </div>
  <div id="races" class="sec on"></div>
  <div id="standings" class="sec"></div>
</main>
<script>
var R=[{r:1,n:"Australian GP",c:"Australia",f:"\uD83C\uDDE6\uD83C\uDDFA",d:"2026-03-09",t:"05:00"},{r:2,n:"Chinese GP",c:"China",f:"\uD83C\uDDE8\uD83C\uDDF3",d:"2026-03-15",t:"07:00"},{r:3,n:"Japanese GP",c:"Japan",f:"\uD83C\uDDEF\uD83C\uDDF5",d:"2026-03-29",t:"07:00"},{r:4,n:"Bahrain GP",c:"Bahrain",f:"\uD83C\uDDE7\uD83C\uDDED",d:"2026-04-19",t:"17:00"},{r:5,n:"Saudi Arabian GP",c:"Saudi Arabia",f:"\uD83C\uDDF8\uD83C\uDDE6",d:"2026-04-26",t:"19:00"},{r:6,n:"Miami GP",c:"USA",f:"\uD83C\uDDFA\uD83C\uDDF8",d:"2026-05-10",t:"21:00"},{r:7,n:"Emilia Romagna GP",c:"Italy",f:"\uD83C\uDDEE\uD83C\uDDF9",d:"2026-05-24",t:"15:00"},{r:8,n:"Monaco GP",c:"Monaco",f:"\uD83C\uDDF2\uD83C\uDDE8",d:"2026-05-31",t:"15:00"},{r:9,n:"Spanish GP",c:"Spain",f:"\uD83C\uDDEA\uD83C\uDDF8",d:"2026-06-07",t:"15:00"},{r:10,n:"Canadian GP",c:"Canada",f:"\uD83C\uDDE8\uD83C\uDDE6",d:"2026-06-21",t:"20:00"},{r:11,n:"Austrian GP",c:"Austria",f:"\uD83C\uDDE6\uD83C\uDDF9",d:"2026-07-05",t:"15:00"},{r:12,n:"British GP",c:"UK",f:"\uD83C\uDDEC\uD83C\uDDE7",d:"2026-07-12",t:"15:00"},{r:13,n:"Belgian GP",c:"Belgium",f:"\uD83C\uDDE7\uD83C\uDDEA",d:"2026-08-02",t:"15:00"},{r:14,n:"Hungarian GP",c:"Hungary",f:"\uD83C\uDDED\uD83C\uDDFA",d:"2026-08-09",t:"15:00"},{r:15,n:"Dutch GP",c:"Netherlands",f:"\uD83C\uDDF3\uD83C\uDDF1",d:"2026-08-30",t:"15:00"},{r:16,n:"Italian GP",c:"Italy",f:"\uD83C\uDDEE\uD83C\uDDF9",d:"2026-09-06",t:"15:00"},{r:17,n:"Azerbaijan GP",c:"Azerbaijan",f:"\uD83C\uDDE6\uD83C\uDDFF",d:"2026-09-20",t:"13:00"},{r:18,n:"Singapore GP",c:"Singapore",f:"\uD83C\uDDF8\uD83C\uDDEC",d:"2026-10-04",t:"08:00"},{r:19,n:"US GP",c:"USA",f:"\uD83C\uDDFA\uD83C\uDDF8",d:"2026-10-18",t:"21:00"},{r:20,n:"Mexico City GP",c:"Mexico",f:"\uD83C\uDDF2\uD83C\uDDFD",d:"2026-10-25",t:"21:00"},{r:21,n:"S\u00e3o Paulo GP",c:"Brazil",f:"\uD83C\uDDE7\uD83C\uDDF7",d:"2026-11-08",t:"18:00"},{r:22,n:"Las Vegas GP",c:"USA",f:"\uD83C\uDDFA\uD83C\uDDF8",d:"2026-11-21",t:"07:00"},{r:23,n:"Qatar GP",c:"Qatar",f:"\uD83C\uDDF6\uD83C\uDDE6",d:"2026-11-29",t:"17:00"},{r:24,n:"Abu Dhabi GP",c:"UAE",f:"\uD83C\uDDE6\uD83C\uDDEA",d:"2026-12-06",t:"14:00"}];
var WX={Australia:{e:"☀️",t:"22°C"},China:{e:"🌤️",t:"18°C"},Japan:{e:"🌸",t:"16°C"},Bahrain:{e:"🌵",t:"32°C"},"Saudi Arabia":{e:"🌡️",t:"35°C"},USA:{e:"⛅",t:"28°C"},Italy:{e:"☀️",t:"24°C"},Monaco:{e:"☀️",t:"23°C"},Spain:{e:"☀️",t:"26°C"},Canada:{e:"🌧️",t:"19°C"},Austria:{e:"⛅",t:"21°C"},UK:{e:"🌧️",t:"17°C"},Belgium:{e:"🌦️",t:"18°C"},Hungary:{e:"☀️",t:"30°C"},Netherlands:{e:"🌤️",t:"19°C"},Azerbaijan:{e:"☀️",t:"25°C"},Singapore:{e:"🌧️",t:"31°C"},Mexico:{e:"⛅",t:"22°C"},Brazil:{e:"🌦️",t:"27°C"},Qatar:{e:"🌡️",t:"33°C"},UAE:{e:"☀️",t:"29°C"}};
var TC={"Mercedes":"#27F4D2","McLaren":"#FF8000","Ferrari":"#E8002D","Red Bull Racing":"#3671C6","Williams":"#64C4FF","Alpine":"#FF69B4","Haas":"#B6BABD","RB":"#6692FF","Kick Sauber":"#52E252","Aston Martin":"#229971"};
var RES={1:{w:"Lando Norris",tm:"McLaren",fl:"1:20.876"},2:{w:"Kimi Antonelli",tm:"Mercedes",fl:"1:18.233"}};
var STD=[{pos:1,n:"George Russell",tm:"Mercedes",pts:36},{pos:2,n:"Kimi Antonelli",tm:"Mercedes",pts:25},{pos:3,n:"Lando Norris",tm:"McLaren",pts:25},{pos:4,n:"Lewis Hamilton",tm:"Ferrari",pts:24},{pos:5,n:"Charles Leclerc",tm:"Ferrari",pts:22},{pos:6,n:"Oscar Piastri",tm:"McLaren",pts:10},{pos:7,n:"Ollie Bearman",tm:"Haas",pts:10},{pos:8,n:"Carlos Sainz",tm:"Williams",pts:8},{pos:9,n:"Pierre Gasly",tm:"Alpine",pts:6},{pos:10,n:"Max Verstappen",tm:"Red Bull Racing",pts:4}];
// Build clock ticks
(function(){var f=document.getElementById('cf');for(var i=0;i<60;i++){var d=document.createElement('div');d.className='tk '+(i%5===0?'mj':'mn');d.style.transform='rotate('+(i*6)+'deg) translateX(-50%)';f.appendChild(d);}})();
// Clock tick
function clk(){var n=new Date(),h=n.getHours(),m=n.getMinutes(),s=n.getSeconds(),ms=n.getMilliseconds(),p=function(x){return String(x).padStart(2,'0');};document.getElementById('HH').style.transform='rotate('+(h%12*30+m*.5)+'deg) translateX(-50%)';document.getElementById('MH').style.transform='rotate('+(m*6+s*.1)+'deg) translateX(-50%)';document.getElementById('SH').style.transform='rotate('+(s*6+ms*.006)+'deg) translateX(-50%)';document.getElementById('dT').textContent=p(h)+':'+p(m)+':'+p(s);document.getElementById('dD').textContent=n.toLocaleDateString('nb-NO',{weekday:'short',day:'numeric',month:'short'});}
clk();setInterval(clk,50);
// Next race
var now=new Date(),NR=R.find(function(r){return new Date(r.d+'T'+r.t+':00')>now;});
if(NR){var wx=WX[NR.c]||{e:'',t:''};document.getElementById('NN').textContent=NR.f+' '+NR.n;document.getElementById('NM').textContent=new Date(NR.d).toLocaleDateString('nb-NO',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' · Start kl '+NR.t+' norsk tid · Runde '+NR.r+' av 24';document.getElementById('WR').innerHTML='<div class="wp">'+wx.e+' '+wx.t+'</div><div class="wp">&#127938; '+NR.c+'</div>';}
// Countdown
function uCD(){if(!NR)return;var diff=new Date(NR.d+'T'+NR.t+':00')-new Date();if(diff<=0){document.getElementById('CD').innerHTML='<span style="color:var(--red);font-family:Bebas Neue,sans-serif;font-size:20px;letter-spacing:2px">LOPET ER I GANG!</span>';return;}var p=function(x){return String(x).padStart(2,'0');},dy=Math.floor(diff/86400000),h=Math.floor(diff%86400000/3600000),m=Math.floor(diff%3600000/60000),s=Math.floor(diff%60000/1000);document.getElementById('CD').innerHTML=[['Dager',dy],['Timer',h],['Min',m],['Sek',s]].map(function(x){return '<div class="cdb"><div class="cdn">'+p(x[1])+'</div><div class="cdl">'+x[0]+'</div></div>';}).join('');}
uCD();setInterval(uCD,1000);
// Render races
function rRaces(){document.getElementById('races').innerHTML=R.map(function(r){var past=new Date(r.d+'T'+r.t+':00')<now,nx=NR&&r.r===NR.r,res=RES[r.r];var badge=nx?'<span class="rb bnx">NESTE</span>':!past?'<span class="rb bco">Kommende</span>':'';var right=res?'<div class="rres"><div class="rw">'+res.w+'</div><div class="rtm">'+res.tm+(res.fl?' · FL: '+res.fl:'')+'</div></div>':'<div class="rres"><div class="rtm">'+r.t+' norsk tid</div></div>';return '<div class="rr '+(past?'p ':'')+(nx?'nx':'')+'"><div class="rn">'+r.r+'</div><div class="rf">'+r.f+'</div><div class="ri"><div class="rna">'+r.n+badge+'</div><div class="rd">'+new Date(r.d).toLocaleDateString('nb-NO',{day:'numeric',month:'short',year:'numeric'})+'</div></div>'+right+'</div>';}).join('');}
// Render standings
function rStd(s){var max=s[0].pts;document.getElementById('standings').innerHTML=s.map(function(d){var c=TC[d.tm]||'#888',pc=d.pos===1?'g':d.pos===2?'s':d.pos===3?'b':'';return '<div class="dr"><div class="dp '+pc+'">'+d.pos+'</div><div class="db" style="background:'+c+'"></div><div class="di"><div class="dn">'+d.n+'</div><div class="dt">'+d.tm+'</div><div class="pb"><div class="pf" style="width:'+Math.round(d.pts/max*100)+'%;background:'+c+'"></div></div></div><div class="dpt" style="color:'+c+'">'+d.pts+'<span> pts</span></div></div>';}).join('')+'<p class="note">Data: Ergast API</p>';}
// Tab switch
function sT(id,btn){document.querySelectorAll('.sec').forEach(function(s){s.classList.remove('on');});document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on');});document.getElementById(id).classList.add('on');btn.classList.add('on');}
// Init
rRaces();rStd(STD);
// Fetch from Ergast API
fetch('https://api.jolpi.ca/ergast/f1/2026/results.json?limit=100').then(function(r){return r.json();}).then(function(data){var races=(data.MRData&&data.MRData.RaceTable&&data.MRData.RaceTable.Races)||[];races.forEach(function(race){var res=race.Results&&race.Results[0];if(res){RES[parseInt(race.round)]={w:res.Driver.givenName+' '+res.Driver.familyName,tm:res.Constructor.name,fl:''};} });rRaces();}).catch(function(){});
fetch('https://api.jolpi.ca/ergast/f1/2026/driverstandings.json').then(function(r){return r.json();}).then(function(data){var lists=(data.MRData&&data.MRData.StandingsTable&&data.MRData.StandingsTable.StandingsLists)||[];if(!lists.length)return;var s=lists[0].DriverStandings||[];if(s.length){rStd(s.slice(0,12).map(function(d){return {pos:parseInt(d.position),n:d.Driver.givenName+' '+d.Driver.familyName,tm:d.Constructors[0].name,pts:parseInt(d.points)};}));}}).catch(function(){});
// News ticker
fetch('https://api.allorigins.win/get?url='+encodeURIComponent('https://www.motorsport.com/rss/f1/news/')).then(function(r){return r.json();}).then(function(data){var xml=new DOMParser().parseFromString(data.contents,'text/xml'),items=xml.querySelectorAll('item'),h=[];items.forEach(function(it,i){if(i<8){var t=it.querySelector('title');if(t)h.push(t.textContent.trim());}});if(h.length){var s=h.map(function(x){return '<span class="ti">&#9642; <b>'+x+'</b></span>';}).join('');document.getElementById('TI').innerHTML=s+s;}}).catch(function(){document.getElementById('TI').innerHTML='<span class="ti">&#9642; <b>Kimi Antonelli vinner Chinese GP</b></span><span class="ti">&#9642; <b>Lando Norris tar seier i Australia</b></span><span class="ti">&#9642; <b>Neste: Japanese GP 29. mars kl 07:00</b></span><span class="ti">&#9642; <b>Russell leder VM med 36 poeng</b></span>'.repeat(2);});
</script>
</body>
</html>
