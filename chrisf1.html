<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ChrisF1 Tracker 2025</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,sans-serif;background:#0a0a0a;color:#fff;}
header{background:linear-gradient(135deg,#e10600,#a00400);padding:18px 24px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-size:24px;font-weight:700;}.logo small{font-size:12px;font-weight:400;opacity:.8;display:block;}
.clk{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;}
main{max-width:900px;margin:0 auto;padding:20px 16px 60px;}
.nc{background:#141414;border:1px solid #2a2a2a;border-left:5px solid #e10600;border-radius:16px;padding:20px 24px;margin-bottom:20px;}
.nlbl{font-size:11px;font-weight:700;color:#e10600;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.nname{font-size:24px;font-weight:700;margin-bottom:4px;}
.nmeta{font-size:13px;color:#888;margin-bottom:14px;}
.cdown{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.cb{background:#1e1e1e;border-radius:10px;padding:10px 16px;text-align:center;min-width:68px;}
.cn{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;color:#e10600;}
.cl{font-size:10px;color:#555;margin-top:2px;text-transform:uppercase;}
.wrow{display:flex;gap:8px;flex-wrap:wrap;}
.wp{background:#1e1e1e;border:1px solid #2a2a2a;border-radius:20px;padding:4px 12px;font-size:12px;color:#999;}
.tabs{display:flex;gap:6px;margin-bottom:16px;}
.tab{padding:8px 18px;border-radius:10px;border:1px solid #2a2a2a;background:#141414;color:#777;font-size:13px;cursor:pointer;font-weight:500;}
.tab:hover{border-color:#e10600;color:#fff;}
.tab.on{background:#e10600;color:#fff;border-color:#e10600;}
.sec{display:none;flex-direction:column;gap:8px;}
.sec.on{display:flex;}
.rr{background:#141414;border:1px solid #2a2a2a;border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:10px;}
.rr.nx{border-color:#e10600;}.rr.pa{opacity:.6;}
.rn{font-size:11px;color:#444;min-width:22px;}.rf{font-size:20px;width:28px;}
.ri{flex:1;}.rna{font-size:14px;font-weight:600;}.rd{font-size:11px;color:#555;margin-top:2px;}
.rv{text-align:right;}.rw{font-size:13px;font-weight:600;}.rt{font-size:11px;color:#666;margin-top:2px;}
.bx{display:inline-block;font-size:10px;padding:2px 7px;border-radius:6px;font-weight:700;margin-left:6px;}
.bx.nx{background:#e10600;color:#fff;}.bx.so{background:#222;color:#666;}
.dr{background:#141414;border:1px solid #2a2a2a;border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:10px;}
.dp{font-size:14px;font-weight:700;min-width:22px;color:#444;}
.dp.g{color:#ffd700;}.dp.s{color:#c0c0c0;}.dp.b{color:#cd7f32;}
.db{width:4px;height:34px;border-radius:2px;flex-shrink:0;}
.di{flex:1;}.dn{font-size:14px;font-weight:600;}.dt{font-size:11px;color:#555;margin-top:1px;}
.pt{height:4px;background:#1e1e1e;border-radius:2px;margin-top:5px;}.pf{height:4px;border-radius:2px;}
.dpt{font-size:17px;font-weight:700;min-width:60px;text-align:right;}
</style>
</head>
<body>
<header>
<div class="logo">⚡ ChrisF1 Tracker <small>2025 Formula 1 Season</small></div>
<div><div class="clk" id="clk">--:--:--</div><div style="font-size:11px;opacity:.7;text-align:right">Norsk tid</div></div>
</header>
<main>
<div class="nc">
<div class="nlbl">🏁 Neste løp</div>
<div class="nname" id="nn">Laster...</div>
<div class="nmeta" id="nm"></div>
<div class="cdown" id="cd"></div>
<div class="wrow" id="wp"></div>
</div>
<div class="tabs">
<button class="tab on" onclick="sT('races',this)">📅 Kalender</button>
<button class="tab" onclick="sT('standings',this)">🏆 Stilling</button>
</div>
<div id="races" class="sec on"></div>
<div id="standings" class="sec"></div>
</main>
<script>
var R=[
{r:1,n:"Australian GP",c:"Australia",f:"🇦🇺",d:"2025-03-16",t:"05:00",w:"Lando Norris",tm:"McLaren",fl:"1:21.542"},
{r:2,n:"Chinese GP",c:"China",f:"🇨🇳",d:"2025-03-23",t:"07:00",w:"Max Verstappen",tm:"Red Bull",fl:"1:18.456"},
{r:3,n:"Japanese GP",c:"Japan",f:"🇯🇵",d:"2025-04-06",t:"07:00",w:"Max Verstappen",tm:"Red Bull",fl:"1:19.123"},
{r:4,n:"Bahrain GP",c:"Bahrain",f:"🇧🇭",d:"2025-04-13",t:"17:00",w:null},
{r:5,n:"Saudi Arabian GP",c:"Saudi Arabia",f:"🇸🇦",d:"2025-04-20",t:"19:00",w:null},
{r:6,n:"Miami GP",c:"USA",f:"🇺🇸",d:"2025-05-04",t:"21:00",w:null},
{r:7,n:"Emilia Romagna GP",c:"Italy",f:"🇮🇹",d:"2025-05-18",t:"15:00",w:null},
{r:8,n:"Monaco GP",c:"Monaco",f:"🇲🇨",d:"2025-05-25",t:"15:00",w:null},
{r:9,n:"Spanish GP",c:"Spain",f:"🇪🇸",d:"2025-06-01",t:"15:00",w:null},
{r:10,n:"Canadian GP",c:"Canada",f:"🇨🇦",d:"2025-06-15",t:"20:00",w:null},
{r:11,n:"Austrian GP",c:"Austria",f:"🇦🇹",d:"2025-06-29",t:"15:00",w:null},
{r:12,n:"British GP",c:"UK",f:"🇬🇧",d:"2025-07-06",t:"15:00",w:null},
{r:13,n:"Belgian GP",c:"Belgium",f:"🇧🇪",d:"2025-07-27",t:"15:00",w:null},
{r:14,n:"Hungarian GP",c:"Hungary",f:"🇭🇺",d:"2025-08-03",t:"15:00",w:null},
{r:15,n:"Dutch GP",c:"Netherlands",f:"🇳🇱",d:"2025-08-31",t:"15:00",w:null},
{r:16,n:"Italian GP",c:"Italy",f:"🇮🇹",d:"2025-09-07",t:"15:00",w:null},
{r:17,n:"Azerbaijan GP",c:"Azerbaijan",f:"🇦🇿",d:"2025-09-21",t:"13:00",w:null},
{r:18,n:"Singapore GP",c:"Singapore",f:"🇸🇬",d:"2025-10-05",t:"08:00",w:null},
{r:19,n:"US GP",c:"USA",f:"🇺🇸",d:"2025-10-19",t:"21:00",w:null},
{r:20,n:"Mexico City GP",c:"Mexico",f:"🇲🇽",d:"2025-10-26",t:"21:00",w:null},
{r:21,n:"São Paulo GP",c:"Brazil",f:"🇧🇷",d:"2025-11-09",t:"18:00",w:null},
{r:22,n:"Las Vegas GP",c:"USA",f:"🇺🇸",d:"2025-11-22",t:"07:00",w:null},
{r:23,n:"Qatar GP",c:"Qatar",f:"🇶🇦",d:"2025-11-30",t:"17:00",w:null},
{r:24,n:"Abu Dhabi GP",c:"UAE",f:"🇦🇪",d:"2025-12-07",t:"14:00",w:null},
];
var W={Australia:{e:"☀️",t:"22°C",c:"Solrikt"},China:{e:"🌤️",t:"18°C",c:"Delvis skyet"},Japan:{e:"🌸",t:"16°C",c:"Fint"},Bahrain:{e:"🌵",t:"32°C",c:"Varmt"},"Saudi Arabia":{e:"🌡️",t:"35°C",c:"Svært varmt"},USA:{e:"⛅",t:"28°C",c:"Skyet"},Italy:{e:"☀️",t:"24°C",c:"Fint"},Monaco:{e:"☀️",t:"23°C",c:"Solrikt"},Spain:{e:"☀️",t:"26°C",c:"Solrikt"},Canada:{e:"🌧️",t:"19°C",c:"Regn mulig"},Austria:{e:"⛅",t:"21°C",c:"Skyet"},UK:{e:"🌧️",t:"17°C",c:"Regn"},Belgium:{e:"🌦️",t:"18°C",c:"Variabelt"},Hungary:{e:"☀️",t:"30°C",c:"Varmt"},Netherlands:{e:"🌤️",t:"19°C",c:"Fint"},Azerbaijan:{e:"☀️",t:"25°C",c:"Solrikt"},Singapore:{e:"🌧️",t:"31°C",c:"Fuktig"},Mexico:{e:"⛅",t:"22°C",c:"Skyet"},Brazil:{e:"🌦️",t:"27°C",c:"Variabelt"},Qatar:{e:"🌡️",t:"33°C",c:"Varmt"},UAE:{e:"☀️",t:"29°C",c:"Solrikt"}};
var S=[{pos:1,n:"Max Verstappen",tm:"Red Bull Racing",pts:51,col:"#3671C6"},{pos:2,n:"Lando Norris",tm:"McLaren",pts:43,col:"#FF8000"},{pos:3,n:"Charles Leclerc",tm:"Ferrari",pts:30,col:"#E8002D"},{pos:4,n:"Oscar Piastri",tm:"McLaren",pts:28,col:"#FF8000"},{pos:5,n:"George Russell",tm:"Mercedes",pts:22,col:"#27F4D2"},{pos:6,n:"Lewis Hamilton",tm:"Ferrari",pts:16,col:"#E8002D"},{pos:7,n:"Yuki Tsunoda",tm:"Red Bull Racing",pts:14,col:"#3671C6"},{pos:8,n:"Carlos Sainz",tm:"Williams",pts:12,col:"#64C4FF"},{pos:9,n:"Fernando Alonso",tm:"Aston Martin",pts:9,col:"#229971"},{pos:10,n:"Lance Stroll",tm:"Aston Martin",pts:5,col:"#229971"}];
var now=new Date(),NR=R.find(function(r){return new Date(r.d)>now;});
function pad(n){return String(n).padStart(2,"0");}
function tick(){
  var d=new Date();
  document.getElementById("clk").textContent=pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
  if(!NR)return;
  var rd=new Date(NR.d+"T"+NR.t+":00"),diff=rd-new Date();
  if(diff<=0){document.getElementById("cd").innerHTML="<span style='color:#e10600;font-size:16px;font-weight:700'>🚦 LØPET ER I GANG!</span>";return;}
  var dy=Math.floor(diff/86400000),h=Math.floor((diff%86400000)/3600000),m=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000);
  document.getElementById("cd").innerHTML=[["Dager",dy],["Timer",h],["Min",m],["Sek",s]].map(function(x){return "<div class='cb'><div class='cn'>"+pad(x[1])+"</div><div class='cl'>"+x[0]+"</div></div>";}).join("");
}
function init(){
  if(NR){
    var w=W[NR.c]||{e:"",t:"",c:"Ukjent"};
    document.getElementById("nn").textContent=NR.f+" "+NR.n;
    document.getElementById("nm").textContent=new Date(NR.d).toLocaleDateString("nb-NO",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+" · Start kl "+NR.t+" norsk tid · Runde "+NR.r+" av 24";
    document.getElementById("wp").innerHTML="<div class='wp'>"+w.e+" "+w.t+"</div><div class='wp'>"+w.c+"</div><div class='wp'>📍 "+NR.c+"</div>";
  }
  document.getElementById("races").innerHTML=R.map(function(r){
    var pa=!!r.w,nx=NR&&r.r===NR.r;
    var bdg=nx?"<span class='bx nx'>NESTE</span>":!pa?"<span class='bx so'>Kommende</span>":"";
    var rv=pa?"<div class='rv'><div class='rw'>"+r.w+"</div><div class='rt'>"+r.tm+" · FL: "+r.fl+"</div></div>":"<div class='rv'><div class='rt' style='color:#555'>"+r.t+" norsk tid</div></div>";
    return "<div class='rr "+(pa?"pa":"")+" "+(nx?"nx":"")+"'><div class='rn'>"+r.r+"</div><div class='rf'>"+r.f+"</div><div class='ri'><div class='rna'>"+r.n+bdg+"</div><div class='rd'>"+new Date(r.d).toLocaleDateString("nb-NO",{day:"numeric",month:"short",year:"numeric"})+"</div></div>"+rv+"</div>";
  }).join("");
  var mx=S[0].pts;
  document.getElementById("standings").innerHTML=S.map(function(d){
    var cl=d.pos===1?"g":d.pos===2?"s":d.pos===3?"b":"";
    return "<div class='dr'><div class='dp "+cl+"'>"+d.pos+"</div><div class='db' style='background:"+d.col+"'></div><div class='di'><div class='dn'>"+d.n+"</div><div class='dt'>"+d.tm+"</div><div class='pt'><div class='pf' style='width:"+Math.round(d.pts/mx*100)+"%;background:"+d.col+"'></div></div></div><div class='dpt' style='color:"+d.col+"'>"+d.pts+"<span style='font-size:11px;color:#444;font-weight:400'> pts</span></div></div>";
  }).join("");
}
function sT(id,btn){
  document.querySelectorAll(".sec").forEach(function(s){s.classList.remove("on");});
  document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("on");});
  document.getElementById(id).classList.add("on");
  btn.classList.add("on");
}
init();tick();setInterval(tick,1000);
</script>
</body>
</html>
