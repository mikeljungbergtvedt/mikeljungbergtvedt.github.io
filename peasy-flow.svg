<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Slik selger du bilen din med Peasy i 5 enkle steg">
<defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1b4332"/><stop offset="1" stop-color="#2d6a4f"/></linearGradient>
<style>
.lbl{font-family:-apple-system,system-ui,sans-serif;font-weight:700;font-size:18px;fill:#1b4332}
.sub{font-family:-apple-system,system-ui,sans-serif;font-weight:500;font-size:14px;fill:#52796f}
.num{font-family:-apple-system,system-ui,sans-serif;font-weight:800;font-size:14px;fill:#fff}
</style>
</defs>

<!-- Connecting line -->
<line x1="120" y1="120" x2="1080" y2="120" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6 8"/>

<!-- STEP 1: Phone with reg.nr -->
<g transform="translate(60,40)">
  <circle cx="60" cy="80" r="56" fill="#fff" stroke="#fbbf24" stroke-width="3"/>
  <!-- Phone -->
  <rect x="42" y="50" width="36" height="60" rx="6" fill="#1b4332"/>
  <rect x="46" y="56" width="28" height="40" fill="#fbbf24"/>
  <text x="60" y="80" text-anchor="middle" font-family="monospace" font-weight="800" font-size="9" fill="#1b4332">AB</text>
  <text x="60" y="91" text-anchor="middle" font-family="monospace" font-weight="800" font-size="9" fill="#1b4332">12345</text>
  <circle cx="60" cy="106" r="2" fill="#fbbf24"/>
  <circle cx="105" cy="35" r="16" fill="#1b4332"/>
  <text x="105" y="40" text-anchor="middle" class="num">1</text>
  <text x="60" y="170" text-anchor="middle" class="lbl">Send reg.nr.</text>
  <text x="60" y="190" text-anchor="middle" class="sub">Tar 30 sekunder</text>
</g>

<g transform="translate(280,40)">
  <circle cx="60" cy="80" r="56" fill="#fff" stroke="#fbbf24" stroke-width="3"/>
  <path d="M 35 60 L 60 50 L 90 60 L 90 105 L 35 105 Z" fill="#fbbf24" stroke="#1b4332" stroke-width="2"/>
  <circle cx="55" cy="68" r="3" fill="#1b4332"/>
  <text x="65" y="92" font-family="-apple-system,system-ui" font-weight="800" font-size="20" fill="#1b4332">kr</text>
  <circle cx="105" cy="35" r="16" fill="#1b4332"/>
  <text x="105" y="40" text-anchor="middle" class="num">2</text>
  <text x="60" y="170" text-anchor="middle" class="lbl">FŅ estimat</text>
  <text x="60" y="190" text-anchor="middle" class="sub">Innen kort tid</text>
</g>

<g transform="translate(500,40)">
  <circle cx="60" cy="80" r="56" fill="#fff" stroke="#fbbf24" stroke-width="3"/>
  <path d="M 25 92 L 33 78 L 50 70 L 75 70 L 92 78 L 100 92 L 100 100 L 25 100 Z" fill="#1b4332"/>
  <circle cx="40" cy="100" r="7" fill="#1b4332" stroke="#fff" stroke-width="2"/>
  <circle cx="85" cy="100" r="7" fill="#1b4332" stroke="#fff" stroke-width="2"/>
  <rect x="55" y="74" width="14" height="10" fill="#fbbf24"/>
  <path d="M 13 88 L 22 88 M 19 84 L 22 88 L 19 92" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="105" cy="35" r="16" fill="#1b4332"/>
  <text x="105" y="40" text-anchor="middle" class="num">3</text>
  <text x="60" y="170" text-anchor="middle" class="lbl">Vi henter bilen</text>
  <text x="60" y="190" text-anchor="middle" class="sub">Gratis henting</text>
</g>

<g transform="translate(720,40)">
  <circle cx="60" cy="80" r="56" fill="#fff" stroke="#fbbf24" stroke-width="3"/>
  <rect x="38" y="78" width="40" height="14" rx="3" fill="#1b4332" transform="rotate(-25 58 85)"/>
  <rect x="65" y="62" width="20" height="20" rx="3" fill="#fbbf24" stroke="#1b4332" stroke-width="2" transform="rotate(-25 75 72)"/>
  <rect x="40" y="100" width="50" height="6" rx="2" fill="#1b4332"/>
  <line x1="30" y1="65" x2="36" y2="71" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="25" y1="74" x2="33" y2="74" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="105" cy="35" r="16" fill="#1b4332"/>
  <text x="105" y="40" text-anchor="middle" class="num">4</text>
  <text x="60" y="170" text-anchor="middle" class="lbl">Auksjon</text>
  <text x="60" y="190" text-anchor="middle" class="sub">2000+ forhandlere</text>
</g>

<g transform="translate(940,40)">
  <circle cx="60" cy="80" r="56" fill="#fff" stroke="#fbbf24" stroke-width="3"/>
  <rect x="32" y="62" width="56" height="40" rx="6" fill="#1b4332"/>
  <rect x="32" y="70" width="56" height="6" fill="#fbbf24"/>
  <circle cx="75" cy="88" r="6" fill="#fbbf24"/>
  <text x="75" y="92" text-anchor="middle" font-family="-apple-system" font-weight="800" font-size="10" fill="#1b4332">kr</text>
  <circle cx="100" cy="60" r="14" fill="#10b981"/>
  <path d="M 94 60 L 99 65 L 107 56" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="105" cy="35" r="16" fill="#1b4332"/>
  <text x="105" y="40" text-anchor="middle" class="num">5</text>
  <text x="60" y="170" text-anchor="middle" class="lbl">Penger på konto</text>
  <text x="60" y="190" text-anchor="middle" class="sub">Innen få dager</text>
</g>
</svg>
