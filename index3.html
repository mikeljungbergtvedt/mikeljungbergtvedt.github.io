<!doctype html>
<html lang="nb-NO">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>Peasy – Bud på din bil</title>

<!-- Your existing styles and other head content -->
<style>
/* Existing styles (keep your current styles here) */

/* Styles for hamburger menu and mobile nav */
#hamburger {
  display: none;
  font-size: 24px;
  cursor: pointer;
  padding: 10px;
  user-select: none;
}

/* Navigation menu styles */
.header-nav {
  display: flex;
  align-items: center;
}

.header-nav ul {
  list-style: none;
  display: flex;
  gap: 20px;
  margin: 0;
  padding: 0;
}

/* Responsive styles for mobile */
@media (max-width: 768px) {
  #hamburger {
    display: block;
  }

  /* Hide menu initially on mobile */
  #headerNav {
    display: none;
    flex-direction: column;
    background-color: #fff;
    position: absolute;
    top: 60px; /* adjust based on header height */
    right: 10px;
    padding: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    z-index: 1000;
  }

  /* Show menu when toggled */
  #headerNav.show {
    display: flex;
  }

  /* Keep form visible on mobile, optional: style it for clarity */
  #renForm {
    display: flex;
    flex-direction: column;
    margin: 10px 0;
  }
}
</style>
</head>
<body>

<header style="position: relative; padding: 10px; background: #f0f0f0;"> 
  <!-- Hamburger icon for mobile -->
  <div class="hamburger" id="hamburger" aria-label="Menu" aria-expanded="false" role="button" tabindex="0">
    &#9776; <!-- Hamburger icon -->
  </div>

  <!-- Navigation links (visible on desktop) -->
  <nav class="header-nav" id="headerNav">
    <ul>
      <li><a href="/vilkar">Vilkår</a></li>
      <li><a href="/faq">FAQ</a></li>
      <li><a href="/login">Login</a></li>
    </ul>
  </nav>

  <!-- Your existing header content, e.g., logo, etc. -->
  <!-- Keep the "Ren nr / km" form -->
  <form id="renForm" style="margin-top: 10px; display: flex; gap: 10px;">
    <input type="text" placeholder="Ren nr" name="renNr" />
    <input type="text" placeholder="km" name="km" />
    <button type="submit">Submit</button>
  </form>
</header>

<!-- Rest of your page content -->

<script>
  // Toggle menu on hamburger click
  document.addEventListener('DOMContentLoaded', () => {
    const hamburger = document.getElementById('hamburger');
    const headerNav = document.getElementById('headerNav');

    hamburger.addEventListener('click', () => {
      const isExpanded = hamburger.getAttribute('aria-expanded') === 'true';
      hamburger.setAttribute('aria-expanded', String(!isExpanded));
      headerNav.classList.toggle('show');
    });

    // Optional: toggle with keyboard (Enter or Space)
    hamburger.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        hamburger.click();
      }
    });
  });
</script>

</body>
</html>
