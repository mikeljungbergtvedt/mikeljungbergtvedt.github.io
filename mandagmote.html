<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mandagsrapport – Peasy v13.2</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        /* Same beautiful styles as before */
        body { font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 0; background: linear-gradient(135deg, #F2F7F9 0%, #E8F0F5 100%); color: #004225; min-height: 100vh; }
        .container { max-width: 1440px; margin: 0 auto; padding: 40px 24px; }
        h1 { font-weight: 900; font-size: 2.25rem; letter-spacing: -0.6px; margin-bottom: 12px; background: linear-gradient(to right, #004225, #006644); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .version { font-size: 1.3rem; color: #006644; margin-left: 12px; }
        .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
        button { padding: 10px 20px; font-size: 0.95rem; font-weight: 600; border-radius: 10px; border: none; background: #004225; color: white; cursor: pointer; }
        button:hover { background: #005533; }
        button:disabled { background: #aaa; cursor: not-allowed; }
        button.danger { background: #c62828; }
        .commentary { background: rgba(255,255,255,0.88); backdrop-filter: blur(24px); border: 1px solid rgba(130,191,210,0.1); border-radius: 14px; padding: 24px; margin-bottom: 40px; }
        table { width: 100%; border-collapse: collapse; background: rgba(255,255,255,0.88); backdrop-filter: blur(24px); border: 1px solid rgba(130,191,210,0.1); border-radius: 14px; margin-bottom: 40px; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid rgba(130,191,210,0.1); }
        th { background: rgba(130,191,210,0.05); font-weight: 700; }
        .highlight-negative { color: #d32f2f; font-weight: 600; }
        .highlight-positive { color: #2e7d32; font-weight: 600; }
        .highlight-zero { color: #555; font-weight: 600; }
        #loading { text-align: center; font-style: italic; padding: 20px; }
        #report-content { display: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>Mandagsrapport – Peasy <span class="version">v13.2</span></h1>
    <p style="opacity: 0.8;">Oppdateres for forrige fullførte uke (man–søn).</p>

    <div class="controls">
        <select id="weekSelect" onchange="loadSavedReport()">
            <option value="">Velg uke...</option>
        </select>
        <button id="generate-btn" onclick="generateNewReport()">Generer forrige fullførte uke</button>
        <button id="edit-btn" onclick="editReport()" style="display:none;">Rediger rapport</button>
        <button id="save-edits" onclick="saveEdits()" style="display:none;">Lagre endringer</button>
        <button id="lock-btn" onclick="showLockCommentModal()" style="display:none;">Lås inn rapport</button>
        <button id="delete-btn" onclick="showDeleteConfirm()" style="display:none;background:#c62828;">Slett rapport</button>
    </div>

    <div id="loading" style="display:none;">Laster...</div>

    <div id="report-content">
        <div id="timestamp" class="timestamp"></div>
        <div id="commentary" class="commentary"></div>
        <div id="sold-section"><div class="section-title">Solgte biler</div><table id="sold-table"></table></div>
        <div id="returned-section"><div class="section-title">Returnerte biler</div><table id="returned-table"></table></div>
    </div>

    <!-- Lock comment modal -->
    <div id="lock-comment-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:1000;justify-content:center;align-items:center;">
        <div style="background:white;padding:30px;border-radius:16px;width:90%;max-width:560px;">
            <h3>Kommentar før låsing (valgfritt)</h3>
            <textarea id="lock-comment-text" style="width:100%;height:110px;margin:12px 0;"></textarea>
            <button onclick="confirmLockWithComment()" style="background:#006644;color:white;padding:12px 24px;">Lås inn rapport</button>
            <button onclick="document.getElementById('lock-comment-modal').style.display='none'" style="margin-left:12px;">Avbryt</button>
        </div>
    </div>

    <!-- Delete modal -->
    <div id="delete-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:1000;justify-content:center;align-items:center;">
        <div style="background:white;padding:30px;border-radius:16px;text-align:center;max-width:420px;">
            <h3>Slette rapport?</h3>
            <p>Dette kan ikke angres.</p>
            <button onclick="promptPasswordForDelete()" style="background:#c62828;color:white;padding:12px 24px;margin:10px;">Ja, slett</button>
            <button onclick="document.getElementById('delete-modal').style.display='none'" style="padding:12px 24px;">Nei</button>
        </div>
    </div>
</div>

<script>
const STORAGE_KEY = 'peasy_mandagsrapporter';
const PASSWORD = 'peasy';
let currentReport = null;
let currentCreatedTime = '';

function cleanNum(str) {
    if (!str) return 0;
    return parseFloat((str+'').replace(/\s/g,'').replace(/\u00A0/g,'').replace(/\u2212/g,'-').replace(/[^0-9.-]/g,'')) || 0;
}

function getISOWeek(date) {
    const d = new Date(date);
    d.setHours(0,0,0,0);
    d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
    const yearStart = new Date(d.getFullYear(), 0, 1);
    const days = Math.floor((d - yearStart) / 86400000);
    return Math.ceil((days + 1) / 7);
}

function getMostRecentCompletedWeekStart() {
    const today = new Date();
    const dayOfWeek = today.getDay() || 7;
    let daysBack = (dayOfWeek === 1) ? 8 : dayOfWeek;
    const endPrev = new Date(today);
    endPrev.setDate(today.getDate() - daysBack);
    endPrev.setHours(0,0,0,0);
    const startPrev = new Date(endPrev);
    startPrev.setDate(endPrev.getDate() - 6);
    startPrev.setHours(0,0,0,0);
    return startPrev;
}

function getMostRecentCompletedWeekNum() {
    return getISOWeek(getMostRecentCompletedWeekStart());
}

window.onload = () => {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    const select = document.getElementById('weekSelect');
    select.innerHTML = '<option value="">Velg uke...</option>';
    saved.forEach(r => {
        const opt = document.createElement('option');
        opt.value = r.id;
        opt.textContent = r.title;
        select.appendChild(opt);
    });
    if (saved.length > 0) {
        select.value = saved[saved.length-1].id;
        loadSavedReport();
    }
    updateGenerateButton();
};

function updateGenerateButton() {
    const btn = document.getElementById('generate-btn');
    const prevWeekNum = getMostRecentCompletedWeekNum();
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    const alreadyLocked = saved.some(r => r.title.includes(`uke ${prevWeekNum}`) && r.locked);

    if (alreadyLocked) {
        btn.disabled = true;
        btn.textContent = `Uke ${prevWeekNum} allerede låst`;
    } else {
        btn.disabled = false;
        btn.textContent = 'Generer forrige fullførte uke';
    }
}

function loadSavedReport() {
    const id = document.getElementById('weekSelect').value;
    if (!id) return;

    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    const report = saved.find(r => r.id === id);
    if (!report) return;

    currentReport = report;
    currentCreatedTime = report.created;

    document.getElementById('report-content').style.display = 'block';
    document.getElementById('edit-btn').style.display = 'block';
    document.getElementById('lock-btn').style.display = 'none';
    document.getElementById('save-edits').style.display = 'none';
    document.getElementById('delete-btn').style.display = 'inline-block';

    const edited = report.edited ? `Sist endret: ${report.edited}` : 'Sist endret: -';
    document.getElementById('timestamp').textContent = `Opprettet: ${report.created}. ${edited}`;
    document.getElementById('commentary').innerHTML = report.commentary;
    document.getElementById('sold-table').innerHTML = report.soldTable;
    document.getElementById('returned-table').innerHTML = report.returnedTable;
    document.getElementById('sold-section').style.display = report.soldTable ? 'block' : 'none';
    document.getElementById('returned-section').style.display = report.returnedTable ? 'block' : 'none';

    updateGenerateButton();
}

</script>
</body>
</html>
