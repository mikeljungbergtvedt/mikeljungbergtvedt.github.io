<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mandagsmøte – Peasy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 0; background: linear-gradient(135deg, #F2F7F9 0%, #E8F0F5 100%); color: #004225; min-height: 100vh; }
        .container { max-width: 1440px; margin: 0 auto; padding: 40px 24px; }
        h1 { font-weight: 900; font-size: 2.25rem; letter-spacing: -0.6px; margin-bottom: 8px; background: linear-gradient(to right, #004225, #006644); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .controls { margin-bottom: 32px; }
        select { padding: 12px 20px; font-size: 1.05rem; font-weight: 600; border-radius: 10px; border: none; background: white; box-shadow: 0 1px 4px rgba(0,66,37,0.06); min-width: 260px; }
        .content { display: none; opacity: 0; transition: opacity 0.4s ease; }
        .content.active { display: block; opacity: 1; }
        .commentary { background: rgba(255,255,255,0.88); backdrop-filter: blur(24px); border: 1px solid rgba(130,191,210,0.10); border-radius: 14px; box-shadow: 0 6px 20px rgba(0,66,37,0.05); padding: 24px; margin-bottom: 40px; }
        table { width: 100%; border-collapse: collapse; background: rgba(255,255,255,0.88); backdrop-filter: blur(24px); border: 1px solid rgba(130,191,210,0.10); border-radius: 14px; box-shadow: 0 6px 20px rgba(0,66,37,0.05); margin-bottom: 24px; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid rgba(130,191,210,0.10); }
        th { background: rgba(130,191,210,0.05); font-weight: 700; }
        tfoot td { font-weight: 700; background: rgba(130,191,210,0.08); }
        .highlight-negative { color: #d32f2f; font-weight: 600; }
        .highlight-positive { color: #2e7d32; font-weight: 600; }
        .highlight-zero { color: #555; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <h1>Mandagsmøte – Peasy</h1>

    <div class="controls">
        <label for="weekSelect">Velg uke:</label>
        <select id="weekSelect" onchange="showWeek()">
            <option value="">Velg uke...</option>
        </select>
    </div>

    <!-- Content will be injected here by JS -->
</div>

<script>
// ─────────────────────────────────────────────────────────────
// All weeks are stored here – add new ones each Monday
// ─────────────────────────────────────────────────────────────
const meetings = [
    {
        id: "uke5",
        title: "Mandag 2. februar 2026 – uke 5",
        html: `
            <h2>Mandag 2. februar 2026 – uke 5</h2>
            <div class="commentary">
                <h3>Fakta – Differanse Bud vs AR-verdi (midtpunkt)</h3>
                <ul>
                    <li>10 biler solgt i perioden</li>
                    <li>7 biler solgt under AR-verdi midtpunkt</li>
                    <li>1 bil solgt over AR-verdi midtpunkt</li>
                    <li>2 biler solgt nøyaktig på AR-verdi midtpunkt</li>
                    <li>Gjennomsnittlig differanse: <span class="highlight-negative">-12 300 NOK</span> per bil</li>
                    <li>Gjennomsnittlig differanse i prosent: <span class="highlight-negative">-9.0%</span></li>
                </ul>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Merke</th><th>Modell</th><th>År</th><th>AR midtpunkt</th><th>Bud</th><th>Diff NOK</th><th>Diff %</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>BMW</td><td>318d xDRIVE</td><td>2013</td><td>140 000</td><td>102 500</td><td class="highlight-negative">-37 500</td><td class="highlight-negative">-26.8%</td></tr>
                    <tr><td>VOLVO</td><td>XC60 T8 Twin Engine</td><td>2018</td><td>275 000</td><td>238 500</td><td class="highlight-negative">-36 500</td><td class="highlight-negative">-13.3%</td></tr>
                    <tr><td>TOYOTA</td><td>AURIS</td><td>2012</td><td>75 000</td><td>65 000</td><td class="highlight-negative">-10 000</td><td class="highlight-negative">-13.3%</td></tr>
                    <tr><td>AUDI</td><td>A6</td><td>2012</td><td>60 000</td><td>55 500</td><td class="highlight-negative">-4 500</td><td class="highlight-negative">-7.5%</td></tr>
                    <tr><td>VOLVO</td><td>V70</td><td>2012</td><td>23 000</td><td>23 000</td><td class="highlight-zero">0</td><td class="highlight-zero">0.0%</td></tr>
                    <tr><td>TOYOTA</td><td>YARIS HYBRID</td><td>2015</td><td>80 000</td><td>69 500</td><td class="highlight-negative">-10 500</td><td class="highlight-negative">-13.1%</td></tr>
                    <tr><td>SKODA</td><td>OCTAVIA</td><td>2018</td><td>162 500</td><td>139 500</td><td class="highlight-negative">-23 000</td><td class="highlight-negative">-14.2%</td></tr>
                    <tr><td>VOLVO</td><td>V70</td><td>2012</td><td>31 000</td><td>33 000</td><td class="highlight-positive">+2 000</td><td class="highlight-positive">+6.5%</td></tr>
                    <tr><td>AUDI</td><td>A3</td><td>2011</td><td>37 500</td><td>34 500</td><td class="highlight-negative">-3 000</td><td class="highlight-negative">-8.0%</td></tr>
                    <tr><td>VOLVO</td><td>V60</td><td>2019</td><td>155 000</td><td>155 000</td><td class="highlight-zero">0</td><td class="highlight-zero">0.0%</td></tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="3"><strong>Gjennomsnitt (10 biler)</strong></td>
                        <td>103 900</td>
                        <td>91 600</td>
                        <td class="highlight-negative">-12 300</td>
                        <td class="highlight-negative">-9.0%</td>
                    </tr>
                </tfoot>
            </table>
        `
    },
    // ─────────────────────────────────────────────────────────────
    // Placeholder for next week (uke 6) – replace this entire block with new data from Grok
    // ─────────────────────────────────────────────────────────────
    {
        id: "uke6",
        title: "Mandag 9. februar 2026 – uke 6",
        html: `
            <h2>Mandag 9. februar 2026 – uke 6</h2>
            <div class="commentary">
                <h3>Fakta – Differanse Bud vs AR-verdi (midtpunkt)</h3>
                <ul>
                    <li>0 biler solgt i perioden</li>
                    <li>0 biler solgt under AR-verdi midtpunkt</li>
                    <li>0 biler solgt over AR-verdi midtpunkt</li>
                    <li>0 biler solgt nøyaktig på AR-verdi midtpunkt</li>
                    <li>Gjennomsnittlig differanse: 0 NOK per bil</li>
                    <li>Gjennomsnittlig differanse i prosent: 0.0%</li>
                </ul>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Merke</th><th>Modell</th><th>År</th><th>AR midtpunkt</th><th>Bud</th><th>Diff NOK</th><th>Diff %</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Empty – add rows here when real data comes -->
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="3"><strong>Gjennomsnitt (0 biler)</strong></td>
                        <td>0</td><td>0</td><td>0</td><td>0.0%</td>
                    </tr>
                </tfoot>
            </table>
        `
    }
    // ─────────────────────────────────────────────────────────────
    // Optimal prompt to copy-paste to Grok each Monday (easy to find):
    // "Generate the JavaScript block for mandagmote.html for [date and week, e.g. Mandag 16. februar 2026 – uke 7]. Use the same table structure every week. Facts: [list your facts here, e.g. 9 biler solgt, 4 under, 3 over, etc.]. Table rows: [paste rows from Excel, e.g. Merke | Modell | År | AR midtpunkt | Bud | Diff NOK | Diff %]. Averages: [snitt AR, snitt Bud, snitt diff NOK, snitt diff %]. Keep facts objective."
    // ─────────────────────────────────────────────────────────────
];

// Populate dropdown
const select = document.getElementById("weekSelect");
meetings.forEach(m => {
    const option = document.createElement("option");
    option.value = m.id;
    option.textContent = m.title;
    select.appendChild(option);
});

// Show selected week
function showWeek() {
    const selectedId = select.value;
    document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
    
    if (selectedId) {
        let contentDiv = document.getElementById(selectedId);
        if (!contentDiv) {
            contentDiv = document.createElement('div');
            contentDiv.id = selectedId;
            contentDiv.className = 'content';
            document.querySelector('.container').appendChild(contentDiv);
        }
        contentDiv.innerHTML = meetings.find(m => m.id === selectedId).html;
        contentDiv.classList.add('active');
    }
}

// Auto-show the latest week on load
if (meetings.length > 0) {
    select.value = meetings[meetings.length - 1].id;
    showWeek();
}
</script>

</body>
</html>
