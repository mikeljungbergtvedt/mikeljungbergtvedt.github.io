<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mandagsrapport – Peasy v1.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 0; background: linear-gradient(135deg, #F2F7F9 0%, #E8F0F5 100%); color: #004225; min-height: 100vh; }
        .container { max-width: 1440px; margin: 0 auto; padding: 40px 24px; }
        h1 { font-weight: 900; font-size: 2.25rem; letter-spacing: -0.6px; margin-bottom: 12px; background: linear-gradient(to right, #004225, #006644); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
        button { padding: 10px 20px; font-size: 0.95rem; font-weight: 600; border-radius: 10px; border: none; background: #004225; color: white; cursor: pointer; box-shadow: 0 1px 4px rgba(0,66,37,0.06); transition: all 0.2s ease; }
        button:hover { box-shadow: 0 3px 10px rgba(0,66,37,0.14); transform: translateY(-1px); }
        .commentary { background: rgba(255,255,255,0.88); backdrop-filter: blur(24px); border: 1px solid rgba(130,191,210,0.10); border-radius: 14px; box-shadow: 0 6px 20px rgba(0,66,37,0.05); padding: 24px; margin-bottom: 40px; }
        table { width: 100%; border-collapse: collapse; background: rgba(255,255,255,0.88); backdrop-filter: blur(24px); border: 1px solid rgba(130,191,210,0.10); border-radius: 14px; box-shadow: 0 6px 20px rgba(0,66,37,0.05); margin-bottom: 40px; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid rgba(130,191,210,0.10); }
        th { background: rgba(130,191,210,0.05); font-weight: 700; }
        tfoot td { font-weight: 700; background: rgba(130,191,210,0.08); }
        .highlight-negative { color: #d32f2f; font-weight: 600; }
        .highlight-positive { color: #2e7d32; font-weight: 600; }
        .highlight-zero { color: #555; font-weight: 600; }
        #loading { font-style: italic; opacity: 0.75; text-align: center; font-size: 1rem; margin: 24px 0; }
        .section-title { font-size: 1.3rem; margin: 32px 0 16px; font-weight: 700; }
        .no-data { text-align: center; color: #777; font-style: italic; margin: 20px 0; }
    </style>
</head>
<body>
<div class="container">
    <h1>Mandagsrapport – Peasy v1.0</h1>
    <p style="opacity: 0.8; margin-bottom: 32px;">Forrige full uke (man–søn). Kun biler med ikke-tomme datoer i kolonne O (verdi) eller U (retur).</p>

    <div class="controls">
        <button onclick="loadReport()">Oppdater nå</button>
    </div>

    <div id="loading">Laster data...</div>

    <div id="commentary" class="commentary" style="display:none;"></div>

    <div id="sold-section" style="display:none;">
        <div class="section-title">Solgte biler (ikke-tom O-dato i uken)</div>
        <table id="sold-table"></table>
    </div>

    <div id="returned-section" style="display:none;">
        <div class="section-title">Returnerte biler (ikke-tom U-dato i uken)</div>
        <table id="returned-table"></table>
    </div>
</div>

<script>
async function loadReport() {
    const url = 'https://api.biladministrasjon.no/public/reports/peasy/dhqui7Hkl54?output=xlsx';
    document.getElementById('loading').textContent = 'Laster data...';
    document.getElementById('loading').style.display = 'block';
    document.getElementById('commentary').style.display = 'none';
    document.getElementById('sold-section').style.display = 'none';
    document.getElementById('returned-section').style.display = 'none';

    try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const ab = await res.arrayBuffer();
        const wb = XLSX.read(ab, {type: 'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const data = XLSX.utils.sheet_to_json(ws, {header: 1, defval: ''});

        const headers = data[0].map(h => (h || '').trim());
        const col = {
            Merke: headers.indexOf('Merke'),
            Modell: headers.indexOf('Modell'),
            År: headers.indexOf('År'),
            'Endelig AR verdi': headers.findIndex(h => h.includes('Endelig AR verdi')),
            Bud: headers.indexOf('Bud'),
            O: headers.findIndex(h => h.includes('Registrert') || h.includes('O')),
            U: headers.findIndex(h => h.includes('Returnert') || h.includes('U'))
        };

        // Previous full week: Mon–Sun before current week
        const today = new Date();
        const dayOfWeek = today.getDay() || 7;
        const lastSunday = new Date(today);
        lastSunday.setDate(today.getDate() - dayOfWeek);
        lastSunday.setHours(23,59,59,999);

        const lastMonday = new Date(lastSunday);
        lastMonday.setDate(lastSunday.getDate() - 6);
        lastMonday.setHours(0,0,0,0);

        const soldCars = [];
        const returnedCars = [];

        const parseDate = (val) => {
            if (!val) return null;
            let str = val.toString().trim();
            if (str === '') return null;
            const datePart = str.split(/\s+/)[0];
            const match = datePart.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
            if (match) {
                const date = new Date(Number(match[3]), Number(match[2])-1, Number(match[1]));
                return isNaN(date.getTime()) ? null : date;
            }
            return null;
        };

        const arLow = (range) => {
            if (!range || typeof range !== 'string' || !range.includes('-')) return 0;
            const low = parseFloat(range.split('-')[0].trim()) || 0;
            return low;
        };

        for (let i = 1; i < data.length; i++) {
            const row = data[i];
            const oVal = row[col.O];
            const uVal = row[col.U];

            const oDate = parseDate(oVal);
            const uDate = parseDate(uVal);

            const ar = arLow(row[col['Endelig AR verdi']]);
            const bud = parseFloat((row[col.Bud] || '0').toString().replace(/\s/g, '')) || 0;
            const diffNok = bud - ar;
            const diffPct = ar ? ((diffNok / ar) * 100).toFixed(1) : '0.0';

            const car = {
                Merke: row[col.Merke] || '-',
                Modell: row[col.Modell] || '-',
                År: row[col.År] || '-',
                'AR lav': ar.toLocaleString('nb-NO'),
                Bud: bud.toLocaleString('nb-NO'),
                'Diff NOK': diffNok.toLocaleString('nb-NO'),
                'Diff %': diffPct + '%'
            };

            if (oVal && oVal.toString().trim() !== '' && oDate && oDate >= lastMonday && oDate <= lastSunday) {
                soldCars.push(car);
            }
            if (uVal && uVal.toString().trim() !== '' && uDate && uDate >= lastMonday && uDate <= lastSunday) {
                returnedCars.push(car);
            }
        }

        const facts = (cars) => {
            const n = cars.length;
            if (n === 0) return { n: 0, underPct: 0, avgUndersalgNok: '0', avgUndersalgPct: '0.0' };
            const under = cars.filter(c => parseFloat(c['Diff NOK'].replace(/\s/g, '')) < 0).length;
            const underPct = Math.round((under / n) * 100);
            const undersalgNok = cars.map(c => Math.min(0, parseFloat(c['Diff NOK'].replace(/\s/g, '')) || 0));
            const avgUndersalgNok = Math.round(undersalgNok.reduce((a,b)=>a+b,0) / n).toLocaleString('nb-NO');
            const avgUndersalgPct = (undersalgNok.reduce((a,b)=>a+b,0) / n).toFixed(1);
            return { n, underPct, avgUndersalgNok, avgUndersalgPct };
        };

        const soldF = facts(soldCars);
        const retF = facts(returnedCars);

        const total = soldF.n + retF.n;
        const returAndel = total > 0 ? Math.round((retF.n / total) * 100) : 0;

        const diffUnder = retF.underPct - soldF.underPct;
        const diffNokRaw = parseFloat(retF.avgUndersalgNok.replace(/\s/g,'')) - parseFloat(soldF.avgUndersalgNok.replace(/\s/g,''));
        const diffNokStr = diffNokRaw.toLocaleString('nb-NO');

        const commentaryHtml = `
            <h3>Mandagsrapport – uke ${getWeekNumber(lastMonday)}</h3>

            <h4>Solgte biler (${soldF.n} stk)</h4>
            <ul>
                <li>Andel under AR lav: ${soldF.underPct}%</li>
                <li>Gjennomsnittlig undersalg: ${soldF.avgUndersalgNok} NOK (${soldF.avgUndersalgPct}%)</li>
            </ul>

            <h4>Returnerte biler (${retF.n} stk)</h4>
            <ul>
                <li>Andel under AR lav: ${retF.underPct}%</li>
                <li>Gjennomsnittlig undersalg: ${retF.avgUndersalgNok} NOK (${retF.avgUndersalgPct}%)</li>
            </ul>

            <h4>Sammenstilling solgt vs returnert</h4>
            <ul>
                <li>Total returandel: ${returAndel}% (${retF.n} av ${total})</li>
                <li>Forskjell i andel under AR lav: ${diffUnder >= 0 ? '+' : ''}${diffUnder} pp</li>
                <li>Forskjell i gj.sn. undersalg: ${diffNokRaw < 0 ? '' : '+'}${diffNokStr} NOK (returnerte har ${diffNokRaw < 0 ? 'mindre' : 'større'} undersalg)</li>
            </ul>
        `;

        document.getElementById('commentary').innerHTML = commentaryHtml;
        document.getElementById('commentary').style.display = 'block';

        const renderTable = (id, cars) => {
            const table = document.getElementById(id);
            table.innerHTML = '';
            if (cars.length === 0) {
                table.innerHTML = '<tr><td colspan="7" class="no-data">Ingen biler i uken</td></tr>';
                return;
            }

            const thead = document.createElement('thead');
            const tr = document.createElement('tr');
            ['Merke','Modell','År','AR lav','Bud','Diff NOK','Diff %'].forEach(h => {
                const th = document.createElement('th');
                th.textContent = h;
                tr.appendChild(th);
            });
            thead.appendChild(tr);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            cars.forEach(car => {
                const row = document.createElement('tr');
                Object.values(car).forEach((v, i) => {
                    const td = document.createElement('td');
                    td.textContent = v;
                    if (i === 5 || i === 6) {
                        const val = parseFloat(v.toString().replace(/\s/g,'').replace('%','')) || 0;
                        td.className = val < 0 ? 'highlight-negative' : val > 0 ? 'highlight-positive' : 'highlight-zero';
                    }
                    row.appendChild(td);
                });
                tbody.appendChild(row);
            });
            table.appendChild(tbody);

            const tfoot = document.createElement('tfoot');
            const ftr = document.createElement('tr');
            const ftd = document.createElement('td');
            ftd.colSpan = 3;
            ftd.innerHTML = `<strong>Gjennomsnitt (${cars.length} biler)</strong>`;
            ftr.appendChild(ftd);

            const avgAR = cars.length ? Math.round(cars.reduce((s,c) => s + parseFloat(c['AR lav'].replace(/\s/g,'')),0) / cars.length).toLocaleString('nb-NO') : '0';
            const avgBud = cars.length ? Math.round(cars.reduce((s,c) => s + parseFloat(c.Bud.replace(/\s/g,'')),0) / cars.length).toLocaleString('nb-NO') : '0';
            const avgDiffN = cars.length ? Math.round(cars.reduce((s,c) => s + parseFloat(c['Diff NOK'].replace(/\s/g,'')),0) / cars.length).toLocaleString('nb-NO') : '0';
            const avgDiffP = cars.length ? (cars.reduce((s,c) => s + parseFloat(c['Diff %'].replace('%','')),0) / cars.length).toFixed(1) + '%' : '0.0%';

            [avgAR, avgBud, avgDiffN, avgDiffP].forEach(v => {
                const td = document.createElement('td');
                td.textContent = v;
                ftr.appendChild(td);
            });
            tfoot.appendChild(ftr);
            table.appendChild(tfoot);
        };

        renderTable('sold-table', soldCars);
        document.getElementById('sold-section').style.display = 'block';
        renderTable('returned-table', returnedCars);
        document.getElementById('returned-section').style.display = 'block';

        document.getElementById('loading').style.display = 'none';
    } catch (err) {
        document.getElementById('loading').textContent = 'Feil: ' + err.message;
    }
}

window.onload = loadReport;
</script>
</body>
</html>
