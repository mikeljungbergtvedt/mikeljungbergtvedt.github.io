<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mandagsrapport – Peasy</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      margin: 0; padding: 0;
      background: linear-gradient(135deg, #F2F7F9 0%, #E8F0F5 100%);
      color: #004225;
      min-height: 100vh;
    }
    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    h1 {
      font-weight: 900;
      font-size: 2.4rem;
      letter-spacing: -0.7px;
      margin-bottom: 8px;
      background: linear-gradient(to right, #004225, #006644);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    button {
      padding: 10px 20px;
      font-size: 0.98rem;
      font-weight: 600;
      border-radius: 10px;
      border: none;
      background: #004225;
      color: white;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,66,37,0.06);
      transition: all 0.2s ease;
    }
    button:hover {
      box-shadow: 0 3px 10px rgba(0,66,37,0.14);
      transform: translateY(-1px);
    }
    button:disabled {
      background: #aaa;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
      opacity: 0.75;
    }
    button#edit-btn { background: #006644; }
    button.danger { background: #c62828; }
    .commentary {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(130,191,210, 0.10);
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0,66,37,0.05);
      padding: 24px;
      margin-bottom: 40px;
    }
    .user-comment {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid rgba(130,191,210,0.2);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(130,191,210, 0.10);
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0,66,37,0.05);
      margin-bottom: 40px;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid rgba(130,191,210, 0.10);
    }
    th {
      background: rgba(130,191,210,0.05);
      font-weight: 700;
    }
    tfoot td {
      font-weight: 700;
      background: rgba(130,191,210,0.08);
    }
    .highlight-negative { color: #d32f2f; font-weight: 600; }
    .highlight-positive { color: #2e7d32; font-weight: 600; }
    .highlight-zero { color: #555; font-weight: 600; }
    #loading {
      font-style: italic;
      opacity: 0.75;
      text-align: center;
      font-size: 1rem;
      margin: 24px 0;
    }
    .section-title {
      font-size: 1.3rem;
      margin: 32px 0 16px;
      font-weight: 700;
    }
    #report-content { display: none; }
    .timestamp {
      font-size: 0.92rem;
      opacity: 0.8;
      margin-bottom: 16px;
    }
    .no-data {
      text-align: center;
      color: #777;
      font-style: italic;
      margin: 20px 0;
    }
    textarea {
      width: 100%;
      min-height: 180px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(130,191,210,0.3);
      background: white;
      font-family: inherit;
      font-size: 1.05rem;
      line-height: 1.6;
    }
    .logo-container {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo {
      max-width: 220px;
      height: auto;
      display: block;
      margin: 0 auto;
      opacity: 0.92;
      filter: grayscale(0.15) saturate(0.92);
      transition: opacity 0.3s ease;
    }
    .logo:hover { opacity: 1; }
    @media (max-width: 768px) {
      .logo { max-width: 180px; }
      .logo-container { margin-bottom: 20px; }
    }
    #version-info {
      position: fixed;
      bottom: 0.75rem;
      right: 1rem;
      font-size: 0.75rem;
      color: #777;
      opacity: 0.65;
      pointer-events: none;
      z-index: 10;
    }
    #historical-section {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(130,191,210, 0.10);
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0,66,37,0.05);
      padding: 24px;
      margin-bottom: 40px;
    }
    .chart-wrapper {
      position: relative;
      height: 420px;
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
    }
    .chart-wrapper canvas {
      max-height: 420px !important;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="logo-container">
    <img src="Peasy_Logo_ORG.png" alt="Peasy" class="logo">
  </div>
  <h1>Mandagsrapport – Peasy</h1>
  <p style="opacity: 0.8; margin-bottom: 32px;">Rapporter lagres i skyen – synlig for alle som åpner denne filen.</p>
  <div class="controls">
    <select id="weekSelect" onchange="loadSavedReport()">
      <option value="">Velg uke...</option>
    </select>
    <button id="generate-btn" onclick="generateNewReport()">Generer rapport for forrige fullførte uke</button>
    <button id="edit-btn" onclick="editUserComment()" style="display:none;">Rediger egen kommentar</button>
    <button id="lock-btn" onclick="showLockCommentModal()" style="display:none;">Lås inn rapport</button>
    <button id="delete-btn" onclick="showDeleteConfirm()" style="display:none; background:#c62828;">Slett rapport</button>
  </div>
  <div id="loading" style="display:none;">Laster...</div>
  <div id="report-content" style="display:none;">
    <div id="timestamp" class="timestamp"></div>
    <div id="commentary" class="commentary"></div>
    <div id="sold-section">
      <div class="section-title">Solgte biler</div>
      <table id="sold-table"></table>
    </div>
    <div id="returned-section">
      <div class="section-title">Returnerte biler</div>
      <table id="returned-table"></table>
    </div>
  </div>
  <!-- Historical trend -->
  <div id="historical-section" style="display:none;">
    <div class="section-title">Historisk trend – gjennomsnittlig diff % (Høyeste bud vs AR laveste estimat)</div>
    <div class="chart-wrapper">
      <canvas id="trend-chart"></canvas>
    </div>
  </div>
  <div id="version-info">
    v18 • Høyeste bud fix • 09.02.2026
  </div>

  <!-- Modals unchanged -->

</div>

  Returnert: headers.findIndex(h => h?.includes('Returnert'))

</body>
</html>
