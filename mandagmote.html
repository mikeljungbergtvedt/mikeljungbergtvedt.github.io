<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mandagsrapport – Peasy v12 (JSONBin shared)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 0; background: linear-gradient(135deg, #F2F7F9 0%, #E8F0F5 100%); color: #004225; min-height: 100vh; }
        .container { max-width: 1440px; margin: 0 auto; padding: 40px 24px; }
        h1 { font-weight: 900; font-size: 2.4rem; letter-spacing: -0.7px; margin-bottom: 8px; background: linear-gradient(to right, #004225, #006644); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: inline-block; }
        .version { font-size: 1.4rem; font-weight: 700; color: #006644; margin-left: 16px; vertical-align: super; }
        .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
        button { padding: 10px 20px; font-size: 0.98rem; font-weight: 600; border-radius: 10px; border: none; background: #004225; color: white; cursor: pointer; box-shadow: 0 1px 4px rgba(0,66,37,0.06); transition: all 0.2s ease; }
        button:hover { box-shadow: 0 3px 10px rgba(0,66,37,0.14); transform: translateY(-1px); }
        button:disabled { background: #aaa; cursor: not-allowed; transform: none; box-shadow: none; opacity: 0.75; }
        button#edit-btn { background: #006644; }
        button.danger { background: #c62828; }
        .commentary { background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(24px); border: 1px solid rgba(130,191,210, 0.10); border-radius: 14px; box-shadow: 0 6px 20px rgba(0,66,37,0.05); padding: 24px; margin-bottom: 40px; }
        table { width: 100%; border-collapse: collapse; background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(24px); border: 1px solid rgba(130,191,210, 0.10); border-radius: 14px; box-shadow: 0 6px 20px rgba(0,66,37,0.05); margin-bottom: 40px; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid rgba(130,191,210, 0.10); }
        th { background: rgba(130,191,210,0.05); font-weight: 700; }
        tfoot td { font-weight: 700; background: rgba(130,191,210,0.08); }
        .highlight-negative { color: #d32f2f; font-weight: 600; }
        .highlight-positive { color: #2e7d32; font-weight: 600; }
        .highlight-zero { color: #555; font-weight: 600; }
        #loading { font-style: italic; opacity: 0.75; text-align: center; font-size: 1rem; margin: 24px 0; }
        .section-title { font-size: 1.3rem; margin: 32px 0 16px; font-weight: 700; }
        #report-content { display: none; }
        .timestamp { font-size: 0.92rem; opacity: 0.8; margin-bottom: 16px; }
        .no-data { text-align: center; color: #777; font-style: italic; margin: 20px 0; }
        textarea { width: 100%; min-height: 120px; padding: 12px; border-radius: 8px; border: 1px solid rgba(130,191,210,0.3); background: white; font-family: inherit; font-size: 1rem; }
        #save-edits, #lock-comment-save { margin-top: 12px; background: #2e7d32; }
        #lock-comment-modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; 
        }
        #lock-comment-box { 
            background: white; padding: 32px; border-radius: 16px; width: 90%; max-width: 600px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
        }
        #delete-modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; 
        }
        #delete-confirm-box { 
            background: white; padding: 32px; border-radius: 16px; text-align: center; 
            max-width: 400px; 
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Mandagsrapport – Peasy<span class="version">v12 (sky-delt)</span></h1>
    <p style="opacity: 0.8; margin-bottom: 32px;">Rapporter lagres i skyen – synlig for alle som åpner denne filen.</p>
   
    <div class="controls">
        <select id="weekSelect" onchange="loadSavedReport()">
            <option value="">Velg uke...</option>
        </select>
        <button id="generate-btn" onclick="generateNewReport()">Generer rapport for forrige fullførte uke</button>
        <button id="edit-btn" onclick="editReport()" style="display:none;">Rediger rapport</button>
        <button id="save-edits" onclick="saveEdits()" style="display:none;">Lagre endringer</button>
        <button id="lock-btn" onclick="showLockCommentModal()" style="display:none;">Lås inn rapport</button>
        <button id="delete-btn" onclick="showDeleteConfirm()" style="display:none; background:#c62828;">Slett rapport</button>
    </div>
   
    <div id="loading" style="display:none;">Laster...</div>
   
    <div id="report-content" style="display:none;">
        <div id="timestamp" class="timestamp"></div>
        <div id="commentary" class="commentary"></div>
        <div id="sold-section"><div class="section-title">Solgte biler</div><table id="sold-table"></table></div>
        <div id="returned-section"><div class="section-title">Returnerte biler</div><table id="returned-table"></table></div>
    </div>

    <!-- Lock comment modal -->
    <div id="lock-comment-modal">
        <div id="lock-comment-box">
            <h3>Kommentar før låsing (valgfritt)</h3>
            <textarea id="lock-comment-text" placeholder="Skriv en kommentar eller begrunnelse..."></textarea>
            <div style="margin-top:16px;">
                <button id="lock-comment-save" onclick="confirmLockWithComment()">Lås inn</button>
                <button onclick="closeLockModal()" style="margin-left:16px;background:#757575;">Avbryt</button>
            </div>
        </div>
    </div>

    <!-- Delete confirmation -->
    <div id="delete-modal">
        <div id="delete-confirm-box">
            <h3>Sikker på sletting?</h3>
            <p>Rapporten blir borte for alle brukere.</p>
            <div style="margin-top:20px;">
                <button onclick="promptPasswordForDelete()" style="background:#c62828;">Ja, slett</button>
                <button onclick="closeDeleteModal()" style="margin-left:16px;background:#757575;">Nei</button>
            </div>
        </div>
    </div>

    <!-- Password prompt -->
    <div id="password-prompt" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:32px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.3);z-index:1100;text-align:center;">
        <h3>Passord kreves</h3>
        <input type="password" id="password-input" placeholder="Passord" style="padding:12px;font-size:1.1rem;width:220px;margin:16px 0;">
        <br>
        <button onclick="checkDeletePassword()">Bekreft</button>
        <button onclick="closePasswordPrompt()" style="margin-left:16px;background:#757575;">Avbryt</button>
    </div>
</div>

<script>
// ────────────────────────────────────────────────
// Dine nøkler – allerede satt inn
// ────────────────────────────────────────────────
const BIN_ID = '6981aa3dae596e708f0d773b';
const MASTER_KEY = '$2a$10$rBlUQ2a25wMoTJmNRu9hkuX5aB/DVZh9EhrM75Ek1nUAdvvILtuy.';
const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
const HEADERS = { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY };

let currentReport = null;
let currentCreatedTime = '';

// Hent alle rapporter fra bin (ingen key nødvendig for lesing på public bin)
async function fetchReports() {
    try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error(`Kunne ikke lese bin: ${res.status}`);
        const json = await res.json();
        return json.record.reports || [];
    } catch (err) {
        console.error('Feil ved henting fra bin:', err);
        alert('Kunne ikke laste rapporter fra skyen. Sjekk internett eller bin-innstillinger.');
        return [];
    }
}

// Lagre alle rapporter til bin
async function saveReports(reports) {
    try {
        const res = await fetch(API_URL, {
            method: 'PUT',
            headers: HEADERS,
            body: JSON.stringify({ reports })
        });
        if (!res.ok) throw new Error(`Kunne ikke lagre: ${res.status} - ${await res.text()}`);
    } catch (err) {
        console.error('Feil ved lagring til bin:', err);
        alert('Kunne ikke lagre rapporten til skyen. Prøv igjen.');
    }
}

function cleanNum(str) {
    if (!str) return 0;
    return parseFloat((str + '').replace(/\s/g,'').replace(/\u00A0/g,'').replace(/\u2212/g,'-').replace(/[^0-9.-]/g,'')) || 0;
}

function getISOWeek(date) {
    const d = new Date(date);
    d.setHours(0,0,0,0);
    d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
    const yearStart = new Date(d.getFullYear(),0,1);
    const days = Math.floor((d - yearStart) / 86400000);
    return Math.ceil((days + 1) / 7);
}

function getMostRecentCompletedWeekStart() {
    const today = new Date();
    const dayOfWeek = today.getDay() || 7;
    let daysBack = dayOfWeek === 1 ? 8 : dayOfWeek;
    const endPrev = new Date(today);
    endPrev.setDate(today.getDate() - daysBack);
    endPrev.setHours(0,0,0,0);
    const startPrev = new Date(endPrev);
    startPrev.setDate(endPrev.getDate() - 6);
    startPrev.setHours(0,0,0,0);
    return startPrev;
}

function getMostRecentCompletedWeekNum() {
    return getISOWeek(getMostRecentCompletedWeekStart());
}

window.onload = async () => {
    const saved = await fetchReports();
    const select = document.getElementById('weekSelect');
    select.innerHTML = '<option value="">Velg uke...</option>';
    saved.forEach(r => {
        const opt = document.createElement('option');
        opt.value = r.id;
        opt.textContent = r.title;
        select.appendChild(opt);
    });
    if (saved.length > 0) {
        select.value = saved[saved.length - 1].id;
        await loadSavedReport();
    }
    updateGenerateButton();
};

async function loadSavedReport() {
    const id = document.getElementById('weekSelect').value;
    if (!id) {
        document.getElementById('report-content').style.display = 'none';
        ['edit-btn','lock-btn','save-edits','delete-btn'].forEach(id => document.getElementById(id).style.display = 'none');
        updateGenerateButton();
        return;
    }
    const saved = await fetchReports();
    const report = saved.find(r => r.id === id);
    if (!report) return;

    currentReport = report;
    currentCreatedTime = report.created;

    document.getElementById('report-content').style.display = 'block';
    const locked = report.locked === true;
    document.getElementById('edit-btn').style.display = locked ? 'none' : 'block';
    document.getElementById('lock-btn').style.display = locked ? 'none' : 'block';
    document.getElementById('save-edits').style.display = 'none';
    document.getElementById('delete-btn').style.display = locked ? 'inline-block' : 'none';

    const edited = report.edited ? `Sist endret: ${report.edited}` : 'Sist endret: -';
    document.getElementById('timestamp').textContent = `Opprettet: ${report.created}. ${edited}`;
    document.getElementById('commentary').innerHTML = report.commentary || '<p>Ingen ekstra kommentar.</p>';
    document.getElementById('sold-table').innerHTML = report.soldTable || '';
    document.getElementById('returned-table').innerHTML = report.returnedTable || '';
    document.getElementById('sold-section').style.display = report.soldTable ? 'block' : 'none';
    document.getElementById('returned-section').style.display = report.returnedTable ? 'block' : 'none';

    updateGenerateButton();
}

function updateGenerateButton() {
    const btn = document.getElementById('generate-btn');
    const prevWeekNum = getMostRecentCompletedWeekNum();
    fetchReports().then(saved => {
        const alreadyLocked = saved.some(r => r.title.includes(`uke ${prevWeekNum}`) && r.locked);
        const selectedLocked = saved.some(r => r.id === document.getElementById('weekSelect').value && r.locked);

        if (alreadyLocked) {
            btn.disabled = true;
            btn.textContent = `Uke ${prevWeekNum} allerede låst`;
        } else if (selectedLocked) {
            btn.disabled = true;
            btn.textContent = 'Valgt rapport er låst';
        } else {
            btn.disabled = false;
            btn.textContent = 'Generer rapport for forrige fullførte uke';
        }
    });
}

async function generateNewReport() {
    if (document.getElementById('generate-btn').disabled) return;

    const url = 'https://api.biladministrasjon.no/public/reports/peasy/dhqui7Hkl54?output=xlsx';
    document.getElementById('loading').textContent = 'Genererer ny rapport...';
    document.getElementById('loading').style.display = 'block';
    document.getElementById('report-content').style.display = 'none';

    try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const ab = await res.arrayBuffer();
        const wb = XLSX.read(ab, {type: 'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const data = XLSX.utils.sheet_to_json(ws, {header: 1, defval: ''});

        const headers = data[0].map(h => (h || '').trim());
        const col = {
            Merke: headers.indexOf('Merke'),
            Modell: headers.indexOf('Modell'),
            År: headers.indexOf('År'),
            'Endelig AR verdi': headers.findIndex(h => h && h.includes('Endelig AR verdi')),
            Bud: headers.indexOf('Bud'),
            'Solgt på': headers.indexOf('Solgt på'),
            Returnert: headers.findIndex(h => h && h.includes('Returnert'))
        };

        const startDate = getMostRecentCompletedWeekStart();
        const endDate = new Date(startDate);
        endDate.setDate(startDate.getDate() + 7);
        endDate.setHours(0,0,0,0);

        const weekNum = getISOWeek(startDate);
        const title = `Mandag ${startDate.toLocaleDateString('nb-NO')} – uke ${weekNum}`;
        const nowStr = new Date().toLocaleString('nb-NO', {dateStyle: 'short', timeStyle: 'short'});

        const saved = await fetchReports();
        if (saved.some(r => r.title === title && r.locked)) {
            alert('Rapport for denne uken finnes allerede og er låst!');
            return;
        }

        const soldCars = [];
        const returnedCars = [];

        for (let i = 1; i < data.length; i++) {
            const row = data[i];
            const parseDate = str => {
                if (!str) return null;
                const m = str.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
                return m ? new Date(m[3], m[2]-1, m[1]) : null;
            };
            const soldDate = parseDate(row[col['Solgt på']]);
            const retDate = parseDate(row[col.Returnert]);

            const arRange = row[col['Endelig AR verdi']] || '';
            let arLowest = 0;
            if (arRange.includes('-')) {
                const [low] = arRange.split('-').map(n => parseFloat(n.trim()) || 0);
                arLowest = low;
            } else {
                arLowest = parseFloat(arRange) || 0;
            }

            const bud = parseFloat(row[col.Bud] || 0);
            const diffNok = bud - arLowest;
            const diffPct = arLowest ? ((diffNok / arLowest) * 100).toFixed(1) : '0.0';

            const car = {
                Merke: row[col.Merke] || '-',
                Modell: row[col.Modell] || '-',
                År: row[col.År] || '-',
                'AR laveste estimat': arLowest.toLocaleString('nb-NO'),
                Bud: bud.toLocaleString('nb-NO'),
                'Diff NOK': diffNok.toLocaleString('nb-NO'),
                'Diff %': diffPct + '%'
            };

            if (soldDate && soldDate >= startDate && soldDate < endDate) soldCars.push(car);
            if (retDate && retDate >= startDate && retDate < endDate) returnedCars.push(car);
        }

        const facts = cars => {
            const n = cars.length;
            if (!n) return {n:0, under:0, over:0, on:0, avgNok:'0', avgPct:'0.0'};
            let u=0,o=0,z=0, sumN=0, sumP=0;
            cars.forEach(c => {
                const nok = cleanNum(c['Diff NOK']);
                if (nok < 0) u++; else if (nok > 0) o++; else z++;
                sumN += nok;
                sumP += cleanNum(c['Diff %']);
            });
            return { n, under:u, over:o, on:z, avgNok: Math.round(sumN/n).toLocaleString('nb-NO'), avgPct: (sumP/n).toFixed(1) };
        };

        const soldF = facts(soldCars);
        const retF = facts(returnedCars);

        const commentaryHtml = `
            <h3>Fakta – forrige fullførte uke (man-søn)</h3>
            <ul>
                <li><strong>Solgt:</strong> ${soldF.n} biler</li>
                <li>Under laveste estimat: ${soldF.under}</li>
                <li>Over laveste estimat: ${soldF.over}</li>
                <li>På laveste estimat: ${soldF.on}</li>
                <li>Gj.sn. diff: ${soldF.avgNok} NOK (${soldF.avgPct}%)</li>
                <li><strong>Returnert:</strong> ${retF.n} biler</li>
                <li>Gj.sn. diff returnert: ${retF.avgNok} NOK (${retF.avgPct}%)</li>
            </ul>
        `;

        const renderTable = (id, cars) => {
            const table = document.getElementById(id);
            table.innerHTML = '';
            if (!cars.length) {
                table.innerHTML = '<tr><td colspan="7" class="no-data">Ingen biler</td></tr>';
                return;
            }
            const thead = document.createElement('thead');
            const tr = document.createElement('tr');
            ['Merke','Modell','År','AR laveste estimat','Bud','Diff NOK','Diff %'].forEach(h => {
                const th = document.createElement('th');
                th.textContent = h;
                tr.appendChild(th);
            });
            thead.appendChild(tr);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            cars.forEach(car => {
                const row = document.createElement('tr');
                Object.values(car).forEach((val, i) => {
                    const td = document.createElement('td');
                    td.textContent = val;
                    if (i >= 5) {
                        const num = cleanNum(val);
                        td.className = num < 0 ? 'highlight-negative' : num > 0 ? 'highlight-positive' : 'highlight-zero';
                    }
                    row.appendChild(td);
                });
                tbody.appendChild(row);
            });
            table.appendChild(tbody);

            const tfoot = document.createElement('tfoot');
            const ftr = document.createElement('tr');
            const ftd = document.createElement('td');
            ftd.colSpan = 3;
            ftd.innerHTML = `<strong>Gjennomsnitt (${cars.length} biler)</strong>`;
            ftr.appendChild(ftd);

            const avgs = [
                cars.length ? Math.round(cars.reduce((s,c) => s + cleanNum(c['AR laveste estimat']),0)/cars.length).toLocaleString('nb-NO') : '0',
                cars.length ? Math.round(cars.reduce((s,c) => s + cleanNum(c.Bud),0)/cars.length).toLocaleString('nb-NO') : '0',
                cars.length ? Math.round(cars.reduce((s,c) => s + cleanNum(c['Diff NOK']),0)/cars.length).toLocaleString('nb-NO') : '0',
                cars.length ? (cars.reduce((s,c) => s + cleanNum(c['Diff %']),0)/cars.length).toFixed(1)+' %' : '0.0 %'
            ];
            avgs.forEach(v => {
                const td = document.createElement('td');
                td.textContent = v;
                ftr.appendChild(td);
            });
            tfoot.appendChild(ftr);
            table.appendChild(tfoot);
        };

        document.getElementById('timestamp').textContent = `Opprettet: ${nowStr}. Sist endret: -`;
        currentCreatedTime = nowStr;
        document.getElementById('commentary').innerHTML = commentaryHtml;
        renderTable('sold-table', soldCars);
        renderTable('returned-table', returnedCars);

        document.getElementById('report-content').style.display = 'block';
        document.getElementById('edit-btn').style.display = 'block';
        document.getElementById('lock-btn').style.display = 'block';

        currentReport = {
            commentary: commentaryHtml,
            soldTable: document.getElementById('sold-table').outerHTML,
            returnedTable: document.getElementById('returned-table').outerHTML,
            created: nowStr,
            title,
            locked: false,
            lockComment: ''
        };

        document.getElementById('weekSelect').value = '';
        updateGenerateButton();

    } catch (err) {
        document.getElementById('loading').textContent = 'Feil: ' + err.message;
    } finally {
        document.getElementById('loading').style.display = 'none';
    }
}

function editReport() {
    const div = document.getElementById('commentary');
    const ta = document.createElement('textarea');
    ta.value = div.innerHTML.trim();
    div.innerHTML = '';
    div.appendChild(ta);
    document.getElementById('edit-btn').style.display = 'none';
    document.getElementById('save-edits').style.display = 'block';
}

function saveEdits() {
    const ta = document.querySelector('#commentary textarea');
    const newHtml = ta.value;
    document.getElementById('commentary').innerHTML = newHtml;
    document.getElementById('edit-btn').style.display = 'block';
    document.getElementById('save-edits').style.display = 'none';

    const nowStr = new Date().toLocaleString('nb-NO', {dateStyle: 'short', timeStyle: 'short'});
    document.getElementById('timestamp').textContent = `Opprettet: ${currentCreatedTime}. Sist endret: ${nowStr}`;

    currentReport.commentary = newHtml;
    currentReport.edited = nowStr;

    // Save edit back to bin
    fetchReports().then(saved => {
        const index = saved.findIndex(r => r.id === currentReport.id);
        if (index !== -1) {
            saved[index] = currentReport;
            saveReports(saved);
        }
    });
}

function showLockCommentModal() {
    document.getElementById('lock-comment-modal').style.display = 'flex';
    document.getElementById('lock-comment-text').value = currentReport.lockComment || '';
}

function closeLockModal() {
    document.getElementById('lock-comment-modal').style.display = 'none';
}

async function confirmLockWithComment() {
    const comment = document.getElementById('lock-comment-text').value.trim();
    currentReport.lockComment = comment;
    closeLockModal();

    let saved = await fetchReports();
    currentReport.id = 'uke' + (saved.length + 1);
    currentReport.edited = currentReport.edited || new Date().toLocaleString('nb-NO', {dateStyle:'short', timeStyle:'short'});
    currentReport.locked = true;
    saved.push(currentReport);

    await saveReports(saved);

    alert('Rapport låst og lagret i skyen som ' + currentReport.id + (comment ? ' med kommentar' : ''));

    // Reload dropdown
    const select = document.getElementById('weekSelect');
    select.innerHTML = '<option value="">Velg uke...</option>';
    saved.forEach(r => {
        const opt = document.createElement('option');
        opt.value = r.id;
        opt.textContent = r.title;
        select.appendChild(opt);
    });
    select.value = currentReport.id;
    await loadSavedReport();
}

function showDeleteConfirm() {
    document.getElementById('delete-modal').style.display = 'flex';
}

function closeDeleteModal() {
    document.getElementById('delete-modal').style.display = 'none';
}

function promptPasswordForDelete() {
    closeDeleteModal();
    const password = prompt('Skriv inn passord for å slette (peasy):');
    if (password === PASSWORD) {
        fetchReports().then(saved => {
            const filtered = saved.filter(r => r.id !== currentReport.id);
            saveReports(filtered).then(() => {
                alert('Rapport slettet fra skyen.');
                loadReportsToSelect();
                document.getElementById('report-content').style.display = 'none';
                document.getElementById('delete-btn').style.display = 'none';
                updateGenerateButton();
            });
        });
    } else if (password !== null) {
        alert('Feil passord.');
    }
}

document.getElementById('weekSelect').addEventListener('change', loadSavedReport);
</script>
</body>
</html>
