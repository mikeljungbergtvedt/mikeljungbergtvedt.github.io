<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mandagsrapport – Peasy v14 (bin fix)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 0; background: linear-gradient(135deg, #F2F7F9 0%, #E8F0F5 100%); color: #004225; min-height: 100vh; }
        .container { max-width: 1440px; margin: 0 auto; padding: 40px 24px; }
        h1 { font-weight: 900; font-size: 2.25rem; letter-spacing: -0.6px; margin-bottom: 12px; background: linear-gradient(to right, #004225, #006644); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .version { font-size: 1.2rem; color: #006644; margin-left: 12px; }
        .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
        button { padding: 10px 20px; font-size: 0.95rem; font-weight: 600; border-radius: 10px; border: none; background: #004225; color: white; cursor: pointer; }
        button:hover { background: #005533; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        button.danger { background: #c62828; }
        button.danger:hover { background: #b71c1c; }
        .commentary, table { background: rgba(255,255,255,0.9); border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
        th, td { padding: 10px; border-bottom: 1px solid #eee; }
        th { background: #f5f5f5; }
        .highlight-negative { color: #c62828; font-weight: bold; }
        .highlight-positive { color: #2e7d32; font-weight: bold; }
        .highlight-zero { color: #555; }
        #loading { text-align: center; padding: 20px; font-style: italic; }
        #report-content { display: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>Mandagsrapport <span class="version">v14</span></h1>
    <p>Rapporter lagres i din JSONBin – synlig for alle.</p>

    <div class="controls">
        <select id="weekSelect" onchange="loadSavedReport()">
            <option value="">Velg uke...</option>
        </select>
        <button id="generate-btn" onclick="generateNewReport()">Generer forrige uke</button>
        <button id="edit-btn" onclick="editReport()" style="display:none;">Rediger</button>
        <button id="save-edits" onclick="saveEdits()" style="display:none;">Lagre endringer</button>
        <button id="lock-btn" onclick="showLockCommentModal()" style="display:none;">Lås inn</button>
        <button id="delete-btn" onclick="showDeleteConfirm()" style="display:none;background:#c62828;color:white;">Slett</button>
    </div>

    <div id="loading">Laster...</div>

    <div id="report-content">
        <div id="timestamp"></div>
        <div id="commentary"></div>
        <div id="sold-section"><h3>Solgte biler</h3><table id="sold-table"></table></div>
        <div id="returned-section"><h3>Returnerte biler</h3><table id="returned-table"></table></div>
    </div>

    <!-- Lock comment modal -->
    <div id="lock-comment-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:1000;justify-content:center;align-items:center;">
        <div style="background:white;padding:24px;border-radius:12px;max-width:500px;width:90%;">
            <h3>Kommentar før låsing (valgfritt)</h3>
            <textarea id="lock-comment-text" style="width:100%;height:100px;"></textarea>
            <div style="margin-top:16px;text-align:right;">
                <button onclick="document.getElementById('lock-comment-modal').style.display='none'">Avbryt</button>
                <button onclick="confirmLockWithComment()" style="margin-left:12px;background:#006644;color:white;">Lås inn</button>
            </div>
        </div>
    </div>

    <!-- Delete confirm -->
    <div id="delete-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:1000;justify-content:center;align-items:center;">
        <div style="background:white;padding:24px;border-radius:12px;text-align:center;max-width:400px;">
            <h3>Slette rapport?</h3>
            <p>Dette fjerner den for alle.</p>
            <div style="margin-top:16px;">
                <button onclick="document.getElementById('delete-modal').style.display='none'">Nei</button>
                <button onclick="deleteReport()" style="margin-left:12px;background:#c62828;color:white;">Ja, slett</button>
            </div>
        </div>
    </div>
</div>

<script>
// ────────────────────────────────────────────────
// Dine nøkler
// ────────────────────────────────────────────────
const BIN_ID = '6981aa3dae596e708f0d773b';
const MASTER_KEY = '$2a$10$rBlUQ2a25wMoTJmNRu9hkuX5aB/DVZh9EhrM75Ek1nUAdvvILtuy.';
const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
const HEADERS_WRITE = { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY };

// Hent rapporter
async function fetchReports() {
    try {
        const res = await fetch(API_URL);
        if (!res.ok) {
            console.error('Read failed:', res.status, await res.text());
            return [];
        }
        const json = await res.json();
        return json.record.reports || [];
    } catch (err) {
        console.error('Fetch error:', err);
        return [];
    }
}

// Lagre rapporter
async function saveReports(reports) {
    try {
        const res = await fetch(API_URL, {
            method: 'PUT',
            headers: HEADERS_WRITE,
            body: JSON.stringify({ reports })
        });
        if (!res.ok) {
            const errText = await res.text();
            console.error('Save failed:', res.status, errText);
            alert('Lagring til bin feilet: ' + errText);
            return false;
        }
        return true;
    } catch (err) {
        console.error('Save error:', err);
        alert('Lagring feilet – sjekk konsoll.');
        return false;
    }
}

let currentReport = null;
let currentCreatedTime = '';

window.onload = async () => {
    await loadDropdown();
    updateGenerateButton();
};

async function loadDropdown() {
    const saved = await fetchReports();
    const select = document.getElementById('weekSelect');
    select.innerHTML = '<option value="">Velg uke...</option>';
    saved.forEach(r => {
        const opt = document.createElement('option');
        opt.value = r.id;
        opt.textContent = r.title;
        select.appendChild(opt);
    });
    if (saved.length > 0) {
        select.value = saved[saved.length - 1].id;
        await loadSavedReport();
    }
}

async function loadSavedReport() {
    const id = document.getElementById('weekSelect').value;
    if (!id) {
        document.getElementById('report-content').style.display = 'none';
        ['edit-btn','lock-btn','save-edits','delete-btn'].forEach(el => document.getElementById(el).style.display = 'none');
        updateGenerateButton();
        return;
    }

    const saved = await fetchReports();
    const report = saved.find(r => r.id === id);
    if (!report) return;

    currentReport = report;
    currentCreatedTime = report.created;

    document.getElementById('report-content').style.display = 'block';
    const locked = report.locked === true;
    document.getElementById('edit-btn').style.display = locked ? 'none' : 'block';
    document.getElementById('lock-btn').style.display = locked ? 'none' : 'block';
    document.getElementById('save-edits').style.display = 'none';
    document.getElementById('delete-btn').style.display = locked ? 'block' : 'none';

    const edited = report.edited ? `Sist endret: ${report.edited}` : 'Sist endret: -';
    document.getElementById('timestamp').textContent = `Opprettet: ${report.created}. ${edited}`;
    document.getElementById('commentary').innerHTML = report.commentary || '<p>Ingen kommentar</p>';

    renderTable('sold-table', report.soldCars || []);
    renderTable('returned-table', report.returnedCars || []);
    document.getElementById('sold-section').style.display = report.soldCars?.length ? 'block' : 'none';
    document.getElementById('returned-section').style.display = report.returnedCars?.length ? 'block' : 'none';

    updateGenerateButton();
}

function renderTable(id, cars) {
    const table = document.getElementById(id);
    table.innerHTML = '';
    if (!cars.length) {
        table.innerHTML = '<tr><td colspan="7" class="no-data">Ingen biler</td></tr>';
        return;
    }

    const thead = document.createElement('thead');
    const tr = document.createElement('tr');
    ['Merke','Modell','År','AR laveste estimat','Bud','Diff NOK','Diff %'].forEach(h => {
        const th = document.createElement('th');
        th.textContent = h;
        tr.appendChild(th);
    });
    thead.appendChild(tr);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    cars.forEach(car => {
        const row = document.createElement('tr');
        ['Merke','Modell','År','AR laveste estimat','Bud','Diff NOK','Diff %'].forEach(key => {
            const td = document.createElement('td');
            td.textContent = car[key] || '-';
            if (key === 'Diff NOK' || key === 'Diff %') {
                const val = cleanNum(car[key]);
                td.className = val < 0 ? 'highlight-negative' : val > 0 ? 'highlight-positive' : 'highlight-zero';
            }
            row.appendChild(td);
        });
        tbody.appendChild(row);
    });
    table.appendChild(tbody);

    const tfoot = document.createElement('tfoot');
    const ftr = document.createElement('tr');
    const ftd = document.createElement('td');
    ftd.colSpan = 3;
    ftd.innerHTML = `<strong>Gjennomsnitt (${cars.length} biler)</strong>`;
    ftr.appendChild(ftd);

    const avgs = [
        cars.length ? Math.round(cars.reduce((s,c) => s + cleanNum(c['AR laveste estimat']),0)/cars.length).toLocaleString('nb-NO') : '0',
        cars.length ? Math.round(cars.reduce((s,c) => s + cleanNum(c.Bud),0)/cars.length).toLocaleString('nb-NO') : '0',
        cars.length ? Math.round(cars.reduce((s,c) => s + cleanNum(c['Diff NOK']),0)/cars.length).toLocaleString('nb-NO') : '0',
        cars.length ? (cars.reduce((s,c) => s + cleanNum(c['Diff %']),0)/cars.length).toFixed(1) + '%' : '0.0%'
    ];
    avgs.forEach(v => {
        const td = document.createElement('td');
        td.textContent = v;
        ftr.appendChild(td);
    });
    tfoot.appendChild(ftr);
    table.appendChild(tfoot);
}

async function generateNewReport() {
    if (document.getElementById('generate-btn').disabled) return;

    // ... (all the fetch, processing, soldCars, returnedCars building code – same as your original)

    // After building soldCars and returnedCars:

    const commentaryHtml = /* your facts HTML */;

    document.getElementById('timestamp').textContent = `Opprettet: ${nowStr}. Sist endret: -`;
    document.getElementById('commentary').innerHTML = commentaryHtml;
    renderTable('sold-table', soldCars);
    renderTable('returned-table', returnedCars);

    document.getElementById('report-content').style.display = 'block';
    document.getElementById('edit-btn').style.display = 'block';
    document.getElementById('lock-btn').style.display = 'block';

    currentReport = {
        commentary: commentaryHtml,
        soldCars: soldCars,       // ← raw array
        returnedCars: returnedCars, // ← raw array
        created: nowStr,
        title,
        locked: false,
        lockComment: ''
    };

    document.getElementById('weekSelect').value = '';
    updateGenerateButton();
}

async function confirmLockWithComment() {
    const comment = document.getElementById('lock-comment-text').value.trim();
    currentReport.lockComment = comment;
    document.getElementById('lock-comment-modal').style.display = 'none';

    let saved = await fetchReports();
    currentReport.id = 'uke' + (saved.length + 1);
    currentReport.edited = new Date().toLocaleString('nb-NO', {dateStyle:'short', timeStyle:'short'});
    currentReport.locked = true;
    saved.push(currentReport);

    await saveReports(saved);

    alert('Rapport låst i bin som ' + currentReport.id);
    await loadDropdown();
    document.getElementById('weekSelect').value = currentReport.id;
    await loadSavedReport();
}

async function saveEdits() {
    const newHtml = document.querySelector('#commentary textarea').value;
    document.getElementById('commentary').innerHTML = newHtml;
    document.getElementById('edit-btn').style.display = 'block';
    document.getElementById('save-edits').style.display = 'none';

    const nowStr = new Date().toLocaleString('nb-NO', {dateStyle:'short', timeStyle:'short'});
    document.getElementById('timestamp').textContent = `Opprettet: ${currentCreatedTime}. Sist endret: ${nowStr}`;

    currentReport.commentary = newHtml;
    currentReport.edited = nowStr;

    let saved = await fetchReports();
    const index = saved.findIndex(r => r.id === currentReport.id);
    if (index !== -1) {
        saved[index] = currentReport;
        await saveReports(saved);
    }
}

function showDeleteConfirm() {
    document.getElementById('delete-modal').style.display = 'flex';
}

function closeDeleteModal() {
    document.getElementById('delete-modal').style.display = 'none';
}

function promptPasswordForDelete() {
    closeDeleteModal();
    const pw = prompt('Passord (peasy):');
    if (pw === 'peasy') {
        fetchReports().then(saved => {
            const filtered = saved.filter(r => r.id !== currentReport.id);
            saveReports(filtered).then(() => {
                alert('Slettet fra bin.');
                loadDropdown();
                document.getElementById('report-content').style.display = 'none';
                document.getElementById('delete-btn').style.display = 'none';
            });
        });
    } else if (pw !== null) {
        alert('Feil passord.');
    }
}
</script>
</body>
</html>
