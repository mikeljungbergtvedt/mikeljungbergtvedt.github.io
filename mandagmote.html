<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mandagsrapport – Peasy v15 (uten bud/diff)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 0; background: linear-gradient(135deg, #F2F7F9 0%, #E8F0F5 100%); color: #004225; min-height: 100vh; }
    .container { max-width: 1440px; margin: 0 auto; padding: 40px 24px; }
    h1 { font-weight: 900; font-size: 2.4rem; letter-spacing: -0.7px; margin-bottom: 8px; background: linear-gradient(to right, #004225, #006644); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: inline-block; }
    .version { font-size: 1.4rem; font-weight: 700; color: #006644; margin-left: 16px; vertical-align: super; }
    .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    button { padding: 10px 20px; font-size: 0.98rem; font-weight: 600; border-radius: 10px; border: none; background: #004225; color: white; cursor: pointer; box-shadow: 0 1px 4px rgba(0,66,37,0.06); transition: all 0.2s ease; }
    button:hover { box-shadow: 0 3px 10px rgba(0,66,37,0.14); transform: translateY(-1px); }
    button:disabled { background: #aaa; cursor: not-allowed; transform: none; box-shadow: none; opacity: 0.75; }
    button#edit-btn { background: #006644; }
    button.danger { background: #c62828; }
    .commentary { background: rgba(255,255,255,0.88); backdrop-filter: blur(24px); border: 1px solid rgba(130,191,210,0.10); border-radius: 14px; box-shadow: 0 6px 20px rgba(0,66,37,0.05); padding: 24px; margin-bottom: 40px; }
    table { width: 100%; border-collapse: collapse; background: rgba(255,255,255,0.88); backdrop-filter: blur(24px); border: 1px solid rgba(130,191,210,0.10); border-radius: 14px; box-shadow: 0 6px 20px rgba(0,66,37,0.05); margin-bottom: 40px; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid rgba(130,191,210,0.10); }
    th { background: rgba(130,191,210,0.05); font-weight: 700; }
    tfoot td { font-weight: 700; background: rgba(130,191,210,0.08); }
    .positive { color: #2e7d32; font-weight: 500; }
    .negative { color: #c62828; font-weight: 500; }
    #loading { font-style: italic; opacity: 0.75; text-align: center; font-size: 1rem; margin: 24px 0; }
    .section-title { font-size: 1.3rem; margin: 32px 0 16px; font-weight: 700; }
    #report-content { display: none; }
    .timestamp { font-size: 0.92rem; opacity: 0.8; margin-bottom: 16px; }
    .no-data { text-align: center; color: #777; font-style: italic; margin: 20px 0; }
    textarea { width: 100%; min-height: 180px; padding: 12px; border-radius: 8px; border: 1px solid rgba(130,191,210,0.3); background: white; font-family: inherit; font-size: 1.05rem; line-height: 1.6; }
    .logo-container { text-align: center; margin-bottom: 28px; }
    .logo { max-width: 220px; height: auto; display: block; margin: 0 auto; opacity: 0.92; filter: grayscale(0.15) saturate(0.92); transition: opacity 0.3s ease; }
    .logo:hover { opacity: 1; }
    @media (max-width: 768px) { .logo { max-width: 180px; } .logo-container { margin-bottom: 20px; } }
    #version-info { position: fixed; bottom: 0.75rem; right: 1rem; font-size: 0.75rem; color: #777; opacity: 0.65; pointer-events: none; z-index: 10; }
  </style>
</head>
<body>
<div class="container">
  <div class="logo-container">
    <img src="Peasy_Logo_ORG.png" alt="Peasy" class="logo">
  </div>
  <h1>Mandagsrapport – Peasy<span class="version">v15 (uten bud/diff)</span></h1>
  <p style="opacity: 0.8; margin-bottom: 32px;">Rapporter lagres i skyen – synlig for alle som åpner denne filen.</p>

  <div class="controls">
    <select id="weekSelect" onchange="loadSavedReport()">
      <option value="">Velg uke...</option>
    </select>
    <button id="generate-btn" onclick="generateNewReport()">Generer rapport for siste fullførte uke</button>
    <button id="edit-btn" onclick="editUserComment()" style="display:none;">Rediger egen kommentar</button>
    <button id="lock-btn" onclick="showLockCommentModal()" style="display:none;">Lås inn rapport</button>
    <button id="delete-btn" onclick="showDeleteConfirm()" style="display:none; background:#c62828;">Slett rapport</button>
  </div>

  <div id="loading" style="display:none;">Laster...</div>

  <div id="report-content" style="display:none;">
    <div id="timestamp" class="timestamp"></div>
    <div id="commentary" class="commentary"></div>

    <div id="sold-section">
      <div class="section-title">Solgte biler</div>
      <table id="sold-table"></table>
    </div>

    <div id="returned-section">
      <div class="section-title">Returnerte biler</div>
      <table id="returned-table"></table>
    </div>
  </div>

  <div id="version-info">v15 • uten bud/diff • 09.02.2026</div>

  <!-- Modals -->
  <div id="lock-comment-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center;">
    <div style="background:white; padding:32px; border-radius:16px; width:90%; max-width:600px; box-shadow:0 10px 30px rgba(0,0,0,0.3);">
      <h3>Kommentar før låsing (valgfritt)</h3>
      <textarea id="lock-comment-text" placeholder="Skriv en kommentar eller begrunnelse..."></textarea>
      <div style="margin-top:16px; text-align:right;">
        <button onclick="closeLockModal()" style="background:#757575; margin-right:12px;">Avbryt</button>
        <button onclick="confirmLockWithComment()" style="background:#2e7d32;">Lås inn</button>
      </div>
    </div>
  </div>

  <div id="delete-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center;">
    <div style="background:white; padding:32px; border-radius:16px; text-align:center; max-width:400px; box-shadow:0 10px 30px rgba(0,0,0,0.3);">
      <h3>Sikker på sletting?</h3>
      <p>Rapporten blir borte for alle brukere.</p>
      <div style="margin-top:20px;">
        <button onclick="promptPasswordForDelete()" style="background:#c62828; color:white;">Ja, slett</button>
        <button onclick="closeDeleteModal()" style="margin-left:16px; background:#757575; color:white;">Nei</button>
      </div>
    </div>
  </div>

  <div id="password-prompt" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:32px; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.3); z-index:1100; text-align:center;">
    <h3>Passord kreves</h3>
    <input type="password" id="password-input" placeholder="Passord" style="padding:12px; font-size:1.1rem; width:220px; margin:16px auto; display:block;">
    <button onclick="checkDeletePassword()" style="background:#c62828; color:white;">Bekreft</button>
    <button onclick="closePasswordPrompt()" style="margin-left:16px; background:#757575; color:white;">Avbryt</button>
  </div>
</div>

<script>
// ────────────────────────────────────────────────
// KONFIGURASJON
const BIN_ID = '6981aa3dae596e708f0d773b';
const MASTER_KEY = '$2a$10$rBlUQ2a25wMoTJmNRu9hkuX5aB/DVZh9EhrM75Ek1nUAdvvILtuy.';
const DELETE_PASSWORD = "slett123";
const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
const HEADERS = { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY };

// ────────────────────────────────────────────────
let currentReport = null;
let headers = [];

// Helpers
function findColumn(patterns) {
  const cleanHeader = h => String(h || '').trim().replace(/\s+/g, ' ').toLowerCase();
  const lowerHeaders = headers.map(cleanHeader);
  for (let p of patterns) {
    const pattern = p.trim().replace(/\s+/g, ' ').toLowerCase();
    const idx = lowerHeaders.findIndex(h => h === pattern);
    if (idx !== -1) return idx;
  }
  for (let p of patterns) {
    const pattern = p.trim().replace(/\s+/g, ' ').toLowerCase();
    const idx = lowerHeaders.findIndex(h => h.includes(pattern));
    if (idx !== -1) return idx;
  }
  return -1;
}

function getISOWeek(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
  const yearStart = new Date(d.getFullYear(), 0, 1);
  const days = Math.floor((d - yearStart) / 86400000);
  return Math.ceil((days + 1) / 7);
}

function getMostRecentCompletedWeekStart() {
  const today = new Date();
  const dayOfWeek = today.getDay() || 7;
  let daysBack = dayOfWeek === 1 ? 8 : dayOfWeek;
  const endPrev = new Date(today);
  endPrev.setDate(today.getDate() - daysBack);
  endPrev.setHours(0,0,0,0);
  const startPrev = new Date(endPrev);
  startPrev.setDate(endPrev.getDate() - 6);
  startPrev.setHours(0,0,0,0);
  return startPrev;
}

function parseDate(str) {
  if (!str) return null;
  const cleaned = String(str).trim().split(' ')[0];
  const m = cleaned.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  return m ? new Date(m[3], m[2]-1, m[1]) : null;
}

// JSONBin
async function fetchReports() {
  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    return json.record?.reports ?? [];
  } catch (err) {
    console.error(err);
    return [];
  }
}

async function saveReports(reports) {
  try {
    const res = await fetch(API_URL, {
      method: 'PUT',
      headers: HEADERS,
      body: JSON.stringify({ reports })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
  } catch (err) {
    console.error(err);
    alert("Lagring feilet – sjekk konsoll.");
  }
}

// Initial load
window.onload = async () => {
  const reports = await fetchReports();
  populateWeekSelect(reports);
  if (reports.length > 0) {
    document.getElementById('weekSelect').value = reports[reports.length - 1].id;
    await loadSavedReport();
  }
};

function populateWeekSelect(reports) {
  const sel = document.getElementById('weekSelect');
  sel.innerHTML = '<option value="">Velg uke...</option>';
  reports.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r.id;
    opt.textContent = r.title;
    sel.appendChild(opt);
  });
}

async function loadSavedReport() {
  const id = document.getElementById('weekSelect').value;
  if (!id) {
    document.getElementById('report-content').style.display = 'none';
    document.querySelectorAll('#edit-btn, #lock-btn, #delete-btn').forEach(el => el.style.display = 'none');
    return;
  }
  const reports = await fetchReports();
  const report = reports.find(r => r.id === id);
  if (!report) return;

  currentReport = report;

  let ts = `Opprettet: ${report.created}`;
  if (report.edited) ts += ` • Sist endret: ${report.edited}`;
  if (report.locked && report.lockComment) ts += ` • Låst med: "${report.lockComment}"`;
  document.getElementById('timestamp').textContent = ts;

  let html = report.commentary || '<p style="color:#777;">Ingen fakta generert.</p>';
  if (report.userComment) {
    html += ` <div class="user-comment">
      <h3>Kommentar til rapporten</h3>
      <div style="white-space: pre-wrap;">${report.userComment.replace(/\n/g, '<br>')}</div>
    </div>`;
  }
  document.getElementById('commentary').innerHTML = html;

  renderTable('sold-table', report.soldCars || []);
  renderTable('returned-table', report.returnedCars || []);

  document.getElementById('sold-section').style.display = report.soldCars?.length ? 'block' : 'none';
  document.getElementById('returned-section').style.display = report.returnedCars?.length ? 'block' : 'none';
  document.getElementById('report-content').style.display = 'block';

  const locked = !!report.locked;
  document.getElementById('edit-btn').style.display = 'block';
  document.getElementById('lock-btn').style.display = locked ? 'none' : 'block';
  document.getElementById('delete-btn').style.display = locked ? 'block' : 'none';
}

function renderTable(id, cars) {
  const table = document.getElementById(id);
  table.innerHTML = '';
  if (!cars.length) {
    table.innerHTML = '<tr><td colspan="7" class="no-data">Ingen biler denne uken</td></tr>';
    return;
  }

  table.innerHTML = `
    <thead>
      <tr>
        <th>Merke</th>
        <th>Modell</th>
        <th>År</th>
        <th>Høyeste bud</th>
        <th>AR laveste estimat</th>
        <th>Diff NOK</th>
        <th>Diff %</th>
      </tr>
    </thead>
    <tbody>
      ${cars.map(car => {
        const bud = parseFloat(car.ColumnE) || 0;
        const ar = car['AR laveste estimat_raw'] || 0;
        const diffNOK = bud - ar;
        const diffPct = ar > 0 ? ((bud - ar) / ar * 100) : 0;
        const diffNOKStr = diffNOK.toLocaleString('nb-NO');
        const diffPctStr = diffPct.toFixed(1) + ' %';
        const pctClass = diffPct > 0 ? 'positive' : (diffPct < 0 ? 'negative' : '');
        return `
          <tr>
            <td>${car.Merke}</td>
            <td>${car.Modell}</td>
            <td>${car.År}</td>
            <td>${bud.toLocaleString('nb-NO') || '-'}</td>
            <td>${ar.toLocaleString('nb-NO') || '-'}</td>
            <td>${diffNOK ? diffNOKStr : '-'}</td>
            <td class="${pctClass}">${ar > 0 ? diffPctStr : '-'}</td>
          </tr>
        `;
      }).join('')}
    </tbody>
    <tfoot>
      <tr>
        <td colspan="3"><strong>Gjennomsnitt (${cars.length} biler)</strong></td>
        <td>-</td>
        <td>${Math.round(cars.reduce((s,c)=>s+(c['AR laveste estimat_raw']||0),0)/cars.length||0).toLocaleString('nb-NO')}</td>
        <td colspan="2">-</td>
      </tr>
    </tfoot>`;
}

// Generate – dynamic last full week
async function generateNewReport() {
  const btn = document.getElementById('generate-btn');
  btn.disabled = true;
  document.getElementById('loading').style.display = 'block';

  try {
    const url = 'https://api.biladministrasjon.no/public/reports/peasy/dhqui7Hkl54?output=xlsx';
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const ab = await res.arrayBuffer();
    const wb = XLSX.read(ab, {type: 'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const data = XLSX.utils.sheet_to_json(ws, {header: 1, defval: ''});

    headers = data[0].map(h => (h || '').trim());

    const col = {
      Merke: findColumn(['Merke']),
      Modell: findColumn(['Modell']),
      År: findColumn(['År', 'Årgang']),
      'Endelig AR verdi': findColumn(['Endelig AR verdi', 'AR verdi', 'Laveste', 'Endelig']),
      'Solgt på': findColumn(['Solgt på', 'Solgt']),
      Returnert: findColumn(['Returnert', 'Returnert på'])
    };

    const startDate = getMostRecentCompletedWeekStart();
    const endDate = new Date(startDate);
    endDate.setDate(startDate.getDate() + 7);
    const weekNum = getISOWeek(startDate);
    const title = `Mandag ${startDate.toLocaleDateString('nb-NO')} – uke ${weekNum}`;
    const nowStr = new Date().toLocaleString('nb-NO', {dateStyle: 'short', timeStyle: 'short'});

    const reports = await fetchReports();
    if (reports.some(r => r.title === title)) {
      alert('Rapport for denne uken finnes allerede.');
      return;
    }

    const soldCars = [], returnedCars = [];

    for (let i = 1; i < data.length; i++) {
      const row = data[i];

      const parseDate = str => {
        if (!str) return null;
        const cleaned = String(str).trim().split(' ')[0];
        const m = cleaned.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
        return m ? new Date(m[3], m[2]-1, m[1]) : null;
      };

      const soldRaw = row[col['Solgt på']];
      const retRaw  = row[col.Returnert];

      const soldDate = parseDate(soldRaw);
      const retDate  = parseDate(retRaw);

      if (!soldRaw && !retRaw) continue;

      let arStr = String(row[col['Endelig AR verdi']] || '').trim();
      let arClean = arStr.replace(/\s/g, '').replace(/\u00A0/g, '').replace(',', '.');
      let arLowest = 0;
      if (arClean.includes('-')) {
        const lowPart = arClean.split('-')[0].trim();
        arLowest = isNaN(parseFloat(lowPart)) ? 0 : parseFloat(lowPart);
      } else {
        arLowest = isNaN(parseFloat(arClean)) ? 0 : parseFloat(arClean);
      }

      const car = {
        Merke: row[col.Merke] || '-',
        Modell: row[col.Modell] || '-',
        År: row[col.År] || '-',
        ColumnE: row[4] != null && row[4] !== '' ? String(row[4]).trim() : '-',
        'AR laveste estimat_raw': arLowest
      };

      if (soldDate && soldDate >= startDate && soldDate < endDate && soldRaw) {
        soldCars.push(car);
      }
      if (retDate && retDate >= startDate && retDate < endDate && retRaw) {
        returnedCars.push(car);
      }
    }

    const commentaryHtml = generateCommentary(soldCars, returnedCars);

    currentReport = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2),
      title,
      created: nowStr,
      edited: null,
      commentary: commentaryHtml,
      userComment: '',
      soldCars,
      returnedCars,
      locked: false,
      lockComment: ''
    };

    const reportsUpdated = await fetchReports();
    reportsUpdated.push(currentReport);
    await saveReports(reportsUpdated);

    const updatedReports = await fetchReports();
    populateWeekSelect(updatedReports);
    document.getElementById('weekSelect').value = currentReport.id;
    await loadSavedReport();

    alert(`Rapport generert for siste fullførte uke.\nSolgte: ${soldCars.length}\nReturnerte: ${returnedCars.length}`);
  } catch (err) {
    console.error(err);
    alert('Feil: ' + err.message);
  } finally {
    document.getElementById('loading').style.display = 'none';
    btn.disabled = false;
  }
}

function generateCommentary(sold, returned) {
  const stats = arr => {
    if (!arr.length) return {n:0, avg:0};
    const sum = arr.reduce((s,c) => s + (c['AR laveste estimat_raw']||0), 0);
    return { n: arr.length, avg: Math.round(sum / arr.length).toLocaleString('nb-NO') };
  };
  const s = stats(sold);
  const r = stats(returned);
  return `
    <h3>Fakta – siste fullførte uke (man–søn)</h3>
    <div style="margin: 24px 0 12px 0;">
      <strong>Solgte biler</strong><br>
      Totalt: ${s.n} biler<br>
      Gjennomsnitt AR laveste estimat: ${s.avg} kr
    </div>
    <div style="margin: 32px 0 12px 0;">
      <strong>Returnerte biler</strong><br>
      Totalt: ${r.n} biler<br>
      Gjennomsnitt AR laveste estimat: ${r.avg} kr
    </div>
  `;
}

// Placeholder functions
function editUserComment() { alert("Rediger kommentar ikke implementert."); }
function showLockCommentModal() { document.getElementById('lock-comment-modal').style.display = 'flex'; }
function closeLockModal() { document.getElementById('lock-comment-modal').style.display = 'none'; }
async function confirmLockWithComment() { alert("Låsing ikke implementert"); closeLockModal(); }
function showDeleteConfirm() { document.getElementById('delete-modal').style.display = 'flex'; }
function closeDeleteModal() { document.getElementById('delete-modal').style.display = 'none'; }
function promptPasswordForDelete() { document.getElementById('password-prompt').style.display = 'block'; }
function closePasswordPrompt() { document.getElementById('password-prompt').style.display = 'none'; }
async function checkDeletePassword() {
  const pw = document.getElementById('password-input').value;
  if (pw === DELETE_PASSWORD) {
    alert("Sletting ikke implementert.");
    closePasswordPrompt(); closeDeleteModal();
  } else {
    alert("Feil passord");
  }
}
</script>
</body>
</html>
