<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peasy Mandagsrapport v1.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.min.js"></script>
    <style>
        :root {
            --primary-green: #2ecc71;
            --dark-bg: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --red: #ff4757;
            --gray: #718093;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark-bg);
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h1, h2 { color: var(--primary-green); margin-top: 0; }
        .version { font-size: 0.8rem; color: var(--text-dim); }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-primary { background: var(--primary-green); color: #000; }
        .btn-secondary { background: var(--glass-border); color: white; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        select {
            padding: 10px;
            border-radius: 8px;
            background: #1e293b;
            color: white;
            border: 1px solid var(--glass-border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        th { text-align: left; color: var(--text-dim); padding: 12px; border-bottom: 1px solid var(--glass-border); }
        td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.03); }

        .diff-pos { color: var(--primary-green); }
        .diff-neg { color: var(--red); }
        .diff-zero { color: var(--gray); }

        .avg-row { font-weight: bold; background: rgba(46, 204, 113, 0.1); }

        #commentary-box {
            width: 100%;
            height: 120px;
            background: rgba(0,0,0,0.2);
            color: white;
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
            font-family: inherit;
        }

        #status-msg { margin: 10px 0; font-weight: bold; }
        .error { color: var(--red); }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-card">
        <h1>Peasy Mandagsrapport <span class="version">v1.0</span></h1>
        
        <div class="controls">
            <button id="btn-generate" class="btn-primary" onclick="handleManualGenerate()">Generer ny rapport</button>
            <select id="saved-reports" onchange="loadSavedReport()">
                <option value="">-- Se lagrede rapporter --</option>
            </select>
            <button id="btn-lock" class="btn-secondary" onclick="saveToLocalStorage()" style="display:none">Lås inn rapport</button>
        </div>
        <div id="status-msg"></div>
    </div>

    <div id="report-content" style="display:none">
        <div class="glass-card">
            <h2>Kommentar</h2>
            <textarea id="commentary-box"></textarea>
            <button id="btn-save-edit" class="btn-secondary" style="margin-top:10px" onclick="updateCommentary()">Lagre endring</button>
            <p id="timestamp-info" class="version"></p>
        </div>

        <div class="glass-card">
            <h2 id="sold-title">Solgte biler</h2>
            <div class="table-container">
                <table id="sold-table">
                    <thead>
                        <tr>
                            <th>Merke</th><th>Modell</th><th>År</th><th>AR Lav</th><th>Bud</th><th>Diff NOK</th><th>Diff %</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div class="glass-card">
            <h2 id="returned-title">Returnerte biler</h2>
            <div class="table-container">
                <table id="returned-table">
                    <thead>
                        <tr>
                            <th>Merke</th><th>Modell</th><th>År</th><th>AR Lav</th><th>Bud</th><th>Diff NOK</th><th>Diff %</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const DATA_URL = 'https://api.biladministrasjon.no/public/reports/peasy/dhqui7Hkl54?output=xlsx';
    let currentReportData = null;
    let currentWeekLabel = "";

    // Initialization
    window.onload = () => {
        updateSavedDropdown();
        const weekInfo = getPreviousWeekRange();
        currentWeekLabel = `Uke ${weekInfo.weekNum}`;
        
        const saved = JSON.parse(localStorage.getItem('peasy_mandagsrapport') || '{}');
        
        if (new Date().getDay() === 0) {
            showStatus("Rapporten kan først genereres på mandager for foregående uke.", "error");
        } else if (saved[currentWeekLabel]) {
            showStatus(`${currentWeekLabel} er allerede lagret. Velg fra menyen over.`);
        } else {
            generateReport(); // Auto-run
        }
    };

    function getPreviousWeekRange() {
        const now = new Date();
        const day = now.getDay() || 7; 
        const lastSunday = new Date(now);
        lastSunday.setDate(now.getDate() - day);
        lastSunday.setHours(23, 59, 59, 999);

        const lastMonday = new Date(lastSunday);
        lastMonday.setDate(lastSunday.getDate() - 6);
        lastMonday.setHours(0, 0, 0, 0);

        // Get Week Number
        const d = new Date(Date.UTC(lastMonday.getFullYear(), lastMonday.getMonth(), lastMonday.getDate()));
        d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
        const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
        const weekNum = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);

        return { start: lastMonday, end: lastSunday, weekNum };
    }

    async function generateReport() {
        showStatus("Henter data...");
        try {
            const response = await fetch(DATA_URL);
            const arrayBuffer = await response.arrayBuffer();
            const workbook = XLSX.read(arrayBuffer);
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const data = XLSX.utils.sheet_to_json(sheet);

            processData(data);
        } catch (err) {
            showStatus("Feil ved henting av data: " + err.message, "error");
        }
    }

    function parseDate(val) {
        if (!val) return null;
        let d;
        if (typeof val === 'number') {
            d = XLSX.utils.format_cell({ v: val, t: 'd' }); // Handle Excel serial
            d = new Date(d);
        } else {
            const parts = val.split('.');
            if (parts.length < 3) return null;
            d = new Date(parts[2].substring(0,4), parts[1]-1, parts[0]);
        }
        return isNaN(d.getTime()) ? null : d;
    }

    function processData(rows) {
        const week = getPreviousWeekRange();
        const sold = [];
        const returned = [];

        rows.forEach(row => {
            const dateO = parseDate(row['O']); // Order date logic
            const dateU = parseDate(row['U']); // Return date logic
            
            const processRow = (r) => {
                const arString = String(r['Endelig AR verdi'] || "");
                const arLav = parseInt(arString.split('-')[0].replace(/\D/g, '')) || 0;
                const bud = parseInt(r['Bud']) || 0;
                const diffNok = bud - arLav;
                const diffPct = arLav > 0 ? (diffNok / arLav) * 100 : 0;

                return {
                    merke: r['Merke'] || '-',
                    modell: r['Modell'] || '-',
                    aar: r['År'] || '-',
                    arLav, bud, diffNok, diffPct
                };
            };

            if (dateO && dateO >= week.start && dateO <= week.end) sold.push(processRow(row));
            if (dateU && dateU >= week.start && dateU <= week.end) returned.push(processRow(row));
        });

        renderTables(sold, returned);
        generateAutoCommentary(sold, returned);
        
        currentReportData = { week: currentWeekLabel, sold, returned };
        document.getElementById('report-content').style.display = 'block';
        document.getElementById('btn-lock').style.display = 'inline-block';
        showStatus(`Rapport generert for ${currentWeekLabel}`);
    }

    function renderTables(sold, returned) {
        const fill = (id, list) => {
            const tbody = document.querySelector(`#${id} tbody`);
            tbody.innerHTML = "";
            let sumDiffNok = 0, sumPct = 0;

            list.forEach(item => {
                sumDiffNok += item.diffNok;
                sumPct += item.diffPct;
                const cls = item.diffNok > 0 ? 'diff-pos' : (item.diffNok < 0 ? 'diff-neg' : 'diff-zero');
                tbody.innerHTML += `<tr>
                    <td>${item.merke}</td><td>${item.modell}</td><td>${item.aar}</td>
                    <td>${item.arLav.toLocaleString()}</td><td>${item.bud.toLocaleString()}</td>
                    <td class="${cls}">${item.diffNok.toLocaleString()}</td>
                    <td class="${cls}">${item.diffPct.toFixed(1)}%</td>
                </tr>`;
            });

            if(list.length > 0) {
                tbody.innerHTML += `<tr class="avg-row">
                    <td colspan="5">Gjennomsnitt (${list.length} biler)</td>
                    <td>${Math.round(sumDiffNok/list.length).toLocaleString()}</td>
                    <td>${(sumPct/list.length).toFixed(1)}%</td>
                </tr>`;
            }
        };
        fill('sold-table', sold);
        fill('returned-table', returned);
    }

    function generateAutoCommentary(sold, returned) {
        const getStats = (list) => {
            const under = list.filter(i => i.diffNok < 0);
            const avgUnder = under.length ? under.reduce((a,b) => a + b.diffNok, 0) / under.length : 0;
            const pctUnder = (under.length / list.length) * 100 || 0;
            return { avgUnder, pctUnder };
        };

        const s = getStats(sold);
        const r = getStats(returned);
        
        const ppDiff = (r.pctUnder - s.pctUnder).toFixed(1);
        const nokDiff = Math.abs(Math.round(r.avgUnder - s.avgUnder));
        
        document.getElementById('commentary-box').value = 
            `Rapport for ${currentWeekLabel}.\n` +
            `Returnerte biler har ${ppDiff} prosentpoeng ${ppDiff > 0 ? 'høyere' : 'lavere'} andel under AR lav, ` +
            `og et undersalg som er ${nokDiff.toLocaleString()} NOK ${r.avgUnder < s.avgUnder ? 'større' : 'mindre'} enn solgte biler i snitt.`;
    }

    function saveToLocalStorage() {
        const saved = JSON.parse(localStorage.getItem('peasy_mandagsrapport') || '{}');
        const timestamp = new Date().toLocaleString('no-NO');
        
        saved[currentWeekLabel] = {
            ...currentReportData,
            commentary: document.getElementById('commentary-box').value,
            created: timestamp,
            edited: timestamp
        };
        
        localStorage.setItem('peasy_mandagsrapport', JSON.stringify(saved));
        updateSavedDropdown();
        showStatus("Rapport låst og lagret!");
    }

    function updateCommentary() {
        const saved = JSON.parse(localStorage.getItem('peasy_mandagsrapport') || '{}');
        if (saved[currentWeekLabel]) {
            saved[currentWeekLabel].commentary = document.getElementById('commentary-box').value;
            saved[currentWeekLabel].edited = new Date().toLocaleString('no-NO');
            localStorage.setItem('peasy_mandagsrapport', JSON.stringify(saved));
            loadSavedReport(); 
            showStatus("Kommentar oppdatert.");
        }
    }

    function loadSavedReport() {
        const val = document.getElementById('saved-reports').value;
        if (!val) return;
        
        const saved = JSON.parse(localStorage.getItem('peasy_mandagsrapport') || '{}');
        const report = saved[val];
        
        currentWeekLabel = val;
        currentReportData = report;
        
        renderTables(report.sold, report.returned);
        document.getElementById('commentary-box').value = report.commentary;
        document.getElementById('timestamp-info').innerText = `Opprettet: ${report.created} | Sist endret: ${report.edited}`;
        document.getElementById('report-content').style.display = 'block';
        document.getElementById('btn-lock').style.display = 'none';
        showStatus(`Viser lagret rapport for ${val}`);
    }

    function updateSavedDropdown() {
        const dropdown = document.getElementById('saved-reports');
        const saved = JSON.parse(localStorage.getItem('peasy_mandagsrapport') || '{}');
        dropdown.innerHTML = '<option value="">-- Se lagrede rapporter --</option>';
        Object.keys(saved).forEach(key => {
            dropdown.innerHTML += `<option value="${key}">${key}</option>`;
        });
    }

    function handleManualGenerate() {
        if (new Date().getDay() === 0) {
            alert("Det er søndag. Vent til mandag for å generere rapport for uken som gikk.");
            return;
        }
        generateReport();
    }

    function showStatus(msg, type="") {
        const el = document.getElementById('status-msg');
        el.innerText = msg;
        el.className = type === "error" ? "error" : "";
    }
</script>

</body>
</html>
