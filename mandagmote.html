<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandagsrapport v1.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(to bottom right, #00ff00, #008000);
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        h1, h2 {
            color: #fff;
        }
        button {
            background: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
            font-family: 'Inter', sans-serif;
        }
        button:hover {
            background: #388e3c;
        }
        select {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.2);
        }
        th {
            background: #4caf50;
            color: white;
            padding: 10px;
            text-align: left;
        }
        td {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        .red {
            color: #ff0000;
        }
        .green {
            color: #00ff00;
        }
        .gray {
            color: #808080;
        }
        #message {
            color: #fff;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-family: 'Inter', sans-serif;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Mandagsrapport v1.0</h1>
        <select id="report-select">
            <option value="">Velg rapport</option>
        </select>
        <button id="generate-btn">Generer ny rapport</button>
        <button id="lock-btn" style="display: none;">Lås inn rapport</button>
        <button id="edit-btn" style="display: none;">Rediger kommentar</button>
        <button id="save-edit" style="display: none;">Lagre endringer</button>
        <div id="report-content"></div>
        <textarea id="commentary-edit" style="display: none;"></textarea>
        <div id="message"></div>
    </div>
    <script>
        const reportKey = 'peasy_mandagsrapport';
        const xlsxUrl = 'https://api.biladministrasjon.no/public/reports/peasy/dhqui7Hkl54?output=xlsx';

        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getDate() + 4 - (d.getUTCDay() || 7));
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        }

        function parseDate(str) {
            if (!str) return null;
            const parts = str.toString().trim().match(/(\d{2})\.(\d{2})\.(\d{4})/);
            if (parts) {
                return new Date(parseInt(parts[3]), parseInt(parts[2]) - 1, parseInt(parts[1]));
            }
            return null;
        }

        function getARlav(str) {
            if (!str) return null;
            const match = str.toString().trim().match(/(\d+)/);
            return match ? parseInt(match[1]) : null;
        }

        function getPreviousWeek() {
            const today = new Date();
            let day = today.getDay();
            if (day === 0) {
                throw new Error('Rapporten kan kun genereres på mandag eller senere.');
            }
            const lastSunday = new Date(today);
            lastSunday.setDate(lastSunday.getDate() - day);
            const monday = new Date(lastSunday);
            monday.setDate(monday.getDate() - 6);
            const weekNum = getWeekNumber(monday);
            return {
                monday,
                sunday: lastSunday,
                title: `Uke ${weekNum}`
            };
        }

        function loadReports() {
            return JSON.parse(localStorage.getItem(reportKey)) || {};
        }

        function saveReport(weekTitle, report) {
            const reports = loadReports();
            reports[weekTitle] = report;
            localStorage.setItem(reportKey, JSON.stringify(reports));
        }

        function populateDropdown(currentWeekTitle) {
            const select = document.getElementById('report-select');
            select.innerHTML = '<option value="">Velg rapport</option>';
            const reports = loadReports();
            Object.keys(reports).sort().forEach(key => {
                const option = document.createElement('option');
                option.value = key;
                option.text = key;
                select.appendChild(option);
            });
            if (reports[currentWeekTitle]) {
                select.value = currentWeekTitle;
                renderReport(reports[currentWeekTitle], currentWeekTitle);
            }
        }

        function showMessage(msg, isError = false) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = msg;
            messageDiv.style.color = isError ? '#ff0000' : '#fff';
        }

        function renderTable(cars, title) {
            if (cars.length === 0) return `<h2>${title}</h2><p>Ingen biler.</p>`;
            let totalAR = 0, totalBud = 0, totalDiffNOK = 0, totalDiffPct = 0;
            let countUnder = 0, sumUnder = 0;
            let html = `<h2>${title}</h2><table><thead><tr><th>Merke</th><th>Modell</th><th>År</th><th>AR lav</th><th>Bud</th><th>Diff NOK</th><th>Diff %</th></tr></thead><tbody>`;
            cars.forEach(car => {
                const diffNOK = car.bud - car.arLav;
                const diffPct = ((diffNOK / car.arLav) * 100).toFixed(1);
                let diffClass = diffNOK > 0 ? 'green' : diffNOK < 0 ? 'red' : 'gray';
                html += `<tr><td>${car.merke}</td><td>${car.modell}</td><td>${car.ar}</td><td>${car.arLav}</td><td>${car.bud}</td><td class="${diffClass}">${diffNOK}</td><td class="${diffClass}">${diffPct}%</td></tr>`;
                totalAR += car.arLav;
                totalBud += car.bud;
                totalDiffNOK += diffNOK;
                totalDiffPct += parseFloat(diffPct);
                if (diffNOK < 0) {
                    countUnder++;
                    sumUnder += -diffNOK; // undersalg
                }
            });
            const avgAR = (totalAR / cars.length).toFixed(0);
            const avgBud = (totalBud / cars.length).toFixed(0);
            const avgDiffNOK = (totalDiffNOK / cars.length).toFixed(0);
            const avgDiffPct = (totalDiffPct / cars.length).toFixed(1);
            html += `<tr><td colspan="3">Gjennomsnitt</td><td>${avgAR}</td><td>${avgBud}</td><td>${avgDiffNOK}</td><td>${avgDiffPct}%</td></tr></tbody></table>`;
            return {html, percentUnder: (countUnder / cars.length) * 100, avgUndersalg: countUnder > 0 ? (sumUnder / countUnder) : 0};
        }

        function generateCommentary(soldStats, returnedStats) {
            const ppDiff = (returnedStats.percentUnder - soldStats.percentUnder).toFixed(1);
            const nokDiff = (returnedStats.avgUndersalg - soldStats.avgUndersalg).toFixed(0);
            const ppSign = ppDiff >= 0 ? '+' : '';
            const nokSign = nokDiff >= 0 ? '+' : '';
            return `Returnerte har ${ppSign}${ppDiff} pp høyere andel under + ${nokSign}${nokDiff} NOK større undersalg.`;
        }

        function renderReport(report, weekTitle) {
            const contentDiv = document.getElementById('report-content');
            const sold = renderTable(report.sold, 'Solgt');
            const returned = renderTable(report.returned, 'Returnert');
            const commentary = generateCommentary({percentUnder: sold.percentUnder, avgUndersalg: sold.avgUndersalg}, {percentUnder: returned.percentUnder, avgUndersalg: returned.avgUndersalg});
            contentDiv.innerHTML = `
                <h2>${weekTitle}</h2>
                ${sold.html}
                ${returned.html}
                <h2>Kommentar</h2>
                <p id="commentary">${report.commentary || commentary}</p>
                <p>Opprettet: ${report.created}</p>
                <p>${report.edited ? 'Redigert: ' + report.edited : ''}</p>
            `;
            document.getElementById('lock-btn').style.display = report.isNew ? 'inline-block' : 'none';
            document.getElementById('edit-btn').style.display = !report.isNew ? 'inline-block' : 'none';
            document.getElementById('generate-btn').style.display = report.isNew ? 'none' : 'inline-block';
        }

        async function generateReport() {
            showMessage('Laster...', false);
            try {
                const week = getPreviousWeek();
                const reports = loadReports();
                if (reports[week.title]) {
                    throw new Error('Rapporten er allerede generert for denne uken.');
                }
                const res = await fetch(xlsxUrl);
                if (!res.ok) throw new Error('Feil ved henting av data.');
                const ab = await res.arrayBuffer();
                const wb = XLSX.read(ab, {type: 'array'});
                const ws = wb.Sheets[wb.SheetNames[0]];
                const data = XLSX.utils.sheet_to_json(ws, {header: 1, blankrows: false});
                if (data.length < 2) throw new Error('Ingen data i rapporten.');

                const headers = data[0].map(h => h ? h.toString().trim() : '');
                const colMerke = headers.indexOf('Merke');
                const colModell = headers.indexOf('Modell');
                const colAr = headers.indexOf('År');
                const colAR = headers.indexOf('Endelig AR verdi');
                const colBud = headers.indexOf('Bud');
                const colO = 14; // O
                const colU = 20; // U

                if (colMerke === -1 || colModell === -1 || colAr === -1 || colAR === -1 || colBud === -1) {
                    throw new Error('Manglende kolonner i dataen.');
                }

                const sold = [];
                const returned = [];
                for (let i = 1; i < data.length; i++) {
                    const row = data[i];
                    const dateO = parseDate(row[colO]);
                    const dateU = parseDate(row[colU]);
                    const arLav = getARlav(row[colAR]);
                    const bud = parseInt(row[colBud]) || 0;
                    if (!arLav || isNaN(bud)) continue;

                    const car = {
                        merke: row[colMerke] || '',
                        modell: row[colModell] || '',
                        ar: row[colAr] || '',
                        arLav,
                        bud
                    };

                    if (dateO && dateO >= week.monday && dateO <= week.sunday) {
                        sold.push(car);
                    }
                    if (dateU && dateU >= week.monday && dateU <= week.sunday) {
                        returned.push(car);
                    }
                }

                const soldStats = renderTable(sold, 'Solgt');
                const returnedStats = renderTable(returned, 'Returnert');
                const commentary = generateCommentary({percentUnder: soldStats.percentUnder, avgUndersalg: soldStats.avgUndersalg}, {percentUnder: returnedStats.percentUnder, avgUndersalg: returnedStats.avgUndersalg});

                const report = {
                    sold,
                    returned,
                    commentary,
                    created: new Date().toLocaleString(),
                    edited: null,
                    isNew: true
                };
                renderReport(report, week.title);
                document.getElementById('lock-btn').style.display = 'inline-block';
                document.getElementById('generate-btn').style.display = 'none';
                showMessage('Rapport generert.', false);

                document.getElementById('lock-btn').onclick = () => {
                    report.isNew = false;
                    saveReport(week.title, report);
                    populateDropdown(week.title);
                    document.getElementById('lock-btn').style.display = 'none';
                    document.getElementById('edit-btn').style.display = 'inline-block';
                    showMessage('Rapport lagret.', false);
                };
            } catch (err) {
                showMessage(err.message, true);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            let week;
            try {
                week = getPreviousWeek();
                const reports = loadReports();
                populateDropdown(week.title);
                if (!reports[week.title]) {
                    generateReport();
                }
            } catch (err) {
                showMessage(err.message, true);
            }

            document.getElementById('generate-btn').onclick = generateReport;

            document.getElementById('report-select').onchange = (e) => {
                const key = e.target.value;
                if (key) {
                    const reports = loadReports();
                    renderReport(reports[key], key);
                } else {
                    document.getElementById('report-content').innerHTML = '';
                    document.getElementById('lock-btn').style.display = 'none';
                    document.getElementById('edit-btn').style.display = 'none';
                    document.getElementById('save-edit').style.display = 'none';
                    document.getElementById('commentary-edit').style.display = 'none';
                }
            };

            document.getElementById('edit-btn').onclick = () => {
                const select = document.getElementById('report-select');
                const key = select.value;
                if (!key) return;
                const reports = loadReports();
                const report = reports[key];
                const commentaryP = document.getElementById('commentary');
                document.getElementById('commentary-edit').value = commentaryP.textContent;
                document.getElementById('commentary-edit').style.display = 'block';
                document.getElementById('save-edit').style.display = 'inline-block';
                document.getElementById('edit-btn').style.display = 'none';

                document.getElementById('save-edit').onclick = () => {
                    const newCommentary = document.getElementById('commentary-edit').value;
                    report.commentary = newCommentary;
                    report.edited = new Date().toLocaleString();
                    saveReport(key, report);
                    renderReport(report, key);
                    document.getElementById('commentary-edit').style.display = 'none';
                    document.getElementById('save-edit').style.display = 'none';
                    document.getElementById('edit-btn').style.display = 'inline-block';
                    showMessage('Endringer lagret.', false);
                };
            };
        });
    </script>
</body>
</html>
