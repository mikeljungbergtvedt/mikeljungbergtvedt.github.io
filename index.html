<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peasy Budaksept</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to bottom, #F9FAFB, #FFFFFF);
      margin: 0;
      padding: 8px;
      color: #2D3748;
    }
    .form-container {
      position: relative;
      background: #FFFFFF;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
      max-width: 194mm;
      max-height: 281mm;
      margin: 8px auto;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .form-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('yellow-spoiler.png') center/contain no-repeat;
      opacity: 0.02;
      z-index: -1;
    }
    button {
      background: #FFC107 !important;
      color: #2D3748 !important;
      padding: 12px 28px !important;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.3s ease;
    }
    button:hover {
      background: #2D3748 !important;
      color: #FFC107 !important;
      transform: translateY(-1px);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
    }
    input {
      border: 1px solid #2D3748 !important;
      border-radius: 6px;
      padding: 10px !important;
      font-size: 13px;
      line-height: 1.5;
      height: 40px;
      transition: all 0.3s ease;
      background: #F9FAFB;
      display: block;
      width: 100%;
      box-sizing: border-box;
    }
    input:focus {
      border-color: #FFC107 !important;
      box-shadow: 0 0 0 3px rgba(255, 193, 7, 0.15);
      outline: none;
    }
    input[readonly] {
      background: #E5E7EB;
      border-color: #9CA3AF !important;
      cursor: not-allowed;
      opacity: 0.6;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }
    input[type="date"] {
      appearance: none;
      -webkit-appearance: none;
      height: 40px;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      opacity: 0.7;
      filter: invert(20%) sepia(80%) saturate(200%) hue-rotate(120deg);
      margin-top: -2px;
    }
    .fine-print-box {
      background: #F3F4F6;
      color: #2D3748;
      padding: 8px;
      border-radius: 6px;
      margin: 6px 0;
      font-size: 11px;
      line-height: 1.4;
      text-align: center;
      border: 1px solid #D1D5DB;
    }
    .button-group {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .form-section {
      margin-bottom: 4px;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(255, 193, 7, 0.1);
    }
    .form-section h3 {
      font-size: 13px;
      font-weight: 600;
      color: #2D3748;
      margin-bottom: 3px;
    }
    .form-section .grid div {
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: 500;
      font-size: 12px;
    }

    @media print {
      @page {
        size: A4;
        margin: 8mm;
      }
      body {
        font-family: Helvetica, Arial, sans-serif;
        background: none;
        margin: 0;
        padding: 0;
        color: #2D3748;
      }
      .form-container {
        max-width: 194mm;
        height: auto;
        padding: 0;
        box-shadow: none;
        margin: 0;
        overflow: visible;
        background: none;
      }
      .form-container::before {
        display: none;
      }
      button, .button-group, .print-hidden {
        display: none;
      }
      h2 {
        font-size: 12pt;
        font-weight: bold;
        text-align: center;
        color: #2D3748;
        margin-bottom: 1mm;
      }
      .form-section {
        margin-bottom: 0.3mm;
        padding-bottom: 0.3mm;
        border-bottom: 0.25pt solid rgba(255, 193, 7, 0.1);
        page-break-inside: avoid;
      }
      .form-section h3 {
        font-size: 9pt;
        font-weight: bold;
        color: #2D3748;
        margin-bottom: 0.5mm;
      }
      .form-section .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 5mm;
        row-gap: 0.3mm;
        page-break-inside: avoid;
      }
      .form-section .grid div {
        display: flex;
        flex-direction: column;
      }
      label {
        font-size: 6.5pt;
        font-weight: normal;
        color: #2D3748;
        margin-bottom: 0.1mm;
      }
      input {
        font-size: 6.5pt;
        padding: 0.3mm;
        border: 0.25pt solid #2D3748;
        height: auto;
        background: none;
        width: 100%;
        box-sizing: border-box;
        line-height: 1.1;
      }
      .fine-print-box {
        background: #F3F4F6;
        color: #2D3748;
        padding: 1mm;
        border: 0.25pt solid #D1D5DB;
        border-radius: 2mm;
        margin: 0.5mm 0;
        font-size: 5.5pt;
        line-height: 1.0;
        text-align: center;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body>
  <div class="form-container">
    <form id="contract-form" class="animate-grid-in">
      <h2 class="text-xl font-bold text-center text-[#2D3748] mb-4">BUDAKSEPT</h2>
      <h2 class="text-xl font-bold text-center text-[#2D3748] mb-8 print-hidden">Fyll inn opplysninger</h2>
      <div class="form-section">
        <h3 class="mb-4">Selger</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label for="selger-navn" class="block text-xs font-medium text-[#2D3748]">Navn</label>
            <input type="text" id="selger-navn" class="mt-1 w-full" required>
          </div>
          <div>
            <label for="selger-adresse" class="block text-xs font-medium text-[#2D3748]">Adresse</label>
            <input type="text" id="selger-adresse" class="mt-1 w-full" required>
          </div>
          <div>
            <label for="selger-postnummer-sted" class="block text-xs font-medium text-[#2D3748]">Postnummer / Sted</label>
            <input type="text" id="selger-postnummer-sted" class="mt-1 w-full" required>
          </div>
          <div>
            <label for="selger-telefon" class="block text-xs font-medium text-[#2D3748]">Telefon</label>
            <input type="text" id="selger-telefon" class="mt-1 w-full" required>
          </div>
          <div>
            <label for="selger-epost" class="block text-xs font-medium text-[#2D3748]">E-post</label>
            <input type="email" id="selger-epost" class="mt-1 w-full" required>
          </div>
          <div>
            <label for="selger-personnummer" class="block text-xs font-medium text-[#2D3748]">Personnummer / Organisasjonsnummer</label>
            <input type="text" id="selger-personnummer" class="mt-1 w-full" required>
          </div>
        </div>
      </div>

      <div class="form-section medeier-section">
        <h3 class="mb-4">Medeier</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label for="medeier-navn" class="block text-xs font-medium text-[#2D3748]">Navn</label>
            <input type="text" id="medeier-navn" class="mt-1 w-full">
          </div>
          <div>
            <label for="medeier-adresse" class="block text-xs font-medium text-[#2D3748]">Adresse</label>
            <input type="text" id="medeier-adresse" class="mt-1 w-full">
          </div>
          <div>
            <label for="medeier-postnummer-sted" class="block text-xs font-medium text-[#2D3748]">Postnummer / Sted</label>
            <input type="text" id="medeier-postnummer-sted" class="mt-1 w-full">
          </div>
          <div>
            <label for="medeier-telefon" class="block text-xs font-medium text-[#2D3748]">Telefon</label>
            <input type="text" id="medeier-telefon" class="mt-1 w-full">
          </div>
          <div>
            <label for="medeier-epost" class="block text-xs font-medium text-[#2D3748]">E-post</label>
            <input type="email" id="medeier-epost" class="mt-1 w-full">
          </div>
          <div>
            <label for="medeier-personnummer" class="block text-xs font-medium text-[#2D3748]">Personnummer / Organisasjonsnummer</label>
            <input type="text" id="medeier-personnummer" class="mt-1 w-full">
          </div>
        </div>
      </div>

      <div class="form-section">
        <h3 class="mb-4">Kjøretøyets opplysninger</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label for="bil-merke" class="block text-xs font-medium text-[#2D3748]">Merke</label>
            <input type="text" id="bil-merke" class="mt-1 w-full" required>
          </div>
          <div>
            <label for="bil-modell" class="block text-xs font-medium text-[#2D3748]">Modell</label>
            <input type="text" id="bil-modell" class="mt-1 w-full" required>
          </div>
          <div>
            <label for="bil-arsmodell" class="block text-xs font-medium text-[#2D3748]">Årsmodell</label>
            <input type="text" id="bil-arsmodell" class="mt-1 w-full" required>
          </div>
          <div>
            <label for="bil-regnr" class="block text-xs font-medium text-[#2D3748]">Registreringsnummer</label>
            <input type="text" id="bil-regnr" class="mt-1 w-full" required>
          </div>
          <div>
            <label for="bil-vinnr" class="block text-xs font-medium text-[#2D3748]">VIN</label>
            <input type="text" id="bil-vinnr" class="mt-1 w-full" required>
          </div>
          <div>
            <label for="bil-kilometer" class="block text-xs font-medium text-[#2D3748]">Kilometerstand</label>
            <input type="number" id="bil-kilometer" class="mt-1 w-full" required>
          </div>
          <div>
            <label for="bil-farge" class="block text-xs font-medium text-[#2D3748]">Farge</label>
            <input type="text" id="bil-farge" class="mt-1 w-full" required>
          </div>
          <div>
            <label for="bil-eukontroll" class="block text-xs font-medium text-[#2D3748]">Sist godkjent EU-kontroll</label>
            <input type="date" id="bil-eukontroll" class="mt-1 w-full" required>
          </div>
        </div>
      </div>

      <div class="form-section">
        <h3 class="mb-4">Bud og betalingsvilkår</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label for="budsum" class="block text-xs font-medium text-[#2D3748]">Budsum (NOK)</label>
            <input type="text" id="budsum" class="mt-1 w-full" required>
          </div>
          <div>
            <label for="kontonummer" class="block text-xs font-medium text-[#2D3748]">Kontonummer</label>
            <input type="text" id="kontonummer" class="mt-1 w-full" maxlength="13" placeholder="0000.00.00000" required>
          </div>
          <div>
            <label for="betalingsdato" class="block text-xs font-medium text-[#2D3748]">Betalingsdato</label>
            <input type="date" id="betalingsdato" class="mt-1 w-full" required>
          </div>
          <div>
            <label for="test-dato" class="block text-xs font-medium text-[#2D3748]">Dato for NAF/Viking-test</label>
            <input type="date" id="test-dato" class="mt-1 w-full" required>
          </div>
        </div>
      </div>

      <div class="fine-print-box">
        <p>Budet aksepteres og det gis fullmakt til å innhente salgsmelding og saldo på eventuell utestående finansiering.</p>
      </div>

      <div class="button-group">
        <button type="button" onclick="acceptBid()" class="px-6 py-3">Akseptere bud</button>
      </div>
    </form>
  </div>

  <script>
    const formatCurrency = (value) => {
      if (!value || isNaN(value)) return '';
      return new Intl.NumberFormat('nb-NO', {
        style: 'currency',
        currency: 'NOK',
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
      }).format(value).replace('NOK', 'kr').replace(/\s+/g, ' ');
    }

    const formatDate = (dateString) => {
      if (!dateString) return '';
      const date = new Date(dateString);
      if (isNaN(date)) return '';
      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = date.getFullYear();
      return `${day}.${month}.${year}`;
    }

    const norwegianHolidays2025 = [
      '2025-01-01', // New Year's Day
      '2025-04-17', // Maundy Thursday
      '2025-04-18', // Good Friday
      '2025-04-20', // Easter Sunday
      '2025-04-21', // Easter Monday
      '2025-05-01', // Labour Day
      '2025-05-17', // Constitution Day
      '2025-05-29', // Ascension Day
      '2025-06-08', // Whit Sunday
      '2025-06-09', // Whit Monday
      '2025-12-25', // Christmas Day
      '2025-12-26'  // Boxing Day
    ];

    const getWorkingDaysAhead = (startDate, days) => {
      let currentDate = new Date(startDate);
      let workingDaysAdded = 0;

      while (workingDaysAdded < days) {
        currentDate.setDate(currentDate.getDate() + 1);
        const isWeekend = currentDate.getDay() === 0 || currentDate.getDay() === 6;
        const isHoliday = norwegianHolidays2025.includes(currentDate.toISOString().split('T')[0]);
        if (!isWeekend && !isHoliday) {
          workingDaysAdded++;
        }
      }

      return currentDate.toISOString().split('T')[0];
    }

    const setupCurrencyInput = (id) => {
      const input = document.getElementById(id);
      input.addEventListener('input', (e) => {
        const digits = e.target.value.replace(/\D/g, '');
        e.target.dataset.value = digits;
        if (digits) {
          e.target.value = formatCurrency(parseFloat(digits));
        } else {
          e.target.value = '';
        }
      });
      input.addEventListener('focus', (e) => {
        if (e.target.dataset.value) {
          e.target.value = e.target.dataset.value;
        }
      });
      input.addEventListener('blur', (e) => {
        if (e.target.dataset.value) {
          e.target.value = formatCurrency(parseFloat(e.target.dataset.value));
        }
      });
    }

    const setupNumberValidation = (id, fieldName) => {
      const input = document.getElementById(id);
      input.addEventListener('input', (e) => {
        if (!/^\d*$/.test(e.target.value)) {
          e.target.value = e.target.value.replace(/[^\d]/g, '');
          alert(`${fieldName} må kun inneholde tall.`);
        }
      });
    }

    setupCurrencyInput('budsum');
    setupNumberValidation('selger-personnummer', 'Personnummer / Organisasjonsnummer');
    setupNumberValidation('medeier-personnummer', 'Personnummer / Organisasjonsnummer');
    setupNumberValidation('bil-arsmodell', 'Årsmodell');

    document.getElementById('kontonummer').addEventListener('input', (e) => {
      const digits = e.target.value.replace(/\D/g, '');
      if (digits.length <= 11) {
        e.target.value = digits;
        if (digits.length === 11) {
          e.target.value = `${digits.slice(0, 4)}.${digits.slice(4, 6)}.${digits.slice(6, 11)}`;
        }
      } else {
        e.target.value = digits.slice(0, 11);
        e.target.value = `${digits.slice(0, 4)}.${digits.slice(4, 6)}.${digits.slice(6, 11)}`;
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      const today = new Date();
      const paymentDate = getWorkingDaysAhead(today, 3);
      document.getElementById('betalingsdato').value = paymentDate;

      ['bil-eukontroll', 'betalingsdato', 'test-dato'].forEach(id => {
        const input = document.getElementById(id);
        input.addEventListener('change', () => {
          if (input.value) {
            input.dataset.displayValue = formatDate(input.value);
          }
        });
      });
    });

    function acceptBid() {
      const form = document.getElementById('contract-form');
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const requiredFields = form.querySelectorAll('[required]');
      let allFilled = true;
      requiredFields.forEach(input => {
        if (!input.value) {
          allFilled = false;
          input.style.borderColor = '#FF0000';
          setTimeout(() => { input.style.borderColor = '#2D3748'; }, 2000);
        }
      });
      if (!allFilled) {
        alert('Vennligst fyll inn alle obligatoriske felter.');
        return;
      }

      window.print();
    }
  </script>
</body>
</html>
