<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peasy Pulse v16.03.ab</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --green: #004225; --green2: #006644; --accent: #00875A; --yellow: #FFCC33;
  --bg0: #F2F7F9; --bg1: #E8F0F5; --card: rgba(255,255,255,0.97);
  --border: rgba(0,66,37,0.08); --shadow: rgba(0,66,37,0.07);
  --text: #004225; --muted: #667; --red: #C62828; --red-bg: #FDECEA;
  --orange: #E65100; --ora-bg: #FFF3E0; --blue: #1565C0; --blu-bg: #E3F2FD;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,var(--bg0),var(--bg1));color:var(--text);min-height:100vh;}
header{background:var(--green);height:64px;padding:0 40px;display:flex;align-items:center;justify-content:space-between;}
.logo img{height:28px;}
.header-right{display:flex;align-items:center;gap:16px;}
.pill{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,0.1);border-radius:99px;padding:5px 14px;font-size:12px;font-weight:500;color:rgba(255,255,255,0.85);}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:#4CAF50;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.mode-toggle{display:flex;background:rgba(255,255,255,0.1);border-radius:99px;padding:3px;gap:2px;}
.mode-btn{font-size:11px;font-weight:600;padding:5px 14px;border-radius:99px;border:none;cursor:pointer;letter-spacing:0.3px;transition:all 0.15s;color:rgba(255,255,255,0.65);background:transparent;}
.mode-btn.active{background:var(--yellow);color:var(--green);}
main{max-width:1400px;margin:0 auto;padding:40px 24px 80px;}
.section-label{font-size:10px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);margin-bottom:14px;margin-top:40px;}
.section-label:first-child{margin-top:0;}
.dials-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:14px;}
.dial-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px 16px 16px;box-shadow:0 4px 24px var(--shadow);text-align:center;position:relative;overflow:hidden;}
.dial-label{font-size:9px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.arc-wrap{position:relative;width:110px;height:64px;margin:0 auto 10px;}
.arc-wrap svg{width:110px;height:64px;}
.dial-value{font-size:26px;font-weight:900;letter-spacing:-1px;line-height:1;}
.dial-unit{font-size:10px;font-weight:500;color:var(--muted);margin-top:2px;}
.dial-sub{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.3;}
.target-tag{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px;margin-top:6px;letter-spacing:0.5px;}
.on-target .target-tag{background:#E8F5E9;color:#2E7D32;}
.off-target .target-tag{background:var(--red-bg);color:var(--red);}
.neutral .target-tag{background:#FFFDE7;color:#F57F17;}
.dial-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;}
.on-target::after{background:linear-gradient(90deg,#4CAF50,#81C784);}
.off-target::after{background:linear-gradient(90deg,var(--red),#EF9A9A);}
.neutral::after{background:linear-gradient(90deg,var(--yellow),#FFE082);}
.brackets-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.bracket-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 4px 24px var(--shadow);border-top:3px solid var(--bc);}
.bc-label{font-size:12px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
.bc-range{font-size:10px;font-weight:500;color:var(--muted);}
.bc-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px;}
.bc-row:last-child{border-bottom:none;}
.bc-key{color:var(--muted);font-weight:500;}
.bc-val{font-weight:700;}
.pos{color:#2E7D32;} .neg{color:var(--red);} .warn{color:var(--orange);}
.x-rec{margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(0,66,37,0.04);font-size:11px;}
.x-rec-label{color:var(--muted);font-weight:500;margin-bottom:3px;}
.x-rec-val{font-size:18px;font-weight:900;letter-spacing:-0.5px;}
.pipeline-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.car-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:0 3px 16px var(--shadow);display:flex;flex-direction:column;gap:6px;}
.car-top{display:flex;align-items:center;justify-content:space-between;}
.car-regnr{font-size:15px;font-weight:800;color:var(--green);letter-spacing:0.3px;}
.car-model{font-size:12px;color:var(--muted);font-weight:500;}
.car-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;}
.b-mottatt{background:var(--blu-bg);color:var(--blue);}
.b-produksjon{background:#F3E5F5;color:#6A1B9A;}
.b-auksjon{background:#E8EAF6;color:#283593;}
.b-ferdig{background:#E8F5E9;color:#2E7D32;}
.car-days{font-size:11px;font-weight:600;}
.days-ok{color:var(--accent);} .days-warn{color:var(--orange);} .days-over{color:var(--red);}
.car-detail{font-size:11px;color:var(--muted);display:flex;gap:10px;}
.progress-bar{height:4px;background:rgba(0,66,37,0.08);border-radius:99px;overflow:hidden;margin-top:4px;}
.progress-fill{height:100%;border-radius:99px;transition:width 0.6s ease;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.table-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 4px 24px var(--shadow);}
.th{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.th-title{font-size:13px;font-weight:700;}
.th-badge{font-size:11px;background:var(--bg0);color:var(--muted);padding:3px 10px;border-radius:99px;}
.th-note{font-size:10px;color:var(--muted);font-style:italic;padding:6px 18px 10px;border-bottom:1px solid var(--border);background:rgba(0,66,37,0.015);}
table{width:100%;border-collapse:collapse;}
thead tr{background:rgba(0,66,37,0.03);}
th{text-align:left;font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:var(--muted);padding:9px 14px;border-bottom:1px solid var(--border);}
td{padding:10px 14px;font-size:12px;border-bottom:1px solid rgba(0,66,37,0.04);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(0,66,37,0.015);}
.regnr{font-weight:700;color:var(--green);font-size:13px;}
.car-name{font-size:11px;color:var(--muted);display:block;margin-top:1px;}
.gap-bar-wrap{width:60px;height:5px;background:rgba(0,66,37,0.08);border-radius:99px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px;}
.gap-bar{height:100%;border-radius:99px;}
.plot-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 4px 24px var(--shadow);}
.plot-title{font-size:13px;font-weight:700;margin-bottom:4px;}
.plot-explain{font-size:11px;color:var(--muted);padding:10px 14px;background:rgba(0,66,37,0.03);border-radius:8px;margin-bottom:14px;line-height:1.6;}
canvas{width:100%;border-radius:8px;}
.mode-section{display:none;}
.mode-section.visible{display:block;}
.loading{text-align:center;padding:80px;color:var(--muted);font-size:14px;}
.spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:12px;}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){
  .dials-grid{grid-template-columns:repeat(2,1fr);}
  .brackets-grid{grid-template-columns:repeat(2,1fr);}
  .two-col{grid-template-columns:1fr;}
  header{padding:0 20px;}
  main{padding:24px 16px 60px;}
}
.sla-bar-wrap{height:5px;background:rgba(0,66,37,0.08);border-radius:99px;overflow:hidden;width:80px;display:inline-block;vertical-align:middle;margin-left:6px;}
.sla-bar{height:100%;border-radius:99px;transition:width 0.4s;}
</style>
</head>
<body>
<header>
  <div class="logo">
    <img src="https://raw.githubusercontent.com/mikeljungbergtvedt/mikeljungbergtvedt.github.io/main/Peasy_Logo_Hvit_gulSpoiler.png" alt="Peasy">
  </div>
  <div class="header-right">
    <a href="https://mikeljungbergtvedt.github.io/peasyportal.html" style="font-size:11px;color:rgba(255,255,255,0.35);text-decoration:none;padding:4px 8px;border-radius:99px;transition:color 0.15s" onmouseover="this.style.color='rgba(255,255,255,0.7)'" onmouseout="this.style.color='rgba(255,255,255,0.35)'">&#8592; portal</a>
    <div class="mode-toggle">
      <button class="mode-btn active" id="btn-ops" onclick="setMode('ops')">Operasjonelt</button>
      <button class="mode-btn" id="btn-fin" onclick="setMode('fin')">Finansielt</button>
      <button class="mode-btn" id="btn-eval" onclick="setMode('eval')">Evaluert</button>
    </div>
    <div class="pill"><div class="pulse-dot"></div><span id="clock">&#8211;</span></div>
  </div>
</header>
<main>
  <div id="app"><div class="loading"><div class="spinner"></div><br>Henter data fra Autoringen&#8230;</div></div>
</main>
<script>
const API      = 'https://api.biladministrasjon.no/public/reports/peasy/dhqui7Hkl54?output=xlsx';
const TARGETS  = { evalMottatt: 10, mottattSolgt: 70, prodDays: 3 };
const CUTOFF   = new Date('2025-11-01');
const BRACKETS = [
  { name:'Lav',     range:'0-100k',   lo:0,      hi:100000,  color:'#00875A' },
  { name:'Mid',     range:'100-250k', lo:100000,  hi:250000,  color:'#1565C0' },
  { name:'Hoy',     range:'250-400k', lo:250000,  hi:400000,  color:'#E65100' },
  { name:'Premium', range:'400k+',    lo:400000,  hi:9999999, color:'#6A1B9A' },
];
let currentMode = 'ops';

function setMode(m) {
  currentMode = m;
  document.getElementById('btn-ops').classList.toggle('active', m==='ops');
  document.getElementById('btn-fin').classList.toggle('active', m==='fin');
  document.getElementById('btn-eval').classList.toggle('active', m==='eval');
  document.querySelectorAll('.mode-section').forEach(function(el) {
    el.classList.toggle('visible', el.dataset.mode === m);
  });
  if (m === 'eval' && window._lastData && window._lastRows) {
    renderEvalSection(window._lastRows, window._lastData);
  }
  if (m === 'fin') {
    setTimeout(function() {
      if (typeof drawScatter === 'function' && window._lastData) {
        drawScatter(window._lastData.sold, window._lastData.returned);
      }
    }, 100);
  }
}

function parseDLow(val) {
  if (!val || val === '-') return null;
  var s = String(val).replace(/\s|\u00a0/g,'');
  var n = parseInt(s.split('-')[0]);
  return isNaN(n) ? null : n;
}

function parseDate(val) {
  if (!val) return null;
  var s = String(val).trim().slice(0,10);
  var parts = s.split('.');
  if (parts.length === 3) return new Date(parts[2]+'-'+parts[1]+'-'+parts[0]);
  return null;
}

function daysAgo(val) {
  if (!val) return '-';
  var d = parseDate(val);
  if (!d || isNaN(d)) return '-';
  var n = Math.floor((Date.now() - d) / 86400000);
  if (n === 0) return 'I dag';
  if (n === 1) return 'I gar';
  return n+'d siden';
}

function renderEvalSection(rows, data) {
  // Chart 1: Eval og bestilt
  var fD = function(s) {
    if (!s) return null;
    var p = String(s).trim().split('.');
    return p.length === 3 ? p[2]+'-'+p[1]+'-'+p[0] : null;
  };
  var today = new Date(), days = [], ev = [], ak = [];
  for (var i = 29; i >= 0; i--) {
    var d = new Date(today); d.setDate(d.getDate()-i);
    days.push(d.toLocaleDateString('nb-NO',{day:'2-digit',month:'2-digit'}));
    ev.push(0); ak.push(0);
  }
  rows.forEach(function(r) {
    var rd = String(r[13]||'').trim(); if (!rd) return;
    var ds = new Date(fD(rd)).toLocaleDateString('nb-NO',{day:'2-digit',month:'2-digit'});
    var idx = days.indexOf(ds); if (idx >= 0) ev[idx]++;
  });
  rows.forEach(function(r) {
    var gd = r[15]&&String(r[15]).trim()?String(r[15]).trim().split(' ')[0]:null;
    var ld = r[16]&&String(r[16]).trim()?String(r[16]).trim().split(' ')[0]:null;
    var ad = gd||ld; if (!ad) return;
    var ds = new Date(fD(ad)).toLocaleDateString('nb-NO',{day:'2-digit',month:'2-digit'});
    var idx = days.indexOf(ds); if (idx >= 0) ak[idx]++;
  });

  var c1 = document.getElementById('evalDayChart');
  if (c1) {
    var ex1 = Chart.getChart(c1); if (ex1) ex1.destroy();
    new Chart(c1, {data:{labels:days,datasets:[
      {type:'bar',label:'Eval',data:ev,backgroundColor:'rgba(0,66,37,0.2)',yAxisID:'y2',order:2},
      {type:'bar',label:'Bestilt',data:ak,backgroundColor:'rgba(0,135,90,0.65)',yAxisID:'y2',order:2},
      {type:'line',data:days.map(function(_,i){
        var e=ev.slice(Math.max(0,i-6),i+1).reduce(function(a,b){return a+b;},0);
        var a=ak.slice(Math.max(0,i-6),i+1).reduce(function(a,b){return a+b;},0);
        return e>0?Math.round(a/e*100):null;
      }),borderColor:'#C62828',borderWidth:2,pointRadius:2,tension:0.4,yAxisID:'y',spanGaps:true,order:1},
      {type:'line',data:days.map(function(){return 20;}),borderColor:'rgba(198,40,40,0.3)',borderWidth:1,borderDash:[4,3],pointRadius:0,yAxisID:'y',order:1}
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{mode:'index',intersect:false}},
    scales:{
      x:{ticks:{color:'#888',font:{size:10},maxTicksLimit:10},grid:{display:false},border:{display:false}},
      y:{min:0,max:100,position:'left',ticks:{color:'#C62828',font:{size:10},callback:function(v){return v+'%';}},grid:{color:'rgba(0,0,0,0.04)'},border:{display:false}},
      y2:{position:'right',ticks:{color:'#888',font:{size:10},callback:function(v){return v+' stk';}},grid:{display:false},border:{display:false}}
    }}});
  }

  // Chart 2: Solgt vs mottatt
  var days2 = [], rc = [], sl = [];
  for (var j = 29; j >= 0; j--) {
    var d2 = new Date(today); d2.setDate(d2.getDate()-j);
    days2.push(d2.toLocaleDateString('nb-NO',{day:'2-digit',month:'2-digit'}));
    rc.push(0); sl.push(0);
  }
  var tD2 = function(v) {
    var x = parseDate(v);
    return x ? x.toLocaleDateString('nb-NO',{day:'2-digit',month:'2-digit'}) : null;
  };
  (data && data.mottatt || []).forEach(function(car) {
    var s = tD2(car.rDate); var i = days2.indexOf(s); if (i >= 0) rc[i]++;
  });
  (data && data.sold || []).forEach(function(car) {
    var s = tD2(car.sDate); var i = days2.indexOf(s); if (i >= 0) sl[i]++;
  });

  var c2 = document.getElementById('soldRecvChart');
  if (c2) {
    var ex2 = Chart.getChart(c2); if (ex2) ex2.destroy();
    // Compute sold rate per day for % axis
    var soldPct2 = days2.map(function(_,i){return rc[i]>0?Math.round(sl[i]/rc[i]*100):null;});
    new Chart(c2, {data:{labels:days2,datasets:[
      {type:'bar',label:'Mottatt',data:rc,backgroundColor:'rgba(0,66,37,0.2)',yAxisID:'y2',order:2},
      {type:'bar',label:'Solgt',data:sl,backgroundColor:'rgba(0,135,90,0.65)',yAxisID:'y2',order:2},
      {type:'line',data:soldPct2,borderColor:'#00875A',borderWidth:2,pointRadius:2,tension:0.4,yAxisID:'y',spanGaps:true,order:1},
      {type:'line',data:days2.map(function(){return 70;}),borderColor:'rgba(0,135,90,0.3)',borderWidth:1,borderDash:[4,3],pointRadius:0,yAxisID:'y',order:1}
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{mode:'index',intersect:false}},
    scales:{
      x:{ticks:{color:'#888',font:{size:10},maxTicksLimit:10},grid:{display:false},border:{display:false}},
      y:{min:0,max:100,position:'left',ticks:{color:'#00875A',font:{size:10},callback:function(v){return v+'%';}},grid:{color:'rgba(0,0,0,0.04)'},border:{display:false}},
      y2:{position:'right',ticks:{color:'#888',font:{size:10},callback:function(v){return v+' stk';}},grid:{display:false},border:{display:false}}
    }}});
  }

  // Aksept-tabell
  var badge = document.getElementById('aksept-badge');
  var tb = document.getElementById('aksept-tbody');
  if (!tb) return;
  var aksept = rows.filter(function(r){
    return (r[15]&&String(r[15]).trim())||(r[16]&&String(r[16]).trim());
  }).sort(function(a,b){
    return new Date(fD(String(b[15]||b[16]||'').split(' ')[0]))-new Date(fD(String(a[15]||a[16]||'').split(' ')[0]));
  }).slice(0,40);
  if (badge) badge.textContent = aksept.length+' biler';
  tb.innerHTML = aksept.map(function(r){
    var ed=String(r[13]||'').trim();
    var gd=r[15]&&String(r[15]).trim()?String(r[15]).trim().split(' ')[0]:null;
    var ld=r[16]&&String(r[16]).trim()?String(r[16]).trim().split(' ')[0]:null;
    var ad=gd||ld;
    var diff=ed&&ad?Math.round((new Date(fD(ad))-new Date(fD(ed)))/864e5):'-';
    return '<tr style="border-bottom:0.5px solid rgba(0,66,37,0.06)">'
      +'<td style="padding:8px 12px;font-family:monospace;font-size:11px;font-weight:700;color:#7C3AED">'+(r[1]||'')+'</td>'
      +'<td style="padding:8px 12px;font-size:12px">'+(r[6]||'')+' '+(r[7]||'')+' '+(r[8]||'')+'</td>'
      +'<td style="padding:8px 12px;font-size:12px;color:#667A72">'+ed+'</td>'
      +'<td style="padding:8px 12px;font-size:12px">'+(ad||'')+'</td>'
      +'<td style="padding:8px 12px;font-size:12px;font-weight:700;color:'+(diff<=3?'#2E7D32':'#667A72')+'">'+diff+'d</td>'
      +'<td style="padding:8px 12px;font-size:11px;color:#667A72">'+(gd?'Gire':'Levere selv')+'</td>'
      +'</tr>';
  }).join('');
}

function fmtK(n)   { return n ? Math.round(n/1000).toLocaleString('nb-NO')+'k' : '-'; }
function fmtPct(n) { if (n===null||n===undefined) return '-'; return (n>0?'+':'')+n.toFixed(1)+'%'; }
function fmtDate(val) {
  if (!val) return '-';
  var d = parseDate(val);
  if (!d || isNaN(d)) return '-';
  return d.toLocaleDateString('nb-NO', { day:'numeric', month:'short' });
}
function pct(n, of) { return of ? Math.round(n/of*100) : 0; }
function avg(arr)   { return arr.length ? arr.reduce(function(a,b){return a+b;},0)/arr.length : null; }

async function loadData() {
  var res = await fetch(API);
  var buf = await res.arrayBuffer();
  var wb  = XLSX.read(buf, { type:'array' });
  var ws  = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws, { header:1 });
}

function processData(rows) {
  var data = { evaluated:[], mottatt:[], sold:[], returned:[], inProd:[] };
  for (var i = 1; i < rows.length; i++) {
    var r     = rows[i];
    var regnr = r[1];
    if (!regnr) continue;
    var nDate = parseDate(r[13]);
    if (nDate && nDate < CUTOFF) continue;
    var merke  = r[6]  || '';
    var modell = r[7]  || '';
    var year   = r[8]  || '';
    var label  = [merke, modell, year].filter(Boolean).join(' ');
    var dLow   = parseDLow(r[3]);
    var t      = r[19] ? parseInt(String(r[19]).replace(/[\s\u00a0]/g,'')) || null : null;
    var u      = r[20] ? parseInt(String(r[20]).replace(/[\s\u00a0]/g,'')) || null : null;
    var rDate  = r[17] && String(r[17]).trim() !== '' ? r[17] : null;
    var sDate  = r[18] && String(r[18]).trim() !== '' ? r[18] : null;
    var vDate  = r[21] && String(r[21]).trim() !== '' ? r[21] : null;
    var km     = r[22];
    var status = String(r[12] || '');
    var car = { regnr:regnr, label:label, merke:merke, modell:modell, year:year, dLow:dLow, t:t, u:u, rDate:rDate, sDate:sDate, vDate:vDate, km:km, status:status, registrertDato:r[13] };
    if (dLow)  data.evaluated.push(car);
    if (rDate) data.mottatt.push(car);
    if (sDate && dLow && t) {
      var e = (t && u) ? t - u : t;
      data.sold.push(Object.assign({}, car, {e:e, gap:(e-dLow)/dLow*100}));
    }
    if (vDate && dLow && t && t > 0) {
      var e2 = (t && u) ? t - u : t;
      data.returned.push(Object.assign({}, car, {e:e2, gap:(e2-dLow)/dLow*100}));
    }
    if (rDate && !sDate && !vDate) {
      var mottattDate = parseDate(rDate);
      var daysSinceMottatt = mottattDate ? Math.floor((Date.now()-mottattDate)/86400000) : null;
      data.inProd.push(Object.assign({}, car, {daysSinceMottatt:daysSinceMottatt, mottattDate:mottattDate}));
    }
  }
  return data;
}

function bracketStats(data) {
  return BRACKETS.map(function(b) {
    var evalB = data.evaluated.filter(function(c){return c.dLow>=b.lo&&c.dLow<b.hi;});
    var motB  = data.mottatt.filter(function(c){return c.dLow>=b.lo&&c.dLow<b.hi;});
    var soldB = data.sold.filter(function(c){return c.dLow>=b.lo&&c.dLow<b.hi;});
    var retB  = data.returned.filter(function(c){return c.dLow>=b.lo&&c.dLow<b.hi;});
    var avgGapSolgt = avg(soldB.filter(function(c){return c.gap>-40;}).map(function(c){return c.gap;}));
    var recX  = avgGapSolgt !== null ? +avgGapSolgt.toFixed(1) : 3.0;
    var rejB  = data.evaluated.filter(function(c){return c.status==='Avvist by customer'&&c.dLow>0&&c.dLow>=b.lo&&c.dLow<b.hi;});
    return Object.assign({}, b, {
      evalCount:evalB.length, motCount:motB.length, soldCount:soldB.length, retCount:retB.length, rejCount:rejB.length,
      convRate:pct(motB.length,evalB.length), soldRate:pct(soldB.length,motB.length),
      avgGapSolgt:avgGapSolgt, avgGapRet:avg(retB.filter(function(c){return c.gap>-40;}).map(function(c){return c.gap;})), recX:recX
    });
  });
}

function drawArc(svgEl, valuePct, color) {
  var r=46, cx=55, cy=60;
  var angle = Math.PI - (valuePct/100) * Math.PI;
  var x = cx + r*Math.cos(angle);
  var y = cy + r*Math.sin(angle);
  svgEl.innerHTML = '<path d="M '+(cx-r)+' '+cy+' A '+r+' '+r+' 0 0 1 '+(cx+r)+' '+cy+'" fill="none" stroke="rgba(0,66,37,0.08)" stroke-width="8" stroke-linecap="round"/>'
    +'<path d="M '+(cx-r)+' '+cy+' A '+r+' '+r+' 0 0 1 '+x+' '+y+'" fill="none" stroke="'+color+'" stroke-width="8" stroke-linecap="round"/>'
    +'<circle cx="'+x+'" cy="'+y+'" r="4" fill="'+color+'"/>';
}

function daysClass(d, target) {
  if (d <= target)      return 'days-ok';
  if (d <= target * 2)  return 'days-warn';
  return 'days-over';
}

function statusBadge(s) {

}

function workHoursElapsed(from) {
  var workStart = 8, workEnd = 16;
  var now = new Date();
  var total = 0;
  var cur = new Date(from);
  while (cur < now) {
    var day = cur.getDay();
    if (day===0||day===6){cur.setDate(cur.getDate()+1);cur.setHours(workStart,0,0,0);continue;}
    var dayStart=new Date(cur);dayStart.setHours(workStart,0,0,0);
    var dayEnd=new Date(cur);dayEnd.setHours(workEnd,0,0,0);
    if(cur<dayStart){cur=dayStart;continue;}
    if(cur>=dayEnd){cur.setDate(cur.getDate()+1);cur.setHours(workStart,0,0,0);continue;}
    var periodEnd=now<dayEnd?now:dayEnd;
    total+=Math.floor((periodEnd-cur)/60000);
    cur=dayEnd;
  }
  return {h:Math.floor(total/60),m:total%60,total:Math.floor(total/60)};
}

    var xColor = b.recX>3?'#2E7D32':b.recX<0?'#C62828':'#1565C0';
    finHtml += '<div class="bracket-card" style="--bc:'+b.color+'"><div class="bc-label" style="color:'+b.color+'">'+b.name+' <span class="bc-range">'+b.range+'</span></div>'
      +'<div class="bc-row"><span class="bc-key">Evaluert</span><span class="bc-val">'+b.evalCount+'</span></div>'
      +'<div class="bc-row"><span class="bc-key">Evaluering avvist av kunde</span><span class="bc-val '+(b.rejCount>0&&(b.rejCount/b.evalCount)>0.28?'neg':b.rejCount>0&&(b.rejCount/b.evalCount)<0.22?'pos':'warn')+'">'+b.rejCount+' <span style="color:var(--muted);font-weight:400">('+( b.evalCount>0?Math.round(b.rejCount/b.evalCount*100):0)+'%)</span></span></div>'
      +'<div class="bc-row"><span class="bc-key">Mottatt</span><span class="bc-val">'+b.motCount+' <span style="color:var(--muted);font-weight:400">('+b.convRate+'%)</span></span></div>'
      +'<div class="bc-row"><span class="bc-key">Solgt</span><span class="bc-val">'+b.soldCount+' <span style="color:var(--muted);font-weight:400">('+b.soldRate+'%)</span></span></div>'
      +'<div class="bc-row"><span class="bc-key">Returnert</span><span class="bc-val '+(b.retCount>0?'neg':'')+'">'+b.retCount+'</span></div>'
      +'<div class="bc-row"><span class="bc-key">Avg Bud/Pris (solgt)</span><span class="bc-val '+(b.avgGapSolgt>=0?'pos':'warn')+'">'+fmtPct(b.avgGapSolgt)+'</span></div>'
      +'<div class="bc-row"><span class="bc-key">Avg Bud/Pris (returnert)</span><span class="bc-val neg">'+fmtPct(b.avgGapRet)+'</span></div>'
      +'<div class="x-rec"><div class="x-rec-label">Anbefalt X% (dynamisk)</div><div class="x-rec-val" style="color:'+xColor+'">'+(b.recX>0?'+':'')+b.recX+'%</div></div>'
      +'</div>';
  }
  finHtml += '</div>'
    +'<div class="section-label">Pris lav vs Bud &#8212; Alle biler</div>'
    +'<div class="plot-card"><div class="plot-title">Prisnoyaktighet: Pris lav vs Hoyeste bud</div>'
    +'<div class="plot-explain"><strong>Hva viser dette?</strong> Hver prikk er en bil. X-aksen er <em>Pris lav</em>. Y-aksen er <em>Hoyeste bud</em>. Stiplede linjen er perfekt treff. Gronne prikker over linjen = bud hoyere enn Pris lav (bra). Rode prikker under = returneringsrisiko.</div>'
    +'<canvas id="scatter" height="300"></canvas></div>'
    +'<div class="section-label">Kostbare returneringer &amp; beste pristreff</div>'
    +'<div class="two-col"><div class="table-card"><div class="th"><div class="th-title">&#10060; Verste returneringer</div><div class="th-badge">'+totalRet+' totalt</div></div>'
    +'<div class="th-note">&#9888;&#65039; No-cure kostnad (~3 000 kr) er et grovt estimat.</div>'
    +'<table><thead><tr><th>Regnr / Bil</th><th>Pris lav</th><th>Bud</th><th>Gap</th><th>Est. kostnad</th></tr></thead><tbody>';
  var worstRet = data.returned.slice().sort(function(a,b){return a.gap-b.gap;}).slice(0,10);
  for (var n = 0; n < worstRet.length; n++) {
    var wr = worstRet[n];
    finHtml += '<tr><td><span class="regnr">'+wr.regnr+'</span><span class="car-name">'+(wr.label||'-')+'</span></td><td>'+fmtK(wr.dLow)+'</td><td>'+fmtK(wr.e)+'</td><td><span style="color:var(--red);font-weight:700">'+fmtPct(wr.gap)+'</span><div class="gap-bar-wrap"><div class="gap-bar" style="width:'+Math.min(Math.abs(wr.gap),100)+'%;background:var(--red)"></div></div></td><td style="color:var(--red);font-weight:600">~3 000 kr</td></tr>';
  }
  finHtml += '</tbody></table></div>'
    +'<div class="table-card"><div class="th"><div class="th-title">&#10003; Beste pristreff (solgte)</div><div class="th-badge">Bud naermest Pris lav</div></div>'
    +'<table><thead><tr><th>Regnr / Bil</th><th>Pris lav</th><th>Bud</th><th>Gap</th></tr></thead><tbody>';
  var bestSold = data.sold.slice().sort(function(a,b){return Math.abs(a.gap)-Math.abs(b.gap);}).slice(0,10);
  for (var o = 0; o < bestSold.length; o++) {
    var bs2 = bestSold[o];
    var col2 = bs2.gap>=0?'#2E7D32':bs2.gap>-5?'#E65100':'#C62828';
    finHtml += '<tr><td><span class="regnr">'+bs2.regnr+'</span><span class="car-name">'+(bs2.label||'-')+'</span></td><td>'+fmtK(bs2.dLow)+'</td><td>'+fmtK(bs2.e)+'</td><td style="color:'+col2+';font-weight:700">'+fmtPct(bs2.gap)+'</td></tr>';
  }
  finHtml += '</tbody></table></div></div>';

  document.getElementById('app').innerHTML = dials
    +'<div class="mode-section'+(currentMode==='ops'?' visible':'')+'" data-mode="ops">'+opsHtml+'</div>'
    +'<div class="mode-section'+(currentMode==='fin'?' visible':'')+'" data-mode="fin">'+finHtml+'</div>'
    +'<div class="mode-section'+(currentMode==='eval'?' visible':'')+'" data-mode="eval">'+buildEvalHtml(data, rows)+'</div>';

  requestAnimationFrame(function() {
    drawArc(document.getElementById('arc0'), 100, '#004225');
    drawArc(document.getElementById('arc1'), Math.min(mottattRate/20*100,100), mottOk?'#4CAF50':'#C62828');
    drawArc(document.getElementById('arc2'), Math.min(soldRate/100*100,100), sldOk?'#4CAF50':'#C62828');
    drawArc(document.getElementById('arc3'), Math.min(data.inProd.length/20*100,100), '#1565C0');
    var gapNorm = avgGapSolgt!==null?Math.min(Math.max((avgGapSolgt+20)/40*100,0),100):50;
    drawArc(document.getElementById('arc4'), gapNorm, avgGapSolgt>=0?'#4CAF50':'#E65100');
    drawArc(document.getElementById('arc5'), Math.min(totalU/1000000*100,100), '#00875A');
    drawArc(document.getElementById('arc6'), Math.min(todayCount/10*100,100), '#1565C0');
    if (currentMode === 'eval') renderEvalSection(rows, data);
    drawScatter(window._lastData.sold, window._lastData.returned);
  });
}

function drawScatter(sold, returned) {
  var canvas = document.getElementById('scatter');
  if (!canvas) return;
  canvas.style.display='block'; canvas.style.width='100%';
  var ctx = canvas.getContext('2d');
  var W = (canvas.offsetWidth>0?canvas.offsetWidth:(canvas.parentElement?.offsetWidth||1200)), H = 300;
  canvas.width=W*window.devicePixelRatio; canvas.height=H*window.devicePixelRatio;
  canvas.style.height=H+'px'; ctx.scale(window.devicePixelRatio,window.devicePixelRatio);
  var all = sold.map(function(c){return Object.assign({},c,{type:'sold'});}).concat(returned.map(function(c){return Object.assign({},c,{type:'ret'});}));
  var maxV = Math.max.apply(null, all.map(function(c){return Math.max(c.dLow,c.e||0);}).concat([500000]));
  var pad = {l:55,r:20,t:20,b:44};
  var pw=W-pad.l-pad.r, ph=H-pad.t-pad.b;
  var sx=function(v){return pad.l+(v/maxV)*pw;};
  var sy=function(v){return pad.t+ph-(v/maxV)*ph;};
  ctx.strokeStyle='rgba(0,66,37,0.06)'; ctx.lineWidth=1;
  for (var i=0;i<=5;i++){
    var x=pad.l+(i/5)*pw, y=pad.t+(i/5)*ph;
    ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,pad.t+ph);ctx.stroke();
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+pw,y);ctx.stroke();
    if(i>0){ctx.fillStyle='#bbb';ctx.font='9px Inter';ctx.textAlign='center';ctx.fillText(Math.round(maxV/5*i/1000)+'k',x,pad.t+ph+14);ctx.textAlign='right';ctx.fillText(Math.round(maxV/5*(5-i)/1000)+'k',pad.l-6,pad.t+(i/5)*ph+4);}
  }
  ctx.strokeStyle='rgba(0,66,37,0.2)';ctx.setLineDash([5,4]);ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(sx(0),sy(0));ctx.lineTo(sx(maxV),sy(maxV));ctx.stroke();ctx.setLineDash([]);
  for (var j=0;j<all.length;j++){
    var c=all[j];
    ctx.beginPath();ctx.arc(sx(c.dLow),sy(c.e||0),5,0,Math.PI*2);
    ctx.fillStyle=c.type==='sold'?'rgba(0,135,90,0.7)':'rgba(198,40,40,0.75)';ctx.fill();
    ctx.strokeStyle=c.type==='sold'?'#00875A':'#C62828';ctx.lineWidth=1;ctx.stroke();
  }
  ctx.fillStyle='#999';ctx.font='10px Inter';ctx.textAlign='center';
  ctx.fillText('Pris lav (tilbud til selger)',pad.l+pw/2,H-4);
  ctx.save();ctx.translate(12,pad.t+ph/2);ctx.rotate(-Math.PI/2);ctx.fillText('Hoyeste bud (pa auksjon)',0,0);ctx.restore();
}
