<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peasy – selg bilen enkelt</title>
<style>
  :root{
    --bg:#fbfaf7;
    --ink:#101814;
    --ink2:#6b7570;
    --line:#e6e3da;
    --soft:#f1efe8;
    --accent:#ffcc33;
    --accent2:#ffe48a;
    --font:"Inter","SF Pro Display",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Helvetica,Arial,sans-serif;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;
    -webkit-font-smoothing:antialiased}
  body{display:flex;align-items:center;justify-content:center}

  #stage{position:relative;flex:none;width:1080px;height:1920px;overflow:hidden;background:var(--bg);transform-origin:center center}
  #stage::before{content:"";position:absolute;left:50%;top:1150px;width:1400px;height:1400px;margin-left:-700px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,204,51,.10),rgba(255,204,51,0) 60%);pointer-events:none}

  /* play overlay */
  .overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
    background:rgba(251,250,247,.96);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}
  .overlay.show{opacity:1;pointer-events:auto}
  .ov-logo{position:relative;font-size:150px;font-weight:900;letter-spacing:-.06em;line-height:1;margin-bottom:150px}
  .ov-logo .sp{position:absolute;right:-30px;top:-10px;width:80px;height:52px}
  .ov-logo .sp svg{width:100%;height:100%;overflow:visible}
  .play{position:relative;width:300px;height:300px;border-radius:50%;border:0;background:var(--accent);cursor:pointer;
    display:flex;align-items:center;justify-content:center;box-shadow:0 40px 90px rgba(255,204,51,.45),0 0 0 0 rgba(255,204,51,.5);
    transition:transform .25s var(--ease),box-shadow .25s var(--ease);-webkit-tap-highlight-color:transparent;outline:none}
  .play:hover,.play:focus-visible{transform:scale(1.05);box-shadow:0 50px 110px rgba(255,204,51,.55),0 0 0 24px rgba(255,204,51,.18)}
  .play:active{transform:scale(.96)}
  .play::before{content:"";position:absolute;inset:-26px;border-radius:50%;border:3px solid rgba(255,204,51,.55);animation:playRing 2.2s ease-out infinite}
  @keyframes playRing{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.45);opacity:0}}
  .play svg{width:110px;height:110px;margin-left:16px}
  .play path{fill:var(--ink)}
  .play-label{margin-top:60px;font-size:40px;font-weight:600;color:var(--ink2);letter-spacing:-.01em}

  /* progress + hint */
  .progress{position:absolute;left:80px;right:80px;bottom:96px;height:4px;border-radius:2px;background:var(--line);z-index:5}
  .progress i{display:block;height:100%;width:0;border-radius:2px;background:var(--accent)}
  .dots{position:absolute;left:0;right:0;bottom:130px;display:flex;justify-content:center;gap:10px;z-index:5}
  .dots b{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .3s,transform .3s}
  .dots b.cur{background:var(--ink);transform:scale(1.25)}
  .brand{position:absolute;top:96px;left:0;right:0;text-align:center;font-size:26px;font-weight:700;letter-spacing:.28em;
    text-transform:uppercase;color:var(--ink2);z-index:5}
  .brand i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-right:14px;vertical-align:2px}

  /* scenes */
  .scene{position:absolute;inset:0;display:none;opacity:0}
  .scene.on{display:block;animation:sceneIn .55s var(--ease) forwards}
  .scene.out{animation:sceneOut .4s ease-in forwards}
  @keyframes sceneIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  @keyframes sceneOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-24px)}}

  /* kinetic headline */
  .h{position:absolute;left:100px;right:100px;top:330px;text-align:center;font-size:108px;font-weight:800;letter-spacing:-.035em;line-height:1.08}
  .h .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .06em;margin:0 -.06em}
  .h .w span{display:inline-block;transform:translateY(115%);animation:wordIn .7s var(--ease) forwards}
  @keyframes wordIn{to{transform:translateY(0)}}
  .h .w.hl span{background:linear-gradient(var(--accent),var(--accent)) no-repeat 0 78%/0 .28em;animation:wordIn .7s var(--ease) forwards,mark .5s .6s var(--ease) forwards}
  @keyframes mark{to{background-size:100% .28em}}
  .h .w.dim span{color:var(--ink2)}
  .sub{position:absolute;left:0;right:0;top:600px;text-align:center;font-size:30px;color:var(--ink2);letter-spacing:.02em;
    opacity:0;animation:fadeUp .6s .9s var(--ease) forwards}

  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  @keyframes popC{0%{opacity:0;transform:translate(var(--tx,0),var(--ty,0)) scale(.7)}65%{transform:translate(var(--tx,0),var(--ty,0)) scale(1.05)}100%{opacity:1;transform:translate(var(--tx,0),var(--ty,0)) scale(1)}}
  @keyframes pop{0%{opacity:0;transform:scale(.7)}65%{transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
  @keyframes blink{50%{opacity:0}}

  /* ===== 1: plate input ===== */
  .field{position:absolute;left:50%;top:1000px;--tx:-50%;transform:translate(-50%,0);width:820px;height:170px;border-radius:34px;
    border:3px solid var(--line);background:#fff;display:flex;align-items:center;padding:0 54px;gap:22px;
    box-shadow:0 20px 60px rgba(16,24,20,.06);opacity:0;animation:popC .6s .5s var(--ease) forwards,fieldOk .4s 2.7s forwards}
  @keyframes fieldOk{to{border-color:var(--accent);box-shadow:0 20px 60px rgba(255,204,51,.25)}}
  .field .flag{width:70px;height:100px;border-radius:12px;background:#003399;color:#fff;font-size:26px;font-weight:700;
    display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px}
  .field .txt{font-size:84px;font-weight:700;letter-spacing:.08em;font-variant-numeric:tabular-nums;display:flex;align-items:center}
  .field .txt span{opacity:0;animation:typeIn .05s forwards}
  @keyframes typeIn{to{opacity:1}}
  .field .caret{width:4px;height:84px;background:var(--ink);margin-left:6px;animation:blink .8s steps(1) infinite,caretOff .1s 2.7s forwards}
  @keyframes caretOff{to{opacity:0;width:0}}
  .field .ok{margin-left:auto;width:72px;height:72px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;
    opacity:0;animation:pop .45s 2.75s var(--ease) forwards}
  .field .ok svg{width:36px;height:36px}
  .field .ok path{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .4s 2.95s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .timer{position:absolute;left:50%;top:1230px;transform:translateX(-50%);font-size:30px;color:var(--ink2);font-variant-numeric:tabular-nums;
    opacity:0;animation:fadeUp .5s .9s forwards}
  .timer b{color:var(--ink)}

  /* ===== 2: cloud ===== */
  .cloud{position:absolute;left:50%;top:780px;--tx:-50%;transform:translate(-50%,0);width:620px;height:300px;opacity:0;animation:popC .7s .4s var(--ease) forwards}
  .cloud i{position:absolute;background:var(--soft);border-radius:50%}
  .cloud i:nth-child(1){left:0;top:120px;width:220px;height:180px;border-radius:110px}
  .cloud i:nth-child(2){left:140px;top:20px;width:250px;height:250px}
  .cloud i:nth-child(3){left:330px;top:70px;width:220px;height:220px}
  .cloud i:nth-child(4){left:200px;top:140px;width:420px;height:160px;border-radius:80px}
  .cloud .name{position:absolute;left:0;right:0;top:160px;text-align:center;font-size:64px;font-weight:800;letter-spacing:-.04em;color:var(--ink)}
  .cloud .name::after{content:"";position:absolute;right:196px;top:-10px;width:44px;height:30px;
    background:var(--accent);clip-path:path("M2 30 Q10 4 44 0 L44 10 Q18 10 6 30 Z")}
  .cloud.lit i{animation:cloudLit .5s 2.2s forwards}
  @keyframes cloudLit{to{background:var(--accent2)}}
  .chip{position:absolute;left:50%;top:1420px;--tx:-50%;transform:translate(-50%,0);padding:22px 44px;border-radius:999px;border:3px solid var(--line);
    background:#fff;font-size:48px;font-weight:700;letter-spacing:.08em;font-variant-numeric:tabular-nums;
    opacity:0;animation:popC .5s .3s var(--ease) forwards,chipGone .5s 1.2s forwards}
  @keyframes chipGone{to{opacity:.25;transform:translate(-50%,0) scale(.9)}}
  .stream{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
  .stream i{position:absolute;left:540px;top:1450px;width:14px;height:14px;border-radius:7px;background:var(--accent);opacity:0;
    animation:rise 1.3s var(--ease) forwards}
  .stream i.bar{width:34px;height:12px;border-radius:6px;background:var(--ink)}
  @keyframes rise{0%{opacity:0;transform:translate(var(--sx),0) scale(.6)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translate(var(--ex),-520px) scale(1)}}

  /* ===== 3: tags ===== */
  .tags{position:absolute;left:110px;right:110px;top:900px;display:flex;flex-wrap:wrap;justify-content:center;gap:22px}
  .tag{padding:24px 40px;border-radius:999px;border:3px solid var(--line);background:#fff;font-size:42px;font-weight:600;letter-spacing:-.01em;
    white-space:nowrap;opacity:0;animation:pop .5s var(--ease) forwards;box-shadow:0 10px 30px rgba(16,24,20,.05)}
  .tag.ac{background:var(--accent);border-color:var(--accent)}
  .carline{position:absolute;left:50%;top:760px;transform:translateX(-50%);width:420px;height:120px;opacity:0;animation:fadeUp .6s .3s forwards}
  .carline path,.carline circle{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}

  /* ===== 4: twins ===== */
  .grid{position:absolute;left:50%;top:820px;transform:translateX(-50%);width:872px;display:grid;grid-template-columns:repeat(4,200px);gap:24px}
  .card{position:relative;height:150px;border-radius:26px;background:#fff;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;
    opacity:0;animation:pop .4s var(--ease) forwards}
  .card svg{width:120px;height:56px}
  .card path,.card circle{fill:none;stroke:#cfcbbf;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .card.dim{animation:pop .4s var(--ease) forwards,cardDim .5s 1.7s forwards,cardGone .5s 2.4s forwards}
  @keyframes cardDim{to{opacity:.18}}
  @keyframes cardGone{to{opacity:0;transform:scale(.9)}}
  .card.best{animation:pop .4s var(--ease) forwards,cardBest .4s 1.5s forwards,gather .8s 2.3s var(--ease) forwards}
  @keyframes cardBest{to{background:var(--accent);border-color:var(--accent);transform:scale(1.08)}}
  .card.best path,.card.best circle{stroke:var(--ink)}
  @keyframes gather{to{transform:translate(var(--dx),var(--dy)) scale(.25);opacity:0}}
  .value{position:absolute;left:0;right:0;top:1120px;text-align:center;font-size:150px;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums;
    opacity:0;animation:pop .6s 2.9s var(--ease) forwards}
  .value small{display:block;font-size:30px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--ink2);margin-bottom:10px}
  .value em{font-style:normal;font-size:60px;font-weight:600;color:var(--ink2);margin-right:14px;letter-spacing:0}

  /* ===== 5: phone ===== */
  .phone{position:absolute;left:50%;top:760px;--tx:-50%;transform:translate(-50%,0);width:540px;height:1000px;border-radius:76px;border:5px solid var(--ink);
    background:#fff;overflow:hidden;opacity:0;animation:popC .7s .3s var(--ease) forwards;box-shadow:0 40px 90px rgba(16,24,20,.10)}
  .phone .notch{position:absolute;left:50%;top:22px;transform:translateX(-50%);width:180px;height:38px;border-radius:19px;background:var(--ink)}
  .phone .screen{position:absolute;inset:90px 30px 40px;border-radius:40px;background:var(--soft)}
  .phone .screen i{position:absolute;left:40px;right:40px;height:22px;border-radius:11px;background:#e2dfd4}
  .phone .screen i:nth-child(1){top:60px;width:200px}
  .phone .screen i:nth-child(2){top:110px}
  .phone .screen i:nth-child(3){top:150px;right:140px}
  .phone .screen i:nth-child(4){top:680px;width:260px}
  .phone .screen i:nth-child(5){top:730px}
  .msg{position:absolute;left:46px;right:46px;top:250px;padding:34px 36px;border-radius:34px;background:#fff;box-shadow:0 20px 50px rgba(16,24,20,.12);
    transform:translateY(-500px);animation:msgIn .8s 1s var(--ease) forwards}
  @keyframes msgIn{to{transform:translateY(0)}}
  .msg .from{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:700;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:18px}
  .msg .from i{width:16px;height:16px;border-radius:50%;background:var(--accent)}
  .msg .btn{position:relative;display:flex;align-items:center;justify-content:space-between;padding:26px 32px;border-radius:22px;background:var(--soft);
    font-size:38px;font-weight:700;letter-spacing:-.01em;animation:btnOpen .4s 2.6s forwards}
  @keyframes btnOpen{to{background:var(--accent)}}
  .msg .btn svg{width:44px;height:44px}
  .msg .btn path{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .msg .btn .lock{animation:lockOut .3s 2.5s forwards}
  .msg .btn .arrow{position:absolute;right:32px;opacity:0;animation:fadeUp .3s 2.7s forwards}
  @keyframes lockOut{to{opacity:0;transform:scale(.6)}}
  .tap{position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(16,24,20,.18);opacity:0;animation:tap .6s 2.25s ease-out}
  @keyframes tap{0%{opacity:0;transform:scale(.4)}30%{opacity:1;transform:scale(.8)}100%{opacity:0;transform:scale(1.6)}}

  /* ===== 6: icons ===== */
  .icons{position:absolute;left:0;right:0;top:960px;display:flex;justify-content:center;gap:60px}
  .ic{width:250px;height:250px;border-radius:50%;background:#fff;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;
    opacity:0;animation:pop .45s var(--ease) forwards,icAccent .3s forwards;box-shadow:0 20px 50px rgba(16,24,20,.06)}
  @keyframes icAccent{to{background:var(--accent);border-color:var(--accent)}}
  .ic svg{width:130px;height:130px}
  .ic path,.ic circle,.ic rect{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .h .w.step span{background:linear-gradient(var(--accent),var(--accent)) no-repeat 0 78%/0 .28em;animation:wordIn .7s var(--ease) forwards,mark .4s var(--ease) forwards}

  /* ===== 7: bids ===== */
  .bids{position:absolute;left:50%;top:860px;transform:translateX(-50%);width:760px}
  .bid{position:absolute;left:0;right:0;height:170px;border-radius:34px;border:3px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:space-between;
    padding:0 50px;font-size:64px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
    opacity:0;transform:translateY(340px);animation:bidIn .6s var(--ease) forwards}
  .bid small{font-size:26px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2)}
  .bid .arrow{font-size:40px;color:var(--ink2)}
  @keyframes bidIn{to{opacity:1;transform:translateY(0)}}
  .bid.old{animation:bidIn .6s var(--ease) forwards,bidOld .4s forwards}
  @keyframes bidOld{to{opacity:.35;transform:translateY(0) scale(.96)}}
  .bid.top{animation:bidIn .6s var(--ease) forwards,bidTop .4s forwards}
  @keyframes bidTop{to{background:var(--accent);border-color:var(--accent);transform:translateY(0) scale(1.04);box-shadow:0 30px 70px rgba(255,204,51,.35)}}
  .ping{position:absolute;left:50%;top:1338px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--accent);opacity:0;animation:ping 1s ease-out infinite}
  @keyframes ping{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(14)}}

  /* ===== 8: accept ===== */
  .accept{position:absolute;left:50%;top:1000px;--tx:-50%;transform:translate(-50%,0);width:640px;height:170px;border-radius:85px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:800;letter-spacing:-.01em;
    box-shadow:0 30px 70px rgba(255,204,51,.35);opacity:0;animation:popC .6s .4s var(--ease) forwards,press .25s 1.5s ease-in-out,morph .6s 1.9s var(--ease) forwards}
  @keyframes press{50%{transform:translate(-50%,0) scale(.94)}}
  @keyframes morph{to{width:200px;height:200px;border-radius:50%}}
  .accept .t{animation:tOut .25s 1.9s forwards}
  @keyframes tOut{to{opacity:0}}
  .accept svg{position:absolute;width:96px;height:96px;opacity:0;animation:fadeIn .2s 2.3s forwards}
  @keyframes fadeIn{to{opacity:1}}
  .accept path{fill:none;stroke:var(--ink);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:90;stroke-dashoffset:90;animation:draw .5s 2.4s var(--ease) forwards}
  .ring{position:absolute;left:50%;top:1100px;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;border:4px solid var(--accent);
    opacity:0;animation:ringOut 1.1s 2.5s ease-out}
  @keyframes ringOut{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
  .finger{position:absolute;left:50%;top:1085px;width:130px;height:130px;margin-left:-65px;border-radius:50%;background:rgba(16,24,20,.16);
    opacity:0;animation:tap .6s 1.4s ease-out}
  .paid{position:absolute;left:0;right:0;top:1300px;text-align:center;font-size:34px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink2);
    opacity:0;animation:fadeUp .5s 2.8s forwards}

  /* ===== end ===== */
  .end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .logo{position:relative;font-size:210px;font-weight:900;letter-spacing:-.06em;line-height:1;opacity:0;animation:pop .8s .2s var(--ease) forwards}
  .logo .sp{position:absolute;right:-40px;top:-14px;width:110px;height:72px;opacity:0;transform:scale(.4);transform-origin:right top;
    animation:spoiler .5s .9s var(--ease) forwards}
  .logo .sp svg{width:100%;height:100%;overflow:visible}
  @keyframes spoiler{to{opacity:1;transform:scale(1)}}
  .tagline{margin-top:40px;font-size:56px;font-weight:600;letter-spacing:-.02em;color:var(--ink2);opacity:0;animation:fadeUp .7s 1.1s var(--ease) forwards}
  .tagline b{color:var(--ink)}
</style>
</head>
<body>
<div id="stage">
  <div class="brand"><i></i>Peasy</div>

  <section class="scene" id="s1">
    <div class="h" data-words="Registrer bilen.|10 sekunder." data-hl="3,4"></div>
    <div class="field"><div class="flag">N</div><div class="txt" id="plate"></div><div class="caret"></div>
      <div class="ok"><svg viewBox="0 0 36 36"><path d="M8 19 L15 26 L28 11"/></svg></div></div>
    <div class="timer"><b id="tm">0,0</b> sek</div>
  </section>

  <section class="scene" id="s2">
    <div class="h" data-words="Slås opp|i skyen." data-hl="3"></div>
    <div class="cloud lit"><i></i><i></i><i></i><i></i><div class="name">peasy</div></div>
    <div class="stream" id="stream"></div>
    <div class="chip">AB 12345</div>
  </section>

  <section class="scene" id="s3">
    <div class="h" data-words="Vi kjenner|bilen." data-hl="2"></div>
    <div class="carline"><svg viewBox="0 0 420 120"><path d="M20 90 L32 60 Q40 48 60 46 L120 20 Q140 10 180 10 L260 10 Q300 12 340 46 L380 52 Q400 56 402 72 L402 90 Z"/><circle cx="110" cy="92" r="20"/><circle cx="320" cy="92" r="20"/></svg></div>
    <div class="tags" id="tags"></div>
  </section>

  <section class="scene" id="s4">
    <div class="h" data-words="De beste|tvillingene." data-hl="1"></div>
    <div class="grid" id="grid"></div>
    <div class="value"><small>Verdi</small><em>kr</em><span id="val">0</span></div>
  </section>

  <section class="scene" id="s5">
    <div class="h" data-words="Invitasjon|til MinSide." data-hl="2"></div>
    <div class="phone"><div class="notch"></div>
      <div class="screen"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="msg"><div class="from"><i></i>Peasy</div>
        <div class="btn">Åpne auksjon
          <svg class="lock" viewBox="0 0 44 44"><path d="M12 20 V14 a10 10 0 0 1 20 0 V20 M9 20 H35 V38 H9 Z"/></svg>
          <svg class="arrow" viewBox="0 0 44 44"><path d="M8 22 H34 M24 12 L34 22 L24 32"/></svg>
        </div>
      </div>
      <div class="tap" style="left:300px;top:380px"></div>
    </div>
  </section>

  <section class="scene" id="s6">
    <div class="h" data-words="Vi henter,|vasker,|fotograferer." data-step="1:.5,2:1.2,3:1.9"></div>
    <div class="icons">
      <div class="ic" style="animation-delay:.5s,.7s"><svg viewBox="0 0 130 130"><path d="M14 86 H116 M22 86 V62 Q26 54 36 54 H66 L80 36 H100 Q108 36 110 44 V86"/><circle cx="40" cy="92" r="11"/><circle cx="94" cy="92" r="11"/><path d="M66 54 V36 H80"/></svg></div>
      <div class="ic" style="animation-delay:1.2s,1.4s"><svg viewBox="0 0 130 130"><path d="M65 18 C50 44 36 60 36 80 a29 29 0 0 0 58 0 C94 60 80 44 65 18 Z"/><path d="M50 82 a15 15 0 0 0 15 15"/><path d="M104 22 L104 40 M95 31 L113 31"/></svg></div>
      <div class="ic" style="animation-delay:1.9s,2.1s"><svg viewBox="0 0 130 130"><rect x="16" y="38" width="98" height="70" rx="12"/><path d="M46 38 L54 24 H76 L84 38"/><circle cx="65" cy="72" r="20"/><circle cx="96" cy="54" r="3"/></svg></div>
    </div>
  </section>

  <section class="scene" id="s7">
    <div class="h" data-words="Hele Norges|forhandlere byr." data-hl="4"></div>
    <div class="ping" style="animation-delay:2.6s"></div>
    <div class="bids">
      <div class="bid old" style="top:0;animation-delay:.5s,1.4s"><small>Bud 1</small>238 000 kr</div>
      <div class="bid old" style="top:200px;animation-delay:1.3s,2.2s"><small>Bud 2</small>241 000 kr</div>
      <div class="bid top" style="top:400px;animation-delay:2.1s,2.6s"><small>Bud 3</small>247 000 kr</div>
    </div>
  </section>

  <section class="scene" id="s8">
    <div class="h" data-words="Trykk aksept.|Vi betaler." data-hl="4"></div>
    <div class="accept"><span class="t">Aksepter</span><svg viewBox="0 0 96 96"><path d="M22 50 L42 70 L76 30"/></svg></div>
    <div class="finger"></div><div class="ring"></div>
    <div class="paid">Betalt</div>
  </section>

  <section class="scene" id="s9">
    <div class="end">
      <div class="logo">peasy<span class="sp"><svg viewBox="0 0 70 46"><path fill="#ffcc33" d="M2 46 Q14 6 70 0 L70 14 Q28 14 8 46 Z"/></svg></span></div>
      <div class="tagline">Selg bilen <b>enkelt.</b></div>
    </div>
  </section>

  <div class="overlay show" id="overlay">
    <div class="ov-logo">peasy<span class="sp"><svg viewBox="0 0 70 46"><path fill="#ffcc33" d="M2 46 Q14 6 70 0 L70 14 Q28 14 8 46 Z"/></svg></span></div>
    <button class="play" id="play" aria-label="Spill av"><svg viewBox="0 0 110 110"><path d="M30 18 L92 55 L30 92 Z"/></svg></button>
    <div class="play-label" id="playLabel">Spill av</div>
  </div>
  <div class="dots" id="dots"></div>
  <div class="progress"><i id="bar"></i></div>
</div>

<script>
(function(){
  const TOTAL=30000, L=3400;
  const SCENES=[];
  for(let i=1;i<=8;i++) SCENES.push({id:'s'+i,start:(i-1)*L,end:i*L});
  SCENES.push({id:'s9',start:8*L,end:TOTAL});
  const $=s=>document.querySelector(s);
  const stage=$('#stage');
  const fmt=n=>Math.round(n).toLocaleString('nb-NO').replace(/ |,/g,' ');

  function fit(){ const a=innerWidth/1080,b=innerHeight/1920; const s=(innerWidth<innerHeight)?Math.max(a,b):Math.min(a,b); stage.style.transform='scale('+s+')'; }
  addEventListener('resize',fit); fit();

  const dots=$('#dots'); SCENES.forEach(()=>dots.appendChild(document.createElement('b')));

  /* kinetic headline builder: words appear one by one */
  function headline(el){
    const lines=el.dataset.words.split('|'); const hl=(el.dataset.hl||'').split(',').filter(Boolean).map(Number);
    const steps={}; (el.dataset.step||'').split(',').filter(Boolean).forEach(p=>{const [i,d]=p.split(':');steps[i]=parseFloat(d);});
    el.innerHTML=''; let n=0;
    lines.forEach((line,li)=>{
      line.split(' ').forEach(w=>{
        n++; const o=document.createElement('span'); o.className='w'+(hl.includes(n)?' hl':'')+(steps[n]!==undefined?' step':'');
        const s=document.createElement('span'); s.textContent=w; s.style.animationDelay=(0.15+n*0.11)+'s'+(steps[n]!==undefined?','+(steps[n]+0.2)+'s':'');
        o.appendChild(s); el.appendChild(o); el.appendChild(document.createTextNode(' '));
      });
      if(li<lines.length-1) el.appendChild(document.createElement('br'));
    });
  }

  /* per-scene builders */
  const build={
    s1(){ const el=$('#plate'); el.innerHTML='';
      'AB 12345'.split('').forEach((c,i)=>{const s=document.createElement('span');s.textContent=c===' '?' ':c;s.style.animationDelay=(1.1+i*.17)+'s';el.appendChild(s);}); },
    s2(){ const st=$('#stream'); st.innerHTML='';
      for(let i=0;i<26;i++){ const d=document.createElement('i'); if(i%3===0) d.className='bar';
        d.style.setProperty('--sx',(Math.random()*160-80)+'px'); d.style.setProperty('--ex',(Math.random()*300-150)+'px');
        d.style.animationDelay=(1.0+i*0.055)+'s'; st.appendChild(d);} },
    s3(){ const box=$('#tags'); box.innerHTML='';
      [['Tesla Model Y',1],['Long Range AWD',0],['2022',0],['41 250 km',0],['Hengerfeste',1],['Varmepumpe',0],['Autopilot',0]].forEach((t,i)=>{
        const d=document.createElement('div'); d.className='tag'+(t[1]?' ac':''); d.textContent=t[0]; d.style.animationDelay=(0.7+i*.28)+'s'; box.appendChild(d);}); },
    s4(){ const g=$('#grid'); g.innerHTML=''; const best=[1,6,13,18];
      const car='<svg viewBox="0 0 120 56"><path d="M6 42 L12 28 Q16 22 26 22 L40 10 Q46 6 58 6 L78 6 Q90 8 102 24 L112 28 Q116 32 116 40 L116 42 Z"/><circle cx="32" cy="44" r="8"/><circle cx="90" cy="44" r="8"/></svg>';
      for(let i=0;i<20;i++){ const d=document.createElement('div'); const b=best.includes(i); d.className='card '+(b?'best':'dim');
        d.innerHTML=car; const col=i%4,row=Math.floor(i/4);
        d.style.setProperty('--dx',((1.5-col)*224)+'px'); d.style.setProperty('--dy',((2-row)*174)+'px');
        d.style.animationDelay=(0.4+i*0.045)+'s'+(b?',1.5s,2.3s':',1.7s'); g.appendChild(d);} },
  };

  const ease=t=>1-Math.pow(1-t,3);
  function counters(local,id){
    if(id==='s1'){ const a=Math.min(1,Math.max(0,(local-1100)/1600)); $('#tm').textContent=(a*10).toFixed(1).replace('.',','); }
    if(id==='s4'){ const a=Math.min(1,Math.max(0,(local-2900)/700)); $('#val').textContent=fmt(ease(a)*245000); }
  }

  let t0=0,cur=null,outTimer=null,playing=false;
  const overlay=$('#overlay'),playBtn=$('#play'),playLabel=$('#playLabel');
  function enterFullscreen(){
    const el=document.documentElement;
    try{
      const r=el.requestFullscreen?el.requestFullscreen():el.webkitRequestFullscreen?el.webkitRequestFullscreen():null;
      if(r&&r.catch) r.catch(()=>{});
    }catch(e){}
  }
  function exitFullscreen(){
    try{
      if(document.fullscreenElement&&document.exitFullscreen) document.exitFullscreen().catch(()=>{});
      else if(document.webkitFullscreenElement&&document.webkitExitFullscreen) document.webkitExitFullscreen();
    }catch(e){}
  }
  function start(){
    enterFullscreen();
    overlay.classList.remove('show');
    document.querySelectorAll('.scene').forEach(s=>s.classList.remove('on','out'));
    cur=null; $('#bar').style.width='0%'; t0=performance.now(); playing=true;
    requestAnimationFrame(tick);
  }
  function finish(){
    playing=false;
    playLabel.textContent='Spill av på nytt'; playBtn.setAttribute('aria-label','Spill av på nytt');
    overlay.classList.add('show');
  }
  playBtn.addEventListener('click',start);
  addEventListener('keydown',e=>{ if(e.key==='Escape') exitFullscreen(); });
  function activate(sc,idx){
    if(cur){ const old=$('#'+cur); old.classList.add('out'); clearTimeout(outTimer); outTimer=setTimeout(()=>old.classList.remove('on','out'),400); }
    const el=$('#'+sc.id); const h=el.querySelector('.h'); if(h) headline(h); if(build[sc.id]) build[sc.id]();
    el.classList.remove('on','out'); void el.offsetWidth; el.classList.add('on');
    [...dots.children].forEach((d,i)=>d.classList.toggle('cur',i===idx)); cur=sc.id;
  }

  function tick(now){
    if(!playing) return;
    let t=now-t0; if(t>=TOTAL){ $('#bar').style.width='100%'; finish(); return; }
    $('#bar').style.width=(t/TOTAL*100)+'%';
    for(let i=0;i<SCENES.length;i++){ const sc=SCENES[i];
      if(t>=sc.start&&t<sc.end){ if(cur!==sc.id) activate(sc,i); counters(t-sc.start,sc.id); break; } }
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
