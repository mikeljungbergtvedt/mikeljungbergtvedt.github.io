<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peasy — Salgsoversikt</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #004225;
    --green-light: #e8f0eb;
    --yellow: #FFCC33;
    --blue: #82bfd2;
    --blue-light: #e8f4f8;
    --red: #c0392b;
    --red-light: #fdecea;
    --bg: #f5f4f0;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #7a7a7a;
    --border: #e5e5e2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header { background: var(--green); padding: 20px 40px; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-family: 'DM Serif Display', serif; font-size: 26px; color: #fff; letter-spacing: -0.5px; }
  .logo span { color: var(--yellow); }
  .live-badge { display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(255,255,255,0.7); font-weight: 500; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4caf50; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  main { max-width: 1100px; margin: 0 auto; padding: 40px 24px 60px; }

  .section-label { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; margin-top: 40px; }
  .section-label:first-child { margin-top: 0; }

  .funnel { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr; background: var(--card); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; }
  .funnel-step { padding: 28px 24px; text-align: center; }
  .funnel-arrow { display: flex; align-items: center; justify-content: center; color: var(--border); font-size: 22px; padding: 0 4px; }
  .funnel-icon { font-size: 28px; margin-bottom: 8px; }
  .funnel-number { font-family: 'DM Serif Display', serif; font-size: 42px; line-height: 1; margin-bottom: 4px; }
  .funnel-label { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .funnel-pct { font-size: 12px; font-weight: 500; padding: 3px 8px; border-radius: 20px; display: inline-block; }

  .funnel-step.evaluert .funnel-number { color: var(--green); }
  .funnel-step.mottatt .funnel-number { color: #2980b9; }
  .funnel-step.mottatt .funnel-pct { background: var(--blue-light); color: #2980b9; }
  .funnel-step.solgt .funnel-number { color: #27ae60; }
  .funnel-step.solgt .funnel-pct { background: #eafaf1; color: #27ae60; }
  .funnel-step.avvist .funnel-number { color: var(--red); }
  .funnel-step.avvist .funnel-pct { background: var(--red-light); color: var(--red); }

  .pipeline-bar { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px 28px; margin-top: 12px; }
  .bar-track { height: 10px; background: #eeede9; border-radius: 99px; overflow: hidden; display: flex; }
  .bar-segment { height: 100%; }
  .bar-legend { display: flex; gap: 20px; margin-top: 12px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  .cars-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
  .cars-header { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .cars-header-title { font-weight: 600; font-size: 15px; }
  .cars-count { font-size: 12px; color: var(--muted); background: var(--bg); padding: 4px 10px; border-radius: 99px; }

  table { width: 100%; border-collapse: collapse; }
  thead tr { background: #fafaf8; }
  th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted); padding: 10px 24px; border-bottom: 1px solid var(--border); }
  td { padding: 14px 24px; font-size: 14px; border-bottom: 1px solid #f0efec; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafaf8; }

  .regnr { font-family: 'DM Serif Display', serif; font-size: 15px; color: var(--green); }
  .status-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
  .badge-pickup  { background: #fff8e1; color: #f57f17; }
  .badge-arrived { background: var(--blue-light); color: #1565c0; }
  .badge-auction { background: #f3e5f5; color: #7b1fa2; }
  .badge-sold    { background: #e8f5e9; color: #2e7d32; }
  .badge-unknown { background: #f5f5f5; color: #757575; }
  .days-ago { font-size: 13px; color: var(--muted); }
  .days-ago.stale { color: #e67e22; font-weight: 500; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  .events-card, .rejected-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
  .card-header { padding: 16px 24px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: space-between; }
  .event-row { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid #f0efec; }
  .event-row:last-child { border-bottom: none; }
  .event-icon { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
  .event-regnr { font-family: 'DM Serif Display', serif; font-size: 14px; color: var(--green); min-width: 68px; }
  .event-desc { font-size: 13px; color: var(--text); flex: 1; }
  .event-time { font-size: 12px; color: var(--muted); white-space: nowrap; }

  .rejected-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; border-bottom: 1px solid #f0efec; font-size: 13px; }
  .rejected-row:last-child { border-bottom: none; }
  .rejected-regnr { font-family: 'DM Serif Display', serif; font-size: 14px; color: var(--red); }

  .loading { text-align: center; padding: 60px; color: var(--muted); font-size: 14px; }
  .error-msg { text-align: center; padding: 40px; color: var(--red); font-size: 14px; }

  @media (max-width: 700px) {
    .funnel { grid-template-columns: 1fr 1fr; }
    .funnel-arrow { display: none; }
    .two-col { grid-template-columns: 1fr; }
    header { padding: 16px 20px; }
    main { padding: 24px 16px 40px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Peasy<span>·</span></div>
  <div class="live-badge">
    <div class="dot"></div>
    <span id="clock">Laster...</span>
  </div>
</header>

<main>
  <div id="app"><div class="loading">Henter data...</div></div>
</main>

<script>
const DATA_URL = 'https://raw.githubusercontent.com/mikeljungbergtvedt/mikeljungbergtvedt.github.io/main/tracked-cars.json?t=' + Date.now();

const STAGE_ORDER = ['EVALUATED','PICKUP_ORDERED','CAR_ARRIVED','ON_AUCTION','AUCTION_FINISHED','SOLD','CONTRACT_SIGNED'];
const ACTIVE_STAGES = ['PICKUP_ORDERED','CAR_ARRIVED','ON_AUCTION','AUCTION_FINISHED'];
const TEST_CARS = ['RN12345'];

function getLatestEvent(events) {
  return events.reduce((a,b) => new Date(a.ts) > new Date(b.ts) ? a : b);
}

function getHighestStage(events) {
  let best = -1, bestEvent = null;
  for (const e of events) {
    const idx = STAGE_ORDER.indexOf(e.event);
    if (idx > best) { best = idx; bestEvent = e; }
  }
  return bestEvent;
}

function daysAgo(ts) {
  const d = Math.floor((Date.now() - new Date(ts)) / 86400000);
  if (d === 0) return 'I dag';
  if (d === 1) return 'I går';
  return d + 'd siden';
}

function formatTime(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('nb-NO', {day:'numeric', month:'short'}) + ' ' +
         d.toLocaleTimeString('nb-NO', {hour:'2-digit', minute:'2-digit'});
}

function stageBadge(event) {
  const map = {
    PICKUP_ORDERED:   ['📦 Henting bestilt', 'badge-pickup'],
    CAR_ARRIVED:      ['🏁 Ankommet', 'badge-arrived'],
    ON_AUCTION:       ['🔨 På auksjon', 'badge-auction'],
    AUCTION_FINISHED: ['⏱ Auksjon avsluttet', 'badge-auction'],
    SOLD:             ['🎉 Solgt', 'badge-sold'],
    CONTRACT_SIGNED:  ['🎉 Solgt', 'badge-sold'],
  };
  const [label, cls] = map[event] || ['• Ukjent', 'badge-unknown'];
  return `<span class="status-badge ${cls}">${label}</span>`;
}

function stageIcon(event) {
  const map = {
    EVALUATED:        {bg:'#e8f0eb', icon:'📤'},
    PICKUP_ORDERED:   {bg:'#fff8e1', icon:'📦'},
    CAR_ARRIVED:      {bg:'#e8f4f8', icon:'🏁'},
    ON_AUCTION:       {bg:'#f3e5f5', icon:'🔨'},
    AUCTION_FINISHED: {bg:'#f3e5f5', icon:'⏱'},
    SOLD:             {bg:'#e8f5e9', icon:'🎉'},
    CONTRACT_SIGNED:  {bg:'#e8f5e9', icon:'🎉'},
    REJECTED:         {bg:'#fdecea', icon:'❌'},
  };
  const s = map[event] || {bg:'#f5f5f5', icon:'•'};
  return `<div class="event-icon" style="background:${s.bg}">${s.icon}</div>`;
}

function stageLabel(event) {
  const map = {
    EVALUATED: 'Tilbud sendt',
    PICKUP_ORDERED: 'Henting bestilt',
    CAR_ARRIVED: 'Ankommet anlegg',
    ON_AUCTION: 'Lagt ut på auksjon',
    AUCTION_FINISHED: 'Auksjon avsluttet',
    SOLD: 'Solgt',
    CONTRACT_SIGNED: 'Solgt',
    REJECTED: 'Avvist av selger',
  };
  return map[event] || event;
}

function render(raw) {
  let evaluert = 0, mottatt = 0, solgt = 0, avvist = 0;
  const activeCars = [], rejectedCars = [], allEvents = [];

  for (const [regnr, events] of Object.entries(raw)) {
    if (TEST_CARS.includes(regnr)) continue;

    const isRejected = events.some(e => e.event === 'REJECTED');
    const isSold = events.some(e => e.event === 'SOLD' || e.event === 'CONTRACT_SIGNED');
    const isEvaluated = events.some(e => e.event === 'EVALUATED');
    const isMottatt = events.some(e => ACTIVE_STAGES.includes(e.event)) || isSold;

    if (isEvaluated) evaluert++;
    if (isMottatt) mottatt++;
    if (isSold) solgt++;
    if (isRejected && !isSold) avvist++;

    for (const e of events) allEvents.push({ regnr, ...e });

    const highest = getHighestStage(events);
    if (!highest) continue;

    if (!isSold && !isRejected && ACTIVE_STAGES.includes(highest.event)) {
      activeCars.push({ regnr, events, highest, latest: getLatestEvent(events) });
    } else if (isRejected && !isSold) {
      rejectedCars.push({ regnr, events, latest: getLatestEvent(events) });
    }
  }

  activeCars.sort((a,b) => new Date(b.latest.ts) - new Date(a.latest.ts));
  rejectedCars.sort((a,b) => new Date(b.latest.ts) - new Date(a.latest.ts));

  const recentEvents = [...allEvents]
    .filter(e => !TEST_CARS.includes(e.regnr))
    .sort((a,b) => new Date(b.ts) - new Date(a.ts))
    .slice(0, 12);

  const mottattPct = evaluert ? Math.round(mottatt/evaluert*100) : 0;
  const solgtPct   = mottatt  ? Math.round(solgt/mottatt*100)    : 0;
  const avvistPct  = evaluert ? Math.round(avvist/evaluert*100)   : 0;

  const total = (mottatt + avvist + Math.max(evaluert - mottatt - avvist, 0)) || 1;
  const bMottatt = Math.round(mottatt/total*100);
  const bAvvist  = Math.round(avvist/total*100);
  const bRest    = 100 - bMottatt - bAvvist;

  let html = '';

  // — Salgstrakt
  html += `
  <div class="section-label">Salgstrakt</div>
  <div class="funnel">
    <div class="funnel-step evaluert">
      <div class="funnel-icon">📤</div>
      <div class="funnel-number">${evaluert}</div>
      <div class="funnel-label">Evaluert</div>
    </div>
    <div class="funnel-arrow">›</div>
    <div class="funnel-step mottatt">
      <div class="funnel-icon">📬</div>
      <div class="funnel-number">${mottatt}</div>
      <div class="funnel-label">Mottatt</div>
      <div class="funnel-pct">${mottattPct}% av evaluert</div>
    </div>
    <div class="funnel-arrow">›</div>
    <div class="funnel-step solgt">
      <div class="funnel-icon">🎉</div>
      <div class="funnel-number">${solgt}</div>
      <div class="funnel-label">Solgt</div>
      <div class="funnel-pct">${solgtPct}% av mottatt</div>
    </div>
    <div class="funnel-arrow">›</div>
    <div class="funnel-step avvist">
      <div class="funnel-icon">❌</div>
      <div class="funnel-number">${avvist}</div>
      <div class="funnel-label">Avvist</div>
      <div class="funnel-pct">${avvistPct}% av evaluert</div>
    </div>
  </div>
  <div class="pipeline-bar">
    <div class="bar-track">
      <div class="bar-segment" style="width:${bMottatt}%;background:var(--blue)"></div>
      <div class="bar-segment" style="width:${bRest}%;background:#d4e6c3"></div>
      <div class="bar-segment" style="width:${bAvvist}%;background:#f5c6c3"></div>
    </div>
    <div class="bar-legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div>Mottatt (${mottatt})</div>
      <div class="legend-item"><div class="legend-dot" style="background:#d4e6c3"></div>Evaluert, ikke mottatt</div>
      <div class="legend-item"><div class="legend-dot" style="background:#f5c6c3"></div>Avvist (${avvist})</div>
    </div>
  </div>`;

  // — Aktive biler
  html += `
  <div class="section-label">Aktive biler i pipeline</div>
  <div class="cars-card">
    <div class="cars-header">
      <div class="cars-header-title">Under behandling</div>
      <div class="cars-count">${activeCars.length} biler</div>
    </div>
    <table>
      <thead><tr>
        <th>Regnr</th><th>Status</th><th>Siste hendelse</th><th>Dager siden</th>
      </tr></thead>
      <tbody>`;

  if (!activeCars.length) {
    html += `<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:24px">Ingen aktive biler</td></tr>`;
  }
  for (const car of activeCars) {
    const dager = Math.floor((Date.now() - new Date(car.latest.ts)) / 86400000);
    html += `<tr>
      <td><span class="regnr">${car.regnr}</span></td>
      <td>${stageBadge(car.highest.event)}</td>
      <td style="color:var(--muted);font-size:13px">${car.highest.subject.substring(0,52)}${car.highest.subject.length>52?'…':''}</td>
      <td><span class="days-ago ${dager>7?'stale':''}">${dager===0?'I dag':dager+'d'}</span></td>
    </tr>`;
  }
  html += `</tbody></table></div>`;

  // — Recent + Avvist
  html += `
  <div class="section-label">Siste aktivitet & avvisninger</div>
  <div class="two-col">
    <div class="events-card">
      <div class="card-header">Hendelseslogg</div>`;

  for (const e of recentEvents) {
    html += `<div class="event-row">
      ${stageIcon(e.event)}
      <div class="event-regnr">${e.regnr}</div>
      <div class="event-desc">${stageLabel(e.event)}</div>
      <div class="event-time">${formatTime(e.ts)}</div>
    </div>`;
  }

  html += `</div>
    <div class="rejected-card">
      <div class="card-header">
        <span>Avvist av selger</span>
        <span style="font-size:12px;color:var(--muted);font-weight:400">${rejectedCars.length} totalt</span>
      </div>`;

  if (!rejectedCars.length) {
    html += `<div style="padding:24px;text-align:center;color:var(--muted);font-size:13px">Ingen avviste</div>`;
  }
  for (const car of rejectedCars.slice(0,12)) {
    html += `<div class="rejected-row">
      <span class="rejected-regnr">${car.regnr}</span>
      <span style="color:var(--muted)">${daysAgo(car.latest.ts)}</span>
    </div>`;
  }

  html += `</div></div>`;

  document.getElementById('app').innerHTML = html;
}

function updateClock() {
  const t = new Date().toLocaleTimeString('nb-NO', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  document.getElementById('clock').textContent = 'Live · ' + t;
}
setInterval(updateClock, 1000);
updateClock();

fetch(DATA_URL)
  .then(r => r.json())
  .then(render)
  .catch(e => {
    document.getElementById('app').innerHTML = `<div class="error-msg">Kunne ikke hente data: ${e.message}</div>`;
  });
</script>
</body>
</html>
