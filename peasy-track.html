<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peasy Track</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #004225;
    --green-light: #005a32;
    --yellow: #FFCC33;
    --blue: #82bfd2;
    --cream: #f5f0e8;
    --white: #ffffff;
    --muted: #8a9a8e;
    --danger: #c0392b;
    --card-bg: rgba(255,255,255,0.05);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--green);
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Noise texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  header {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 48px;
    border-bottom: 1px solid rgba(255,204,51,0.2);
  }

  .logo {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .logo-text {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 900;
    color: var(--yellow);
    letter-spacing: -0.5px;
  }

  .logo-sub {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--yellow);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.3); }
  }

  .last-updated {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  main {
    position: relative;
    z-index: 1;
    padding: 48px;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* FUNNEL */
  .funnel-section {
    margin-bottom: 56px;
  }

  .section-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .funnel {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 0;
    background: rgba(0,0,0,0.15);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid rgba(255,204,51,0.1);
  }

  .funnel-step {
    padding: 24px 16px;
    text-align: center;
    border-right: 1px solid rgba(255,255,255,0.06);
    position: relative;
    transition: background 0.2s;
    cursor: default;
  }

  .funnel-step:last-child { border-right: none; }

  .funnel-step:hover { background: rgba(255,204,51,0.05); }

  .funnel-step::after {
    content: '›';
    position: absolute;
    right: -8px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(255,204,51,0.3);
    font-size: 18px;
    z-index: 2;
  }

  .funnel-step:last-child::after { display: none; }

  .funnel-emoji { font-size: 22px; margin-bottom: 8px; }

  .funnel-count {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    font-weight: 700;
    color: var(--yellow);
    line-height: 1;
    margin-bottom: 4px;
  }

  .funnel-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .funnel-bar {
    height: 3px;
    background: var(--yellow);
    margin-top: 12px;
    border-radius: 2px;
    transition: width 0.8s ease;
  }

  /* KPI ROW */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 48px;
  }

  .kpi-card {
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--yellow);
    opacity: 0.6;
  }

  .kpi-card.blue::before { background: var(--blue); }
  .kpi-card.danger::before { background: #e74c3c; }
  .kpi-card.green::before { background: #2ecc71; }

  .kpi-value {
    font-family: 'Playfair Display', serif;
    font-size: 42px;
    font-weight: 700;
    color: var(--cream);
    line-height: 1;
    margin-bottom: 6px;
  }

  .kpi-unit {
    font-size: 18px;
    color: var(--muted);
  }

  .kpi-label {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  /* MAIN GRID */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 24px;
    margin-bottom: 32px;
  }

  .panel {
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px;
    overflow: hidden;
  }

  .panel-header {
    padding: 20px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .panel-title {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--blue);
  }

  /* CARS TABLE */
  .cars-table {
    width: 100%;
    border-collapse: collapse;
  }

  .cars-table th {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 12px 24px;
    text-align: left;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .cars-table td {
    padding: 14px 24px;
    font-size: 13px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    vertical-align: middle;
  }

  .cars-table tr:last-child td { border-bottom: none; }
  .cars-table tr:hover td { background: rgba(255,204,51,0.03); }

  .regnr {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--yellow);
    letter-spacing: 1px;
  }

  .stage-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    background: rgba(255,204,51,0.1);
    color: var(--yellow);
    border: 1px solid rgba(255,204,51,0.2);
  }

  .stage-badge.green { background: rgba(46,204,113,0.1); color: #2ecc71; border-color: rgba(46,204,113,0.2); }
  .stage-badge.blue { background: rgba(130,191,210,0.1); color: var(--blue); border-color: rgba(130,191,210,0.2); }
  .stage-badge.red { background: rgba(231,76,60,0.1); color: #e74c3c; border-color: rgba(231,76,60,0.2); }
  .stage-badge.muted { background: rgba(138,154,142,0.1); color: var(--muted); border-color: rgba(138,154,142,0.2); }

  .days-bar {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .days-track {
    width: 80px;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    overflow: hidden;
  }

  .days-fill {
    height: 100%;
    background: var(--blue);
    border-radius: 2px;
  }

  .days-fill.warn { background: var(--yellow); }
  .days-fill.danger { background: #e74c3c; }

  .days-num {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  /* EVENTS FEED */
  .events-feed {
    padding: 0;
  }

  .event-item {
    padding: 14px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    display: flex;
    align-items: flex-start;
    gap: 12px;
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(10px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .event-item:last-child { border-bottom: none; }

  .event-emoji { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

  .event-body { flex: 1; min-width: 0; }

  .event-regnr {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--yellow);
    letter-spacing: 1px;
  }

  .event-label {
    font-size: 12px;
    color: var(--cream);
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .event-time {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    flex-shrink: 0;
    margin-top: 2px;
  }

  /* EMPTY STATE */
  .empty-state {
    padding: 48px 24px;
    text-align: center;
    color: var(--muted);
  }

  .empty-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.4; }
  .empty-text { font-size: 13px; opacity: 0.6; }

  /* CONVERSION CHART */
  .conversion-section {
    margin-bottom: 32px;
  }

  .conv-bars {
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .conv-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .conv-label {
    font-size: 12px;
    color: var(--muted);
    width: 120px;
    flex-shrink: 0;
  }

  .conv-track {
    flex: 1;
    height: 8px;
    background: rgba(255,255,255,0.06);
    border-radius: 4px;
    overflow: hidden;
  }

  .conv-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green-light), var(--yellow));
    border-radius: 4px;
    transition: width 1s ease;
  }

  .conv-pct {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--yellow);
    width: 40px;
    text-align: right;
    flex-shrink: 0;
  }

  /* LOADING */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px;
    gap: 12px;
    color: var(--muted);
    font-size: 13px;
  }

  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,204,51,0.2);
    border-top-color: var(--yellow);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* RESPONSIVE */
  @media (max-width: 1100px) {
    .main-grid { grid-template-columns: 1fr; }
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
    .funnel { grid-template-columns: repeat(4, 1fr); }
  }

  @media (max-width: 640px) {
    header, main { padding: 20px; }
    .funnel { grid-template-columns: repeat(2, 1fr); }
    .kpi-row { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-text">peasy</span>
    <span class="logo-sub">track</span>
  </div>
  <div class="header-right">
    <div class="live-dot"></div>
    <span class="last-updated" id="lastUpdated">Laster...</span>
  </div>
</header>

<main>

  <!-- FUNNEL -->
  <div class="funnel-section">
    <div class="section-label">Salgstrakt</div>
    <div class="funnel" id="funnel">
      <div class="loading"><div class="spinner"></div> Laster data...</div>
    </div>
  </div>

  <!-- KPI ROW -->
  <div class="kpi-row" id="kpiRow">
    <div class="kpi-card">
      <div class="kpi-value"><span id="kpiTotal">—</span></div>
      <div class="kpi-label">Totalt evaluert</div>
    </div>
    <div class="kpi-card green">
      <div class="kpi-value"><span id="kpiConv">—</span><span class="kpi-unit">%</span></div>
      <div class="kpi-label">Konvertering (solgt)</div>
    </div>
    <div class="kpi-card blue">
      <div class="kpi-value"><span id="kpiAvgDays">—</span><span class="kpi-unit">d</span></div>
      <div class="kpi-label">Snitt dager tilbud→solgt</div>
    </div>
    <div class="kpi-card danger">
      <div class="kpi-value"><span id="kpiRejected">—</span></div>
      <div class="kpi-label">Avvist av selger</div>
    </div>
  </div>

  <!-- MAIN GRID -->
  <div class="main-grid">

    <!-- ACTIVE CARS TABLE -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Aktive biler</span>
        <span class="last-updated" id="activeCount">—</span>
      </div>
      <div id="carsTableWrap">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>

    <!-- EVENTS FEED -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Siste hendelser</span>
      </div>
      <div class="events-feed" id="eventsFeed">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>

  </div>

  <!-- CONVERSION BARS -->
  <div class="conversion-section">
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Konvertering per trinn</span>
      </div>
      <div class="conv-bars" id="convBars">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

</main>

<script>
const STAGES = [
  { type: 'EVALUATED',       emoji: '📤', label: 'Evaluert' },
  { type: 'PICKUP_ORDERED',  emoji: '📦', label: 'Henting bestilt' },
  { type: 'CAR_ARRIVED',     emoji: '🏁', label: 'Ankommet' },
  { type: 'READY_AUCTION',   emoji: '🏷️', label: 'Klar auksjon' },
  { type: 'ON_AUCTION',      emoji: '🔨', label: 'På auksjon' },
  { type: 'AUCTION_FINISHED',emoji: '⏱️', label: 'Auksjon ferdig' },
  { type: 'SOLD',            emoji: '🎉', label: 'Solgt' },
  { type: 'REJECTED',        emoji: '❌', label: 'Avvist' },
];

const STAGE_ORDER = ['EVALUATED','PICKUP_ORDERED','CAR_ARRIVED','READY_AUCTION','ON_AUCTION','AUCTION_FINISHED','SOLD'];

function getLatestStage(events) {
  for (let i = STAGE_ORDER.length - 1; i >= 0; i--) {
    if (events.find(e => e.event === STAGE_ORDER[i])) return STAGE_ORDER[i];
  }
  if (events.find(e => e.event === 'REJECTED')) return 'REJECTED';
  return 'UNKNOWN';
}

function daysSince(ts) {
  return Math.round((Date.now() - new Date(ts).getTime()) / 86400000);
}

function stageBadgeClass(stage) {
  if (stage === 'SOLD') return 'green';
  if (stage === 'REJECTED') return 'red';
  if (stage === 'ON_AUCTION' || stage === 'AUCTION_FINISHED') return 'blue';
  if (stage === 'EVALUATED') return 'muted';
  return '';
}

function stageLabel(stage) {
  return STAGES.find(s => s.type === stage)?.label || stage;
}

function stageEmoji(stage) {
  return STAGES.find(s => s.type === stage)?.emoji || '•';
}

function formatTime(ts) {
  const d = new Date(ts);
  return d.toLocaleString('nb-NO', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function render(data) {
  const cars = Object.entries(data);

  // --- FUNNEL ---
  const stageCounts = {};
  STAGES.forEach(s => stageCounts[s.type] = 0);
  cars.forEach(([, events]) => {
    const stage = getLatestStage(events);
    if (stageCounts[stage] !== undefined) stageCounts[stage]++;
    else stageCounts['EVALUATED'] = (stageCounts['EVALUATED'] || 0);
  });

  const maxCount = Math.max(...Object.values(stageCounts), 1);
  document.getElementById('funnel').innerHTML = STAGES.map(s => {
    const count = stageCounts[s.type] || 0;
    const pct = Math.round((count / maxCount) * 100);
    return `<div class="funnel-step">
      <div class="funnel-emoji">${s.emoji}</div>
      <div class="funnel-count">${count}</div>
      <div class="funnel-label">${s.label}</div>
      <div class="funnel-bar" style="width:${pct}%"></div>
    </div>`;
  }).join('');

  // --- KPIs ---
  const total = stageCounts['EVALUATED'] + Object.values(stageCounts).reduce((a,b)=>a+b,0) - stageCounts['EVALUATED'];
  const totalCars = cars.length;
  const soldCars = cars.filter(([,e]) => e.find(ev => ev.event === 'SOLD')).length;
  const rejectedCars = cars.filter(([,e]) => e.find(ev => ev.event === 'REJECTED')).length;
  const convPct = totalCars > 0 ? Math.round((soldCars / totalCars) * 100) : 0;

  // Avg days from EVALUATED to SOLD
  const soldDays = cars
    .filter(([,e]) => e.find(ev => ev.event === 'SOLD') && e.find(ev => ev.event === 'EVALUATED'))
    .map(([,e]) => {
      const start = new Date(e.find(ev => ev.event === 'EVALUATED').ts);
      const end = new Date(e.find(ev => ev.event === 'SOLD').ts);
      return Math.round((end - start) / 86400000);
    });
  const avgDays = soldDays.length > 0 ? Math.round(soldDays.reduce((a,b)=>a+b,0)/soldDays.length) : '—';

  document.getElementById('kpiTotal').textContent = totalCars;
  document.getElementById('kpiConv').textContent = convPct;
  document.getElementById('kpiAvgDays').textContent = avgDays;
  document.getElementById('kpiRejected').textContent = rejectedCars;

  // --- ACTIVE CARS TABLE ---
  const activeCars = cars.filter(([,e]) => {
    const stage = getLatestStage(e);
    return stage !== 'SOLD' && stage !== 'REJECTED';
  });
  document.getElementById('activeCount').textContent = activeCars.length + ' biler';

  if (activeCars.length === 0) {
    document.getElementById('carsTableWrap').innerHTML = `<div class="empty-state"><div class="empty-icon">🚗</div><div class="empty-text">Ingen aktive biler</div></div>`;
  } else {
    const rows = activeCars.map(([regNr, events]) => {
      const stage = getLatestStage(events);
      const firstEvent = events[0];
      const days = firstEvent ? daysSince(firstEvent.ts) : 0;
      const barPct = Math.min(days / 30 * 100, 100);
      const barClass = days > 20 ? 'danger' : days > 10 ? 'warn' : '';
      return `<tr>
        <td><span class="regnr">${regNr}</span></td>
        <td><span class="stage-badge ${stageBadgeClass(stage)}">${stageEmoji(stage)} ${stageLabel(stage)}</span></td>
        <td><div class="days-bar">
          <div class="days-track"><div class="days-fill ${barClass}" style="width:${barPct}%"></div></div>
          <span class="days-num">${days}d</span>
        </div></td>
        <td class="days-num">${events.length} hendelser</td>
      </tr>`;
    }).join('');

    document.getElementById('carsTableWrap').innerHTML = `
      <table class="cars-table">
        <thead><tr>
          <th>Regnr</th><th>Status</th><th>Dager</th><th>Hendelser</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  // --- EVENTS FEED ---
  const allEvents = [];
  cars.forEach(([regNr, events]) => {
    events.forEach(e => allEvents.push({ regNr, ...e }));
  });
  allEvents.sort((a,b) => new Date(b.ts) - new Date(a.ts));
  const recent = allEvents.slice(0, 20);

  if (recent.length === 0) {
    document.getElementById('eventsFeed').innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">Ingen hendelser ennå</div></div>`;
  } else {
    document.getElementById('eventsFeed').innerHTML = recent.map(e => `
      <div class="event-item">
        <span class="event-emoji">${stageEmoji(e.event)}</span>
        <div class="event-body">
          <div class="event-regnr">${e.regNr}</div>
          <div class="event-label">${stageLabel(e.event)}</div>
        </div>
        <span class="event-time">${formatTime(e.ts)}</span>
      </div>`).join('');
  }

  // --- CONVERSION BARS ---
  const convStages = [
    { label: 'Evaluert → Henting', from: 'EVALUATED', to: 'PICKUP_ORDERED' },
    { label: 'Henting → Ankommet', from: 'PICKUP_ORDERED', to: 'CAR_ARRIVED' },
    { label: 'Ankommet → Auksjon', from: 'CAR_ARRIVED', to: 'ON_AUCTION' },
    { label: 'Auksjon → Solgt',    from: 'ON_AUCTION', to: 'SOLD' },
    { label: 'Totalt konvertering', from: 'EVALUATED', to: 'SOLD' },
  ];

  document.getElementById('convBars').innerHTML = convStages.map(cs => {
    const hasFrom = cars.filter(([,e]) => e.find(ev => ev.event === cs.from)).length;
    const hasTo = cars.filter(([,e]) => e.find(ev => ev.event === cs.to)).length;
    const pct = hasFrom > 0 ? Math.round((hasTo / hasFrom) * 100) : 0;
    return `<div class="conv-row">
      <span class="conv-label">${cs.label}</span>
      <div class="conv-track"><div class="conv-fill" style="width:${pct}%"></div></div>
      <span class="conv-pct">${pct}%</span>
    </div>`;
  }).join('');

  // Update timestamp
  document.getElementById('lastUpdated').textContent = 'Oppdatert ' + new Date().toLocaleTimeString('nb-NO', {hour:'2-digit',minute:'2-digit'});
}

async function loadData() {
  try {
    const res = await fetch('/api/tracked-cars?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    render(data);
  } catch(e) {
    // Show demo data if no real data yet
    render(getDemoData());
    document.getElementById('lastUpdated').textContent = 'Demo-data (bot ikke tilkoblet)';
  }
}
