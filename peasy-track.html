<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peasy Track</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #F2F7F9 0%, #E8F0F5 100%);
    color: #004225;
    min-height: 100vh;
  }

  header {
    padding: 36px 48px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(0,66,37,0.08);
  }

  .logo img { height: 44px; }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: #8aab99;
    font-weight: 500;
  }

  .live-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #004225;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.4; transform:scale(1.3); }
  }

  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 48px 60px;
  }

  /* FUNNEL */
  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #8aab99;
    margin-bottom: 16px;
  }

  .funnel {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 0;
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,66,37,0.07);
    margin-bottom: 28px;
  }

  .funnel-step {
    padding: 22px 12px;
    text-align: center;
    border-right: 1px solid rgba(0,66,37,0.06);
    position: relative;
    transition: background 0.15s;
    cursor: default;
  }

  .funnel-step:last-child { border-right: none; }
  .funnel-step:hover { background: rgba(0,66,37,0.03); }

  .funnel-step::after {
    content: '›';
    position: absolute;
    right: -8px; top: 50%;
    transform: translateY(-50%);
    color: rgba(0,66,37,0.2);
    font-size: 18px;
    z-index: 2;
  }
  .funnel-step:last-child::after { display: none; }

  .funnel-emoji { font-size: 20px; margin-bottom: 6px; }

  .funnel-count {
    font-size: 28px;
    font-weight: 800;
    color: #004225;
    line-height: 1;
    margin-bottom: 4px;
  }

  .funnel-label {
    font-size: 9px;
    font-weight: 600;
    color: #8aab99;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .funnel-bar {
    height: 3px;
    background: #FFCC33;
    margin-top: 10px;
    border-radius: 2px;
    transition: width 0.8s ease;
  }

  /* KPI ROW */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }

  .kpi-card {
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 2px 12px rgba(0,66,37,0.07);
    border-top: 3px solid #FFCC33;
  }

  .kpi-card.green { border-top-color: #004225; }
  .kpi-card.blue  { border-top-color: #82bfd2; }
  .kpi-card.red   { border-top-color: #e05a4e; }

  .kpi-value {
    font-size: 38px;
    font-weight: 800;
    color: #004225;
    line-height: 1;
    margin-bottom: 6px;
  }

  .kpi-unit { font-size: 18px; font-weight: 400; color: #8aab99; }

  .kpi-label {
    font-size: 12px;
    font-weight: 500;
    color: #8aab99;
  }

  /* MAIN GRID */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 20px;
    margin-bottom: 20px;
  }

  .panel {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,66,37,0.07);
  }

  .panel-header {
    padding: 18px 24px;
    border-bottom: 1px solid rgba(0,66,37,0.07);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .panel-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #004225;
  }

  .panel-count {
    font-size: 12px;
    font-weight: 500;
    color: #8aab99;
  }

  /* TABLE */
  .cars-table { width: 100%; border-collapse: collapse; }

  .cars-table th {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #8aab99;
    padding: 12px 24px;
    text-align: left;
    border-bottom: 1px solid rgba(0,66,37,0.06);
  }

  .cars-table td {
    padding: 14px 24px;
    font-size: 13px;
    border-bottom: 1px solid rgba(0,66,37,0.05);
    vertical-align: middle;
  }

  .cars-table tr:last-child td { border-bottom: none; }
  .cars-table tr:hover td { background: rgba(0,66,37,0.02); }

  .regnr {
    font-size: 12px;
    font-weight: 700;
    color: #004225;
    letter-spacing: 0.5px;
  }

  .stage-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    background: rgba(0,66,37,0.07);
    color: #004225;
  }

  .stage-badge.green { background: rgba(0,66,37,0.1); color: #004225; }
  .stage-badge.blue  { background: rgba(130,191,210,0.15); color: #2a7a9a; }
  .stage-badge.red   { background: rgba(224,90,78,0.1); color: #c0392b; }
  .stage-badge.muted { background: rgba(138,171,153,0.12); color: #8aab99; }
  .stage-badge.yellow { background: rgba(255,204,51,0.2); color: #996600; }

  .days-bar { display: flex; align-items: center; gap: 8px; }
  .days-track { width: 70px; height: 4px; background: rgba(0,66,37,0.08); border-radius: 2px; overflow: hidden; }
  .days-fill { height: 100%; background: #82bfd2; border-radius: 2px; }
  .days-fill.warn { background: #FFCC33; }
  .days-fill.danger { background: #e05a4e; }
  .days-num { font-size: 11px; font-weight: 500; color: #8aab99; }

  /* EVENTS FEED */
  .event-item {
    padding: 13px 24px;
    border-bottom: 1px solid rgba(0,66,37,0.05);
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .event-item:last-child { border-bottom: none; }
  .event-emoji { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
  .event-body { flex: 1; min-width: 0; }
  .event-regnr { font-size: 11px; font-weight: 700; color: #004225; }
  .event-label { font-size: 12px; color: #4a7a62; margin-top: 1px; }
  .event-time { font-size: 10px; font-weight: 500; color: #8aab99; flex-shrink: 0; margin-top: 2px; }

  /* CONV BARS */
  .conv-bars { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  .conv-row { display: flex; align-items: center; gap: 14px; }
  .conv-label { font-size: 12px; font-weight: 500; color: #4a7a62; width: 150px; flex-shrink: 0; }
  .conv-track { flex: 1; height: 7px; background: rgba(0,66,37,0.07); border-radius: 4px; overflow: hidden; }
  .conv-fill { height: 100%; background: linear-gradient(90deg, #004225, #82bfd2); border-radius: 4px; transition: width 1s ease; }
  .conv-pct { font-size: 12px; font-weight: 700; color: #004225; width: 36px; text-align: right; flex-shrink: 0; }

  /* EMPTY / LOADING */
  .loading {
    display: flex; align-items: center; justify-content: center;
    padding: 40px; gap: 10px; color: #8aab99; font-size: 13px;
  }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(0,66,37,0.1);
    border-top-color: #004225;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state { padding: 40px 24px; text-align: center; color: #8aab99; }
  .empty-icon { font-size: 28px; margin-bottom: 10px; opacity: 0.4; }
  .empty-text { font-size: 13px; }

  footer {
    text-align: center;
    padding: 24px;
    font-size: 12px;
    color: #8aab99;
    font-weight: 400;
  }
  footer a { color: #004225; text-decoration: none; font-weight: 600; }

  @media (max-width: 1100px) {
    .main-grid { grid-template-columns: 1fr; }
    .kpi-row { grid-template-columns: repeat(2,1fr); }
    .funnel { grid-template-columns: repeat(4,1fr); }
  }
  @media (max-width: 640px) {
    header, main { padding: 20px; }
    .funnel { grid-template-columns: repeat(2,1fr); }
    .kpi-row { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <img src="https://mikeljungbergtvedt.github.io/Peasy_Logo_ORG.png" alt="Peasy">
  </div>
  <div class="header-right">
    <div class="live-dot"></div>
    <span id="lastUpdated">Laster...</span>
  </div>
</header>

<main>

  <div style="margin-bottom:32px">
    <div class="section-label">Salgstrakt</div>
    <div class="funnel" id="funnel">
      <div class="loading" style="grid-column:1/-1"><div class="spinner"></div> Laster...</div>
    </div>
  </div>

  <div class="kpi-row" style="margin-bottom:28px">
    <div class="kpi-card">
      <div class="kpi-value"><span id="kpiTotal">—</span></div>
      <div class="kpi-label">Totalt evaluert</div>
    </div>
    <div class="kpi-card green">
      <div class="kpi-value"><span id="kpiConv">—</span><span class="kpi-unit">%</span></div>
      <div class="kpi-label">Konvertering (solgt)</div>
    </div>
    <div class="kpi-card blue">
      <div class="kpi-value"><span id="kpiAvgDays">—</span><span class="kpi-unit">d</span></div>
      <div class="kpi-label">Snitt dager tilbud→solgt</div>
    </div>
    <div class="kpi-card red">
      <div class="kpi-value"><span id="kpiRejected">—</span></div>
      <div class="kpi-label">Avvist av selger</div>
    </div>
  </div>

  <div class="main-grid">
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Aktive biler</span>
        <span class="panel-count" id="activeCount">—</span>
      </div>
      <div id="carsTableWrap"><div class="loading"><div class="spinner"></div></div></div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Siste hendelser</span>
      </div>
      <div id="eventsFeed"><div class="loading"><div class="spinner"></div></div></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">Konvertering per trinn</span>
    </div>
    <div class="conv-bars" id="convBars">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>

</main>

<footer>
  Peasy • <a href="https://peasy.no">peasy.no</a> &nbsp;·&nbsp; <a href="https://mikeljungbergtvedt.github.io/peasyportal.html">← Tilbake til portal</a>
</footer>

<script>
const STAGES = [
  { type: 'EVALUATED',        emoji: '📤', label: 'Evaluert' },
  { type: 'PICKUP_ORDERED',   emoji: '📦', label: 'Henting' },
  { type: 'CAR_ARRIVED',      emoji: '🏁', label: 'Ankommet' },
  { type: 'READY_AUCTION',    emoji: '🏷️', label: 'Klar' },
  { type: 'ON_AUCTION',       emoji: '🔨', label: 'Auksjon' },
  { type: 'AUCTION_FINISHED', emoji: '⏱️', label: 'Ferdig' },
  { type: 'SOLD',             emoji: '🎉', label: 'Solgt' },
  { type: 'REJECTED',         emoji: '❌', label: 'Avvist' },
];
const STAGE_ORDER = ['EVALUATED','PICKUP_ORDERED','CAR_ARRIVED','READY_AUCTION','ON_AUCTION','AUCTION_FINISHED','SOLD'];

function getLatestStage(events) {
  for (let i = STAGE_ORDER.length - 1; i >= 0; i--)
    if (events.find(e => e.event === STAGE_ORDER[i])) return STAGE_ORDER[i];
  if (events.find(e => e.event === 'REJECTED')) return 'REJECTED';
  return 'UNKNOWN';
}
function daysSince(ts) { return Math.round((Date.now() - new Date(ts)) / 86400000); }
function stageLabel(s) { return STAGES.find(x => x.type === s)?.label || s; }
function stageEmoji(s) { return STAGES.find(x => x.type === s)?.emoji || '•'; }
function stageBadgeClass(s) {
  if (s === 'SOLD') return 'green';
  if (s === 'REJECTED') return 'red';
  if (s === 'ON_AUCTION' || s === 'AUCTION_FINISHED') return 'blue';
  if (s === 'EVALUATED') return 'muted';
  return 'yellow';
}
function formatTime(ts) {
  return new Date(ts).toLocaleString('nb-NO', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
}

function render(data) {
  const cars = Object.entries(data);

  // FUNNEL
  const counts = {}; STAGES.forEach(s => counts[s.type] = 0);
  cars.forEach(([,ev]) => { const s = getLatestStage(ev); if (counts[s] !== undefined) counts[s]++; });
  const maxC = Math.max(...Object.values(counts), 1);
  document.getElementById('funnel').innerHTML = STAGES.map(s => {
    const c = counts[s.type] || 0;
    return `<div class="funnel-step">
      <div class="funnel-emoji">${s.emoji}</div>
      <div class="funnel-count">${c}</div>
      <div class="funnel-label">${s.label}</div>
      <div class="funnel-bar" style="width:${Math.round(c/maxC*100)}%"></div>
    </div>`;
  }).join('');

  // KPIs
  const total = cars.length;
  const sold = cars.filter(([,e]) => e.find(ev=>ev.event==='SOLD')).length;
  const rejected = cars.filter(([,e]) => e.find(ev=>ev.event==='REJECTED')).length;
  const conv = total > 0 ? Math.round(sold/total*100) : 0;
  const soldDays = cars
    .filter(([,e]) => e.find(ev=>ev.event==='SOLD') && e.find(ev=>ev.event==='EVALUATED'))
    .map(([,e]) => Math.round((new Date(e.find(ev=>ev.event==='SOLD').ts) - new Date(e.find(ev=>ev.event==='EVALUATED').ts))/86400000));
  const avgD = soldDays.length ? Math.round(soldDays.reduce((a,b)=>a+b,0)/soldDays.length) : '—';
  document.getElementById('kpiTotal').textContent = total;
  document.getElementById('kpiConv').textContent = conv;
  document.getElementById('kpiAvgDays').textContent = avgD;
  document.getElementById('kpiRejected').textContent = rejected;

  // ACTIVE CARS
  const active = cars.filter(([,e]) => { const s=getLatestStage(e); return s!=='SOLD'&&s!=='REJECTED'; });
  document.getElementById('activeCount').textContent = active.length + ' biler';
  if (!active.length) {
    document.getElementById('carsTableWrap').innerHTML = `<div class="empty-state"><div class="empty-icon">🚗</div><div class="empty-text">Ingen aktive biler</div></div>`;
  } else {
    const rows = active.map(([rn, ev]) => {
      const s = getLatestStage(ev);
      const days = ev[0] ? daysSince(ev[0].ts) : 0;
      const pct = Math.min(days/30*100,100);
      const bc = days>20?'danger':days>10?'warn':'';
      return `<tr>
        <td><span class="regnr">${rn}</span></td>
        <td><span class="stage-badge ${stageBadgeClass(s)}">${stageEmoji(s)} ${stageLabel(s)}</span></td>
        <td><div class="days-bar"><div class="days-track"><div class="days-fill ${bc}" style="width:${pct}%"></div></div><span class="days-num">${days}d</span></div></td>
        <td><span class="days-num">${ev.length} hendelser</span></td>
      </tr>`;
    }).join('');
    document.getElementById('carsTableWrap').innerHTML = `<table class="cars-table"><thead><tr><th>Regnr</th><th>Status</th><th>Dager</th><th>Hendelser</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  // EVENTS FEED
  const allEv = [];
  cars.forEach(([rn,ev]) => ev.forEach(e => allEv.push({rn,...e})));
  allEv.sort((a,b) => new Date(b.ts)-new Date(a.ts));
  const recent = allEv.slice(0,20);
  if (!recent.length) {
    document.getElementById('eventsFeed').innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">Ingen hendelser ennå</div></div>`;
  } else {
    document.getElementById('eventsFeed').innerHTML = recent.map(e => `
      <div class="event-item">
        <span class="event-emoji">${stageEmoji(e.event)}</span>
        <div class="event-body">
          <div class="event-regnr">${e.rn}</div>
          <div class="event-label">${stageLabel(e.event)}</div>
        </div>
        <span class="event-time">${formatTime(e.ts)}</span>
      </div>`).join('');
  }

  // CONV BARS
  const convStages = [
    { label: 'Evaluert → Henting',  from:'EVALUATED',      to:'PICKUP_ORDERED' },
    { label: 'Henting → Ankommet',  from:'PICKUP_ORDERED', to:'CAR_ARRIVED' },
    { label: 'Ankommet → Auksjon',  from:'CAR_ARRIVED',    to:'ON_AUCTION' },
    { label: 'Auksjon → Solgt',     from:'ON_AUCTION',     to:'SOLD' },
    { label: 'Totalt konvertering', from:'EVALUATED',      to:'SOLD' },
  ];
  document.getElementById('convBars').innerHTML = convStages.map(cs => {
    const f = cars.filter(([,e])=>e.find(ev=>ev.event===cs.from)).length;
    const t = cars.filter(([,e])=>e.find(ev=>ev.event===cs.to)).length;
    const pct = f>0?Math.round(t/f*100):0;
    return `<div class="conv-row">
      <span class="conv-label">${cs.label}</span>
      <div class="conv-track"><div class="conv-fill" style="width:${pct}%"></div></div>
      <span class="conv-pct">${pct}%</span>
    </div>`;
  }).join('');

  document.getElementById('lastUpdated').textContent = 'Oppdatert ' + new Date().toLocaleTimeString('nb-NO',{hour:'2-digit',minute:'2-digit'});
}

async function loadData() {
  try {
    const res = await fetch('/api/tracked-cars?t=' + Date.now());
    if (!res.ok) throw new Error();
    render(await res.json());
  } catch {
    render(getDemoData());
    document.getElementById('lastUpdated').textContent = 'Demo-data (bot ikke tilkoblet)';
  }
}

function getDemoData() {
  const now = new Date();
  const ago = d => new Date(now - d*86400000).toISOString();
  return {
    'EC88228': [
      {event:'EVALUATED',ts:ago(18)},{event:'PICKUP_ORDERED',ts:ago(14)},
      {event:'CAR_ARRIVED',ts:ago(10)},{event:'ON_AUCTION',ts:ago(3)},
    ],
    'SX19074': [{event:'EVALUATED',ts:ago(22)},{event:'REJECTED',ts:ago(20)}],
    'RN12345': [
      {event:'EVALUATED',ts:ago(30)},{event:'PICKUP_ORDERED',ts:ago(25)},
      {event:'CAR_ARRIVED',ts:ago(20)},{event:'ON_AUCTION',ts:ago(14)},
      {event:'SOLD',ts:ago(7)},
    ],
    'DN83567': [{event:'EVALUATED',ts:ago(12)},{event:'PICKUP_ORDERED',ts:ago(8)}],
    'EB74014': [{event:'EVALUATED',ts:ago(5)}],
  };
}

loadData();
setInterval(loadData, 60000);
</script>
</body>
</html>
