<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peasy Track</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --green:   #004225;
  --green2:  #006644;
  --accent:  #00875A;
  --yellow:  #FFCC33;
  --bg0:     #F2F7F9;
  --bg1:     #E8F0F5;
  --card:    rgba(255,255,255,0.97);
  --border:  rgba(0,66,37,0.08);
  --shadow:  rgba(0,66,37,0.07);
  --text:    #004225;
  --muted:   #667;
  --red:     #C62828;
  --red-bg:  #FDECEA;
  --orange:  #E65100;
  --ora-bg:  #FFF3E0;
  --blue:    #1565C0;
  --blu-bg:  #E3F2FD;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,var(--bg0),var(--bg1));color:var(--text);min-height:100vh;}

header{background:var(--green);height:64px;padding:0 40px;display:flex;align-items:center;justify-content:space-between;}
.logo img{height:28px;}
.header-right{display:flex;align-items:center;gap:16px;}
.pill{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,0.1);border-radius:99px;padding:5px 14px;font-size:12px;font-weight:500;color:rgba(255,255,255,0.85);}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:#4CAF50;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.nav-link{font-size:13px;font-weight:600;color:rgba(255,255,255,0.65);text-decoration:none;letter-spacing:0.3px;padding:6px 14px;border-radius:99px;transition:all 0.15s;}
.nav-link:hover{color:#fff;background:rgba(255,255,255,0.1);}
.nav-link.active{color:var(--green);background:var(--yellow);}

main{max-width:1200px;margin:0 auto;padding:40px 24px 80px;}
.section-label{font-size:10px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);margin-bottom:14px;margin-top:40px;}
.section-label:first-child{margin-top:0;}

/* KPI COUNTERS */
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px 16px 16px;box-shadow:0 4px 24px var(--shadow);text-align:center;position:relative;overflow:hidden;}
.kpi-label{font-size:9px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.kpi-value{font-size:38px;font-weight:900;letter-spacing:-2px;line-height:1;}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:6px;}
.kpi-tag{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px;margin-top:7px;letter-spacing:0.5px;}
.on-target .kpi-tag{background:#E8F5E9;color:#2E7D32;}
.off-target .kpi-tag{background:var(--red-bg);color:var(--red);}
.neutral .kpi-tag{background:#FFFDE7;color:#F57F17;}
.kpi-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;}
.on-target::after{background:linear-gradient(90deg,#4CAF50,#81C784);}
.off-target::after{background:linear-gradient(90deg,var(--red),#EF9A9A);}
.neutral::after{background:linear-gradient(90deg,var(--yellow),#FFE082);}

/* FUNNEL */
.funnel-row{display:grid;grid-template-columns:repeat(9,1fr);gap:0;background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 4px 20px var(--shadow);}
.funnel-step{padding:20px 12px;text-align:center;border-right:1px solid var(--border);position:relative;}
.funnel-step:last-child{border-right:none;}
.f-icon{font-size:22px;margin-bottom:6px;}
.f-num{font-size:28px;font-weight:800;letter-spacing:-1px;color:var(--green);margin-bottom:2px;}
.f-label{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
.f-pct{font-size:10px;font-weight:600;margin-top:4px;padding:2px 6px;border-radius:99px;display:inline-block;}
.funnel-arrow{display:flex;align-items:center;justify-content:center;color:rgba(0,66,37,0.15);font-size:18px;border-right:1px solid var(--border);}
.f-rejected .f-num{color:var(--red);}
.f-rejected .f-pct{background:var(--red-bg);color:var(--red);}
.f-sold .f-num{color:var(--accent);}
.f-sold .f-pct{background:#E8F5E9;color:#2E7D32;}
.f-mottatt .f-pct{background:var(--blu-bg);color:var(--blue);}

/* PIPELINE CARDS */
.pipeline-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.car-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:0 3px 16px var(--shadow);display:flex;flex-direction:column;gap:6px;}
.car-top{display:flex;align-items:center;justify-content:space-between;}
.car-regnr{font-size:15px;font-weight:800;color:var(--green);letter-spacing:0.3px;}
.car-model{font-size:12px;color:var(--muted);font-weight:500;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:700;}
.b-mottatt  {background:var(--blu-bg);color:var(--blue);}
.b-prod     {background:#F3E5F5;color:#6A1B9A;}
.b-auksjon  {background:#E8EAF6;color:#283593;}
.b-solgt    {background:#E8F5E9;color:#2E7D32;}
.b-returnert{background:var(--red-bg);color:var(--red);}
.b-avvist   {background:#FFF8E1;color:#F57F17;}
.car-days{font-size:11px;font-weight:600;}
.days-ok  {color:var(--accent);}
.days-warn{color:var(--orange);}
.days-over{color:var(--red);}
.car-detail{font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;}
.progress-bar{height:4px;background:rgba(0,66,37,0.08);border-radius:99px;overflow:hidden;margin-top:4px;}
.progress-fill{height:100%;border-radius:99px;}

/* TABLE */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.table-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 4px 24px var(--shadow);}
.th{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.th-title{font-size:13px;font-weight:700;}
.th-badge{font-size:11px;background:var(--bg0);color:var(--muted);padding:3px 10px;border-radius:99px;}
table{width:100%;border-collapse:collapse;}
thead tr{background:rgba(0,66,37,0.03);}
th{text-align:left;font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:var(--muted);padding:9px 14px;border-bottom:1px solid var(--border);}
td{padding:10px 14px;font-size:12px;border-bottom:1px solid rgba(0,66,37,0.04);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(0,66,37,0.015);}
.regnr{font-weight:700;color:var(--green);font-size:13px;}
.car-name{font-size:11px;color:var(--muted);display:block;margin-top:1px;}

.loading{text-align:center;padding:80px;color:var(--muted);font-size:14px;}
.spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:12px;}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:900px){
  .kpi-grid{grid-template-columns:1fr 1fr;}
  .funnel-row{grid-template-columns:1fr 1fr 1fr;}
  .funnel-arrow{display:none;}
  .two-col{grid-template-columns:1fr;}
  header{padding:0 20px;}
  main{padding:24px 16px 60px;}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <img src="https://raw.githubusercontent.com/mikeljungbergtvedt/mikeljungbergtvedt.github.io/main/Peasy_Logo_Hvit_gulSpoiler.png" alt="Peasy">
  </div>
  <div class="header-right">
    <a href="peasy-track.html" class="nav-link active">Track</a>
    <a href="peasy-pulse.html" class="nav-link">Pulse</a>
    <div class="pill"><div class="pulse-dot"></div><span id="clock">–</span></div>
  </div>
</header>

<main>
  <div id="app"><div class="loading"><div class="spinner"></div><br>Henter data fra Autoringen…</div></div>
</main>

<script>
const API    = 'https://api.biladministrasjon.no/public/reports/peasy/dhqui7Hkl54?output=xlsx';
const CUTOFF = new Date('2025-11-01');
const TARGETS = { evalMottatt: 10, mottattSolgt: 70, prodDays: 3 };

function parseDLow(val) {
  if (!val || val==='-') return null;
  try { const n=parseInt(String(val).replace(/\s|\u00a0/g,'').split('-')[0]); return isNaN(n)?null:n; }
  catch { return null; }
}
function parseDate(val) {
  if (!val) return null;
  const parts=String(val).trim().slice(0,10).split('.');
  return parts.length===3 ? new Date(`${parts[2]}-${parts[1]}-${parts[0]}`) : null;
}
function daysAgo(d) {
  if (!d) return '–';
  const n=Math.floor((Date.now()-new Date(d))/86400000);
  if(n===0)return'I dag'; if(n===1)return'I går'; return`${n}d siden`;
}
function fmtDate(d){if(!d)return'–';return new Date(d).toLocaleDateString('nb-NO',{day:'numeric',month:'short'});}
function fmtK(n){return n?Math.round(n/1000).toLocaleString('nb-NO')+'k':'–';}
function pct(n,of){return of?Math.round(n/of*100):0;}
function daysClass(d,t){if(d<=t)return'days-ok';if(d<=t*2)return'days-warn';return'days-over';}

async function loadData() {
  const res=await fetch(API);
  const buf=await res.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array'});
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
}

function processData(rows) {
  const data={evaluated:[],mottatt:[],inProd:[],onAuction:[],sold:[],returned:[],avvist:[]};

  for(let i=1;i<rows.length;i++){
    const r=rows[i];
    const regnr=r[1]; if(!regnr) continue;
    const nDate=parseDate(r[13]);
    if(nDate && nDate<CUTOFF) continue;

    const label=[r[6],r[7],r[8]].filter(Boolean).join(' ');
    const dLow=parseDLow(r[3]);
    const t=r[19]?parseInt(String(r[19]).replace(/[\s\u00a0]/g,''))||null:null;
    const pDate=r[15], qDate=r[16], rDate=r[17], sDate=r[18], vDate=r[21];
    const status=String(r[12]||'').toLowerCase();
    const km=r[22];

    const car={regnr,label,dLow,t,pDate,qDate,rDate,sDate,vDate,km,nDate};

    if(dLow) data.evaluated.push(car);
    if(pDate||qDate) data.mottatt.push(car);
    if(sDate) data.sold.push(car);
    if(vDate) data.returned.push(car);

    if(dLow && !pDate && !qDate && !sDate && !vDate && (status.includes('avvist')||status.includes('reject'))) {
      data.avvist.push(car);
    }

    if(rDate && !sDate && !vDate) {
      const mottattDate=parseDate(rDate);
      const daysSince=mottattDate?Math.floor((Date.now()-mottattDate)/86400000):null;
      const isOnAuction=status.includes('auksjon')||status.includes('auction');
      if(isOnAuction) data.onAuction.push({...car,daysSince,mottattDate});
      else data.inProd.push({...car,daysSince,mottattDate});
    }
  }
  return data;
}

function render(data) {
  const totalEval=data.evaluated.length;
  const totalMott=data.mottatt.length;
  const totalSold=data.sold.length;
  const totalRet=data.returned.length;
  const totalProd=data.inProd.length;
  const totalAuct=data.onAuction.length;
  const mottRate=pct(totalMott,totalEval);
  const soldRate=pct(totalSold,totalMott);
  const mottOk=mottRate>=TARGETS.evalMottatt;
  const sldOk=soldRate>=TARGETS.mottattSolgt;

  const prodDaysArr=data.inProd.filter(c=>c.daysSince!==null).map(c=>c.daysSince);
  const avgProd=prodDaysArr.length?(prodDaysArr.reduce((a,b)=>a+b,0)/prodDaysArr.length).toFixed(1):'–';
  const prodOk=avgProd==='-'||parseFloat(avgProd)<=TARGETS.prodDays;

  let html='';

  html+=`
  <div class="section-label">Nøkkeltall</div>
  <div class="kpi-grid">
    <div class="kpi-card neutral">
      <div class="kpi-label">Evaluert totalt</div>
      <div class="kpi-value">${totalEval}</div>
      <div class="kpi-sub">Tilbud sendt selger</div>
      <div class="kpi-tag">Fra 1.11.2025</div>
    </div>
    <div class="kpi-card ${mottOk?'on-target':'off-target'}">
      <div class="kpi-label">Evaluert → Mottatt</div>
      <div class="kpi-value">${mottRate}<span style="font-size:22px;font-weight:600">%</span></div>
      <div class="kpi-sub">${totalMott} av ${totalEval} mottatt</div>
      <div class="kpi-tag">Mål ${TARGETS.evalMottatt}%</div>
    </div>
    <div class="kpi-card ${sldOk?'on-target':'off-target'}">
      <div class="kpi-label">Mottatt → Solgt</div>
      <div class="kpi-value">${soldRate}<span style="font-size:22px;font-weight:600">%</span></div>
      <div class="kpi-sub">${totalSold} av ${totalMott} solgt</div>
      <div class="kpi-tag">Mål ${TARGETS.mottattSolgt}%</div>
    </div>
    <div class="kpi-card ${prodOk?'on-target':'off-target'}">
      <div class="kpi-label">Produksjonstid snitt</div>
      <div class="kpi-value">${avgProd}<span style="font-size:22px;font-weight:600"> d</span></div>
      <div class="kpi-sub">Mottatt → klar for auksjon</div>
      <div class="kpi-tag">Mål ${TARGETS.prodDays}d</div>
    </div>
    <div class="kpi-card neutral">
      <div class="kpi-label">Aktive nå</div>
      <div class="kpi-value">${totalProd+totalAuct}</div>
      <div class="kpi-sub">${totalProd} produksjon · ${totalAuct} auksjon</div>
      <div class="kpi-tag">Live</div>
    </div>
  </div>`;

  const avvistCount=data.avvist.length;
  html+=`
  <div class="section-label">Salgstrakt</div>
  <div class="funnel-row">
    <div class="funnel-step">
      <div class="f-icon">📄</div>
      <div class="f-num">${totalEval}</div>
      <div class="f-label">Evaluert</div>
    </div>
    <div class="funnel-arrow">›</div>
    <div class="funnel-step f-mottatt">
      <div class="f-icon">🚗</div>
      <div class="f-num">${totalMott}</div>
      <div class="f-label">Mottatt</div>
      <div class="f-pct">${mottRate}%</div>
    </div>
    <div class="funnel-arrow">›</div>
    <div class="funnel-step">
      <div class="f-icon">🏭</div>
      <div class="f-num">${totalProd}</div>
      <div class="f-label">Produksjon</div>
    </div>
    <div class="funnel-arrow">›</div>
    <div class="funnel-step">
      <div class="f-icon">🔨</div>
      <div class="f-num">${totalAuct}</div>
      <div class="f-label">Auksjon</div>
    </div>
    <div class="funnel-arrow">›</div>
    <div class="funnel-step f-sold">
      <div class="f-icon">🎉</div>
      <div class="f-num">${totalSold}</div>
      <div class="f-label">Solgt</div>
      <div class="f-pct">${soldRate}%</div>
    </div>
    <div class="funnel-arrow">›</div>
    <div class="funnel-step f-rejected">
      <div class="f-icon">↩</div>
      <div class="f-num">${totalRet}</div>
      <div class="f-label">Returnert</div>
      <div class="f-pct">${pct(totalRet,totalMott)}%</div>
    </div>
  </div>`;

  const inProdSorted=[...data.inProd].sort((a,b)=>(b.daysSince||0)-(a.daysSince||0));
  const maxD=Math.max(...inProdSorted.map(c=>c.daysSince||0),1);

  html+=`
  <div class="section-label">🏭 I produksjon på anlegg (${totalProd} biler)</div>
  <div class="pipeline-grid">`;

  if(!inProdSorted.length){
    html+=`<div style="color:var(--muted);padding:24px;font-size:13px;grid-column:1/-1">Ingen biler i produksjon nå</div>`;
  }
  for(const car of inProdSorted){
    const d=car.daysSince;
    const cls=daysClass(d,TARGETS.prodDays);
    const barPct=Math.min((d/Math.max(maxD,7))*100,100);
    const barColor=cls==='days-ok'?'#4CAF50':cls==='days-warn'?'#E65100':'#C62828';
    html+=`
    <div class="car-card">
      <div class="car-top">
        <span class="car-regnr">${car.regnr}</span>
        <span class="badge b-prod">🏭 Produksjon</span>
      </div>
      <div class="car-model">${car.label||'Ukjent bil'}</div>
      <div class="car-days ${cls}">${d!==null?`${d} dager på anlegg`:'Ukjent dato'}</div>
      <div class="car-detail">
        <span>Mottatt: ${fmtDate(car.rDate)}</span>
        ${car.dLow?`<span>Pris lav: ${fmtK(car.dLow)}</span>`:''}
        ${car.km?`<span>${Math.round(car.km/1000)}k km</span>`:''}
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${barPct}%;background:${barColor}"></div></div>
    </div>`;
  }
  html+=`</div>`;

  if(data.onAuction.length){
    html+=`<div class="section-label">🔨 På auksjon nå ${totalAuct} biler)</div><div class="pipeline-grid">`;
    for(const car of data.onAuction){
      html+=`
      <div class="car-card">
        <div class="car-top">
          <span class="car-regnr">${car.regnr}</span>
          <span class="badge b-auksjon">🔨 Auksjon</span>
        </div>
        <div class="car-model">${car.label||'Ukjent bil'}</div>
        <div class="car-detail">
          <span>Mottatt: ${fmtDate(car.rDate)}</span>
          ${car.dLow?`<span>Pris lav: ${fmtK(car.dLow)}</span>`:''}
        </div>
      </div>`;
    }
    html+=`</div>`;
  }

  const recentSold=[...data.sold].sort((a,b)=>new Date(b.sDate)-new Date(a.sDate)).slice(0,10);
  const recentRet=[...data.returned].sort((a,b)=>new Date(b.vDate)-new Date(a.vDate)).slice(0,10);

  html+=`
  <div class="section-label">Nylig fullført</div>
  <div class="two-col">
    <div class="table-card">
      <div class="th">
        <div class="th-title">✅ Nylig solgt</div>
        <div class="th-badge">${totalSold} totalt</div>
      </div>
      <table>
        <thead><tr><th>Regnr / Bil</th><th>Pris lav</th><th>Bud</th><th>Solgt</th></tr></thead>
        <tbody>`;
  for(const c of recentSold){
    const gap=c.t&&c.dLow?(c.t-c.dLow)/c.dLow*100:null;
    const gapCol=gap===null?'var(--muted)':gap>=0?'#2E7D32':gap>-10?'#E65100':'#C62828';
    html+=`<tr>
      <td><span class="regnr">${c.regnr}</span><span class="car-name">${c.label||'–'}</span></td>
      <td>${fmtK(c.dLow)}</td>
      <td style="color:${gapCol};font-weight:700">${fmtK(c.t)}</td>
      <td style="color:var(--muted);font-size:11px">${daysAgo(c.sDate)}</td>
    </tr>`;
  }
  html+=`</tbody></table></div>
    <div class="table-card">
      <div class="th">
        <div class="th-title">↩ Nylig returnert</div>
        <div class="th-badge">${totalRet} totalt</div>
      </div>
      <table>
        <thead><tr><th>Regnr / Bil</th><th>Pris lav</th><th>Ud</th><th>Returnert</th></tr></thead>
        <tbody>`;
  for(const c of recentRet){
    html+=`<tr>
      <td><span class="regnr">${c.regnr}</span><span class="car-name">${c.label||'–'}</span></td>
      <td>${fmtK(c.dLow)}</td>
      <td style="color:var(--red);font-weight:700">${fmtK(c.t)}</td>
      <td style="color:var(--muted);font-size:11px">${daysAgo(c.vDate)}</td>
    </tr>`;
  }
  html+=`</tbody></table></div></div>`;

  document.getElementById('app').innerHTML=html;
}

setInterval(()=>{
  document.getElementById('clock').textContent=
    new Date().toLocaleTimeString('nb-NO',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
},1000);

loadData().then(rows=>{
  render(processData(rows));
}).catch(err=>{
  document.getElementById('app').innerHTML=
    `<div style="text-align:center;padding:60px;color:#C62828">
      Kunne ikke hente data: ${err.message}<br>
      <small style="color:#999">CORS kan blokkere direkte API-kall fra browser.</small>
    </div>`;
});
</script>
</body>
</html>
