<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peasy Track</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --green:       #004225;
    --green-mid:   #005a32;
    --green-light: #e8f0eb;
    --yellow:      #FFCC33;
    --yellow-soft: #fff8e1;
    --blue:        #82bfd2;
    --blue-soft:   #e8f4f8;
    --bg:          #F2F7F5;
    --surface:     #ffffff;
    --border:      rgba(0,66,37,0.08);
    --muted:       #6b8f7a;
    --text:        #004225;
    --danger:      #c0392b;
    --danger-soft: #fdf0ee;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 48px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo img {
    height: 32px;
  }

  .logo-tag {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--muted);
    background: var(--green-light);
    padding: 3px 8px;
    border-radius: 4px;
  }

  .header-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
  }

  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #2ecc71;
    box-shadow: 0 0 0 0 rgba(46,204,113,0.4);
    animation: ping 2s ease infinite;
  }

  .live-dot.offline { background: var(--muted); box-shadow: none; animation: none; }

  @keyframes ping {
    0%   { box-shadow: 0 0 0 0 rgba(46,204,113,0.4); }
    70%  { box-shadow: 0 0 0 6px rgba(46,204,113,0); }
    100% { box-shadow: 0 0 0 0 rgba(46,204,113,0); }
  }

  /* ── LAYOUT ── */
  main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 40px 48px 64px;
  }

  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  /* ── FUNNEL ── */
  .funnel-wrap {
    margin-bottom: 32px;
  }

  .funnel {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    background: var(--surface);
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 1px 4px rgba(0,66,37,0.05);
  }

  .funnel-step {
    padding: 20px 10px 16px;
    text-align: center;
    border-right: 1px solid var(--border);
    position: relative;
    transition: background 0.15s;
    cursor: default;
  }

  .funnel-step:last-child { border-right: none; }
  .funnel-step:hover { background: var(--green-light); }

  .funnel-step::after {
    content: '›';
    position: absolute;
    right: -9px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--border);
    font-size: 20px;
    z-index: 2;
    pointer-events: none;
  }
  .funnel-step:last-child::after { display: none; }

  .funnel-emoji { font-size: 18px; margin-bottom: 6px; }

  .funnel-count {
    font-size: 30px;
    font-weight: 800;
    color: var(--green);
    line-height: 1;
    margin-bottom: 4px;
  }

  .funnel-count.has-count { color: var(--green); }
  .funnel-count.zero { color: rgba(0,66,37,0.2); }

  .funnel-label {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .funnel-bar {
    height: 3px;
    background: var(--yellow);
    margin-top: 10px;
    border-radius: 2px;
    transition: width 1s ease;
    min-width: 0;
  }

  /* ── KPI ROW ── */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 32px;
  }

  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 24px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,66,37,0.05);
  }

  .kpi-card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: var(--yellow);
    border-radius: 0 0 14px 14px;
  }

  .kpi-card.green::after  { background: var(--green); }
  .kpi-card.blue::after   { background: var(--blue); }
  .kpi-card.danger::after { background: var(--danger); }

  .kpi-value {
    font-size: 40px;
    font-weight: 800;
    color: var(--green);
    line-height: 1;
    margin-bottom: 6px;
    letter-spacing: -1px;
  }

  .kpi-unit { font-size: 20px; font-weight: 400; color: var(--muted); }

  .kpi-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
  }

  /* ── MAIN GRID ── */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 20px;
    margin-bottom: 20px;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,66,37,0.05);
  }

  .panel-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .panel-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--green);
  }

  .panel-meta {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
  }

  /* ── TABLE ── */
  .cars-table { width: 100%; border-collapse: collapse; }

  .cars-table th {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 10px 24px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    background: #fafcfb;
  }

  .cars-table td {
    padding: 13px 24px;
    font-size: 13px;
    border-bottom: 1px solid rgba(0,66,37,0.04);
    vertical-align: middle;
  }

  .cars-table tr:last-child td { border-bottom: none; }
  .cars-table tr:hover td { background: var(--green-light); }

  .regnr {
    font-size: 12px;
    font-weight: 700;
    color: var(--green);
    letter-spacing: 0.5px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
  }

  .badge-default { background: var(--yellow-soft); color: #7a5c00; border: 1px solid rgba(255,204,51,0.3); }
  .badge-green   { background: var(--green-light);  color: var(--green); border: 1px solid rgba(0,66,37,0.15); }
  .badge-blue    { background: var(--blue-soft);    color: #1a6e8a; border: 1px solid rgba(130,191,210,0.3); }
  .badge-red     { background: var(--danger-soft);  color: var(--danger); border: 1px solid rgba(192,57,43,0.2); }
  .badge-muted   { background: #f5f5f5; color: var(--muted); border: 1px solid rgba(0,0,0,0.08); }

  .days-bar { display: flex; align-items: center; gap: 8px; }
  .days-track { width: 64px; height: 4px; background: rgba(0,66,37,0.08); border-radius: 2px; overflow: hidden; }
  .days-fill { height: 100%; background: var(--blue); border-radius: 2px; }
  .days-fill.warn   { background: var(--yellow); }
  .days-fill.danger { background: var(--danger); }
  .days-num { font-size: 11px; font-weight: 500; color: var(--muted); }

  /* ── EVENTS FEED ── */
  .event-item {
    padding: 12px 24px;
    border-bottom: 1px solid rgba(0,66,37,0.04);
    display: flex;
    align-items: flex-start;
    gap: 11px;
  }
  .event-item:last-child { border-bottom: none; }

  .event-emoji { font-size: 14px; flex-shrink: 0; margin-top: 2px; }
  .event-body { flex: 1; min-width: 0; }
  .event-regnr { font-size: 11px; font-weight: 700; color: var(--green); letter-spacing: 0.3px; }
  .event-label { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .event-time { font-size: 10px; font-weight: 500; color: var(--muted); flex-shrink: 0; padding-top: 2px; }

  /* ── CONV BARS ── */
  .conv-bars { padding: 20px 24px; display: flex; flex-direction: column; gap: 13px; }

  .conv-row { display: flex; align-items: center; gap: 12px; }

  .conv-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    width: 160px;
    flex-shrink: 0;
  }

  .conv-track {
    flex: 1;
    height: 6px;
    background: rgba(0,66,37,0.07);
    border-radius: 3px;
    overflow: hidden;
  }

  .conv-fill {
    height: 100%;
    background: var(--green);
    border-radius: 3px;
    transition: width 1.2s ease;
  }

  .conv-fill.highlight { background: var(--yellow); }

  .conv-pct {
    font-size: 12px;
    font-weight: 700;
    color: var(--green);
    width: 36px;
    text-align: right;
    flex-shrink: 0;
  }

  /* ── STATES ── */
  .loading {
    display: flex; align-items: center; justify-content: center;
    padding: 40px; gap: 10px; color: var(--muted); font-size: 13px;
  }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(0,66,37,0.1);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state { padding: 40px 24px; text-align: center; color: var(--muted); }
  .empty-icon  { font-size: 28px; margin-bottom: 10px; opacity: 0.35; }
  .empty-text  { font-size: 13px; }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 24px;
    font-size: 12px;
    color: var(--muted);
  }
  footer a { color: var(--green); text-decoration: none; font-weight: 600; }

  /* ── RESPONSIVE ── */
  @media (max-width: 1100px) {
    .main-grid { grid-template-columns: 1fr; }
    .kpi-row   { grid-template-columns: repeat(2, 1fr); }
    .funnel    { grid-template-columns: repeat(4, 1fr); }
  }
  @media (max-width: 640px) {
    header, main { padding: 16px 20px; }
    .funnel      { grid-template-columns: repeat(2, 1fr); }
    .kpi-row     { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <img src="https://mikeljungbergtvedt.github.io/Peasy_Logo_ORG.png" alt="Peasy">
    <span class="logo-tag">Track</span>
  </div>
  <div class="header-status">
    <div class="live-dot" id="liveDot"></div>
    <span id="lastUpdated">Laster...</span>
  </div>
</header>

<main>

  <div class="funnel-wrap">
    <div class="section-label">Salgstrakt</div>
    <div class="funnel" id="funnel">
      <div class="loading" style="grid-column:1/-1"><div class="spinner"></div></div>
    </div>
  </div>

  <div class="kpi-row">
    <div class="kpi-card">
      <div class="kpi-value"><span id="kpiTotal">—</span></div>
      <div class="kpi-label">Totalt evaluert</div>
    </div>
    <div class="kpi-card green">
      <div class="kpi-value"><span id="kpiConv">—</span><span class="kpi-unit">%</span></div>
      <div class="kpi-label">Konvertering (solgt)</div>
    </div>
    <div class="kpi-card blue">
      <div class="kpi-value"><span id="kpiAvgDays">—</span><span class="kpi-unit" id="kpiDaysUnit">d</span></div>
      <div class="kpi-label">Snitt dager tilbud → solgt</div>
    </div>
    <div class="kpi-card danger">
      <div class="kpi-value"><span id="kpiRejected">—</span></div>
      <div class="kpi-label">Avvist av selger</div>
    </div>
  </div>

  <div class="main-grid">
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Aktive biler</span>
        <span class="panel-meta" id="activeCount">—</span>
      </div>
      <div id="carsTableWrap"><div class="loading"><div class="spinner"></div></div></div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Siste hendelser</span>
      </div>
      <div id="eventsFeed"><div class="loading"><div class="spinner"></div></div></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">Konvertering per trinn</span>
    </div>
    <div class="conv-bars" id="convBars">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>

</main>

<footer>
  Peasy &nbsp;·&nbsp; <a href="https://peasy.no">peasy.no</a> &nbsp;·&nbsp; <a href="https://mikeljungbergtvedt.github.io/peasyportal.html">← Portal</a>
</footer>

<script>
const GITHUB_URL = 'https://raw.githubusercontent.com/mikeljungbergtvedt/mikeljungbergtvedt.github.io/main/tracked-cars.json';

const STAGES = [
  { type: 'EVALUATED',        emoji: '📤', label: 'Evaluert' },
  { type: 'PICKUP_ORDERED',   emoji: '📦', label: 'Henting' },
  { type: 'CAR_ARRIVED',      emoji: '🏁', label: 'Ankommet' },
  { type: 'READY_AUCTION',    emoji: '🏷️', label: 'Klar' },
  { type: 'ON_AUCTION',       emoji: '🔨', label: 'Auksjon' },
  { type: 'AUCTION_FINISHED', emoji: '⏱️', label: 'Ferdig' },
  { type: 'SOLD',             emoji: '🎉', label: 'Solgt' },
  { type: 'REJECTED',         emoji: '❌', label: 'Avvist' },
];

const STAGE_ORDER = ['EVALUATED','PICKUP_ORDERED','CAR_ARRIVED','READY_AUCTION','ON_AUCTION','AUCTION_FINISHED','SOLD'];

function getLatestStage(events) {
  for (let i = STAGE_ORDER.length - 1; i >= 0; i--)
    if (events.find(e => e.event === STAGE_ORDER[i])) return STAGE_ORDER[i];
  if (events.find(e => e.event === 'REJECTED')) return 'REJECTED';
  return 'UNKNOWN';
}

function daysSince(ts) { return Math.round((Date.now() - new Date(ts)) / 86400000); }
function stageLabel(s) { return STAGES.find(x => x.type === s)?.label || s; }
function stageEmoji(s) { return STAGES.find(x => x.type === s)?.emoji || '•'; }

function badgeClass(s) {
  if (s === 'SOLD')    return 'badge-green';
  if (s === 'REJECTED') return 'badge-red';
  if (s === 'ON_AUCTION' || s === 'AUCTION_FINISHED') return 'badge-blue';
  if (s === 'EVALUATED') return 'badge-muted';
  return 'badge-default';
}

function fmt(ts) {
  return new Date(ts).toLocaleString('nb-NO', { day:'2-digit', month:'numeric', hour:'2-digit', minute:'2-digit' });
}

function fmtClock() {
  return new Date().toLocaleTimeString('nb-NO', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
}

function render(data, isLive) {
  const cars = Object.entries(data);

  // dot
  const dot = document.getElementById('liveDot');
  if (isLive) dot.classList.remove('offline');
  else dot.classList.add('offline');

  // FUNNEL
  const counts = {};
  STAGES.forEach(s => counts[s.type] = 0);
  cars.forEach(([,ev]) => { const s = getLatestStage(ev); if (counts[s] !== undefined) counts[s]++; });
  const maxC = Math.max(...Object.values(counts), 1);
  document.getElementById('funnel').innerHTML = STAGES.map(s => {
    const c = counts[s.type] || 0;
    return `<div class="funnel-step">
      <div class="funnel-emoji">${s.emoji}</div>
      <div class="funnel-count ${c > 0 ? 'has-count' : 'zero'}">${c}</div>
      <div class="funnel-label">${s.label}</div>
      <div class="funnel-bar" style="width:${Math.round(c/maxC*100)}%"></div>
    </div>`;
  }).join('');

  // KPIs
  const total     = cars.length;
  const sold      = cars.filter(([,e]) => e.find(ev=>ev.event==='SOLD')).length;
  const rejected  = cars.filter(([,e]) => e.find(ev=>ev.event==='REJECTED')).length;
  const conv      = total > 0 ? Math.round(sold/total*100) : 0;
  const soldDays  = cars
    .filter(([,e]) => e.find(ev=>ev.event==='SOLD') && e.find(ev=>ev.event==='EVALUATED'))
    .map(([,e]) => Math.round((new Date(e.find(ev=>ev.event==='SOLD').ts) - new Date(e.find(ev=>ev.event==='EVALUATED').ts))/86400000));
  const avgD = soldDays.length ? Math.round(soldDays.reduce((a,b)=>a+b,0)/soldDays.length) : '—';

  document.getElementById('kpiTotal').textContent    = total;
  document.getElementById('kpiConv').textContent     = conv;
  document.getElementById('kpiAvgDays').textContent  = avgD;
  document.getElementById('kpiDaysUnit').textContent = avgD === '—' ? '' : 'd';
  document.getElementById('kpiRejected').textContent = rejected;

  // ACTIVE CARS
  const active = cars.filter(([,e]) => { const s=getLatestStage(e); return s!=='SOLD'&&s!=='REJECTED'; });
  document.getElementById('activeCount').textContent = active.length + ' biler';

  if (!active.length) {
    document.getElementById('carsTableWrap').innerHTML = `<div class="empty-state"><div class="empty-icon">🚗</div><div class="empty-text">Ingen aktive biler</div></div>`;
  } else {
    const rows = active.map(([rn,ev]) => {
      const s    = getLatestStage(ev);
      const days = ev[0] ? daysSince(ev[0].ts) : 0;
      const pct  = Math.min(days/30*100,100);
      const bc   = days>20?'danger':days>10?'warn':'';
      return `<tr>
        <td><span class="regnr">${rn}</span></td>
        <td><span class="badge ${badgeClass(s)}">${stageEmoji(s)} ${stageLabel(s)}</span></td>
        <td><div class="days-bar"><div class="days-track"><div class="days-fill ${bc}" style="width:${pct}%"></div></div><span class="days-num">${days}d</span></div></td>
        <td><span class="days-num">${ev.length} hendelser</span></td>
      </tr>`;
    }).join('');
    document.getElementById('carsTableWrap').innerHTML = `
      <table class="cars-table">
        <thead><tr><th>Regnr</th><th>Status</th><th>Dager</th><th>Hendelser</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  // EVENTS FEED
  const allEv = [];
  cars.forEach(([rn,ev]) => ev.forEach(e => allEv.push({rn,...e})));
  allEv.sort((a,b) => new Date(b.ts)-new Date(a.ts));
  const recent = allEv.slice(0,20);

  document.getElementById('eventsFeed').innerHTML = recent.length
    ? recent.map(e => `<div class="event-item">
        <span class="event-emoji">${stageEmoji(e.event)}</span>
        <div class="event-body">
          <div class="event-regnr">${e.rn}</div>
          <div class="event-label">${stageLabel(e.event)}</div>
        </div>
        <span class="event-time">${fmt(e.ts)}</span>
      </div>`).join('')
    : `<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">Ingen hendelser ennå</div></div>`;

  // CONV BARS
  const convStages = [
    { label: 'Evaluert → Henting',  from:'EVALUATED',      to:'PICKUP_ORDERED', highlight: false },
    { label: 'Henting → Ankommet',  from:'PICKUP_ORDERED', to:'CAR_ARRIVED',    highlight: false },
    { label: 'Ankommet → Auksjon',  from:'CAR_ARRIVED',    to:'ON_AUCTION',     highlight: false },
    { label: 'Auksjon → Solgt',     from:'ON_AUCTION',     to:'SOLD',           highlight: false },
    { label: 'Totalt konvertering', from:'EVALUATED',      to:'SOLD',           highlight: true  },
  ];
  document.getElementById('convBars').innerHTML = convStages.map(cs => {
    const f   = cars.filter(([,e])=>e.find(ev=>ev.event===cs.from)).length;
    const t   = cars.filter(([,e])=>e.find(ev=>ev.event===cs.to)).length;
    const pct = f>0?Math.round(t/f*100):0;
    return `<div class="conv-row">
      <span class="conv-label">${cs.label}</span>
      <div class="conv-track"><div class="conv-fill${cs.highlight?' highlight':''}" style="width:${pct}%"></div></div>
      <span class="conv-pct">${pct}%</span>
    </div>`;
  }).join('');
}

// Running clock
function tickClock(isLive) {
  document.getElementById('lastUpdated').textContent =
    (isLive ? 'Live · ' : 'Demo · ') + fmtClock();
}

let lastIsLive = false;
setInterval(() => tickClock(lastIsLive), 1000);

async function loadData() {
  try {
    const res = await fetch(GITHUB_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    lastIsLive = true;
    render(data, true);
  } catch {
    lastIsLive = false;
    render(getDemoData(), false);
  }
}

function getDemoData() {
  const now = new Date();
  const ago = d => new Date(now - d*86400000).toISOString();
  return {
    'EC88228': [
      {event:'EVALUATED',ts:ago(18)},{event:'PICKUP_ORDERED',ts:ago(14)},
      {event:'CAR_ARRIVED',ts:ago(10)},{event:'ON_AUCTION',ts:ago(3)},
    ],
