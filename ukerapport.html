<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peasy Ukerapport</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#F2F7F9,#E8F0F5);color:#004225;min-height:100vh;}
header{background:#004225;height:64px;padding:0 40px;display:flex;align-items:center;justify-content:space-between;}
.logo img{height:28px;}
.nav a{font-size:11px;color:rgba(255,255,255,0.4);text-decoration:none;padding:4px 8px;border-radius:99px;margin-left:8px;}
.nav a:hover{color:rgba(255,255,255,0.8);}
main{max-width:960px;margin:0 auto;padding:40px 24px 80px;}
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.week-title{font-size:20px;font-weight:800;color:#004225;text-align:center;}
.week-sub{font-size:11px;color:#aaa;text-align:center;margin-top:3px;}
.btn{background:#004225;color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:12px;font-weight:600;cursor:pointer;}
.btn:disabled{background:#ccc;cursor:not-allowed;}
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px;}
.kpi{background:rgba(255,255,255,0.97);border-radius:16px;padding:18px 12px;text-align:center;box-shadow:0 4px 24px rgba(0,66,37,0.07);border:1px solid rgba(0,66,37,0.08);}
.kpi-val{font-size:32px;font-weight:900;line-height:1;letter-spacing:-1px;}
.kpi-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#667;margin-top:6px;}
.kpi-sub{font-size:10px;color:#aaa;margin-top:3px;}
.card{background:rgba(255,255,255,0.97);border-radius:16px;margin-bottom:16px;box-shadow:0 4px 24px rgba(0,66,37,0.07);overflow:hidden;border:1px solid rgba(0,66,37,0.08);}
.card-body{padding:16px 20px;}
.card-hdr{padding:10px 16px;font-weight:700;font-size:12px;color:#fff;}
.section-label{font-size:10px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:#667;margin-bottom:10px;}
.rate-bar-bg{background:rgba(0,66,37,0.08);border-radius:99px;height:8px;position:relative;margin-top:8px;overflow:hidden;}
.rate-bar-fill{height:100%;border-radius:99px;}
.rate-marker{position:absolute;left:70%;top:-2px;width:2px;height:12px;background:rgba(0,0,0,0.15);}
.tl-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(0,66,37,0.06);font-size:12px;}
.tl-row:last-child{border-bottom:none;}
table{width:100%;border-collapse:collapse;}
thead tr{background:rgba(0,66,37,0.03);}
th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#667;padding:9px 14px;border-bottom:1px solid rgba(0,66,37,0.08);}
th.r{text-align:right;} th.c{text-align:center;}
td{padding:10px 14px;font-size:12px;border-bottom:1px solid rgba(0,66,37,0.04);}
td.r{text-align:right;} td.c{text-align:center;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(0,66,37,0.015);}
.loading{text-align:center;padding:80px;color:#aaa;}
.spinner{display:inline-block;width:32px;height:32px;border:3px solid rgba(0,66,37,0.1);border-top-color:#004225;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:12px;}
@keyframes spin{to{transform:rotate(360deg)}}
.version{position:fixed;bottom:8px;right:12px;font-size:9px;color:rgba(0,66,37,0.3);font-family:monospace;}
</style>
</head>
<body>
<a id="portal-back-link" href="peasyportal.html" style="position:fixed;top:12px;right:16px;z-index:99999;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:rgba(255,255,255,0.75);text-decoration:none;letter-spacing:0.5px;background:rgba(0,66,37,0.6);padding:5px 12px;border-radius:20px;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,0.15);transition:all .2s;" onmouseover="this.style.background='rgba(0,66,37,0.9)';this.style.color='rgba(255,204,51,0.8)'" onmouseout="this.style.background='rgba(0,66,37,0.6)';this.style.color='rgba(255,255,255,0.75)'">&#8592; portal</a>

<header>
  <div class="logo"><img src="https://raw.githubusercontent.com/mikeljungbergtvedt/mikeljungbergtvedt.github.io/main/Peasy_Logo_Hvit_gulSpoiler.png" alt="Peasy"></div>
  <div class="nav">
    <a href="https://mikeljungbergtvedt.github.io/peasy-pulse.html">&larr; Pulse</a>
    <a href="https://mikeljungbergtvedt.github.io/peasyportal.html">&larr; portal</a>
  </div>
</header>
<main>
  <div id="app"><div class="loading"><div class="spinner"></div><br>Henter data&hellip;</div></div>
</main>
<div class="version">v16.03.b</div>
<script>
const API = 'https://api.biladministrasjon.no/public/reports/peasy/dhqui7Hkl54?output=xlsx';
var weekOffset = -1; // default: last complete week

function pd(v) {
  if (!v) return null;
  var s = String(v).trim().slice(0,10);
  var p = s.split('.');
  return p.length===3 ? new Date(p[2]+'-'+p[1]+'-'+p[0]) : new Date(s);
}

function getWeekBounds(offset) {
  var now = new Date();
  var dow = now.getDay()||7;
  var mon = new Date(now); mon.setHours(0,0,0,0); mon.setDate(now.getDate()-(dow-1));
  var wS = new Date(mon); wS.setDate(mon.getDate() + offset*7);
  var wE = new Date(wS); wE.setDate(wS.getDate()+7);
  return {wS:wS, wE:wE};
}

function getWeekNumber(d) {
  var d2 = new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  var dn = d2.getUTCDay()||7; d2.setUTCDate(d2.getUTCDate()+4-dn);
  var ys = new Date(Date.UTC(d2.getUTCFullYear(),0,1));
  return Math.ceil((((d2-ys)/86400000)+1)/7);
}

function avg(arr) { return arr.length ? (arr.reduce(function(a,b){return a+b;},0)/arr.length).toFixed(1) : null; }

function days(a,b) {
  var da=pd(a), db=pd(b);
  if (!da||!db) return null;
  return Math.round((db-da)/86400000);
}

function render(rows) {
  var bounds = getWeekBounds(weekOffset);
  var wS = bounds.wS, wE = bounds.wE;
  var mo = ['jan','feb','mar','apr','mai','jun','jul','aug','sep','okt','nov','des'];
  var wn = getWeekNumber(wS);
  var wLabel = 'Uke '+wn+' &middot; '+wS.getDate()+'. '+mo[wS.getMonth()]+' &ndash; '+(new Date(wE-1)).getDate()+'. '+mo[(new Date(wE-1)).getMonth()]+' '+wE.getFullYear();

  function inW(v) { var d=pd(v); return d&&d>=wS&&d<wE; }

  var all = rows.slice(1).filter(function(r){return r[1];});
  var evaluert  = all.filter(function(r){return inW(r[14]);});
  var mottatt   = all.filter(function(r){return inW(r[17]);});
  var solgt     = all.filter(function(r){return inW(r[18]);});
  var returnert = all.filter(function(r){return inW(r[21]);});
  var avvist    = all.filter(function(r){return inW(r[14])&&String(r[12]||'').toLowerCase().indexOf('avvist')>-1;});

  var pa = solgt.length+returnert.length;
  var rate = pa>0 ? Math.round(solgt.length/pa*100) : 0;
  var fee = solgt.reduce(function(s,r){return s+(parseFloat(r[20])||0);},0);
  var rc = rate>=70 ? '#2d6a2d' : '#c62828';

  var evToMot   = evaluert.filter(function(r){return r[17];}).map(function(r){return days(r[14],r[17]);}).filter(function(d){return d!==null&&d>=0;});
  var motToSold = solgt.map(function(r){return days(r[17],r[18]);}).filter(function(d){return d!==null&&d>=0;});
  var motToRet  = returnert.map(function(r){return days(r[17],r[21]);}).filter(function(d){return d!==null&&d>=0;});

  var soldSorted = solgt.slice().sort(function(a,b){return (pd(a[18])||0)-(pd(b[18])||0);});
  var retSorted  = returnert.slice().sort(function(a,b){return (pd(a[21])||0)-(pd(b[21])||0);});

  function soldRow(r) {
    var d = days(r[17],r[18]);
    var dc = d!==null&&d>10 ? '#c62828' : '#2d6a2d';
    return '<tr><td style="font-weight:700;color:#004225">'+r[1]+'</td><td style="color:#667">'+r[6]+' '+r[7]+' '+r[8]+'</td><td class="r">'+( r[4]?Math.round(r[4]/1000)+'k':'&ndash;')+'</td><td class="r" style="color:#2d6a2d;font-weight:700">'+( r[20]?Number(r[20]).toLocaleString('nb-NO')+' kr':'&ndash;')+'</td><td class="c" style="color:'+dc+';font-weight:700">'+( d!==null?d+'d':'&ndash;')+'</td></tr>';
  }
  function retRow(r) {
    var d = days(r[17],r[21]);
    var dc = d!==null&&d>10 ? '#c62828' : '#667';
    return '<tr><td style="font-weight:700;color:#c62828">'+r[1]+'</td><td style="color:#667">'+r[6]+' '+r[7]+' '+r[8]+'</td><td class="r">'+( r[4]?Math.round(r[4]/1000)+'k':'&ndash;')+'</td><td class="c" style="color:'+dc+';font-weight:700">'+( d!==null?d+'d':'&ndash;')+'</td></tr>';
  }
  function avvRow(r) {
    var est = String(r[3]||'').trim().replace(/\s/g,'');
    var parts = est.split('-');
    var estStr = parts.length===2 ? Math.round(parseInt(parts[0])/1000)+'k&ndash;'+Math.round(parseInt(parts[1])/1000)+'k' : '&ndash;';
    return '<tr><td style="font-weight:700;color:#e65100">'+r[1]+'</td><td style="color:#667">'+r[6]+' '+r[7]+' '+r[8]+'</td><td class="r">'+estStr+'</td></tr>';
  }

  var isCurrentWeek = weekOffset === 0;

  document.getElementById('app').innerHTML =
    '<div class="week-nav">'+
      '<button class="btn" onclick="weekOffset--;loadAndRender()">&larr; Forrige uke</button>'+
      '<div><div class="week-title">'+wLabel+'</div>'+
        (isCurrentWeek ? '<div class="week-sub" style="color:#c62828">Uken er ikke ferdig enn&aring;</div>' : '')+
      '</div>'+
      '<button class="btn" onclick="weekOffset++;loadAndRender()" '+(weekOffset>=0?'disabled':'')+'>&rarr; Neste uke</button>'+
    '</div>'+

    '<div class="kpi-grid">'+
      kpi(evaluert.length,'Evaluert','tilbud sendt','#004225')+
      kpi(mottatt.length,'Mottatt','p&aring; anlegg','#1565c0')+
      kpi(solgt.length,'Solgt','biler','#2d6a2d')+
      kpi(returnert.length,'Ikke solgt','returnert','#c62828')+
      kpi(avvist.length,'Avvist','av selger','#e65100')+
    '</div>'+

    '<div class="card"><div class="card-body">'+
      '<div style="display:flex;justify-content:space-between;align-items:center">'+
        '<span style="font-weight:700;font-size:13px">Konverteringsrate (mottatt &rarr; solgt)</span>'+
        '<span><b style="color:'+rc+';font-size:20px">'+rate+'%</b> <span style="color:#aaa;font-size:12px">(m&aring;l 70%)</span> &middot; Peasy fee: <b style="color:#004225">'+fee.toLocaleString('nb-NO')+' kr</b></span>'+
      '</div>'+
      '<div class="rate-bar-bg"><div class="rate-bar-fill" style="width:'+Math.min(rate,100)+'%;background:'+rc+'"></div><div class="rate-marker"></div></div>'+
    '</div></div>'+

    '<div class="card"><div class="card-body">'+
      '<div class="section-label">Tidslinjer</div>'+
      tl('Evaluert &rarr; Mottatt (snitt)', avg(evToMot), false)+
      tl('Mottatt &rarr; Solgt (snitt)', avg(motToSold), parseFloat(avg(motToSold))>10)+
      tl('Mottatt &rarr; Returnert (snitt)', avg(motToRet), parseFloat(avg(motToRet))>10)+
    '</div></div>'+

    '<div class="card">'+
      '<div class="card-hdr" style="background:#004225">&#10003; Solgte biler ('+solgt.length+') &middot; '+fee.toLocaleString('nb-NO')+' kr fee</div>'+
      (soldSorted.length ?
        '<table><thead><tr><th>REGNR</th><th>BIL</th><th class="r">BUD</th><th class="r">FEE</th><th class="c">DAGER</th></tr></thead><tbody>'+soldSorted.map(soldRow).join('')+'</tbody></table>' :
        '<div style="padding:14px 16px;color:#aaa;font-size:12px">Ingen solgte biler denne uken</div>')+
    '</div>'+

    '<div class="card">'+
      '<div class="card-hdr" style="background:#c62828">&#10007; Ikke solgt &mdash; returnert ('+returnert.length+')</div>'+
      (retSorted.length ?
        '<table><thead><tr><th>REGNR</th><th>BIL</th><th class="r">BUD</th><th class="c">DAGER</th></tr></thead><tbody>'+retSorted.map(retRow).join('')+'</tbody></table>' :
        '<div style="padding:14px 16px;color:#aaa;font-size:12px">Ingen returnerte biler denne uken</div>')+
    '</div>'+

    '<div class="card">'+
      '<div class="card-hdr" style="background:#e65100">Avvist av selger ('+avvist.length+')</div>'+
      (avvist.length ?
        '<table><thead><tr><th>REGNR</th><th>BIL</th><th class="r">ESTIMAT</th></tr></thead><tbody>'+avvist.map(avvRow).join('')+'</tbody></table>' :
        '<div style="padding:14px 16px;color:#aaa;font-size:12px">Ingen avviste biler denne uken</div>')+
    '</div>';
}

function kpi(val, label, sub, color) {
  return '<div class="kpi" style="border-top:3px solid '+color+'">'+
    '<div class="kpi-val" style="color:'+color+'">'+val+'</div>'+
    '<div class="kpi-label">'+label+'</div>'+
    '<div class="kpi-sub">'+sub+'</div>'+
  '</div>';
}

function tl(label, val, warn) {
  if (!val) return '';
  var color = warn ? '#c62828' : val < 3 ? '#2d6a2d' : '#667';
  return '<div class="tl-row"><span style="color:#667">'+label+'</span><b style="color:'+color+'">'+val+' dager'+(warn?' &#9888;':'')+'</b></div>';
}

function loadAndRender() {
  document.getElementById('app').innerHTML = '<div class="loading"><div class="spinner"></div><br>Henter data&hellip;</div>';
  fetch(API)
    .then(function(r){return r.arrayBuffer();})
    .then(function(buf){
      var wb = XLSX.read(buf, {type:'array'});
      var ws = wb.Sheets[wb.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(ws, {header:1});
      render(rows);
    })
    .catch(function(err){
      document.getElementById('app').innerHTML = '<div style="text-align:center;padding:60px;color:#c62828">Kunne ikke hente data: '+err.message+'</div>';
    });
}

loadAndRender();
</script>
</body>
</html>
